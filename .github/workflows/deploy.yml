name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Ajouter toutes les pages du site (le build Vite ne produit que index.html)
        run: |
          shopt -s nullglob
          for f in *.html *.js *.css *.json *.png *.jpg *.jpeg *.svg *.webp *.ico *.txt *.xml CNAME; do
            case "$f" in index.html|package.json|package-lock.json) continue;; esac
            cp -f "$f" dist/
          done
          for d in models bestiaire textures hub; do
            test -d "$d" && cp -r "$d" dist/
          done
          test -f dist/models/fille1.glb && test -f dist/bestiaire/tigre.glb && test -d dist/textures
          test -f dist/lavri.html && test -f dist/games.html && test -f dist/sw.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        