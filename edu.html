.hero h1{letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.2)}.hero h1:after{content:"";display:block;width:70px;height:4px;background:var(--gold);border-radius:2px;margin-top:10px}
.hstats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hstats span{background:rgba(255,255,255,.12);border:1px solid rgba(224,176,64,.55);border-radius:20px;padding:5px 14px;font-size:14px;color:#fff}.hstats b{color:var(--gold);font:700 18px var(--serif);margin-right:4px}
.sec{position:relative;padding-left:26px;border-bottom:2px solid rgba(224,176,64,.6)}.sec:before{content:"★";position:absolute;left:0;top:50%;transform:translateY(-58%);color:var(--gold);font-size:18px}
.lvc,.stile,.acard,.gt,.panel,.box,.rankbar,.bdg,.gw,.stats div,.fig{box-shadow:var(--shadow);border-color:var(--line);border-radius:12px}
.lvc{border-top:5px solid var(--navy)}.lvc .n{color:var(--gold);text-shadow:0 1px 0 var(--navy2)}
.stile{border-left:6px solid var(--gold)}.stile i{color:var(--navy)}
.acard{border-top:4px solid var(--navy)}.acard .sj{color:var(--navy)}
.chip,.chip.lg{background:var(--navy)!important;color:#fff}.chip.lg{background:var(--gold)!important;color:var(--navy2)}
.lvb{background:#5B7FC7}.lvb.l2{background:#12306B}.lvb.l3{background:#0B1E47;color:var(--gold)}
#side .sj i{background:var(--gold);color:var(--navy2)}
.shead{background:linear-gradient(135deg,#0B1E47,#12306B);border-bottom:5px solid var(--gold)}.shead i{background:var(--gold);color:var(--navy2)}
.subh{border-left-color:var(--gold)}
.callout{background:#FFF6D8;border-left-color:var(--gold)}
.gw{border-left-color:var(--gold)}.topic.live em{color:var(--navy)}
.art h1{border-bottom:3px solid var(--gold);padding-bottom:8px}
.tl{border-bottom-color:var(--navy)}
/* carrousel vertical */
.car{position:relative;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(transparent,#000 9%,#000 91%,transparent)}
.car-in{animation:carup 80s linear infinite;will-change:transform}
.car:hover .car-in,.car:focus-within .car-in,.car:active .car-in{animation-play-state:paused}
@keyframes carup{to{transform:translateY(-50%)}}
.car.side{height:min(48vh,430px);margin:2px 0}.car.side .car-in{display:flex;flex-direction:column}.car.side .clone{display:flex;flex-direction:column}
.car.big{height:400px;border-radius:12px}.car.big .car-in{display:block}.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));column-gap:12px;align-content:start}.car.big .stile{margin-bottom:12px}
.allb{display:block;margin:6px 8px 0;text-align:center;background:var(--gold);color:var(--navy2)!important;font-weight:700;border-radius:8px;padding:9px}
@media(prefers-reduced-motion:reduce){.car-in{animation:none!important}.car{overflow:auto;-webkit-mask-image:none;mask-image:none}.clone{display:none!important}}
@media(max-width:860px){.car.side{display:none}.allb{flex:none;white-space:nowrap;margin:0;padding:10px 14px}.car.big{height:340px}.cg{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---------- 1. Fraksyon ---------- */
ART.push({id:"fraksyon",s:"math",lv:1,min:4,img:"pie",lab:"fraction",w:["numerateur","denominateur"],
t:L("Fraksyon : koupe yon bagay an pati egal","Les fractions : couper un tout en parts égales","Fractions: cutting a whole into equal parts","Дроби: делим целое на равные части"),
sum:L("Konprann kisa 3/4 vle di, epi aprann konpare ak adisyone fraksyon.","Comprendre ce que veut dire 3/4, comparer et additionner des fractions.","Understand what 3/4 means, then compare and add fractions.","Понять, что значит 3/4, сравнивать и складывать дроби."),
b:{
ht:["## Kisa yon fraksyon ye ?","Yon fraksyon se yon fason pou di ou pran yon pati nan yon bagay ki antye. Si ou koupe yon pen an 4 moso egal epi ou manje 1, ou manje **1/4** (yon kar) nan pen an.","Nimewo ki anwo a rele **nimeratè** : li di konbyen pati ou pran. Nimewo ki anba a rele **denominatè** : li di an konbyen pati egal yo koupe tout la.","## Fraksyon ki egal","**1/2 = 2/4 = 4/8.** Si ou miltipliye nimeratè a ak denominatè a pa menm nonm lan, valè a pa chanje. Se konsa nou senplifye fraksyon : 6/8 = 3/4 (nou divize pa 2).","## Adisyone fraksyon","Si denominatè yo menm, ou jis adisyone nimeratè yo : 1/4 + 2/4 = **3/4**. Si yo diferan, ou dwe mete yo sou menm denominatè anvan : 1/2 + 1/4 = 2/4 + 1/4 = 3/4.","> Rapèl : denominatè a pa janm ka 0. Pa gen moun ki ka koupe yon pen an zewo pati.","## Eseye pa ou","Itilize laboratwa a : chanje nimeratè a ak denominatè a epi gade ki pati nan sèk la ki kolore."],
fr:["## Qu'est-ce qu'une fraction ?","Une fraction dit qu'on prend une partie d'un tout. Si l'on coupe un pain en 4 parts égales et qu'on en mange 1, on a mangé **1/4** (un quart) du pain.","Le nombre du haut s'appelle le **numérateur** : il indique combien de parts on prend. Le nombre du bas s'appelle le **dénominateur** : il indique en combien de parts égales le tout est coupé.","## Fractions égales","**1/2 = 2/4 = 4/8.** Si l'on multiplie le numérateur et le dénominateur par le même nombre, la valeur ne change pas. C'est ainsi qu'on simplifie : 6/8 = 3/4 (on divise par 2).","## Additionner des fractions","Si les dénominateurs sont identiques, on additionne les numérateurs : 1/4 + 2/4 = **3/4**. S'ils sont différents, on les met d'abord au même dénominateur : 1/2 + 1/4 = 2/4 + 1/4 = 3/4.","> À retenir : le dénominateur n'est jamais 0. On ne peut pas couper un pain en zéro part.","## À toi de jouer","Utilise le laboratoire : change le numérateur et le dénominateur et observe la part colorée du cercle."],
en:["## What is a fraction?","A fraction says you take a part of a whole. If you cut a loaf into 4 equal pieces and eat 1, you ate **1/4** (one quarter) of the loaf.","The top number is the **numerator**: it tells how many parts you take. The bottom number is the **denominator**: it tells into how many equal parts the whole is cut.","## Equal fractions","**1/2 = 2/4 = 4/8.** If you multiply the numerator and denominator by the same number, the value does not change. That is how we simplify: 6/8 = 3/4 (divide by 2).","## Adding fractions","With the same denominator, just add the numerators: 1/4 + 2/4 = **3/4**. With different denominators, first rewrite them over a common one: 1/2 + 1/4 = 2/4 + 1/4 = 3/4.","> Remember: the denominator is never 0. You cannot cut a loaf into zero pieces.","## Try it","Use the lab: change the numerator and denominator and watch the coloured part of the circle."],
ru:["## Что такое дробь?","Дробь показывает, что мы берём часть целого. Если разрезать хлеб на 4 равные части и съесть 1, мы съели **1/4** (одну четверть) хлеба.","Верхнее число — **числитель**: сколько частей берём. Нижнее число — **знаменатель**: на сколько равных частей разделено целое.","## Равные дроби","**1/2 = 2/4 = 4/8.** Если умножить числитель и знаменатель на одно и то же число, значение не меняется. Так дроби сокращают: 6/8 = 3/4 (делим на 2).","## Сложение дробей","При одинаковых знаменателях складываем числители: 1/4 + 2/4 = **3/4**. При разных знаменателях сначала приводим к общему: 1/2 + 1/4 = 2/4 + 1/4 = 3/4.","> Запомни: знаменатель никогда не равен 0. Нельзя разрезать хлеб на ноль частей.","## Попробуй сам","Открой лабораторию: меняй числитель и знаменатель и смотри на закрашенную часть круга."]},
q:[{q:L("Ki fraksyon ki egal ak 1/2 ?","Quelle fraction est égale à 1/2 ?","Which fraction equals 1/2?","Какая дробь равна 1/2?"),o:["2/4","1/3","3/4","2/3"],a:0},

t:L("Fonksyon lineyè : y = mx + b","Fonctions affines : y = mx + b","Linear functions: y = mx + b","Линейные функции: y = mx + b"),
sum:L("Pant ak odone nan orijin : de nonm ki dekri yon liy dwat.","Pente et ordonnée à l'origine : deux nombres qui décrivent une droite.","Slope and y-intercept: two numbers that describe a straight line.","Наклон и свободный член: два числа, которые задают прямую."),
b:{
ht:["## Yon règ senp","Yon fonksyon lineyè gen fòm **y = mx + b**. Pou chak valè x, ou jwenn yon sèl valè y. Graf li toujou se yon liy dwat.","## De nonm ki fè tout diferans","**m** se **pant** liy lan : si m pozitif, liy lan monte ; si m negatif, li desann ; si m = 0, li plat. **b** se **odone nan orijin** : kote liy lan koupe aks vètikal la (lè x = 0).","## Yon egzanp ak lajan","Yon moun achte 20 goud kredi, epi chak jou li depanse 5 goud. Kredi a apre x jou se **y = 20 − 5x**. Pant la se −5 (kredi a bese), epi b = 20 (kredi depa a). Kredi a rive 0 lè x = 4 jou.","> Pou jwenn m ak de pwen (x1, y1) ak (x2, y2) : m = (y2 − y1) / (x2 − x1).","## Eseye pa ou","Nan laboratwa a, deplase glisyè m ak b yo epi gade ki jan liy lan chanje."],
fr:["## Une règle simple","Une fonction affine s'écrit **y = mx + b**. À chaque valeur de x correspond une seule valeur de y. Son graphique est toujours une droite.","## Deux nombres font toute la différence","**m** est la **pente** : si m est positif la droite monte, s'il est négatif elle descend, s'il vaut 0 elle est horizontale. **b** est l'**ordonnée à l'origine** : l'endroit où la droite coupe l'axe vertical (quand x = 0).","## Un exemple avec de l'argent","Quelqu'un achète 20 gourdes de crédit et dépense 5 gourdes par jour. Le crédit après x jours est **y = 20 − 5x**. La pente est −5 (le crédit diminue) et b = 20 (crédit de départ). Le crédit tombe à 0 au bout de x = 4 jours.","> Pour trouver m à partir de deux points (x1, y1) et (x2, y2) : m = (y2 − y1) / (x2 − x1).","## À toi de jouer","Dans le laboratoire, déplace les curseurs m et b et regarde la droite changer."],
en:["## A simple rule","A linear function is written **y = mx + b**. Each value of x gives exactly one value of y. Its graph is always a straight line.","## Two numbers make all the difference","**m** is the **slope**: if m is positive the line rises, if negative it falls, if 0 it is flat. **b** is the **y-intercept**: where the line crosses the vertical axis (when x = 0).","## An example with money","Someone buys 20 gourdes of phone credit and spends 5 gourdes a day. The credit after x days is **y = 20 − 5x**. The slope is −5 (credit shrinks) and b = 20 (starting credit). The credit reaches 0 after x = 4 days.","> To find m from two points (x1, y1) and (x2, y2): m = (y2 − y1) / (x2 − x1).","## Try it","In the lab, move the m and b sliders and watch the line change."],
ru:["## Простое правило","Линейная функция записывается как **y = mx + b**. Каждому x соответствует ровно одно y. Её график — всегда прямая.","## Два числа решают всё","**m** — это **наклон**: при положительном m прямая растёт, при отрицательном убывает, при 0 горизонтальна. **b** — **свободный член**: точка, где прямая пересекает вертикальную ось (при x = 0).","## Пример с деньгами","Человек пополняет телефон на 20 гурдов и тратит по 5 гурдов в день. Остаток через x дней: **y = 20 − 5x**. Наклон равен −5 (остаток уменьшается), b = 20 (начальная сумма). Остаток становится нулевым через x = 4 дня.","> Чтобы найти m по двум точкам (x1, y1) и (x2, y2): m = (y2 − y1) / (x2 − x1).","## Попробуй сам","В лаборатории двигай ползунки m и b и смотри, как меняется прямая."]},
q:[{q:L("Nan y = 3x + 2, ki pant la ?","Dans y = 3x + 2, quelle est la pente ?","In y = 3x + 2, what is the slope?","В y = 3x + 2 чему равен наклон?"),o:["2","3","5","−3"],a:1},
{q:L("Si x = 0 nan y = 3x + 2, konbyen y ye ?","Si x = 0 dans y = 3x + 2, combien vaut y ?","If x = 0 in y = 3x + 2, what is y?","Если x = 0 в y = 3x + 2, чему равно y?"),o:["0","3","2","5"],a:2},
{q:L("Ki liy ki desann ?","Quelle droite descend ?","Which line goes down?","Какая прямая убывает?"),o:["y = 2x + 1","y = x","y = −x + 4","y = 5"],a:2},
{q:L("Pant liy ki pase pa (0,1) ak (2,5) ?","Pente de la droite passant par (0,1) et (2,5) ?","Slope of the line through (0,1) and (2,5)?","Наклон прямой через (0,1) и (2,5)?"),o:["2","4","1/2","3"],a:0}]});

/* ---------- 3. Lalin ---------- */
ART.push({id:"lalin",s:"jewo",lv:1,min:4,img:"moon",lab:"moon",w:["orbite","phase"],
t:L("Poukisa Lalin nan chanje fòm ?","Pourquoi la Lune change-t-elle de forme ?","Why does the Moon change shape?","Почему Луна меняет форму?"),
sum:L("Lalin pa chanje vre : se jan nou wè pati klere a ki chanje.","La Lune ne change pas vraiment : c'est la part éclairée que nous voyons qui change.","The Moon does not really change: what we see of its lit half does.","Луна на самом деле не меняется: меняется видимая нам освещённая часть."),
b:{
ht:["## Yon boul ki toujou mwatye klere","Lalin se yon boul wòch ki vire otou Latè. Solèy la toujou klere mwatye li, jan solèy klere mwatye Latè a. Lalin pa gen pwòp limyè : li reflechi limyè Solèy la.","## Faz yo","Pandan Lalin ap vire otou Latè (anviwon **29,5 jou**), nou wè pati klere a anba plizyè ang. Lè Lalin nan ant nou ak Solèy la, nou pa wè pati klere a : se **nouvèl lin**. Lè Latè nan mitan, nou wè tout pati klere a : se **plèn lin**. Nan mitan, nou wè yon mwatye : se **premye ak dènye kar**.","## Yon erè komen","Faz yo pa vini de lonm Latè. Lonm Latè se pou eklips yo. Faz yo vini de pozisyon Lalin kont Solèy la ak Latè.","> Kalandriye anpil kilti baze sou Lalin. Mwa a (month) vle di \"yon vire Lalin\".","## Eseye pa ou","Deplase glisyè jou a nan laboratwa a pou wè Lalin nan chak etap."],
fr:["## Une boule toujours à moitié éclairée","La Lune est une boule de roche qui tourne autour de la Terre. Le Soleil en éclaire toujours la moitié, comme il éclaire la moitié de la Terre. La Lune n'a pas de lumière propre : elle reflète celle du Soleil.","## Les phases","Pendant que la Lune tourne autour de la Terre (environ **29,5 jours**), nous voyons sa face éclairée sous des angles différents. Quand la Lune est entre nous et le Soleil, nous ne voyons pas la face éclairée : c'est la **nouvelle Lune**. Quand la Terre est au milieu, nous voyons toute la face éclairée : c'est la **pleine Lune**. Entre les deux, nous voyons une moitié : ce sont le **premier et le dernier quartier**.","## Une erreur fréquente","Les phases ne viennent pas de l'ombre de la Terre. Cette ombre explique les éclipses. Les phases viennent de la position de la Lune par rapport au Soleil et à la Terre.","> Beaucoup de calendriers se fondent sur la Lune. Le mot « mois » vient de « lunaison ».","## À toi de jouer","Déplace le curseur des jours dans le laboratoire pour voir la Lune à chaque étape."],
en:["## A ball that is always half lit","The Moon is a ball of rock circling the Earth. The Sun always lights half of it, just as it lights half of the Earth. The Moon makes no light of its own: it reflects the Sun's.","## The phases","As the Moon circles the Earth (about **29.5 days**), we see its lit side from different angles. When the Moon is between us and the Sun, we cannot see the lit side: that is the **new Moon**. When the Earth is in the middle, we see the whole lit side: the **full Moon**. In between we see half: the **first and last quarters**.","## A common mistake","The phases do not come from Earth's shadow. That shadow explains eclipses. Phases come from the Moon's position relative to the Sun and Earth.","> Many calendars follow the Moon. The word \"month\" comes from \"moon\".","## Try it","Move the day slider in the lab to see the Moon at each stage."],
ru:["## Шар, всегда освещённый наполовину","Луна — каменный шар, обращающийся вокруг Земли. Солнце всегда освещает половину Луны, как и половину Земли. Собственного света у Луны нет: она отражает солнечный.","## Фазы","Пока Луна обходит Землю (примерно **29,5 суток**), мы видим её освещённую сторону под разными углами. Когда Луна между нами и Солнцем, освещённой стороны не видно: это **новолуние**. Когда Земля посередине, видна вся освещённая сторона: **полнолуние**. Между ними видна половина: **первая и последняя четверти**.","## Частая ошибка","Фазы возникают не из-за тени Земли. Тень Земли объясняет затмения. Фазы зависят от положения Луны относительно Солнца и Земли.","> Многие календари основаны на Луне. Слово «месяц» связано с лунным циклом.","## Попробуй сам","Двигай ползунок дней в лаборатории и смотри на Луну на каждом этапе."]},
q:[{q:L("Konbyen jou apeprè yon sik Lalin dire ?","Environ combien de jours dure un cycle lunaire ?","About how many days does a lunar cycle last?","Сколько примерно суток длится лунный цикл?"),o:["7","15","29,5","365"],a:2},
{q:L("Ki faz Lalin lè nou wè tout pati klere a ?","Quelle phase voit-on quand toute la face éclairée est visible ?","Which phase shows the whole lit side?","Какая фаза показывает всю освещённую сторону?"),o:[L("Nouvèl lin","Nouvelle Lune","New Moon","Новолуние"),L("Plèn lin","Pleine Lune","Full Moon","Полнолуние"),L("Premye kar","Premier quartier","First quarter","Первая четверть"),L("Eklips","Éclipse","Eclipse","Затмение")],a:1},
{q:L("Poukisa Lalin klere ?","Pourquoi la Lune est-elle lumineuse ?","Why does the Moon shine?","Почему Луна светит?"),o:[L("Li fè pwòp limyè li","Elle fabrique sa lumière","It makes its own light","Она сама излучает свет"),L("Li reflechi limyè Solèy la","Elle reflète la lumière du Soleil","It reflects sunlight","Она отражает свет Солнца"),L("Latè klere l","La Terre l'éclaire","Earth lights it","Её освещает Земля"),L("Se zetwal","C'est une étoile","It is a star","Это звезда")],a:1}]});

ART.push({id:"kowodone",s:"jewo",lv:2,min:4,img:"globe",lab:"coords",w:["latitude","longitude"],
t:L("Latitid ak lonjitid : adrès yon kote sou Latè","Latitude et longitude : l'adresse d'un lieu sur Terre","Latitude and longitude: a place's address on Earth","Широта и долгота: адрес места на Земле"),
sum:L("De nonm ase pou jwenn nenpòt kote sou planèt la, tankou Gonayiv.","Deux nombres suffisent pour situer n'importe quel point de la planète, comme les Gonaïves.","Two numbers are enough to place any point on the planet, such as Gonaïves.","Двух чисел достаточно, чтобы указать любую точку планеты, например Гонаив."),
b:{
ht:["## Yon grid sou tout glòb la","Pou jwenn yon kote sou Latè, nou itilize yon grid. **Latitid** mezire konbyen degre ou nan nò (N) oswa nan sid (S) ekwatè a. Ekwatè a gen latitid 0°, Pòl Nò a gen 90° N.","**Lonjitid** mezire konbyen degre ou nan lès (E) oswa nan lwès (W) meridyen Grinwich la, ki gen lonjitid 0°.","## Ayiti sou glòb la","Gonayiv sitiye apeprè nan **19,45° N ak 72,69° W**. Sa vle di li nan nò ekwatè a epi nan lwès Grinwich.","## Poukisa sa itil ?","GPS telefòn ou a itilize menm sistèm sa a. Bato, avyon ak sèvis dijans tou. Yon adrès tankou \"19,45 ; −72,69\" montre yon kote egzak.","> Rapèl : nò ak lès se pozitif ; sid ak lwès se negatif nan anpil aplikasyon.","## Eseye pa ou","Nan laboratwa a, chwazi yon vil oswa chanje latitid ak lonjitid pou wè pwen an."],
fr:["## Un quadrillage sur tout le globe","Pour situer un lieu sur Terre, on utilise un quadrillage. La **latitude** mesure combien de degrés on est au nord (N) ou au sud (S) de l'équateur. L'équateur a une latitude de 0°, le pôle Nord 90° N.","La **longitude** mesure combien de degrés on est à l'est (E) ou à l'ouest (W) du méridien de Greenwich, de longitude 0°.","## Haïti sur le globe","Les Gonaïves se situent à environ **19,45° N et 72,69° O**. Elles sont donc au nord de l'équateur et à l'ouest de Greenwich.","## À quoi ça sert ?","Le GPS de votre téléphone utilise ce même système, comme les bateaux, les avions et les secours. Une adresse comme « 19,45 ; −72,69 » désigne un endroit précis.","> À retenir : nord et est sont positifs ; sud et ouest sont négatifs dans beaucoup d'applications.","## À toi de jouer","Dans le laboratoire, choisis une ville ou change la latitude et la longitude pour voir le point."],
en:["## A grid over the whole globe","To locate a place on Earth we use a grid. **Latitude** measures how many degrees you are north (N) or south (S) of the equator. The equator is 0°, the North Pole 90° N.","**Longitude** measures how many degrees you are east (E) or west (W) of the Greenwich meridian, which is 0°.","## Haiti on the globe","Gonaïves lies at about **19.45° N, 72.69° W**: north of the equator and west of Greenwich.","## Why it matters","Your phone's GPS uses this same system, as do ships, planes and rescue services. An address such as \"19.45, −72.69\" points to an exact spot.","> Remember: north and east are positive; south and west are negative in many apps.","## Try it","In the lab, pick a city or change the latitude and longitude to see the point."],
ru:["## Сетка на всём земном шаре","Чтобы указать место на Земле, используют сетку. **Широта** показывает, на сколько градусов вы севернее (с. ш.) или южнее (ю. ш.) экватора. Экватор — 0°, Северный полюс — 90° с. ш.","**Долгота** показывает, на сколько градусов вы восточнее (в. д.) или западнее (з. д.) гринвичского меридиана — 0°.","## Гаити на глобусе","Гонаив находится примерно на **19,45° с. ш. и 72,69° з. д.**: севернее экватора и западнее Гринвича.","## Зачем это нужно","GPS в телефоне использует эту же систему, как и корабли, самолёты и спасатели. Запись «19,45; −72,69» указывает точное место.","> Запомни: север и восток положительны, юг и запад отрицательны во многих приложениях.","## Попробуй сам","В лаборатории выбери город или измени широту и долготу, чтобы увидеть точку."]},
q:[{q:L("Ki latitid ekwatè a ?","Quelle est la latitude de l'équateur ?","What is the latitude of the equator?","Какова широта экватора?"),o:["90°","45°","180°","0°"],a:3},
{q:L("Gonayiv nan ki lonjitid apeprè ?","Les Gonaïves sont à quelle longitude environ ?","Gonaïves is at roughly which longitude?","Какова примерно долгота Гонаива?"),o:["72,7° W","72,7° E","19,5° W","0°"],a:0},
{q:L("Lonjitid 0° pase kote ?","Où passe la longitude 0° ?","Where does longitude 0° pass?","Где проходит нулевая долгота?"),o:[L("Pòtoprens","Port-au-Prince","Port-au-Prince","Порт-о-Пренс"),L("Ekwatè a","L'équateur","The equator","Экватор"),L("Grinwich","Greenwich","Greenwich","Гринвич"),L("Pòl Nò","Pôle Nord","North Pole","Северный полюс")],a:2}]});

ART.push({id:"1804",s:"istwa",lv:2,min:6,img:"flag",lab:"timeline",w:["independance","revolution"],
t:L("1804 : yon revolisyon ki chanje mond lan","1804 : une révolution qui a changé le monde","1804: a revolution that changed the world","1804: революция, изменившая мир"),
sum:L("Ki jan ansyen esklav yo kreye premye repiblik nwa lib nan mond lan.","Comment d'anciens esclaves ont fondé la première république noire libre du monde.","How formerly enslaved people founded the world's first free Black republic.","Как бывшие рабы создали первую в мире свободную чёрную республику."),
b:{
ht:["## Sendomeng anvan revolisyon an","Nan fen 18yèm syèk la, Sendomeng, koloni franse a, te pi rich koloni nan mond lan gras ak sik ak kafe. Men richès sa a te bati sou travay fòse sou plis pase mwatye milyon esklav.","## Yon revòlt ki vin yon revolisyon","An **1791**, esklav yo leve nan Bwa Kayiman. Chèf tankou Toussaint Louverture, Jean-Jacques Dessalines, Henri Christophe ak Alexandre Pétion te dirije lit la. An 1794, Lafrans te abolisyon esklavaj, men an 1802 Napoleyon te voye yon lame pou retabli l.","## Vètyè ak endepandans","Lame endijèn nan te genyen **Batay Vètyè** an novanm 1803. Nan **1ye janvye 1804**, Dessalines pwoklame endepandans nan Gonayiv. Peyi a pran non **Ayiti**, yon non Taino.","## Konsekans yo","Ayiti vin yon senbòl espwa pou moun ki te anba esklavaj toupatou. Men gwo pouvwa yo te izole peyi a, epi an 1825 Lafrans te mande yon gwo dèt an echanj pou rekonesans.","> Fèt la : Dekleraasyon endepandans lan siyen nan Gonayiv, nan 1ye janvye 1804.","## Eksplore kwonoloji a","Klike sou dat yo nan laboratwa a pou wè ki sa ki te pase chak fwa."],
fr:["## Saint-Domingue avant la Révolution","À la fin du XVIIIe siècle, Saint-Domingue, colonie française, était la plus riche du monde grâce au sucre et au café. Mais cette richesse reposait sur le travail forcé de plus d'un demi-million d'esclaves.","## D'une révolte à une révolution","En **1791**, les esclaves se soulèvent au Bois Caïman. Des chefs comme Toussaint Louverture, Jean-Jacques Dessalines, Henri Christophe et Alexandre Pétion dirigent la lutte. En 1794 la France abolit l'esclavage, mais en 1802 Napoléon envoie une armée pour le rétablir.","## Vertières et l'indépendance","L'armée indigène remporte la **bataille de Vertières** en novembre 1803. Le **1er janvier 1804**, Dessalines proclame l'indépendance aux Gonaïves. Le pays prend le nom d'**Haïti**, un nom taïno.","## Les conséquences","Haïti devient un symbole d'espoir pour les personnes réduites en esclavage partout dans le monde. Mais les grandes puissances isolent le pays et, en 1825, la France exige une lourde dette en échange de sa reconnaissance.","> Fait : l'acte d'indépendance a été proclamé aux Gonaïves, le 1er janvier 1804.","## Explorer la chronologie","Clique sur les dates dans le laboratoire pour voir ce qui s'est passé à chaque fois."],
en:["## Saint-Domingue before the Revolution","In the late 18th century Saint-Domingue, a French colony, was the richest in the world thanks to sugar and coffee. But that wealth rested on the forced labour of over half a million enslaved people.","## From revolt to revolution","In **1791** the enslaved rose up at Bois Caïman. Leaders such as Toussaint Louverture, Jean-Jacques Dessalines, Henri Christophe and Alexandre Pétion led the struggle. France abolished slavery in 1794, but in 1802 Napoleon sent an army to restore it.","## Vertières and independence","The indigenous army won the **Battle of Vertières** in November 1803. On **1 January 1804**, Dessalines proclaimed independence in Gonaïves. The country took the name **Haiti**, a Taíno name.","## The consequences","Haiti became a symbol of hope for enslaved people everywhere. But the great powers isolated the country, and in 1825 France demanded a heavy debt in exchange for recognition.","> Fact: the Act of Independence was proclaimed in Gonaïves on 1 January 1804.","## Explore the timeline","Click the dates in the lab to see what happened each time."],
ru:["## Сен-Доменг до революции","В конце XVIII века Сен-Доменг, французская колония, был богатейшей колонией мира благодаря сахару и кофе. Но это богатство держалось на принудительном труде более полумиллиона рабов.","## От восстания к революции","В **1791** году рабы восстали в Буа-Кайман. Борьбой руководили Туссен-Лувертюр, Жан-Жак Дессалин, Анри Кристоф и Александр Петион. В 1794 году Франция отменила рабство, но в 1802-м Наполеон отправил армию, чтобы его вернуть.","## Вертьер и независимость","Туземная армия выиграла **битву при Вертьере** в ноябре 1803 года. **1 января 1804** года Дессалин провозгласил независимость в Гонаиве. Страна получила название **Гаити** — слово из языка тайно.","## Последствия","Гаити стало символом надежды для порабощённых людей всего мира. Но великие державы изолировали страну, а в 1825 году Франция потребовала тяжёлый долг в обмен на признание.","> Факт: Акт независимости был провозглашён в Гонаиве 1 января 1804 года.","## Изучи хронологию","Нажимай на даты в лаборатории, чтобы увидеть, что тогда произошло."]},
q:[{q:L("Ki lè Ayiti pwoklame endepandans li ?","Quand Haïti a-t-elle proclamé son indépendance ?","When did Haiti proclaim independence?","Когда Гаити провозгласило независимость?"),o:["1791","1804","1825","1915"],a:1},
{q:L("Ki vil ki te sèn pwoklamasyon an ?","Dans quelle ville l'indépendance a-t-elle été proclamée ?","In which city was independence proclaimed?","В каком городе провозгласили независимость?"),o:[L("Okap","Cap-Haïtien","Cap-Haïtien","Кап-Гаситьен"),L("Gonayiv","Les Gonaïves","Gonaïves","Гонаив"),L("Jakmèl","Jacmel","Jacmel","Жакмель"),L("Okay","Les Cayes","Les Cayes","Ле-Ке")],a:1},
{q:L("Ki non Taino ki vin non peyi a ?","Quel nom taïno est devenu le nom du pays ?","Which Taíno name became the country's name?","Какое слово тайно стало названием страны?"),o:["Kiskeya","Ayiti","Boyo","Bohio"],a:1},
{q:L("Ki batay an novanm 1803 ki te bat lame franse a nan Sendomeng ?","Quelle bataille de novembre 1803 a vaincu l'armée française à Saint-Domingue ?","Which November 1803 battle defeated the French army in Saint-Domingue?","Какая битва в ноябре 1803 года разбила французскую армию в Сен-Доменге?"),o:[L("Vètyè","Vertières","Vertières","Вертьер"),L("Waterloo","Waterloo","Waterloo","Ватерлоо"),L("Trafalgar","Trafalgar","Trafalgar","Трафальгар"),L("Austerlitz","Austerlitz","Austerlitz","Аустерлиц")],a:0}]});

t:L("Koulè : ki jan ekran ou fè tout koulè yo","Les couleurs : comment votre écran fabrique toutes les teintes","Colour: how your screen makes every shade","Цвет: как экран создаёт все оттенки"),
sum:L("Twa koulè limyè (wouj, vèt, ble) ase pou fè tout lòt yo.","Trois lumières (rouge, vert, bleu) suffisent à fabriquer toutes les autres couleurs.","Three lights (red, green, blue) are enough to make every other colour.","Трёх цветов света (красный, зелёный, синий) достаточно для всех остальных."),
b:{
ht:["## Limyè ak penti pa menm bagay","Lè ou melanje penti, ou jwenn yon koulè ki pi fonse. Men lè ou melanje limyè, ou jwenn yon koulè ki pi klere. Se sa k fè ekran yo pa mache tankou penti.","## Twa koulè primè limyè","Ekran telefòn ou a fè tout koulè ak twa limyè : **wouj (R), vèt (G), ble (B)**. Chak limyè gen yon fòs ant 0 ak 255. Wouj + vèt = jòn ; wouj + ble = majenta ; vèt + ble = siyan ; wouj + vèt + ble pandan fòs maksimòm = **blan**. Si tout twa nan 0, se **nwa**.","## Kòd koulè","Òdinatè ekri koulè yo ak yon kòd tankou **#FF0000** (wouj). Kat nimewo yo se fòs R, G, B an egzadesimal : FF = 255.","> Chak ti pwen sou ekran an rele yon **piksèl**. Yon foto se milye piksèl ak twa limyè nan chak.","## Eseye pa ou","Nan laboratwa a, glise twa bann yo epi gade ki koulè ou kreye."],
fr:["## Lumière et peinture, ce n'est pas pareil","Quand on mélange des peintures, la couleur devient plus sombre. Quand on mélange des lumières, elle devient plus claire. C'est pourquoi les écrans ne fonctionnent pas comme la peinture.","## Les trois lumières primaires","L'écran de votre téléphone fabrique toutes les couleurs avec trois lumières : **rouge (R), vert (V), bleu (B)**. Chacune a une intensité de 0 à 255. Rouge + vert = jaune ; rouge + bleu = magenta ; vert + bleu = cyan ; les trois à fond = **blanc**. Les trois à 0 = **noir**.","## Les codes de couleur","Les ordinateurs écrivent les couleurs avec un code comme **#FF0000** (rouge). Les paires de chiffres sont les intensités R, V, B en hexadécimal : FF = 255.","> Chaque petit point de l'écran est un **pixel**. Une photo, ce sont des milliers de pixels avec trois lumières chacun.","## À toi de jouer","Dans le laboratoire, glisse les trois barres et observe la couleur obtenue."],
en:["## Light and paint are not the same","Mixing paints makes a darker colour. Mixing lights makes a brighter one. That is why screens do not work like paint.","## The three primary lights","Your phone screen makes every colour from three lights: **red (R), green (G), blue (B)**. Each has a strength from 0 to 255. Red + green = yellow; red + blue = magenta; green + blue = cyan; all three at full = **white**. All three at 0 = **black**.","## Colour codes","Computers write colours with a code like **#FF0000** (red). The pairs of digits are the R, G, B strengths in hexadecimal: FF = 255.","> Each tiny dot on the screen is a **pixel**. A photo is thousands of pixels, each with three lights.","## Try it","In the lab, drag the three sliders and watch the colour you make."],
ru:["## Свет и краски — не одно и то же","При смешении красок цвет темнеет. При смешении светов он светлеет. Поэтому экраны работают не так, как краски.","## Три основных цвета света","Экран телефона создаёт все цвета из трёх огней: **красного (R), зелёного (G), синего (B)**. Яркость каждого от 0 до 255. Красный + зелёный = жёлтый; красный + синий = пурпурный; зелёный + синий = голубой; все три на максимуме = **белый**. Все три на 0 = **чёрный**.","## Коды цветов","Компьютеры записывают цвет кодом вроде **#FF0000** (красный). Пары цифр — яркость R, G, B в шестнадцатеричной записи: FF = 255.","> Каждая маленькая точка экрана — **пиксель**. Фото — это тысячи пикселей, в каждом три огня.","## Попробуй сам","В лаборатории двигай три ползунка и смотри, какой цвет получается."]},
q:[{q:L("Wouj + vèt (limyè) fè ki koulè ?","Rouge + vert (lumière) donne quelle couleur ?","Red + green (light) makes which colour?","Красный + зелёный (свет) даёт какой цвет?"),o:[L("Jòn","Jaune","Yellow","Жёлтый"),L("Ble","Bleu","Blue","Синий"),L("Mov","Violet","Purple","Фиолетовый"),L("Nwa","Noir","Black","Чёрный")],a:0},
{q:L("Twa limyè nan fòs maksimòm fè ki koulè ?","Trois lumières à fond donnent quelle couleur ?","Three lights at full strength make which colour?","Три света на максимуме дают какой цвет?"),o:[L("Nwa","Noir","Black","Чёрный"),L("Gri","Gris","Grey","Серый"),L("Blan","Blanc","White","Белый"),L("Mawon","Marron","Brown","Коричневый")],a:2},
{q:L("Ki nonm FF an egzadesimal ye an desimal ?","Que vaut FF en décimal ?","What is FF in decimal?","Чему равно FF в десятичной системе?"),o:["15","100","255","256"],a:2}]});

/* ---------- 7. Bidjè ---------- */
ART.push({id:"bidje",s:"ekonomi",lv:1,min:4,img:"coins",lab:"budget",w:["budget","epargne"],
t:L("Bidjè 50/30/20 : kote lajan m ale ?","Le budget 50/30/20 : où va mon argent ?","The 50/30/20 budget: where does my money go?","Бюджет 50/30/20: куда уходят деньги?"),
sum:L("Yon règ senp pou separe revni ou an bezwen, anvi ak epay.","Une règle simple pour partager un revenu entre besoins, envies et épargne.","A simple rule to split income between needs, wants and savings.","Простое правило: делить доход на нужды, желания и сбережения."),
b:{
ht:["## Poukisa fè yon bidjè ?","Yon bidjè se yon plan ki di ki kote lajan ou prale **anvan** ou depanse l. Li pa bay lajan an plis, men li ede ou pa bouke avan fen mwa a.","## Règ 50/30/20","Separe revni ou apre taks an twa : **50 % pou bezwen** (lojman, manje, transpò, lekòl), **30 % pou anvi** (lwazi, rad, soti), **20 % pou epay** oswa pou peye dèt. Egzanp : si ou touche 10 000 goud, ou gen 5 000 pou bezwen, 3 000 pou anvi, 2 000 pou epay.","## Adapte l a sitiyasyon ou","Pa gen règ ki bon pou tout moun. Si ou touche ti kras, bezwen yo ka pran plis. Sa ki enpòtan se pa depanse plis pase sa ou touche, epi mete yon ti pati sou kote chak mwa, menm piti.","> Konsèy : mete epay la sou kote **depi ou touche**, pa sa ki rete a lafen mwa a.","## Eseye pa ou","Antre revni ou nan laboratwa a pou wè separasyon an."],
fr:["## Pourquoi faire un budget ?","Un budget est un plan qui dit où ira l'argent **avant** de le dépenser. Il n'en donne pas plus, mais il évite d'être à sec avant la fin du mois.","## La règle 50/30/20","Répartissez votre revenu net en trois : **50 % pour les besoins** (logement, nourriture, transport, école), **30 % pour les envies** (loisirs, vêtements, sorties), **20 % pour l'épargne** ou le remboursement de dettes. Exemple : avec 10 000 gourdes, 5 000 pour les besoins, 3 000 pour les envies, 2 000 pour l'épargne.","## L'adapter à sa situation","Aucune règle ne convient à tout le monde. Avec un petit revenu, les besoins prennent plus de place. L'essentiel est de ne pas dépenser plus qu'on ne gagne et de mettre un peu de côté chaque mois, même peu.","> Astuce : mettez l'épargne de côté **dès la paie**, pas avec ce qui reste en fin de mois.","## À toi de jouer","Entre ton revenu dans le laboratoire pour voir la répartition."],
en:["## Why make a budget?","A budget is a plan for where money goes **before** you spend it. It does not give you more, but it keeps you from running dry before month's end.","## The 50/30/20 rule","Split your take-home income three ways: **50% for needs** (housing, food, transport, school), **30% for wants** (fun, clothes, outings), **20% for savings** or paying off debt. Example: with 10,000 gourdes, 5,000 for needs, 3,000 for wants, 2,000 for savings.","## Fit it to your situation","No rule suits everyone. With a small income, needs take a bigger share. What matters is not spending more than you earn and setting a little aside each month, however small.","> Tip: put savings aside **as soon as you are paid**, not with what is left at month's end.","## Try it","Enter your income in the lab to see the split."],
ru:["## Зачем нужен бюджет?","Бюджет — это план, куда пойдут деньги **до того**, как вы их потратите. Он не прибавляет денег, но не даёт остаться без них до конца месяца.","## Правило 50/30/20","Разделите доход на три части: **50 % на нужды** (жильё, еда, транспорт, школа), **30 % на желания** (досуг, одежда, развлечения), **20 % на сбережения** или погашение долгов. Пример: при 10 000 гурдов — 5 000 на нужды, 3 000 на желания, 2 000 на сбережения.","## Подстройте под себя","Нет правила на все случаи. При небольшом доходе на нужды уходит больше. Главное — не тратить больше, чем зарабатываете, и откладывать понемногу каждый месяц.","> Совет: откладывайте **сразу после получения денег**, а не то, что осталось в конце месяца.","## Попробуй сам","Введи свой доход в лаборатории, чтобы увидеть разделение."]},
q:[{q:L("Ak 8 000 goud, konbyen ki pou epay (20 %) ?","Avec 8 000 gourdes, combien pour l'épargne (20 %) ?","With 8,000 gourdes, how much goes to savings (20%)?","При 8 000 гурдов сколько на сбережения (20 %)?"),o:["800","1 600","2 400","4 000"],a:1},
{q:L("Ki pwosantaj ki pou bezwen nan règ 50/30/20 la ?","Quel pourcentage va aux besoins dans la règle 50/30/20 ?","What share goes to needs in the 50/30/20 rule?","Какая доля идёт на нужды по правилу 50/30/20?"),o:["20 %","30 %","50 %","100 %"],a:2},
{q:L("Ki lè pou mete epay la sou kote ?","Quand faut-il mettre l'épargne de côté ?","When should savings be set aside?","Когда нужно откладывать сбережения?"),o:[L("Depi ou touche","Dès qu'on est payé","As soon as you are paid","Сразу после получения денег"),L("Si gen rès","S'il en reste","If anything is left","Если что-то останется"),L("Lanne pwochèn","L'an prochain","Next year","В следующем году")],a:0}]});

/* ---------- 8. Binè ---------- */
ART.push({id:"bine",s:"enfo",lv:2,min:5,img:"bits",lab:"binary",w:["bit","binaire"],
t:L("Nonm binè : lang òdinatè yo","Les nombres binaires : la langue des ordinateurs","Binary numbers: the language of computers","Двоичные числа: язык компьютеров"),
sum:L("Ak sèlman 0 ak 1, yon òdinatè ka reprezante nenpòt nonm, lèt oswa foto.","Avec seulement 0 et 1, un ordinateur représente n'importe quel nombre, lettre ou image.","With only 0 and 1, a computer can represent any number, letter or picture.","Только с 0 и 1 компьютер может представить любое число, букву или картинку."),
b:{
ht:["## Konte ak de chif sèlman","Nou konte nan **baz 10** (dis chif : 0 a 9). Òdinatè yo konte nan **baz 2** (de chif : 0 ak 1), paske yon ti pyès elektwonik fasil pou fè de eta : limen oswa etenn. Yon chif 0 oswa 1 rele yon **bit**.","## Ki jan li mache","Nan baz 2, chak pozisyon vo yon pisans 2 : 1, 2, 4, 8, 16, 32, 64, 128 (soti adwat pou agoch). **1011** = 8 + 0 + 2 + 1 = **11**. Yon gwoup 8 bit rele yon **okte** (byte) epi li ka reprezante 256 valè, soti 0 rive 255.","## Lèt ak foto","Chak lèt gen yon nimewo (egzanp \"A\" = 65), epi nimewo a ekri an binè. Yon foto se yon gwo lis nimewo koulè pou chak piksèl.","> Rapèl : 8 bit ak tout 1 (11111111) = 255.","## Eseye pa ou","Klike sou bit yo nan laboratwa a pou limen oswa etenn yo."],
fr:["## Compter avec deux chiffres seulement","Nous comptons en **base 10** (dix chiffres : 0 à 9). Les ordinateurs comptent en **base 2** (deux chiffres : 0 et 1), car un composant électronique distingue facilement deux états : allumé ou éteint. Un chiffre 0 ou 1 s'appelle un **bit**.","## Comment ça marche","En base 2, chaque position vaut une puissance de 2 : 1, 2, 4, 8, 16, 32, 64, 128 (de droite à gauche). **1011** = 8 + 0 + 2 + 1 = **11**. Un groupe de 8 bits s'appelle un **octet** et peut représenter 256 valeurs, de 0 à 255.","## Lettres et images","Chaque lettre a un numéro (par exemple « A » = 65), écrit en binaire. Une image est une longue liste de numéros de couleur, un par pixel.","> À retenir : 8 bits tous à 1 (11111111) = 255.","## À toi de jouer","Clique sur les bits dans le laboratoire pour les allumer ou les éteindre."],
en:["## Counting with just two digits","We count in **base 10** (ten digits: 0 to 9). Computers count in **base 2** (two digits: 0 and 1), because an electronic part easily tells two states apart: on or off. A 0 or 1 is called a **bit**.","## How it works","In base 2, each position is worth a power of 2: 1, 2, 4, 8, 16, 32, 64, 128 (right to left). **1011** = 8 + 0 + 2 + 1 = **11**. A group of 8 bits is a **byte** and can represent 256 values, from 0 to 255.","## Letters and pictures","Each letter has a number (for example \"A\" = 65), written in binary. A picture is a long list of colour numbers, one per pixel.","> Remember: 8 bits all set to 1 (11111111) = 255.","## Try it","Click the bits in the lab to switch them on or off."],
ru:["## Счёт двумя цифрами","Мы считаем в **десятичной системе** (десять цифр: от 0 до 9). Компьютеры считают в **двоичной** (две цифры: 0 и 1), ведь электронный элемент легко различает два состояния: включено и выключено. Цифра 0 или 1 называется **битом**.","## Как это работает","В двоичной системе каждая позиция — степень двойки: 1, 2, 4, 8, 16, 32, 64, 128 (справа налево). **1011** = 8 + 0 + 2 + 1 = **11**. Группа из 8 бит — **байт**, он хранит 256 значений, от 0 до 255.","## Буквы и картинки","У каждой буквы есть номер (например, «A» = 65), записанный двоично. Картинка — длинный список номеров цвета, по одному на пиксель.","> Запомни: 8 бит, все равные 1 (11111111) = 255.","## Попробуй сам","Нажимай на биты в лаборатории, чтобы включать и выключать их."]},
q:[{q:L("Konbyen 101 (binè) ye an desimal ?","Que vaut 101 (binaire) en décimal ?","What is 101 (binary) in decimal?","Чему равно 101 (двоичное) в десятичной?"),o:["3","5","7","101"],a:1},
{q:L("Konbyen valè 8 bit ka reprezante ?","Combien de valeurs 8 bits peuvent-ils représenter ?","How many values can 8 bits represent?","Сколько значений могут представить 8 бит?"),o:["8","64","255","256"],a:3},
{q:L("Ki chif yon bit ka genyen ?","Quels chiffres un bit peut-il avoir ?","Which digits can a bit have?","Какие цифры может иметь бит?"),o:["0–9","0 / 1","1–2","A–F"],a:1},
{q:L("Konbyen 1111 (binè) ye ?","Que vaut 1111 (binaire) ?","What is 1111 (binary)?","Чему равно 1111 (двоичное)?"),o:["4","8","15","16"],a:2}]});

ART.push({id:"ortograf",s:"kreyol",lv:1,min:4,img:"letters",lab:"spell",w:["voyelle","syllabe"],
t:L("Ortograf kreyòl : yon son, yon fason pou ekri l","Orthographe créole : un son, une façon de l'écrire","Creole spelling: one sound, one way to write it","Креольская орфография: один звук — одно написание"),
sum:L("Kreyòl la ekri jan li pale : aprann son yo epi ou ka ekri nenpòt mo.","Le créole s'écrit comme il se prononce : apprenez les sons et vous pouvez écrire n'importe quel mot.","Creole is written as it is spoken: learn the sounds and you can write any word.","Креольский пишется как произносится: выучи звуки, и сможешь писать любое слово."),
b:{
ht:["## Yon lang ki ekri jan li pale","Òtograf ofisyèl kreyòl ayisyen an fonetik : chak son gen yon fason pou ekri l, epi yon lèt toujou fè menm son an. Se sa k fè li pi fasil pou aprann li ak ekri.","## Vwayèl yo","Kreyòl gen vwayèl oral tankou **a, e, è, i, o, ò, ou** ak vwayèl nazal tankou **an, en, on**. Aksan yo enpòtan : **è** ak **e** fè de son diferan, tankou **ò** ak **o**.","## Silab yo","Yon silab se yon gwoup son ou di nan yon sèl souf. **ze-twal** gen 2 silab ; **ba-nann** gen 2 ; **dlo** gen 1. Konte silab yo ede ou ekri ak li mo yo pi byen.","> Egzanp : \"mwen\", \"bonjou\", \"lekòl\". Kreyòl la pa itilize fen \"-our\" tankou nan fransè.","## Eseye pa ou","Nan laboratwa a, mete lèt yo nan lòd pou fòme mo a."],
fr:["## Une langue qui s'écrit comme elle se dit","L'orthographe officielle du créole haïtien est phonétique : chaque son a une façon de s'écrire, et une lettre fait toujours le même son. C'est ce qui rend l'apprentissage de la lecture et de l'écriture plus simple.","## Les voyelles","Le créole a des voyelles orales comme **a, e, è, i, o, ò, ou** et des voyelles nasales comme **an, en, on**. Les accents comptent : **è** et **e** font deux sons différents, comme **ò** et **o**.","## Les syllabes","Une syllabe est un groupe de sons dit en une seule émission de voix. **ze-twal** a 2 syllabes ; **ba-nann** en a 2 ; **dlo** en a 1. Compter les syllabes aide à mieux lire et écrire les mots.","> Exemples : « mwen », « bonjou », « lekòl » — le créole n'utilise pas les terminaisons « -our » du français.","## À toi de jouer","Dans le laboratoire, remets les lettres dans l'ordre pour former le mot."],
en:["## A language written as it is spoken","The official spelling of Haitian Creole is phonetic: every sound has one way of being written, and a letter always makes the same sound. That makes reading and writing easier to learn.","## The vowels","Creole has oral vowels like **a, e, è, i, o, ò, ou** and nasal vowels like **an, en, on**. Accents matter: **è** and **e** are two different sounds, like **ò** and **o**.","## Syllables","A syllable is a group of sounds said in one breath. **ze-twal** has 2 syllables; **ba-nann** has 2; **dlo** has 1. Counting syllables helps you read and write words better.","> Examples: \"mwen\", \"bonjou\", \"lekòl\": Creole does not use French \"-our\" endings.","## Try it","In the lab, put the letters in order to build the word."],
ru:["## Язык, который пишется как звучит","Официальная орфография гаитянского креольского фонетическая: у каждого звука один способ записи, а буква всегда даёт один и тот же звук. Поэтому читать и писать выучить проще.","## Гласные","В креольском есть устные гласные **a, e, è, i, o, ò, ou** и носовые **an, en, on**. Знаки важны: **è** и **e** — разные звуки, как и **ò** и **o**.","## Слоги","Слог — группа звуков, произносимая на одном выдохе. В **ze-twal** 2 слога; в **ba-nann** — 2; в **dlo** — 1. Счёт слогов помогает лучше читать и писать слова.","> Примеры: «mwen», «bonjou», «lekòl» — в креольском нет французских окончаний «-our».","## Попробуй сам","В лаборатории расставь буквы по порядку, чтобы получилось слово."]},
q:[{q:L("Konbyen silab nan \"zetwal\" ?","Combien de syllabes dans « zetwal » ?","How many syllables in \"zetwal\"?","Сколько слогов в слове «zetwal»?"),o:["1","2","3","4"],a:1},
{q:L("Ki fason ki kòrèk pou ekri \"bonjou\" an kreyòl ?","Quelle est l'écriture correcte de « bonjou » en créole ?","Which is the correct Creole spelling of \"good day\"?","Как правильно по-креольски «добрый день»?"),o:["bonjour","bonjou","bonjourr","bonjo"],a:1},
{q:L("Konbyen silab nan \"dlo\" ?","Combien de syllabes dans « dlo » ?","How many syllables in \"dlo\"?","Сколько слогов в «dlo»?"),o:["1","2","3","0"],a:0}]});

/* ---------- 10. Salitasyon ---------- */
ART.push({id:"salit",s:"franse",lv:1,min:3,img:"hello",lab:"greet",w:["salutation"],
t:L("Di bonjou nan kat lang","Dire bonjour en quatre langues","Saying hello in four languages","Здороваемся на четырёх языках"),
sum:L("Salitasyon debaz an kreyòl, fransè, angle ak ris, ak pwononsyasyon.","Les salutations de base en créole, français, anglais et russe, avec la prononciation.","Basic greetings in Creole, French, English and Russian, with pronunciation.","Базовые приветствия на креольском, французском, английском и русском с произношением."),
b:{
ht:["## Premye mo ou aprann","Salitasyon se premye mo ou aprann nan yon nouvo lang. Yon bon \"bonjou\" ouvri pòt yo.","## Kreyòl, fransè, angle, ris","Nan laboratwa a ou jwenn salitasyon yo nan kat lang. Klike sou bouton **Koute** pou tande pwononsyasyon an si aparèy ou gen vwa pou lang lan.","## Konsèy pou pwononse","Fè atansyon ak son : nan ris, lèt **р** woule, epi nan angle \"th\" fè yon son espesyal. Repete a vwa wo, plizyè fwa.","> Nòt : kèk navigatè pa gen vwa kreyòl ; nan ka sa a li itilize yon vwa fransè ki pwòch.","## Eseye pa ou","Pase sou kat yo epi repete chak salitasyon a vwa wo."],
fr:["## Les premiers mots qu'on apprend","Les salutations sont les premiers mots d'une nouvelle langue. Un bon « bonjour » ouvre des portes.","## Créole, français, anglais, russe","Dans le laboratoire, vous trouverez les salutations en quatre langues. Cliquez sur **Écouter** pour entendre la prononciation si votre appareil a une voix pour la langue.","## Conseils de prononciation","Attention aux sons : en russe le **р** est roulé, et en anglais le « th » est un son particulier. Répétez à voix haute, plusieurs fois.","> Remarque : certains navigateurs n'ont pas de voix créole ; dans ce cas une voix française proche est utilisée.","## À toi de jouer","Parcours les cartes et répète chaque salutation à voix haute."],
en:["## The first words you learn","Greetings are the first words of a new language. A good \"hello\" opens doors.","## Creole, French, English, Russian","In the lab you will find greetings in four languages. Click **Listen** to hear the pronunciation if your device has a voice for the language.","## Pronunciation tips","Watch the sounds: in Russian the letter **р** is rolled, and in English \"th\" is a special sound. Repeat aloud, several times.","> Note: some browsers have no Creole voice; then a nearby French voice is used.","## Try it","Go through the cards and repeat each greeting aloud."],
ru:["## Первые слова, которые учат","Приветствия — первые слова нового языка. Хорошее «здравствуйте» открывает двери.","## Креольский, французский, английский, русский","В лаборатории вы найдёте приветствия на четырёх языках. Нажмите **Слушать**, чтобы услышать произношение, если на устройстве есть голос для языка.","## Советы по произношению","Следите за звуками: в русском **р** раскатистое, а в английском «th» — особый звук. Повторяйте вслух несколько раз.","> Примечание: в некоторых браузерах нет креольского голоса; тогда используется близкий французский.","## Попробуй сам","Пройдись по карточкам и повтори каждое приветствие вслух."]},

b:{
ht:["## Miltiplikasyon se adisyon rapid","Si ou gen 3 sak ak 4 mango nan chak sak, ou ka konte 4 + 4 + 4 = 12. Nou ekri sa pi kout : **3 × 4 = 12**. Rezilta a rele **pwodui** a.","## Lòd la pa chanje anyen","**3 × 4 = 4 × 3.** Se menm pwodui a. Kidonk ou jis bezwen aprann mwatye tab yo : si ou konnen 3 × 7, ou konnen 7 × 3.","## Astis pou ale vit","**× 2** : double nonm lan. **× 5** : rezilta a fini ak 0 oswa 5. **× 10** : ajoute yon zewo. **× 9** : chif yo ajoute yo bay 9 (9 × 4 = 36, epi 3 + 6 = 9). **× 11** (jiska 9) : repete chif la (11 × 4 = 44).","> Rapèl : nenpòt nonm × 0 = 0, epi nenpòt nonm × 1 = li menm.","## Eseye pa ou","Nan laboratwa a, klike sou yon kare nan tab la pou wè pwodui a ak pwen yo."],
fr:["## La multiplication, c'est de l'addition rapide","Si vous avez 3 sacs avec 4 mangues dans chacun, vous pouvez compter 4 + 4 + 4 = 12. On l'écrit plus court : **3 × 4 = 12**. Le résultat s'appelle le **produit**.","## L'ordre ne change rien","**3 × 4 = 4 × 3.** C'est le même produit. Il suffit donc d'apprendre la moitié des tables : si vous connaissez 3 × 7, vous connaissez 7 × 3.","## Astuces pour aller vite","**× 2** : doubler le nombre. **× 5** : le résultat finit par 0 ou 5. **× 10** : ajouter un zéro. **× 9** : les chiffres du résultat font 9 (9 × 4 = 36, et 3 + 6 = 9). **× 11** (jusqu'à 9) : répéter le chiffre (11 × 4 = 44).","> À retenir : tout nombre × 0 = 0, et tout nombre × 1 = lui-même.","## À toi de jouer","Dans le laboratoire, clique sur une case du tableau pour voir le produit et les points."],
en:["## Multiplication is fast adding","If you have 3 bags with 4 mangoes in each, you can count 4 + 4 + 4 = 12. We write it shorter: **3 × 4 = 12**. The result is called the **product**.","## Order does not matter","**3 × 4 = 4 × 3.** Same product. So you only need to learn half the tables: if you know 3 × 7, you know 7 × 3.","## Tricks to go fast","**× 2**: double the number. **× 5**: the result ends in 0 or 5. **× 10**: add a zero. **× 9**: the digits of the result add up to 9 (9 × 4 = 36, and 3 + 6 = 9). **× 11** (up to 9): repeat the digit (11 × 4 = 44).","> Remember: any number × 0 = 0, and any number × 1 = itself.","## Try it","In the lab, click a square in the table to see the product and the dots."],
ru:["## Умножение — это быстрое сложение","Если у вас 3 мешка и в каждом по 4 манго, можно посчитать 4 + 4 + 4 = 12. Короче: **3 × 4 = 12**. Результат называется **произведением**.","## От перестановки результат не меняется","**3 × 4 = 4 × 3.** Произведение то же. Значит, учить нужно только половину таблицы: зная 3 × 7, вы знаете и 7 × 3.","## Приёмы для быстрого счёта","**× 2**: удвоить число. **× 5**: результат оканчивается на 0 или 5. **× 10**: приписать ноль. **× 9**: сумма цифр результата равна 9 (9 × 4 = 36, и 3 + 6 = 9). **× 11** (до 9): повторить цифру (11 × 4 = 44).","> Запомни: любое число × 0 = 0, а любое число × 1 = само себе.","## Попробуй сам","В лаборатории нажимай на клетки таблицы, чтобы увидеть произведение и точки."]},

ART.push({id:"fotosentez",s:"byoloji",lv:1,min:4,img:"leaf",lab:"photo",w:["photosynthese","chlorophylle"],
t:L("Fotosentèz : ki jan plant yo fè manje","La photosynthèse : comment les plantes fabriquent leur nourriture","Photosynthesis: how plants make their food","Фотосинтез: как растения создают пищу"),
sum:L("Limyè, dlo ak gaz kabonik tounen sik ak oksijèn.","Lumière, eau et gaz carbonique deviennent sucre et oxygène.","Light, water and carbon dioxide become sugar and oxygen.","Свет, вода и углекислый газ превращаются в сахар и кислород."),
b:{
ht:["## Plant yo fè pwòp manje yo","Pa tankou moun, plant yo pa bezwen manje yon lòt vivan. Yo fè sik yo menm, nan fèy yo, ak enèji solèy la. Sa rele **fotosentèz**.","## Resèt la","**Dlo** (ki soti nan rasin yo) + **gaz kabonik** (ki soti nan lè a) + **limyè** → **sik** + **oksijèn**. Pati vèt nan fèy la, **klowofil** la, kenbe limyè a.","## Poukisa sa enpòtan ?","Sik la nouri plant la epi tout bèt k ap manje l. Oksijèn lan se lè nou respire. Pye bwa yo se pi bon zanmi lè a.","> Si youn nan twa eleman yo manke, fotosentèz la ralanti oswa li kanpe.","## Eseye pa ou","Nan laboratwa a, chanje limyè, dlo ak gaz kabonik pou wè ki sa k limite plant la."],
fr:["## Les plantes fabriquent leur propre nourriture","Contrairement aux humains, les plantes n'ont pas besoin de manger un autre être vivant. Elles fabriquent leur sucre elles-mêmes, dans leurs feuilles, avec l'énergie du Soleil. C'est la **photosynthèse**.","## La recette","**Eau** (venue des racines) + **gaz carbonique** (venu de l'air) + **lumière** → **sucre** + **oxygène**. La partie verte de la feuille, la **chlorophylle**, capte la lumière.","## Pourquoi c'est important ?","Le sucre nourrit la plante et tous les animaux qui la mangent. L'oxygène, c'est l'air que nous respirons. Les arbres sont les meilleurs amis de l'air.","> Si l'un des trois éléments manque, la photosynthèse ralentit ou s'arrête.","## À toi de jouer","Dans le laboratoire, change la lumière, l'eau et le gaz carbonique pour voir ce qui limite la plante."],
en:["## Plants make their own food","Unlike people, plants do not need to eat another living thing. They make sugar themselves, in their leaves, using the Sun's energy. This is **photosynthesis**.","## The recipe","**Water** (from the roots) + **carbon dioxide** (from the air) + **light** → **sugar** + **oxygen**. The green part of the leaf, **chlorophyll**, captures the light.","## Why it matters","The sugar feeds the plant and every animal that eats it. Oxygen is the air we breathe. Trees are the air's best friends.","> If any one of the three is missing, photosynthesis slows down or stops.","## Try it","In the lab, change light, water and carbon dioxide to see what limits the plant."],
ru:["## Растения сами создают пищу","В отличие от людей, растениям не нужно есть другие живые существа. Сахар они вырабатывают сами, в листьях, используя энергию Солнца. Это **фотосинтез**.","## Рецепт","**Вода** (из корней) + **углекислый газ** (из воздуха) + **свет** → **сахар** + **кислород**. Зелёная часть листа, **хлорофилл**, улавливает свет.","## Почему это важно","Сахар питает растение и всех животных, которые его едят. Кислород — воздух, которым мы дышим. Деревья — лучшие друзья воздуха.","> Если не хватает любого из трёх компонентов, фотосинтез замедляется или останавливается.","## Попробуй сам","В лаборатории меняй свет, воду и углекислый газ и смотри, что ограничивает растение."]},
q:[{q:L("Ki gaz plant yo pran nan lè a ?","Quel gaz les plantes prennent-elles dans l'air ?","Which gas do plants take from the air?","Какой газ растения берут из воздуха?"),o:[L("Oksijèn","Oxygène","Oxygen","Кислород"),L("Gaz kabonik","Gaz carbonique","Carbon dioxide","Углекислый газ"),L("Azòt","Azote","Nitrogen","Азот"),L("Idwojèn","Hydrogène","Hydrogen","Водород")],a:1},
{q:L("Ki gaz plant yo lage ?","Quel gaz les plantes rejettent-elles ?","Which gas do plants release?","Какой газ выделяют растения?"),o:[L("Oksijèn","Oxygène","Oxygen","Кислород"),L("Gaz kabonik","Gaz carbonique","Carbon dioxide","Углекислый газ"),L("Lafimen","Fumée","Smoke","Дым"),L("Metàn","Méthane","Methane","Метан")],a:0},

t:L("Lave men ou : 20 segonn ki sove lavi","Se laver les mains : 20 secondes qui sauvent des vies","Washing hands: 20 seconds that save lives","Мытьё рук: 20 секунд, спасающих жизни"),
sum:L("Ki jan ak ki lè pou lave men ou, ak ki jan pou pwòp dlo a.","Comment et quand se laver les mains, et comment rendre l'eau plus sûre.","How and when to wash your hands, and how to make water safer.","Как и когда мыть руки и как сделать воду безопаснее."),
b:{
ht:["## Mikwòb yo pa wè ak je","**Mikwòb** yo twò piti pou wè, men yo ka ba ou dyare, kolera ak anpil lòt maladi. Men ou pwòp lè ou gen sabon ak dlo ; se pi bon defans ki egziste.","## Ki lè pou lave men ?","Anvan ou manje oswa kwit manje, apre ou sòti nan twalèt, apre ou okipe yon moun malad, apre ou manyen bèt, epi lè men ou sal.","## Ki jan pou lave yo","Mouye men yo, mete sabon, frote **omwen 20 segonn** : pla men, do men, ant dwèt yo, gwo dwèt yo, zong yo. Rense byen epi seche ak yon twal pwòp.","## Dlo pou bwè","Si ou pa sèten dlo a pwòp, fè l bouyi byen pandan **1 minit**, oswa trete l ak pwodui klò dapre enstriksyon sou pake a. Kenbe dlo a nan yon veso kouvri.","> Sa se enfòmasyon jeneral ; pou yon maladi, wè yon pwofesyonèl sante.","## Eseye pa ou","Kòmanse tenporizatè a nan laboratwa a epi swiv etap yo."],
fr:["## Les microbes sont invisibles à l'œil nu","Les **microbes** sont trop petits pour être vus, mais ils peuvent donner la diarrhée, le choléra et bien d'autres maladies. Avec du savon et de l'eau, vos mains sont propres : c'est la meilleure défense qui existe.","## Quand se laver les mains ?","Avant de manger ou de cuisiner, après les toilettes, après avoir soigné un malade, après avoir touché un animal, et quand les mains sont sales.","## Comment faire","Mouillez les mains, savonnez, frottez **au moins 20 secondes** : paumes, dos des mains, entre les doigts, pouces, ongles. Rincez bien et séchez avec un linge propre.","## L'eau à boire","Si vous n'êtes pas sûr que l'eau est propre, faites-la bouillir **1 minute**, ou traitez-la avec un produit chloré selon les instructions du paquet. Conservez l'eau dans un récipient couvert.","> Ces informations sont générales ; en cas de maladie, voyez un professionnel de santé.","## À toi de jouer","Lance le minuteur dans le laboratoire et suis les étapes."],
en:["## Germs are invisible to the eye","**Germs** are too small to see, but they can cause diarrhoea, cholera and many other illnesses. With soap and water your hands are clean: it is the best defence there is.","## When to wash your hands","Before eating or cooking, after the toilet, after caring for someone sick, after touching animals, and whenever your hands are dirty.","## How to do it","Wet your hands, add soap, scrub for **at least 20 seconds**: palms, backs of hands, between fingers, thumbs, nails. Rinse well and dry with a clean cloth.","## Drinking water","If you are not sure water is clean, boil it for **1 minute**, or treat it with a chlorine product following the instructions on the pack. Store water in a covered container.","> This is general information; for an illness, see a health professional.","## Try it","Start the timer in the lab and follow the steps."],
ru:["## Микробы невидимы глазу","**Микробы** слишком малы, чтобы их увидеть, но они могут вызывать диарею, холеру и многие другие болезни. С мылом и водой руки становятся чистыми: это лучшая защита.","## Когда мыть руки","Перед едой и готовкой, после туалета, после ухода за больным, после контакта с животными и когда руки грязные.","## Как это делать","Намочите руки, намыльте и мойте **не меньше 20 секунд**: ладони, тыльную сторону, между пальцами, большие пальцы, ногти. Хорошо смойте и вытрите чистым полотенцем.","## Питьевая вода","Если вы не уверены, что вода чистая, кипятите её **1 минуту** или обеззараживайте хлорным средством по инструкции на упаковке. Храните воду в закрытой посуде.","> Это общая информация; при болезни обратитесь к медицинскому работнику.","## Попробуй сам","Запусти таймер в лаборатории и следуй шагам."]},

ART.push({id:"kedlo",s:"med",lv:2,min:5,img:"heart",lab:"pulse",w:["pouls"],
t:L("Kè a ak batman : motè kò a","Le cœur et le pouls : le moteur du corps","The heart and the pulse: the body's engine","Сердце и пульс: двигатель организма"),
sum:L("Ki jan kè a pouse san nan tout kò a epi ki jan pou mezire batman ou.","Comment le cœur envoie le sang dans tout le corps et comment mesurer son pouls.","How the heart sends blood through the body and how to measure your pulse.","Как сердце гонит кровь по телу и как измерить пульс."),
b:{
ht:["## Yon ponp ki pa janm repoze","Kè a se yon misk ki gen **kat chanm** : de oreyèt ak de vantrikil. Li pouse san nan tout kò a pou pote oksijèn ak manje nan chak selil, epi li pran dechè yo tounen. Yon moun adilt gen apeprè **5 lit san**.","## De sikwi","Sikilasyon an gen de bouk : bouk **ti sikilasyon an** voye san nan poumon pou pran oksijèn ; bouk **gwo sikilasyon an** pote san ki rich ak oksijèn nan tout kò a. Atè yo pote san soti nan kè a, venn yo pote l tounen.","## Batman an (pouls la)","Chak fwa kè a kontrakte, li kreye yon vag nan atè yo ou ka santi nan ponyèt oswa nan kou. Pou yon adilt ki an repo, batman nòmal la se anjeneral **ant 60 ak 100 batman pa minit**. Egzèsis, emosyon, lafyèv ak kafe ka fè l monte.","## Siyal pou pa neglije","Doulè nan lestomak, souf kout toudenkou, malèz ak sezisman se siyal ki mande èd medikal ijan. Tansyon ki wo souvan pa gen sentòm : se poutèt sa yo mezire l regilyèman.","> Enfòmasyon edikatif sèlman ; li pa ranplase yon konsiltasyon ak yon doktè.","## Eseye pa ou","Nan laboratwa a, konte batman ou pandan 15 segonn epi miltipliye pa 4."],
fr:["## Une pompe qui ne se repose jamais","Le cœur est un muscle à **quatre cavités** : deux oreillettes et deux ventricules. Il envoie le sang dans tout le corps pour apporter l'oxygène et les nutriments à chaque cellule, et récupère les déchets. Un adulte a environ **5 litres de sang**.","## Deux circuits","La circulation a deux boucles : la **petite circulation** envoie le sang aux poumons pour prendre l'oxygène ; la **grande circulation** distribue le sang riche en oxygène dans tout le corps. Les artères emportent le sang loin du cœur, les veines le ramènent.","## Le pouls","À chaque contraction, le cœur crée une onde dans les artères qu'on sent au poignet ou au cou. Chez un adulte au repos, la fréquence normale se situe en général **entre 60 et 100 battements par minute**. L'effort, l'émotion, la fièvre et la caféine la font monter.","## Signaux à ne pas négliger","Douleur dans la poitrine, essoufflement soudain, malaise et évanouissement demandent une aide médicale urgente. L'hypertension n'a souvent aucun symptôme : c'est pourquoi on mesure régulièrement la tension.","> Information éducative uniquement ; elle ne remplace pas une consultation médicale.","## À toi de jouer","Dans le laboratoire, compte ton pouls pendant 15 secondes et multiplie par 4."],
en:["## A pump that never rests","The heart is a muscle with **four chambers**: two atria and two ventricles. It sends blood around the body to bring oxygen and nutrients to every cell and takes waste away. An adult has about **5 litres of blood**.","## Two circuits","Circulation has two loops: the **pulmonary circuit** sends blood to the lungs to pick up oxygen; the **systemic circuit** delivers oxygen-rich blood to the whole body. Arteries carry blood away from the heart, veins bring it back.","## The pulse","With each contraction the heart makes a wave in the arteries that you can feel at the wrist or neck. For a resting adult the normal rate is usually **60 to 100 beats per minute**. Exercise, emotion, fever and caffeine raise it.","## Signs not to ignore","Chest pain, sudden breathlessness, feeling faint or fainting need urgent medical help. High blood pressure often has no symptoms, which is why it is measured regularly.","> Educational information only; it does not replace a medical consultation.","## Try it","In the lab, count your pulse for 15 seconds and multiply by 4."],
ru:["## Насос, который не отдыхает","Сердце — мышца с **четырьмя камерами**: двумя предсердиями и двумя желудочками. Оно гонит кровь по телу, доставляя кислород и питательные вещества каждой клетке и забирая отходы. У взрослого около **5 литров крови**.","## Два круга","Кровообращение состоит из двух кругов: **малый круг** направляет кровь в лёгкие за кислородом; **большой круг** доставляет обогащённую кислородом кровь по всему телу. Артерии уносят кровь от сердца, вены возвращают её.","## Пульс","При каждом сокращении сердце создаёт волну в артериях, которую можно ощутить на запястье или шее. У взрослого в покое норма обычно **от 60 до 100 ударов в минуту**. Нагрузка, эмоции, жар и кофеин повышают её.","## Тревожные признаки","Боль в груди, внезапная одышка, дурнота и обморок требуют срочной медицинской помощи. Высокое давление часто не даёт симптомов, поэтому его измеряют регулярно.","> Только образовательная информация; она не заменяет консультацию врача.","## Попробуй сам","В лаборатории считай пульс 15 секунд и умножь на 4."]},
q:[{q:L("Konbyen chanm kè a genyen ?","Combien de cavités a le cœur ?","How many chambers does the heart have?","Сколько камер у сердца?"),o:["2","3","4","6"],a:2},
{q:L("Ki batman nòmal pou yon adilt ki an repo ?","Quelle fréquence est normale pour un adulte au repos ?","What is a normal resting adult heart rate?","Какая частота пульса нормальна для взрослого в покое?"),o:[L("10–30","10–30","10–30","10–30"),L("60–100","60–100","60–100","60–100"),L("150–200","150–200","150–200","150–200"),L("Pa gen limit","Aucune limite","No limit","Без ограничений")],a:1},
{q:L("Ki vè ki pote san soti nan kè a ?","Quels vaisseaux emportent le sang loin du cœur ?","Which vessels carry blood away from the heart?","Какие сосуды уносят кровь от сердца?"),o:[L("Atè","Les artères","Arteries","Артерии"),L("Venn","Les veines","Veins","Вены"),L("Nè","Les nerfs","Nerves","Нервы"),L("Misk","Les muscles","Muscles","Мышцы")],a:0}]});

ART.push({id:"memwa",s:"psy",lv:2,min:5,img:"curve",lab:"forget",w:["memoire"],
t:L("Memwa : poukisa nou bliye epi ki jan pou sonje","La mémoire : pourquoi on oublie et comment mieux retenir","Memory: why we forget and how to remember better","Память: почему мы забываем и как лучше запоминать"),
sum:L("Kou bliye Ebbinghaus ak revizyon espase ki goumen kont bliye a.","La courbe de l'oubli d'Ebbinghaus et la révision espacée qui la combat.","Ebbinghaus's forgetting curve and the spaced review that fights it.","Кривая забывания Эббингауза и интервальное повторение, которое с ней борется."),
b:{
ht:["## Twa etap memwa","Enfòmasyon pase pa **memwa sansoryèl** (kèk segonn), **memwa kout tèm** (apeprè 20 a 30 segonn, 4 a 7 eleman) epi, si li rete, **memwa alontèm**. Sa ki gen sans pou ou ak sa ou repete rete pi fasil.","## Kou bliye a","An 1885, sikològ alman **Hermann Ebbinghaus** te teste tèt li ak sila ki pa gen sans epi li jwenn ke nou bliye vit nan premye lè ak premye jou yo, apre sa pi dousman. Kou sa a rele **kou bliye a**.","## Revizyon espase","Si ou revize nan kèk jou ki espase (egzanp jou 1, jou 3, jou 7) olye ou etidye tout bagay yon sèl fwa, souvni a vin pi solid epi li dire pi lontan. Se sa ki rele **efè espasman an**.","## Lòt konsèy ki mache","Eseye sonje san gade (pa jis relire), eksplike bagay la ak pwòp mo ou, dòmi byen (somèy ede konsolide memwa), epi fè lyen ak sa ou deja konnen.","> Modèl nan laboratwa a senplifye pou montre lide a ; chak moun diferan.","## Eseye pa ou","Nan laboratwa a, konpare kou ak revizyon ak kou san revizyon."],
fr:["## Trois étapes de mémoire","L'information passe par la **mémoire sensorielle** (quelques secondes), la **mémoire à court terme** (environ 20 à 30 secondes, 4 à 7 éléments) puis, si elle est retenue, la **mémoire à long terme**. Ce qui a du sens pour vous et ce que vous répétez se retient mieux.","## La courbe de l'oubli","En 1885, le psychologue allemand **Hermann Ebbinghaus** s'est testé sur des syllabes sans sens et a trouvé qu'on oublie vite pendant les premières heures et le premier jour, puis plus lentement. C'est la **courbe de l'oubli**.","## La révision espacée","Si vous révisez à des intervalles espacés (par exemple jour 1, jour 3, jour 7) au lieu de tout étudier d'un coup, le souvenir devient plus solide et dure plus longtemps. C'est l'**effet d'espacement**.","## Autres conseils qui marchent","Essayez de retrouver sans regarder (pas juste relire), expliquez avec vos propres mots, dormez bien (le sommeil aide à consolider la mémoire) et faites des liens avec ce que vous savez déjà.","> Le modèle du laboratoire est simplifié pour montrer l'idée ; chaque personne est différente.","## À toi de jouer","Dans le laboratoire, compare la courbe avec révisions et sans révisions."],
en:["## Three stages of memory","Information passes through **sensory memory** (a few seconds), **short-term memory** (about 20 to 30 seconds, 4 to 7 items) and, if kept, **long-term memory**. What is meaningful to you and what you repeat sticks better.","## The forgetting curve","In 1885 the German psychologist **Hermann Ebbinghaus** tested himself on meaningless syllables and found that we forget fast in the first hours and first day, then more slowly. This is the **forgetting curve**.","## Spaced review","If you review at spaced intervals (for example day 1, day 3, day 7) instead of studying everything at once, the memory becomes stronger and lasts longer. This is the **spacing effect**.","## Other tips that work","Try to recall without looking (not just rereading), explain it in your own words, sleep well (sleep helps consolidate memory), and link it to what you already know.","> The lab model is simplified to show the idea; everyone is different.","## Try it","In the lab, compare the curve with reviews and without."],
ru:["## Три стадии памяти","Информация проходит через **сенсорную память** (несколько секунд), **кратковременную** (около 20–30 секунд, 4–7 элементов) и, если сохраняется, **долговременную**. То, что имеет для вас смысл и что вы повторяете, запоминается лучше.","## Кривая забывания","В 1885 году немецкий психолог **Герман Эббингауз** проверил себя на бессмысленных слогах и обнаружил, что мы быстро забываем в первые часы и в первый день, затем медленнее. Это **кривая забывания**.","## Интервальное повторение","Если повторять через промежутки (например, на 1-й, 3-й, 7-й день), а не учить всё сразу, воспоминание становится прочнее и держится дольше. Это **эффект интервала**.","## Другие работающие советы","Пробуйте вспомнить, не подглядывая (а не просто перечитывать), объясняйте своими словами, хорошо спите (сон помогает закреплять память) и связывайте новое с тем, что уже знаете.","> Модель в лаборатории упрощена, чтобы показать идею; все люди разные.","## Попробуй сам","В лаборатории сравни кривую с повторениями и без них."]},
q:[{q:L("Ki moun ki te dekri kou bliye a an 1885 ?","Qui a décrit la courbe de l'oubli en 1885 ?","Who described the forgetting curve in 1885?","Кто описал кривую забывания в 1885 году?"),o:["Freud","Ebbinghaus","Piaget","Pavlov"],a:1},
{q:L("Ki teknik ki ede pi plis pou sonje alontèm ?","Quelle technique aide le plus à retenir à long terme ?","Which technique helps long-term retention most?","Какой приём лучше всего помогает запоминать надолго?"),o:[L("Revizyon espase","Révision espacée","Spaced review","Интервальное повторение"),L("Etidye yon sèl fwa","Étudier une seule fois","Studying once","Учить один раз"),L("Pa dòmi","Ne pas dormir","Skipping sleep","Не спать"),L("Li san repete","Lire sans répéter","Reading without repeating","Читать без повторения")],a:0},
{q:L("Konbyen eleman memwa kout tèm kenbe apeprè ?","Combien d'éléments la mémoire à court terme retient-elle environ ?","About how many items does short-term memory hold?","Сколько элементов примерно удерживает кратковременная память?"),o:["1–2","4–7","20–30","100"],a:1}]});

ART.push({id:"newon",s:"neuro",lv:2,min:5,img:"neuron",lab:"neuron",w:["neurone","synapse"],
t:L("Nèwòn ak sinaps : ki jan sèvo a voye mesaj","Neurones et synapses : comment le cerveau envoie des messages","Neurons and synapses: how the brain sends messages","Нейроны и синапсы: как мозг передаёт сообщения"),
sum:L("Selil nè yo, siyal elektrik yo ak ti espas sinaptik la.","Les cellules nerveuses, les signaux électriques et le petit espace synaptique.","Nerve cells, electrical signals and the tiny synaptic gap.","Нервные клетки, электрические сигналы и крошечная синаптическая щель."),
b:{
ht:["## Selil ki pale youn ak lòt","Sèvo moun gen apeprè **86 milya nèwòn**. Chak nèwòn gen **dandrit** (ki resevwa siyal), yon **kò selilè** (ki trete yo) ak yon **akson** (ki voye siyal la pi lwen).","## Yon siyal elektrik","Lè yon nèwòn resevwa ase eksitasyon, li deklanche yon **potansyèl daksyon** : yon ti enpilsyon elektrik ki kouri sou akson an. Si siyal yo twò fèb, li pa tire : se prensip **tout oswa anyen**.","## Sinaps la","Nèwòn yo pa kole youn ak lòt. Nan **sinaps la**, nèwòn nan lage **nèwotransmetè** (sibstans chimik) ki travèse ti espas la epi ki aji sou nèwòn k ap vini an. Yo ka **ekside** li oswa **inibe** li.","## Poukisa sa enpòtan","Aprantisaj fòtifye sèten sinaps. Anpil medikaman ak maladi aji sou sinaps yo. Konprann sa ede nou konprann memwa, emosyon ak twoub tankou epilepsi.","> Modèl nan laboratwa a trè senplifye : yon nèwòn reyèl resevwa mil siyal.","## Eseye pa ou","Nan laboratwa a, ajiste eksitasyon ak inibisyon pou wè lè nèwòn nan tire."],
fr:["## Des cellules qui se parlent","Le cerveau humain compte environ **86 milliards de neurones**. Chaque neurone a des **dendrites** (qui reçoivent les signaux), un **corps cellulaire** (qui les traite) et un **axone** (qui envoie le signal plus loin).","## Un signal électrique","Quand un neurone reçoit assez d'excitation, il déclenche un **potentiel d'action** : une petite impulsion électrique qui parcourt l'axone. Si les signaux sont trop faibles, il ne tire pas : c'est le principe du **tout ou rien**.","## La synapse","Les neurones ne se touchent pas. À la **synapse**, le neurone libère des **neurotransmetteurs** (substances chimiques) qui traversent le petit espace et agissent sur le neurone suivant. Ils peuvent l'**exciter** ou l'**inhiber**.","## Pourquoi c'est important","L'apprentissage renforce certaines synapses. De nombreux médicaments et maladies agissent sur les synapses. Comprendre cela aide à comprendre la mémoire, les émotions et des troubles comme l'épilepsie.","> Le modèle du laboratoire est très simplifié : un vrai neurone reçoit des milliers de signaux.","## À toi de jouer","Dans le laboratoire, règle excitation et inhibition pour voir quand le neurone tire."],
en:["## Cells that talk to each other","The human brain has about **86 billion neurons**. Each neuron has **dendrites** (which receive signals), a **cell body** (which processes them) and an **axon** (which sends the signal onward).","## An electrical signal","When a neuron receives enough excitation it triggers an **action potential**: a small electrical pulse running along the axon. If the signals are too weak it does not fire: this is the **all-or-nothing** principle.","## The synapse","Neurons do not touch. At the **synapse** the neuron releases **neurotransmitters** (chemicals) that cross the tiny gap and act on the next neuron. They can **excite** or **inhibit** it.","## Why it matters","Learning strengthens certain synapses. Many drugs and diseases act on synapses. Understanding this helps explain memory, emotions and conditions such as epilepsy.","> The lab model is very simplified: a real neuron receives thousands of signals.","## Try it","In the lab, set excitation and inhibition to see when the neuron fires."],
ru:["## Клетки, которые общаются","В мозге человека около **86 миллиардов нейронов**. У каждого есть **дендриты** (принимают сигналы), **тело клетки** (обрабатывает их) и **аксон** (передаёт сигнал дальше).","## Электрический сигнал","Когда нейрон получает достаточно возбуждения, он запускает **потенциал действия** — короткий электрический импульс по аксону. Если сигналы слишком слабы, он не срабатывает: это принцип **«всё или ничего»**.","## Синапс","Нейроны не касаются друг друга. В **синапсе** нейрон выделяет **нейромедиаторы** (химические вещества), которые пересекают щель и действуют на следующий нейрон. Они могут его **возбуждать** или **тормозить**.","## Почему это важно","Обучение укрепляет определённые синапсы. Многие лекарства и болезни действуют на синапсы. Это помогает понять память, эмоции и такие состояния, как эпилепсия.","> Модель в лаборатории очень упрощена: реальный нейрон получает тысячи сигналов.","## Попробуй сам","В лаборатории настрой возбуждение и торможение и посмотри, когда нейрон срабатывает."]},
