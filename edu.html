ART.push({id:"vetye",s:"istwa",lv:2,min:4,img:"flag",lab:"vtv",w:[],
t:L("Batay Vètyè : dènye gwo batay la","La bataille de Vertières : la dernière grande bataille","The Battle of Vertières: the last great battle","Битва при Вертьере: последнее великое сражение"),
sum:L("18 novanm 1803 : jou twoup endepandan yo te bat lame franse a.","18 novembre 1803 : le jour où l'armée indigène a battu l'armée française.","18 November 1803: the day the indigenous army defeated the French.","18 ноября 1803 года: армия повстанцев разбила французов."),
b:{
ht:["## Yon batay desizif","Batay **Vètyè** te fèt **18 novanm 1803**, toupre Okap. Se dènye gwo batay Revolisyon ayisyen an. Lame endijèn nan te anba kòmandman **Jan-Jak Desalin** kont twoup franse jeneral **Rochambeau**.","## Sa ki te pase","Twoup ayisyen yo te atake fò Brèda ak lòt pozisyon franse yo. Se nan batay sa a **Kapwa-la-Mò** te rete li kanpe ak kouraj anba tire kanon yo pou ankouraje sòlda li yo. Franse yo te oblije mande yon kanpe zam.","## Konsekans","Franse yo te kite Okap, epi yo te evakye peyi a. Sa te louvri chemen pou pwoklamasyon endepandans lan **1ye janvye 1804**.","> Vètyè se batay ki te fè lide endepandans lan vin yon reyalite."],
fr:["## Une bataille décisive","La bataille de **Vertières** a eu lieu le **18 novembre 1803**, près du Cap. C'est la dernière grande bataille de la Révolution haïtienne. L'armée indigène, sous le commandement de **Jean-Jacques Dessalines**, affrontait les troupes françaises du général **Rochambeau**.","## Ce qui s'est passé","Les troupes haïtiennes ont attaqué le fort Bréda et d'autres positions françaises. C'est lors de cette bataille que **Capois-la-Mort** est resté debout, courageux sous le feu des canons, pour encourager ses soldats. Les Français ont dû demander une trêve.","## Conséquences","Les Français ont quitté le Cap, puis évacué le pays. Cela a ouvert la voie à la proclamation de l'indépendance le **1er janvier 1804**.","> Vertières a fait de l'idée d'indépendance une réalité."],
en:["## A decisive battle","The Battle of **Vertières** took place on **18 November 1803**, near Cap-Haïtien. It was the last major battle of the Haitian Revolution. The indigenous army, commanded by **Jean-Jacques Dessalines**, faced the French troops of General **Rochambeau**.","## What happened","Haitian troops attacked Fort Bréda and other French positions. In this battle **Capois-la-Mort** stood bravely under cannon fire to encourage his soldiers. The French had to ask for a truce.","## Consequences","The French left Cap-Haïtien, then evacuated the country. This opened the way to the proclamation of independence on **1 January 1804**.","> Vertières turned the idea of independence into reality."],
ru:["## Решающее сражение","Битва при **Вертьере** произошла **18 ноября 1803 года** близ Кап-Аитьен. Это последнее крупное сражение Гаитянской революции. Армия повстанцев под командованием **Жан-Жака Дессалина** сражалась с французскими войсками генерала **Рошамбо**.","## Что произошло","Гаитянские войска атаковали форт Бреда и другие французские позиции. В этой битве **Капуа-ла-Мор** бесстрашно стоял под огнём пушек, воодушевляя солдат. Французам пришлось просить перемирия.","## Последствия","Французы ушли из Капа, а затем покинули страну. Это открыло путь к провозглашению независимости **1 января 1804 года**.","> Вертьер превратил идею независимости в реальность."]},
q:[{q:L("Ki dat batay Vètyè a ?","Quelle est la date de la bataille de Vertières ?","When was the Battle of Vertières?","Когда была битва при Вертьере?"),o:[L("18 novanm 1803","18 novembre 1803","18 November 1803","18 ноября 1803"),L("1ye janvye 1804","1er janvier 1804","1 January 1804","1 января 1804"),L("14 out 1791","14 août 1791","14 August 1791","14 августа 1791"),L("18 me 1803","18 mai 1803","18 May 1803","18 мая 1803")],a:0},
{q:L("Ki moun ki te kòmande lame endijèn nan ?","Qui commandait l'armée indigène ?","Who commanded the indigenous army?","Кто командовал армией повстанцев?"),o:["Dessalines","Rochambeau","Napoléon","Leclerc"],a:0},
{q:L("Kisa ki te vini aprè Vètyè ?","Qu'est-ce qui a suivi Vertières ?","What followed Vertières?","Что последовало за Вертьером?"),o:[L("Endepandans 1804","L'indépendance en 1804","Independence in 1804","Независимость в 1804"),L("Retou esklavaj","Le retour de l'esclavage","Return of slavery","Возврат рабства"),L("Yon nouvo kolonizasyon","Une nouvelle colonisation","A new colonisation","Новая колонизация"),L("Anyen","Rien","Nothing","Ничего")],a:0}]});

ART.push({id:"drapo",s:"istwa",lv:1,min:3,img:"flag",lab:"drp",w:[],
t:L("Drapo ayisyen an : istwa ak siyifikasyon","Le drapeau haïtien : histoire et sens","The Haitian flag: history and meaning","Флаг Гаити: история и смысл"),
sum:L("Kongrè Akayè a, koulè yo ak deviz la.","Le congrès de l'Arcahaie, les couleurs et la devise.","The Arcahaie congress, the colours and the motto.","Конгресс в Аркайе, цвета и девиз."),
b:{
ht:["## Yon drapo fèt nan batay","Dapre tradisyon, nan **Kongrè Akayè** (**18 me 1803**), **Desalin** te chire pati blan nan drapo franse a. Pita, **Katrin Flon** te kouti de bann koulè ki rete yo, **ble ak wouj**.","## Siyifikasyon","Ble ak wouj reprezante inyon moun yo nan batay la pou libète. Deviz la se **« L'union fait la force »** (Inyon fè fòs).","## Jou drapo","Chak **18 me** Ayiti selebre **Jou Drapo ak Inivèsite**.","> Yon drapo ki di : ansanm nou pi fò."],
fr:["## Un drapeau né dans la lutte","Selon la tradition, au **congrès de l'Arcahaie** (**18 mai 1803**), **Dessalines** a déchiré la bande blanche du drapeau français. Plus tard, **Catherine Flon** a cousu les deux bandes restantes, **bleue et rouge**.","## Signification","Le bleu et le rouge représentent l'union des gens dans la lutte pour la liberté. La devise est **« L'union fait la force »**.","## Jour du drapeau","Chaque **18 mai**, Haïti célèbre la **Journée du drapeau et de l'université**.","> Un drapeau qui dit : ensemble, nous sommes plus forts."],
en:["## A flag born in struggle","According to tradition, at the **Arcahaie congress** (**18 May 1803**), **Dessalines** tore the white band out of the French flag. Later, **Catherine Flon** sewed the two remaining bands, **blue and red**.","## Meaning","Blue and red represent the union of the people in the fight for freedom. The motto is **“L'union fait la force”** (Unity makes strength).","## Flag Day","Every **18 May**, Haiti celebrates **Flag and University Day**.","> A flag that says: together we are stronger."],
ru:["## Флаг, рождённый в борьбе","По преданию, на **конгрессе в Аркайе** (**18 мая 1803 года**) **Дессалин** вырвал белую полосу из французского флага. Позже **Катрин Флон** сшила две оставшиеся полосы — **синюю и красную**.","## Значение","Синий и красный символизируют единство народа в борьбе за свободу. Девиз — **«L'union fait la force»** («Единство — сила»).","## День флага","Каждое **18 мая** Гаити отмечает **День флага и университета**.","> Флаг, который говорит: вместе мы сильнее."]},
q:[{q:L("Ki koulè drapo ayisyen an genyen ?","Quelles couleurs a le drapeau haïtien ?","What colours is the Haitian flag?","Какие цвета у флага Гаити?"),o:[L("Ble ak wouj","Bleu et rouge","Blue and red","Синий и красный"),L("Vèt ak jòn","Vert et jaune","Green and yellow","Зелёный и жёлтый"),L("Nwa ak blan","Noir et blanc","Black and white","Чёрный и белый"),L("Wouj ak blan","Rouge et blanc","Red and white","Красный и белый")],a:0},

{q:L("Ki deviz drapo a ?","Quelle est la devise ?","What is the motto?","Каков девиз?"),o:["L'union fait la force",L("Libète oswa lanmò","Liberté ou la mort","Freedom or death","Свобода или смерть"),L("Dye ak peyi","Dieu et pays","God and country","Бог и страна"),L("Travay ak lapè","Travail et paix","Work and peace","Труд и мир")],a:0}]});

ART.push({id:"elektrik",s:"fizik",lv:2,min:5,img:"rays",lab:"elk",w:[],
t:L("Elektrisite : kouran, vòltaj ak sekirite","Électricité : courant, tension et sécurité","Electricity: current, voltage and safety","Электричество: ток, напряжение и безопасность"),
sum:L("Kisa ki kouri nan fil la, lwa Ohm, ak règ sekirite.","Ce qui circule dans le fil, la loi d'Ohm et les règles de sécurité.","What flows in a wire, Ohm's law and safety rules.","Что течёт по проводу, закон Ома и правила безопасности."),
b:{
ht:["## Yon kouran ki sikile","Elektrisite se mouvman patikil piti (**elektwon**) nan yon fil fèmen. Pou yon ampoul limen, sikui a dwe **fèmen** : kouran an soti nan sous la (pil, batri), pase nan ampoul la epi retounen.","## Twa grandè","**Vòltaj** (V, volt) : fòs ki pouse kouran an. **Kouran** (I, anpè) : kantite ki pase. **Rezistans** (R, om) : sa ki bloke kouran an. **Lwa Om** : **V = I × R**.","## Kondiktè ak izolan","**Kondiktè** (metal tankou kwiv) kite kouran pase. **Izolan** (plastik, kawotchou, bwa sèk) bloke l.","## Sekirite","Pa manyen fil elektrik tonbe. Pa manyen priz ak men mouye. Pa mete twòp aparèy sou yon sèl priz. Chita lwen dlo. Si yon moun pran chòk, **pa manyen li dirèkteman** : koupe kouran an anvan epi rele èd.","> Elektrisite se yon bon sèvitè, men yon move mèt."],
fr:["## Un courant qui circule","L'électricité est le mouvement de minuscules particules (les **électrons**) dans un fil fermé. Pour allumer une ampoule, le circuit doit être **fermé** : le courant part de la source (pile, batterie), traverse l'ampoule et revient.","## Trois grandeurs","**Tension** (V, volt) : la force qui pousse le courant. **Courant** (I, ampère) : la quantité qui passe. **Résistance** (R, ohm) : ce qui freine le courant. **Loi d'Ohm** : **V = I × R**.","## Conducteurs et isolants","Les **conducteurs** (métaux comme le cuivre) laissent passer le courant. Les **isolants** (plastique, caoutchouc, bois sec) le bloquent.","## Sécurité","Ne touchez pas un fil électrique tombé. Ne touchez pas une prise avec les mains mouillées. Ne branchez pas trop d'appareils sur une prise. Restez loin de l'eau. Si quelqu'un reçoit un choc, **ne le touchez pas directement** : coupez d'abord le courant et appelez de l'aide.","> L'électricité est un bon serviteur, mais un mauvais maître."],
en:["## A current that flows","Electricity is the movement of tiny particles (**electrons**) in a closed wire. For a bulb to light, the circuit must be **closed**: current leaves the source (cell, battery), goes through the bulb and returns.","## Three quantities","**Voltage** (V, volt): the force pushing the current. **Current** (I, ampere): the amount flowing. **Resistance** (R, ohm): what slows the current. **Ohm's law**: **V = I × R**.","## Conductors and insulators","**Conductors** (metals such as copper) let current through. **Insulators** (plastic, rubber, dry wood) block it.","## Safety","Do not touch a fallen electric wire. Do not touch a socket with wet hands. Do not plug too many devices into one socket. Stay away from water. If someone gets a shock, **do not touch them directly**: switch off the power first and call for help.","> Electricity is a good servant but a bad master."],
ru:["## Течущий ток","Электричество — это движение мельчайших частиц (**электронов**) по замкнутому проводу. Чтобы лампочка загорелась, цепь должна быть **замкнута**: ток идёт от источника (батарейки, аккумулятора), проходит через лампу и возвращается.","## Три величины","**Напряжение** (V, вольт): сила, толкающая ток. **Сила тока** (I, ампер): количество проходящего тока. **Сопротивление** (R, ом): то, что тормозит ток. **Закон Ома**: **V = I × R**.","## Проводники и изоляторы","**Проводники** (металлы, например медь) пропускают ток. **Изоляторы** (пластик, резина, сухое дерево) его блокируют.","## Безопасность","Не трогайте упавший электрический провод. Не касайтесь розетки мокрыми руками. Не включайте слишком много приборов в одну розетку. Держитесь подальше от воды. Если человека ударило током, **не касайтесь его напрямую**: сначала отключите ток и позовите на помощь.","> Электричество — хороший слуга, но плохой хозяин."]},
q:[{q:L("Ki fòmil lwa Om ?","Quelle est la loi d'Ohm ?","What is Ohm's law?","Каков закон Ома?"),o:["V = I × R","V = I + R","V = I / R","V = R − I"],a:0},
{q:L("Ki materyèl ki izolan ?","Quel matériau est isolant ?","Which material is an insulator?","Какой материал — изолятор?"),o:[L("Kawotchou","Le caoutchouc","Rubber","Резина"),L("Kwiv","Le cuivre","Copper","Медь"),L("Fè","Le fer","Iron","Железо"),L("Alimin","L'aluminium","Aluminium","Алюминий")],a:0},
{q:L("Si yon moun pran chòk, kisa pou w fè anvan ?","Si quelqu'un reçoit un choc, que faire d'abord ?","If someone gets shocked, what first?","Если человека ударило током, что сделать сначала?"),o:[L("Koupe kouran an","Couper le courant","Switch off the power","Отключить ток"),L("Rale l ak men w","Le tirer à mains nues","Pull them with bare hands","Тянуть голыми руками"),L("Vide dlo sou li","Lui jeter de l'eau","Throw water on them","Облить водой"),L("Kouri ale","S'enfuir","Run away","Убежать")],a:0}]});

t:L("Chanjman klimatik : sa ki pase ak Latè","Le changement climatique : ce qui arrive à la Terre","Climate change: what is happening to Earth","Изменение климата: что происходит с Землёй"),
sum:L("Efè lakòl, kòz yo, konsekans pou Ayiti, ak sa nou ka fè.","L'effet de serre, ses causes, les conséquences pour Haïti et ce qu'on peut faire.","The greenhouse effect, its causes, consequences for Haiti and what we can do.","Парниковый эффект, причины, последствия для Гаити и что можно сделать."),
b:{
ht:["## Efè lakòl","Kèk gaz nan atmosfè a (tankou **gaz kabonik**, CO₂) kenbe yon pati chalè solèy la. Sa se **efè lakòl** : li nesesè pou Latè pa twò frèt. Pwoblèm lan se lè gen twòp gaz sa yo.","## Kòz yo","Lè nou boule **lenmen fosil** (chabon, petwòl, gaz) ak lè nou koupe fowè, nou ajoute plis CO₂ nan lè a. Depi epòk preindistriyèl, Latè chofe pa plis pase **1 °C**.","## Konsekans","Tanperati k ap monte, nivo lanmè k ap monte, sechrès ak gwo lapli ki pi fò, ak siklòn ki ka vin pi danjere. **Ayiti** vilnerab anpil : kòt yo, plèn yo ak mòn dekoupe yo gen anpil risk.","## Sa nou ka fè","Plante pyebwa, pwoteje fowè, itilize enèji pwòp (solè), mwens gaspiye. Prepare kominote w pou siklòn ak inondasyon.","> Aksyon piti, anpil moun, ka chanje bagay yo."],
fr:["## L'effet de serre","Certains gaz de l'atmosphère (comme le **dioxyde de carbone**, CO₂) retiennent une partie de la chaleur du soleil. C'est l'**effet de serre** : il est nécessaire pour que la Terre ne soit pas trop froide. Le problème apparaît quand il y a trop de ces gaz.","## Les causes","Quand on brûle des **combustibles fossiles** (charbon, pétrole, gaz) et qu'on coupe les forêts, on ajoute du CO₂ dans l'air. Depuis l'époque préindustrielle, la Terre s'est réchauffée de **plus de 1 °C**.","## Les conséquences","Hausse des températures, montée du niveau de la mer, sécheresses et pluies extrêmes plus fortes, cyclones parfois plus dangereux. **Haïti** est très vulnérable : les côtes, les plaines et les montagnes déboisées sont très exposées.","## Ce qu'on peut faire","Planter des arbres, protéger les forêts, utiliser des énergies propres (solaire), gaspiller moins. Préparer sa communauté aux cyclones et aux inondations.","> De petites actions, par beaucoup de gens, peuvent changer les choses."],
en:["## The greenhouse effect","Some gases in the atmosphere (such as **carbon dioxide**, CO₂) trap part of the sun's heat. This is the **greenhouse effect**: it is necessary so the Earth is not too cold. The problem arises when there are too many of these gases.","## Causes","When we burn **fossil fuels** (coal, oil, gas) and cut forests, we add CO₂ to the air. Since pre-industrial times, the Earth has warmed by **more than 1 °C**.","## Consequences","Rising temperatures, rising sea levels, stronger droughts and extreme rains, and sometimes more dangerous hurricanes. **Haiti** is very vulnerable: coasts, plains and deforested mountains are highly exposed.","## What we can do","Plant trees, protect forests, use clean energy (solar), waste less. Prepare your community for hurricanes and floods.","> Small actions by many people can change things."],
ru:["## Парниковый эффект","Некоторые газы атмосферы (например, **углекислый газ**, CO₂) удерживают часть тепла Солнца. Это **парниковый эффект**: он необходим, чтобы Земля не была слишком холодной. Проблема возникает, когда этих газов слишком много.","## Причины","Когда мы сжигаем **ископаемое топливо** (уголь, нефть, газ) и вырубаем леса, мы добавляем CO₂ в воздух. С доиндустриальных времён Земля потеплела **более чем на 1 °C**.","## Последствия","Рост температур, повышение уровня моря, более сильные засухи и экстремальные ливни, иногда более опасные ураганы. **Гаити** очень уязвима: побережья, равнины и обезлесенные горы сильно подвержены рискам.","## Что можно сделать","Сажать деревья, беречь леса, использовать чистую энергию (солнечную), меньше расточать. Готовить свою общину к ураганам и наводнениям.","> Малые действия многих людей могут изменить многое."]},
q:[{q:L("Ki gaz prensipal ki ogmante efè lakòl la ?","Quel gaz principal renforce l'effet de serre ?","Which main gas strengthens the greenhouse effect?","Какой основной газ усиливает парниковый эффект?"),o:[L("Gaz kabonik (CO₂)","Le dioxyde de carbone (CO₂)","Carbon dioxide (CO₂)","Углекислый газ (CO₂)"),L("Oksijèn","L'oxygène","Oxygen","Кислород"),L("Azòt","L'azote","Nitrogen","Азот"),L("Idwojèn","L'hydrogène","Hydrogen","Водород")],a:0},
{q:L("Kisa ki ajoute CO₂ nan lè a ?","Qu'est-ce qui ajoute du CO₂ dans l'air ?","What adds CO₂ to the air?","Что добавляет CO₂ в воздух?"),o:[L("Boule lenmen fosil ak koupe fowè","Brûler des énergies fossiles et couper les forêts","Burning fossil fuels and cutting forests","Сжигание ископаемого топлива и вырубка лесов"),L("Plante pyebwa","Planter des arbres","Planting trees","Посадка деревьев"),L("Lapli","La pluie","Rain","Дождь"),L("Lanmè","La mer","The sea","Море")],a:0},
{q:L("Kisa nou ka fè ?","Que peut-on faire ?","What can we do?","Что можно сделать?"),o:[L("Plante pyebwa, itilize enèji pwòp","Planter des arbres, utiliser des énergies propres","Plant trees, use clean energy","Сажать деревья, использовать чистую энергию"),L("Koupe plis fowè","Couper plus de forêts","Cut more forests","Вырубать больше лесов"),L("Anyen","Rien","Nothing","Ничего"),L("Boule plis chabon","Brûler plus de charbon","Burn more coal","Сжигать больше угля")],a:0}]});

ART.push({id:"malarya",s:"sp",lv:1,min:4,img:"shield",lab:"mal",w:[],
t:L("Malarya : ki jan pou pwoteje w","Le paludisme : comment se protéger","Malaria: how to protect yourself","Малярия: как защититься"),
sum:L("Ki jan li pase, siy yo, prevansyon ak tretman bonè.","Comment il se transmet, les signes, la prévention et le traitement précoce.","How it spreads, the signs, prevention and early treatment.","Как передаётся, признаки, профилактика и раннее лечение."),
b:{
ht:["## Yon maladi ki soti nan marengwen","Malarya (oswa **paludis**) se yon maladi ki pase lè yon **marengwen fi (Anofèl)** ki enfekte pike w. Li pa pase dirèkteman de moun a moun nan manyen.","## Siy yo","**Lafyèv**, frison, tèt fè mal, swe, kò fè mal, fatig. Siy yo ka parèt 1 a 4 semèn aprè pike a.","## Prevansyon","Dòmi anba **moustikè trete**. Retire dlo ki kanpe (nan pòt, gode, ponp) kote marengwen yo ponn. Mete rad ki kouvri po w nan aswè ak maten bonè. Fèmen fenèt si sa posib.","## Si w gen lafyèv","Ale nan yon sant sante **san tann** pou fè yon tès epi jwenn tretman. Tretman bonè ka sove lavi, sitou nan timoun ak fanm ansent.","> Yon moustikè pwòp pwoteje tout fanmi an."],
fr:["## Une maladie transmise par les moustiques","Le paludisme est une maladie transmise quand un **moustique femelle (anophèle)** infecté vous pique. Il ne se transmet pas directement de personne à personne par simple contact.","## Les signes","**Fièvre**, frissons, maux de tête, sueurs, douleurs musculaires, fatigue. Les signes peuvent apparaître 1 à 4 semaines après la piqûre.","## Prévention","Dormez sous une **moustiquaire imprégnée**. Supprimez les eaux stagnantes (récipients, mares, pneus) où les moustiques pondent. Portez des vêtements couvrant la peau le soir et tôt le matin. Fermez les fenêtres si possible.","## En cas de fièvre","Allez dans un centre de santé **sans attendre** pour faire un test et recevoir un traitement. Un traitement précoce peut sauver des vies, surtout chez les enfants et les femmes enceintes.","> Une moustiquaire propre protège toute la famille."],
en:["## A mosquito-borne disease","Malaria is spread when an infected **female Anopheles mosquito** bites you. It does not pass directly from person to person by simple contact.","## Signs","**Fever**, chills, headache, sweating, muscle aches, tiredness. Signs may appear 1 to 4 weeks after the bite.","## Prevention","Sleep under a **treated mosquito net**. Remove standing water (containers, puddles, tyres) where mosquitoes lay eggs. Wear clothes covering the skin in the evening and early morning. Close windows if possible.","## If you have a fever","Go to a health centre **without delay** to be tested and treated. Early treatment can save lives, especially in children and pregnant women.","> A clean net protects the whole family."],
ru:["## Болезнь, которую переносят комары","Малярия передаётся, когда вас кусает заражённая **самка комара Anopheles**. Она не передаётся напрямую от человека к человеку при обычном контакте.","## Признаки","**Лихорадка**, озноб, головная боль, потливость, ломота в мышцах, усталость. Признаки могут появиться через 1–4 недели после укуса.","## Профилактика","Спите под **обработанной москитной сеткой**. Убирайте стоячую воду (ёмкости, лужи, шины), где комары откладывают яйца. Вечером и рано утром носите одежду, закрывающую кожу. По возможности закрывайте окна.","## При лихорадке","Идите в медицинский центр **без промедления**, чтобы сдать тест и получить лечение. Раннее лечение может спасти жизнь, особенно детям и беременным.","> Чистая сетка защищает всю семью."]},
q:[{q:L("Ki bèt ki gaye malarya ?","Quel animal transmet le paludisme ?","Which animal spreads malaria?","Какое животное переносит малярию?"),o:[L("Marengwen Anofèl","Le moustique anophèle","The Anopheles mosquito","Комар Anopheles"),L("Mouch","La mouche","The fly","Муха"),L("Pis","La puce","The flea","Блоха"),L("Rat","Le rat","The rat","Крыса")],a:0},
{q:L("Kisa ki pwoteje pandan w ap dòmi ?","Qu'est-ce qui protège pendant le sommeil ?","What protects you while sleeping?","Что защищает во время сна?"),o:[L("Moustikè trete","Une moustiquaire imprégnée","A treated net","Обработанная сетка"),L("Fenèt louvri","Fenêtre ouverte","Open window","Открытое окно"),L("Dlo kanpe","De l'eau stagnante","Standing water","Стоячая вода"),L("Anyen","Rien","Nothing","Ничего")],a:0},
{q:L("Si w gen lafyèv, kisa pou w fè ?","Si vous avez de la fièvre, que faire ?","If you have a fever, what to do?","Если у вас лихорадка, что делать?"),o:[L("Ale nan sant sante pou tès","Aller au centre de santé pour un test","Go to a health centre for a test","Пойти в медцентр на тест"),L("Tann plizyè semèn","Attendre des semaines","Wait for weeks","Ждать недели"),L("Pa fè anyen","Ne rien faire","Do nothing","Ничего не делать"),L("Pran medikaman san konsèy","Prendre n'importe quel médicament","Take any medicine","Принять любое лекарство")],a:0}]});

ART.push({id:"atom",s:"chimi",lv:2,min:5,img:"bits",lab:"atm",w:[],
t:L("Atòm ak molekil : brik ki fè tout bagay","Atomes et molécules : les briques de tout","Atoms and molecules: the bricks of everything","Атомы и молекулы: кирпичики всего"),
sum:L("Pwoton, netwon, elektwon, eleman ak fòmil tankou H₂O.","Protons, neutrons, électrons, éléments et formules comme H₂O.","Protons, neutrons, electrons, elements and formulas like H₂O.","Протоны, нейтроны, электроны, элементы и формулы вроде H₂O."),
b:{
ht:["## Tout fèt ak atòm","**Atòm** se pi piti pati yon eleman. Li gen yon **nwayo** nan mitan (**pwoton** ki chaje pozitif + **netwon** ki pa chaje) ak **elektwon** negatif k ap vire alantou.","## Eleman","Nimewo pwoton yo detèmine ki eleman atòm lan ye. Idwojèn gen 1 pwoton, kabòn 6, oksijèn 8. Gen anviwon **118 eleman** nan tablo peryodik la.","## Molekil","Lè atòm yo sere ansanm, yo fòme **molekil**. Dlo se **H₂O** : 2 atòm idwojèn ak 1 atòm oksijèn. Gaz kabonik se **CO₂**.","## Sa sa vle di","Chanje fason atòm yo konbine fè nouvo matyè : sa se yon **reyaksyon chimik**, tankou lè fè ranje.","> Tout sa w wè, manyen ak respire fèt ak menm kèk atòm ki òganize diferan."],
fr:["## Tout est fait d'atomes","L'**atome** est la plus petite partie d'un élément. Il a un **noyau** au centre (**protons** chargés positivement + **neutrons** sans charge) et des **électrons** négatifs qui tournent autour.","## Les éléments","Le nombre de protons détermine l'élément. L'hydrogène a 1 proton, le carbone 6, l'oxygène 8. Il y a environ **118 éléments** dans le tableau périodique.","## Les molécules","Quand des atomes s'assemblent, ils forment des **molécules**. L'eau est **H₂O** : 2 atomes d'hydrogène et 1 atome d'oxygène. Le dioxyde de carbone est **CO₂**.","## Ce que cela signifie","Changer la façon dont les atomes se combinent crée de nouvelles substances : c'est une **réaction chimique**, comme la rouille du fer.","> Tout ce que vous voyez, touchez et respirez est fait des mêmes quelques atomes, organisés différemment."],
en:["## Everything is made of atoms","An **atom** is the smallest part of an element. It has a **nucleus** in the centre (positively charged **protons** + uncharged **neutrons**) and negative **electrons** moving around it.","## Elements","The number of protons decides which element an atom is. Hydrogen has 1 proton, carbon 6, oxygen 8. There are about **118 elements** in the periodic table.","## Molecules","When atoms bond together they form **molecules**. Water is **H₂O**: 2 hydrogen atoms and 1 oxygen atom. Carbon dioxide is **CO₂**.","## What this means","Changing how atoms combine makes new substances: this is a **chemical reaction**, like iron rusting.","> Everything you see, touch and breathe is made of the same few atoms, arranged differently."],
ru:["## Всё состоит из атомов","**Атом** — наименьшая часть элемента. В центре у него **ядро** (положительные **протоны** + незаряженные **нейтроны**), вокруг которого движутся отрицательные **электроны**.","## Элементы","Число протонов определяет элемент. У водорода 1 протон, у углерода 6, у кислорода 8. В периодической таблице около **118 элементов**.","## Молекулы","Когда атомы соединяются, они образуют **молекулы**. Вода — это **H₂O**: 2 атома водорода и 1 атом кислорода. Углекислый газ — **CO₂**.","## Что это значит","Изменение способа соединения атомов создаёт новые вещества: это **химическая реакция**, например ржавление железа.","> Всё, что вы видите, трогаете и вдыхаете, состоит из одних и тех же немногих атомов, устроенных по-разному."]},
q:[{q:L("Ki patikil ki gen chaj pozitif nan nwayo a ?","Quelle particule du noyau est chargée positivement ?","Which nucleus particle is positively charged?","Какая частица ядра заряжена положительно?"),o:[L("Pwoton","Le proton","Proton","Протон"),L("Elektwon","L'électron","Electron","Электрон"),L("Netwon","Le neutron","Neutron","Нейтрон"),L("Okenn","Aucune","None","Никакая")],a:0},
{q:L("Ki fòmil dlo a ?","Quelle est la formule de l'eau ?","What is the formula of water?","Какова формула воды?"),o:["H₂O","CO₂","O₂","NaCl"],a:0},
{q:L("Kisa ki detèmine ki eleman yon atòm ye ?","Qu'est-ce qui détermine l'élément d'un atome ?","What determines an atom's element?","Что определяет элемент атома?"),o:[L("Nimewo pwoton yo","Le nombre de protons","The number of protons","Число протонов"),L("Koulè","La couleur","The colour","Цвет"),L("Pwa total","Le poids total","The total weight","Общий вес"),L("Fòm","La forme","The shape","Форма")],a:0}]});

ART.push({id:"jeyometri",s:"math",lv:1,min:4,img:"graph",lab:"pmt",w:[],
t:L("Pèrimèt ak sifas : mezire fòm yo","Périmètre et aire : mesurer les formes","Perimeter and area: measuring shapes","Периметр и площадь: измерение фигур"),
sum:L("Rektang, triyang ak sèk : fòmil ak egzanp reyèl.","Rectangle, triangle et cercle : formules et exemples concrets.","Rectangle, triangle and circle: formulas and real examples.","Прямоугольник, треугольник и круг: формулы и примеры."),
b:{
ht:["## De kesyon diferan","**Pèrimèt** = longè kontou yon fòm (pou mete kloti alantou yon teren). **Sifas** (aire) = kantite espas andedan l (pou plante oswa kouvri ak tòl).","## Fòmil yo","**Rektang** (longè L, lajè l) : pèrimèt = 2 × (L + l), sifas = **L × l**. **Triyang** : sifas = (baz × wotè) ÷ 2. **Sèk** (reyon r) : sikonferans = 2 × π × r, sifas = **π × r²**, ak π ≈ 3,14.","## Egzanp","Yon teren 8 m sou 5 m : pèrimèt = 2 × 13 = **26 m** ; sifas = 8 × 5 = **40 m²**. Yon triyang ki gen baz 10 m ak wotè 6 m : sifas = 10 × 6 ÷ 2 = **30 m²**.","## Inite","Pèrimèt an **mèt (m)**, sifas an **mèt kare (m²)**. Pa melanje yo.","> Mezire anvan w achte materyèl : sa evite gaspiyaj."],
fr:["## Deux questions différentes","**Périmètre** = longueur du contour d'une forme (pour clôturer un terrain). **Aire** = quantité d'espace à l'intérieur (pour planter ou couvrir de tôle).","## Les formules","**Rectangle** (longueur L, largeur l) : périmètre = 2 × (L + l), aire = **L × l**. **Triangle** : aire = (base × hauteur) ÷ 2. **Cercle** (rayon r) : circonférence = 2 × π × r, aire = **π × r²**, avec π ≈ 3,14.","## Exemple","Un terrain de 8 m sur 5 m : périmètre = 2 × 13 = **26 m** ; aire = 8 × 5 = **40 m²**. Un triangle de base 10 m et de hauteur 6 m : aire = 10 × 6 ÷ 2 = **30 m²**.","## Unités","Le périmètre en **mètres (m)**, l'aire en **mètres carrés (m²)**. Ne les mélangez pas.","> Mesurez avant d'acheter le matériel : cela évite le gaspillage."],
en:["## Two different questions","**Perimeter** = length of the outline of a shape (to fence a plot). **Area** = amount of space inside (to plant or cover with roofing sheets).","## The formulas","**Rectangle** (length L, width w): perimeter = 2 × (L + w), area = **L × w**. **Triangle**: area = (base × height) ÷ 2. **Circle** (radius r): circumference = 2 × π × r, area = **π × r²**, with π ≈ 3.14.","## Example","A plot 8 m by 5 m: perimeter = 2 × 13 = **26 m**; area = 8 × 5 = **40 m²**. A triangle with base 10 m and height 6 m: area = 10 × 6 ÷ 2 = **30 m²**.","## Units","Perimeter in **metres (m)**, area in **square metres (m²)**. Do not mix them.","> Measure before buying materials: it avoids waste."],
ru:["## Два разных вопроса","**Периметр** — длина контура фигуры (чтобы огородить участок). **Площадь** — количество места внутри (чтобы засадить или покрыть кровельным листом).","## Формулы","**Прямоугольник** (длина L, ширина w): периметр = 2 × (L + w), площадь = **L × w**. **Треугольник**: площадь = (основание × высота) ÷ 2. **Круг** (радиус r): длина окружности = 2 × π × r, площадь = **π × r²**, где π ≈ 3,14.","## Пример","Участок 8 м на 5 м: периметр = 2 × 13 = **26 м**; площадь = 8 × 5 = **40 м²**. Треугольник с основанием 10 м и высотой 6 м: площадь = 10 × 6 ÷ 2 = **30 м²**.","## Единицы","Периметр — в **метрах (м)**, площадь — в **квадратных метрах (м²)**. Не путайте их.","> Измеряйте перед покупкой материалов: это избавляет от расточительства."]},
q:[{q:L("Sifas yon teren 8 m sou 5 m ?","Aire d'un terrain de 8 m sur 5 m ?","Area of an 8 m by 5 m plot?","Площадь участка 8 м на 5 м?"),o:["40 m²","26 m²","13 m²","80 m²"],a:0},
{q:L("Pèrimèt teren 8 m sou 5 m lan ?","Périmètre du même terrain ?","Perimeter of the same plot?","Периметр того же участка?"),o:["26 m","40 m","13 m","20 m"],a:0},
{q:L("Sifas triyang baz 10 ak wotè 6 ?","Aire d'un triangle base 10, hauteur 6 ?","Area of a triangle with base 10, height 6?","Площадь треугольника с основанием 10 и высотой 6?"),o:["30","60","16","20"],a:0}]});

ART.push({id:"pwoveb",s:"kreyol",lv:1,min:4,img:"letters",lab:"pwv",w:[],
t:L("Pwovèb kreyòl : sajès pèp la","Les proverbes créoles : la sagesse du peuple","Creole proverbs: the people's wisdom","Креольские пословицы: мудрость народа"),
sum:L("Senk pwovèb byen konnen ak sa yo vle di.","Cinq proverbes bien connus et leur sens.","Five well-known proverbs and what they mean.","Пять известных пословиц и их смысл."),
b:{
ht:["## Yon trezò lang","Pwovèb yo se fraz kout ki gen yon leson. Yo vin de zansèt nou yo epi yo toujou itil.","## Senk pwovèb","**Dèyè mòn gen mòn** : lè w rezoud yon pwoblèm, yon lòt ka vini ; toujou gen plis pou aprann. **Piti piti zwazo fè nich li** : ak pasyans ak efò chak jou, w rive nan bi w. **Men anpil chay pa lou** : lè moun ede, travay la vin pi lejè. **Sak vid pa kanpe** : yon moun ki grangou pa ka travay byen. **Tout moun se moun** : chak moun merite respè.","## Poukisa sa enpòtan","Pwovèb yo transmèt valè tankou pasyans, solidarite ak respè. Si w gen yon pwovèb ou renmen, pataje l ak jèn yo.","> Pwovèb se konsèy ki pase de bouch an bouch."],
fr:["## Un trésor de la langue","Les proverbes sont de courtes phrases qui portent une leçon. Ils viennent de nos ancêtres et restent utiles.","## Cinq proverbes","**Dèyè mòn gen mòn** (derrière les montagnes, il y a des montagnes) : quand on résout un problème, un autre peut venir ; il y a toujours à apprendre. **Piti piti zwazo fè nich li** (petit à petit l'oiseau fait son nid) : avec patience et efforts quotidiens, on atteint son but. **Men anpil chay pa lou** (beaucoup de mains, la charge n'est pas lourde) : quand on s'entraide, le travail est plus léger. **Sak vid pa kanpe** (un sac vide ne tient pas debout) : celui qui a faim ne peut pas bien travailler. **Tout moun se moun** (tout le monde est une personne) : chacun mérite le respect.","## Pourquoi c'est important","Les proverbes transmettent des valeurs comme la patience, la solidarité et le respect. Si vous avez un proverbe préféré, partagez-le avec les jeunes.","> Un proverbe est un conseil qui passe de bouche en bouche."],
en:["## A treasure of the language","Proverbs are short sentences that carry a lesson. They come from our ancestors and remain useful.","## Five proverbs","**Dèyè mòn gen mòn** (behind mountains there are mountains): when you solve one problem another may come; there is always more to learn. **Piti piti zwazo fè nich li** (little by little the bird builds its nest): with patience and daily effort you reach your goal. **Men anpil chay pa lou** (many hands, the load is not heavy): when people help each other, work is lighter. **Sak vid pa kanpe** (an empty sack does not stand): a hungry person cannot work well. **Tout moun se moun** (everyone is a person): everyone deserves respect.","## Why it matters","Proverbs pass on values such as patience, solidarity and respect. If you have a favourite proverb, share it with young people.","> A proverb is advice passed from mouth to mouth."],
ru:["## Сокровище языка","Пословицы — короткие фразы, несущие урок. Они пришли от наших предков и остаются полезными.","## Пять пословиц","**Dèyè mòn gen mòn** («за горами есть горы»): решив одну проблему, можно встретить другую; всегда есть чему учиться. **Piti piti zwazo fè nich li** («понемногу птица вьёт гнездо»): с терпением и ежедневными усилиями достигаешь цели. **Men anpil chay pa lou** («много рук — ноша не тяжела»): когда люди помогают друг другу, работа легче. **Sak vid pa kanpe** («пустой мешок не стоит»): голодный человек не может хорошо работать. **Tout moun se moun** («все люди — люди»): каждый заслуживает уважения.","## Почему это важно","Пословицы передают такие ценности, как терпение, солидарность и уважение. Если у вас есть любимая пословица, поделитесь ею с молодёжью.","> Пословица — это совет, передаваемый из уст в уста."]},
q:[{q:L("Kisa « Piti piti zwazo fè nich li » vle di ?","Que signifie « Piti piti zwazo fè nich li » ?","What does “Piti piti zwazo fè nich li” mean?","Что значит «Piti piti zwazo fè nich li»?"),o:[L("Ak pasyans ak efò, w rive nan bi w","Avec patience et efforts on atteint son but","With patience and effort you reach your goal","Терпением и трудом достигают цели"),L("Zwazo yo pa ka vole","Les oiseaux ne volent pas","Birds cannot fly","Птицы не умеют летать"),L("Fòk ou kouri vit","Il faut courir vite","You must run fast","Надо бежать быстро"),L("Pa bati nich","Ne pas construire de nid","Do not build nests","Не строить гнёзд")],a:0},
{q:L("Kisa « Men anpil chay pa lou » ansegne ?","Que montre « Men anpil chay pa lou » ?","What does “Men anpil chay pa lou” teach?","Чему учит «Men anpil chay pa lou»?"),o:[L("Solidarite fè travay la pi lejè","La solidarité allège le travail","Solidarity makes work lighter","Солидарность облегчает работу"),L("Pa travay","Ne pas travailler","Do not work","Не работать"),L("Chay yo toujou lou","Les charges sont toujours lourdes","Loads are always heavy","Ноша всегда тяжела"),L("Pa mande èd","Ne pas demander d'aide","Do not ask for help","Не просить помощи")],a:0},
{q:L("Ki pwovèb ki pale de respè pou tout moun ?","Quel proverbe parle du respect de tous ?","Which proverb speaks of respect for all?","Какая пословица о уважении ко всем?"),o:["Tout moun se moun","Sak vid pa kanpe","Dèyè mòn gen mòn","Piti piti zwazo fè nich li"],a:0}]});

ART.push({id:"siklon",s:"geol",lv:1,min:4,img:"globe",lab:"skl",w:[],
t:L("Siklòn : konprann epi pwoteje w","Les cyclones : comprendre et se protéger","Hurricanes: understand and protect yourself","Ураганы: понять и защититься"),
sum:L("Sezon an, kategori yo, ak sa pou w fè anvan, pandan ak aprè.","La saison, les catégories, et que faire avant, pendant et après.","The season, the categories, and what to do before, during and after.","Сезон, категории и что делать до, во время и после."),
b:{
ht:["## Ki sa yon siklòn ye","Yon siklòn (ouragan) se yon gwo tanpèt won ki fòme sou lanmè cho. Li pote van fò, gwo lapli ak vag. Sezon siklòn nan Atlantik la ale de **1ye jen rive 30 novanm**.","## Kategori yo","Echèl **Saffir-Simpson** klase yo de **1 a 5** selon vitès van an. Kategori 1 kòmanse a anviwon **119 km/h** epi kategori 5 depase **252 km/h**. Men lapli ak inondasyon ka danjere menm nan kategori ki ba.","## Anvan","Swiv enfòmasyon ofisyèl yo (radyo, pwoteksyon sivil). Prepare dlo pwòp, manje ki pa gate, lanp, medikaman ak dokiman ou nan yon sak. Konnen kote abri a ye.","## Pandan ak aprè","Rete andedan yon kote solid, lwen fenèt. Pa travèse rivyè ki anfle. Aprè siklòn nan, pa manyen fil elektrik tonbe, pa bwè dlo inondasyon, epi bouyi dlo anvan w bwè l.","> Prepare w anvan, se sa ki sove lavi."],
fr:["## Qu'est-ce qu'un cyclone","Un cyclone (ouragan) est une grande tempête tournante qui se forme sur une mer chaude. Il apporte des vents forts, de fortes pluies et des vagues. La saison cyclonique dans l'Atlantique va du **1er juin au 30 novembre**.","## Les catégories","L'échelle de **Saffir-Simpson** les classe de **1 à 5** selon la vitesse du vent. La catégorie 1 commence vers **119 km/h** et la catégorie 5 dépasse **252 km/h**. Mais la pluie et les inondations peuvent être dangereuses même pour les catégories basses.","## Avant","Suivez les informations officielles (radio, protection civile). Préparez de l'eau propre, des aliments qui se conservent, des lampes, des médicaments et vos documents dans un sac. Sachez où se trouve l'abri.","## Pendant et après","Restez à l'intérieur d'un endroit solide, loin des fenêtres. Ne traversez pas une rivière en crue. Après le cyclone, ne touchez pas les fils électriques tombés, ne buvez pas l'eau des inondations, et faites bouillir l'eau avant de la boire.","> Se préparer à l'avance, c'est ce qui sauve des vies."],
en:["## What is a hurricane","A hurricane is a large rotating storm that forms over warm sea. It brings strong winds, heavy rain and waves. The Atlantic hurricane season runs from **1 June to 30 November**.","## Categories","The **Saffir-Simpson** scale ranks them from **1 to 5** by wind speed. Category 1 starts at about **119 km/h** and category 5 exceeds **252 km/h**. But rain and flooding can be dangerous even in low categories.","## Before","Follow official information (radio, civil protection). Prepare clean water, non-perishable food, lamps, medicines and your documents in a bag. Know where the shelter is.","## During and after","Stay inside a solid place, away from windows. Do not cross swollen rivers. After the hurricane, do not touch fallen electric wires, do not drink floodwater, and boil water before drinking it.","> Preparing in advance is what saves lives."],
ru:["## Что такое ураган","Ураган — это большой вращающийся шторм, формирующийся над тёплым морем. Он приносит сильный ветер, ливни и волны. Сезон ураганов в Атлантике длится с **1 июня по 30 ноября**.","## Категории","Шкала **Саффира — Симпсона** делит их на **5 категорий** по скорости ветра. Категория 1 начинается примерно со **119 км/ч**, а категория 5 превышает **252 км/ч**. Но дождь и наводнения опасны даже при низких категориях.","## До урагана","Следите за официальной информацией (радио, гражданская защита). Подготовьте в сумке чистую воду, непортящуюся еду, фонари, лекарства и документы. Узнайте, где находится убежище.","## Во время и после","Оставайтесь в прочном здании, вдали от окон. Не переходите вздувшиеся реки. После урагана не трогайте упавшие провода, не пейте воду наводнения и кипятите воду перед питьём.","> Подготовка заранее спасает жизни."]},
q:[{q:L("Ki lè sezon siklòn Atlantik la ye ?","Quand est la saison cyclonique atlantique ?","When is the Atlantic hurricane season?","Когда сезон ураганов в Атлантике?"),o:[L("1ye jen – 30 novanm","1er juin – 30 novembre","1 June – 30 November","1 июня – 30 ноября"),L("Janvye – mas","Janvier – mars","January – March","Январь – март"),L("Sèlman jiyè","Seulement juillet","Only July","Только июль"),L("Tout ane","Toute l'année","All year","Весь год")],a:0},
{q:L("Kisa pou w fè pandan siklòn nan ?","Que faire pendant le cyclone ?","What to do during the hurricane?","Что делать во время урагана?"),o:[L("Rete andedan, lwen fenèt","Rester à l'intérieur, loin des fenêtres","Stay inside, away from windows","Остаться внутри, вдали от окон"),L("Travèse rivyè a","Traverser la rivière","Cross the river","Переходить реку"),L("Soti pou gade","Sortir regarder","Go out to watch","Выйти посмотреть"),L("Kanpe sou twati","Monter sur le toit","Climb on the roof","Залезть на крышу")],a:0},
{q:L("Kisa pou w fè ak dlo aprè inondasyon ?","Que faire de l'eau après inondation ?","What to do with water after a flood?","Что делать с водой после наводнения?"),o:[L("Bouyi l anvan w bwè l","La faire bouillir avant de la boire","Boil it before drinking","Прокипятить перед питьём"),L("Bwè l dirèk","La boire directement","Drink it directly","Пить сразу"),L("Pa bezwen fè anyen","Rien à faire","Nothing needed","Ничего не нужно"),L("Ajoute sik","Ajouter du sucre","Add sugar","Добавить сахар")],a:0}]});

ART.push({id:"lettfom",s:"franse",lv:2,min:4,img:"letters",lab:"ltf",w:[],
t:L("Ekri yon lèt fòmèl an fransè","Rédiger une lettre formelle en français","Writing a formal letter in French","Как написать официальное письмо по-французски"),
sum:L("Estrikti a, fòmil politès yo ak yon egzanp.","La structure, les formules de politesse et un modèle.","The structure, polite formulas and a model.","Структура, формулы вежливости и образец."),
b:{
ht:["## Poukisa yon lèt fòmèl","Yon lèt fòmèl itil pou mande yon travay, yon dokiman oswa yon rann-vou. Li dwe klè, kout epi respektye.","## Estrikti","**1.** Non ak adrès ou (anlè agoch). **2.** Non ak adrès moun w ap ekri a (adwat). **3.** Lye ak dat. **4.** **Objè** : yon fraz kout ki di sa lèt la ye. **5.** Fòmil apèl : **« Madame, Monsieur, »**. **6.** Kò lèt la : prezante w, di sa w mande, bay rezon. **7.** Fòmil politès nan fen. **8.** Siyati.","## Fòmil nan fen","Egzanp : **« Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées. »**","## Konsèy","Itilize fraz kout. Pa mete fòt. Relijen anvan w voye l. Mete yon adrès oswa nimewo pou kontakte w.","> Yon lèt ki byen ekri louvri pòt."],
fr:["## Pourquoi une lettre formelle","Une lettre formelle sert à demander un emploi, un document ou un rendez-vous. Elle doit être claire, courte et respectueuse.","## Structure","**1.** Vos nom et adresse (en haut à gauche). **2.** Nom et adresse du destinataire (à droite). **3.** Lieu et date. **4.** **Objet** : une phrase courte qui dit ce qu'est la lettre. **5.** Formule d'appel : **« Madame, Monsieur, »**. **6.** Corps de la lettre : vous présenter, dire ce que vous demandez, donner les raisons. **7.** Formule de politesse finale. **8.** Signature.","## Formule finale","Exemple : **« Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées. »**","## Conseils","Utilisez des phrases courtes. Évitez les fautes. Relisez avant d'envoyer. Indiquez une adresse ou un numéro pour vous joindre.","> Une lettre bien écrite ouvre des portes."],
en:["## Why a formal letter","A formal letter is used to ask for a job, a document or an appointment. It should be clear, short and respectful.","## Structure","**1.** Your name and address (top left). **2.** The recipient's name and address (right). **3.** Place and date. **4.** **Subject line**: a short phrase saying what the letter is. **5.** Opening: **“Madame, Monsieur,”**. **6.** Body: introduce yourself, say what you request, give reasons. **7.** Closing polite formula. **8.** Signature.","## Closing formula","Example: **“Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées.”**","## Tips","Use short sentences. Avoid mistakes. Proofread before sending. Include an address or number to reach you.","> A well-written letter opens doors."],
ru:["## Зачем нужно официальное письмо","Официальное письмо нужно, чтобы попросить о работе, документе или встрече. Оно должно быть ясным, коротким и вежливым.","## Структура","**1.** Ваше имя и адрес (вверху слева). **2.** Имя и адрес адресата (справа). **3.** Место и дата. **4.** **Тема**: короткая фраза о содержании письма. **5.** Обращение: **«Madame, Monsieur,»**. **6.** Основная часть: представьтесь, скажите, о чём просите, приведите причины. **7.** Заключительная формула вежливости. **8.** Подпись.","## Заключительная формула","Пример: **«Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées.»**","## Советы","Пишите короткими фразами. Избегайте ошибок. Перечитайте перед отправкой. Укажите адрес или номер для связи.","> Хорошо написанное письмо открывает двери."]},
q:[{q:L("Ki fòmil apèl ki apwopriye ?","Quelle formule d'appel convient ?","Which opening formula suits?","Какое обращение подходит?"),o:["Madame, Monsieur,","Salut mon ami,","Coucou,","Hé !"],a:0},
{q:L("Kisa « Objet » nan lèt la ye ?","Qu'est-ce que l'« objet » de la lettre ?","What is the letter's “objet”?","Что такое «objet» письма?"),o:[L("Yon fraz kout ki di sa lèt la ye","Une phrase courte qui dit de quoi parle la lettre","A short line stating what the letter is about","Короткая фраза о теме письма"),L("Siyati a","La signature","The signature","Подпись"),L("Dat la","La date","The date","Дата"),L("Adrès la","L'adresse","The address","Адрес")],a:0},
{q:L("Kisa pou w fè anvan w voye lèt la ?","Que faire avant d'envoyer la lettre ?","What to do before sending?","Что сделать перед отправкой?"),o:[L("Relijen l pou kòrije fòt","La relire pour corriger les fautes","Proofread it","Перечитать и исправить ошибки"),L("Pa relijen","Ne pas la relire","Not reread it","Не перечитывать"),L("Ajoute emoji","Ajouter des émojis","Add emojis","Добавить смайлики"),L("Fè l twò long","La faire très longue","Make it very long","Сделать очень длинным")],a:0}]});

ART.push({id:"presen",s:"angle",lv:1,min:4,img:"hello",lab:"prs",w:[],
t:L("Prezan senp an anglè","Le présent simple en anglais","The simple present in English","Простое настоящее время в английском"),
sum:L("Pou pale de abitid ak verite : fòm, « s » nan 3yèm pèsòn, kesyon ak negasyon.","Pour parler d'habitudes et de vérités : forme, « s » à la 3e personne, questions et négations.","For habits and facts: form, the third-person “s”, questions and negatives.","Для привычек и фактов: форма, «s» в 3-м лице, вопросы и отрицания."),
b:{
ht:["## Kilè pou itilize l","Prezan senp la sèvi pou **abitid** (I work every day) ak **verite jeneral** (Water boils at 100 °C).","## Fòm","I / you / we / they + vèb : **I work**. He / she / it + vèb + **s** : **she works**. Vèb ki fini ak -s, -sh, -ch, -x, -o pran **-es** : **he watches**. Vèb ki fini ak konsòn + y chanje y an **-ies** : **study → studies**.","## Kesyon ak negasyon","Kesyon : **Do** I/you/we/they work ? **Does** he/she/it work ? Negasyon : **don't** work, **doesn't** work. Aprè does/doesn't, vèb la pa gen -s : **She doesn't work**.","## Mo ki ede","always, usually, often, sometimes, never, every day.","> Yon sèl « s » nan 3yèm pèsòn nan fè gwo diferans."],
fr:["## Quand l'utiliser","Le présent simple sert pour les **habitudes** (I work every day) et les **vérités générales** (Water boils at 100 °C).","## Formation","I / you / we / they + verbe : **I work**. He / she / it + verbe + **s** : **she works**. Les verbes en -s, -sh, -ch, -x, -o prennent **-es** : **he watches**. Les verbes en consonne + y changent y en **-ies** : **study → studies**.","## Questions et négations","Question : **Do** I/you/we/they work ? **Does** he/she/it work ? Négation : **don't** work, **doesn't** work. Après does/doesn't, le verbe n'a pas de -s : **She doesn't work**.","## Mots utiles","always, usually, often, sometimes, never, every day.","> Un seul « s » à la 3e personne fait une grande différence."],
en:["## When to use it","The simple present is used for **habits** (I work every day) and **general facts** (Water boils at 100 °C).","## Form","I / you / we / they + verb: **I work**. He / she / it + verb + **s**: **she works**. Verbs ending in -s, -sh, -ch, -x, -o take **-es**: **he watches**. Verbs ending in consonant + y change y to **-ies**: **study → studies**.","## Questions and negatives","Question: **Do** I/you/we/they work? **Does** he/she/it work? Negative: **don't** work, **doesn't** work. After does/doesn't the verb has no -s: **She doesn't work**.","## Useful words","always, usually, often, sometimes, never, every day.","> One little “s” in the third person makes a big difference."],
ru:["## Когда использовать","Простое настоящее время используется для **привычек** (I work every day) и **общих фактов** (Water boils at 100 °C).","## Образование","I / you / we / they + глагол: **I work**. He / she / it + глагол + **s**: **she works**. Глаголы на -s, -sh, -ch, -x, -o получают **-es**: **he watches**. Глаголы на согласная + y меняют y на **-ies**: **study → studies**.","## Вопросы и отрицания","Вопрос: **Do** I/you/we/they work? **Does** he/she/it work? Отрицание: **don't** work, **doesn't** work. После does/doesn't у глагола нет -s: **She doesn't work**.","## Полезные слова","always, usually, often, sometimes, never, every day.","> Одна маленькая «s» в 3-м лице многое меняет."]},
q:[{q:L("Ki fraz ki kòrèk ?","Quelle phrase est correcte ?","Which sentence is correct?","Какое предложение правильное?"),o:["She works every day.","She work every day.","She works every days.","She working every day."],a:0},
{q:L("Ki negasyon ki kòrèk ?","Quelle négation est correcte ?","Which negative is correct?","Какое отрицание правильное?"),o:["He doesn't like fish.","He don't like fish.","He doesn't likes fish.","He not like fish."],a:0},
{q:L("Ki jan nou fè kesyon pou « they » ?","Comment faire la question pour « they » ?","How to ask a question with “they”?","Как задать вопрос с «they»?"),o:["Do they work?","Does they work?","Do they works?","Are they work?"],a:0}]});

ART.push({id:"epay",s:"ekonomi",lv:1,min:4,img:"coins",lab:"epy",w:[],
t:L("Epay ak prè : abitid ki pwoteje lajan w","Épargne et crédit : des habitudes qui protègent votre argent","Saving and borrowing: habits that protect your money","Сбережения и займы: привычки, защищающие ваши деньги"),
sum:L("Ki jan pou mete lajan sou kote, sòl, enterè ak sa pou w verifye anvan w prete.","Comment mettre de l'argent de côté, le sòl, l'intérêt et quoi vérifier avant d'emprunter.","How to set money aside, the sòl, interest and what to check before borrowing.","Как откладывать, что такое «сол», проценты и что проверить перед займом."),
b:{
ht:["## Mete yon ti kras sou kote","Menm yon ti kantite chak jou/semèn ede. Yon bon abitid se mete yon pati lajan w sou kote **le w resevwa l**, pa sa ki rete a. Yon rezèv pou ijans (ki ka kouvri plizyè semèn oswa mwa depans) pwoteje w si gen maladi oswa pèt revni.","## Sòl ak gwoup epay","Anpil moun itilize **sòl** : yon gwoup moun ki mete yon kantite chak peryòd epi chak moun resevwa tou pa l. Li bon lè w fè l ak moun ou fè konfyans, ak règ klè ak yon moun ki kenbe kont yo.","## Prè ak enterè","**Enterè** se pri pou w sèvi ak lajan yon lòt. Anvan w prete, mande : ki pousantaj la, pou konbyen tan, konbyen w ap peye an total, ak ki sa ki rive si w an reta.","## Pwoteje w","Pa siyen sa w pa konprann. Pa kite yon moun près ou. Konpare plizyè òf. Prete sèlman sa w kapab remèt.","> Lajan ou mete sou kote jodi a se libète w demen."],
fr:["## Mettre un peu de côté","Même une petite somme chaque jour ou semaine aide. Une bonne habitude : mettre une partie de l'argent de côté **dès qu'on le reçoit**, pas ce qui reste. Une réserve d'urgence (couvrant plusieurs semaines ou mois de dépenses) vous protège en cas de maladie ou de perte de revenu.","## Le sòl et les groupes d'épargne","Beaucoup de gens utilisent le **sòl** : un groupe où chacun verse une somme à chaque période et chacun reçoit à son tour. C'est bien avec des personnes de confiance, des règles claires et quelqu'un qui tient les comptes.","## Crédit et intérêt","L'**intérêt** est le prix pour utiliser l'argent d'un autre. Avant d'emprunter, demandez : quel taux, pour combien de temps, combien vous paierez au total, et ce qui se passe en cas de retard.","## Se protéger","Ne signez pas ce que vous ne comprenez pas. Ne vous laissez pas presser. Comparez plusieurs offres. N'empruntez que ce que vous pouvez rembourser.","> L'argent mis de côté aujourd'hui, c'est votre liberté de demain."],
en:["## Set a little aside","Even a small amount each day or week helps. A good habit is to set part of your money aside **as soon as you receive it**, not what is left over. An emergency reserve (covering several weeks or months of expenses) protects you in case of illness or loss of income.","## The sòl and savings groups","Many people use the **sòl**: a group where each person pays in an amount each period and everyone receives in turn. It works well with trusted people, clear rules and someone keeping the accounts.","## Credit and interest","**Interest** is the price of using someone else's money. Before borrowing, ask: what rate, for how long, how much you will pay in total, and what happens if you are late.","## Protect yourself","Do not sign what you do not understand. Do not be rushed. Compare several offers. Borrow only what you can repay.","> The money you set aside today is your freedom tomorrow."],
ru:["## Откладывайте понемногу","Даже небольшая сумма каждый день или неделю помогает. Хорошая привычка — откладывать часть денег **сразу после получения**, а не то, что осталось. Резерв на непредвиденные случаи (покрывающий несколько недель или месяцев расходов) защищает при болезни или потере дохода.","## «Сол» и сберегательные группы","Многие используют **сол**: группу, где каждый вносит сумму в каждый период и каждый по очереди получает общий взнос. Это хорошо работает с доверенными людьми, чёткими правилами и тем, кто ведёт учёт.","## Займ и проценты","**Процент** — плата за пользование чужими деньгами. Перед займом спросите: какая ставка, на какой срок, сколько вы заплатите всего и что будет при просрочке.","## Защитите себя","Не подписывайте то, чего не понимаете. Не позволяйте себя торопить. Сравнивайте несколько предложений. Занимайте только то, что можете вернуть.","> Деньги, отложенные сегодня, — ваша свобода завтра."]},
q:[{q:L("Kilè pou w mete lajan sou kote ?","Quand mettre de l'argent de côté ?","When to set money aside?","Когда откладывать деньги?"),o:[L("Le w resevwa l","Dès qu'on le reçoit","As soon as you receive it","Сразу при получении"),L("Sèlman sa ki rete","Seulement ce qui reste","Only what is left","Только остаток"),L("Pa janm","Jamais","Never","Никогда"),L("Lè w gen dèt","Quand on a des dettes","When in debt","Когда есть долги")],a:0},
{q:L("Kisa enterè a ye ?","Qu'est-ce que l'intérêt ?","What is interest?","Что такое процент?"),o:[L("Pri pou w sèvi ak lajan yon lòt","Le prix pour utiliser l'argent d'un autre","The price for using someone else's money","Плата за пользование чужими деньгами"),L("Yon kado","Un cadeau","A gift","Подарок"),L("Yon taks","Une taxe","A tax","Налог"),L("Yon sòl","Un sòl","A sòl","Сол")],a:0},
{q:L("Kisa pou w fè anvan w prete ?","Que faire avant d'emprunter ?","What to do before borrowing?","Что сделать перед займом?"),o:[L("Mande pousantaj la ak total ou pral peye","Demander le taux et le total à payer","Ask the rate and total to repay","Спросить ставку и общую сумму"),L("Siyen vit","Signer vite","Sign quickly","Быстро подписать"),L("Prete plis posib","Emprunter le plus possible","Borrow as much as possible","Занять как можно больше"),L("Pa li kontra","Ne pas lire le contrat","Not read the contract","Не читать договор")],a:0}]});

ART.push({id:"selil",s:"byoloji",lv:2,min:5,img:"neuron",lab:"sel",w:[],
t:L("Selil la : ti inite lavi a","La cellule : l'unité de la vie","The cell: the unit of life","Клетка: единица жизни"),
sum:L("Pati yo, selil plant ak bèt, ak mitokondri a.","Les parties, cellules végétale et animale, et la mitochondrie.","The parts, plant and animal cells, and the mitochondrion.","Части, клетки растений и животных, митохондрия."),
b:{
ht:["## Tout vivan fèt ak selil","Yon selil se pi piti pati ki vivan. Gen kèk òganis ki gen yon sèl selil (bakteri), lòt yo gen milyon (moun, plant). Se **Robert Hooke** ki te bay non « selil » an 1665.","## Pati prensipal yo","**Manbràn** : li kenbe selil la epi kontwole sa k antre ak sa k soti. **Sitoplas** : likid andedan an. **Nwayo** : li gen ADN, enstriksyon selil la. **Mitokondri** : li pwodui enèji.","## Plant kont bèt","Selil plant gen anplis yon **miray selil** ak **kloroplas** (pou fotosentèz). Selil bèt pa gen yo.","## Poukisa sa enpòtan","Maladi, kwasans ak geri tout depann de sa selil yo fè. Bakteri se selil ki viv poukont yo ; viris pa selil.","> Se nan yon selil ti kras tout lavi kòmanse."],
fr:["## Tout être vivant est fait de cellules","Une cellule est la plus petite partie vivante. Certains organismes n'ont qu'une cellule (bactéries), d'autres en ont des milliards (humains, plantes). C'est **Robert Hooke** qui a donné le nom de « cellule » en 1665.","## Les parties principales","**Membrane** : elle protège la cellule et contrôle ce qui entre et sort. **Cytoplasme** : le liquide à l'intérieur. **Noyau** : il contient l'ADN, les instructions de la cellule. **Mitochondrie** : elle produit de l'énergie.","## Plante contre animal","Les cellules végétales ont en plus une **paroi** et des **chloroplastes** (pour la photosynthèse). Les cellules animales n'en ont pas.","## Pourquoi c'est important","Maladie, croissance et guérison dépendent de ce que font les cellules. Les bactéries sont des cellules qui vivent seules ; les virus ne sont pas des cellules.","> Toute vie commence dans une toute petite cellule."],
en:["## All living things are made of cells","A cell is the smallest living part. Some organisms have just one cell (bacteria), others have billions (humans, plants). **Robert Hooke** gave the name “cell” in 1665.","## Main parts","**Membrane**: it protects the cell and controls what goes in and out. **Cytoplasm**: the liquid inside. **Nucleus**: it holds the DNA, the cell's instructions. **Mitochondrion**: it makes energy.","## Plant versus animal","Plant cells also have a **cell wall** and **chloroplasts** (for photosynthesis). Animal cells do not.","## Why it matters","Disease, growth and healing all depend on what cells do. Bacteria are cells living alone; viruses are not cells.","> All life starts in a very small cell."],
ru:["## Все живые существа состоят из клеток","Клетка — наименьшая живая часть. У некоторых организмов всего одна клетка (бактерии), у других — миллиарды (люди, растения). Название «клетка» дал **Роберт Гук** в 1665 году.","## Главные части","**Мембрана**: защищает клетку и контролирует, что входит и выходит. **Цитоплазма**: жидкость внутри. **Ядро**: содержит ДНК, инструкции клетки. **Митохондрия**: вырабатывает энергию.","## Растения и животные","У растительных клеток есть ещё **клеточная стенка** и **хлоропласты** (для фотосинтеза). У животных клеток их нет.","## Почему это важно","Болезнь, рост и заживление зависят от работы клеток. Бактерии — клетки, живущие самостоятельно; вирусы клетками не являются.","> Вся жизнь начинается в крошечной клетке."]},
q:[{q:L("Ki pati selil la ki gen ADN ?","Quelle partie de la cellule contient l'ADN ?","Which part of the cell holds DNA?","Какая часть клетки содержит ДНК?"),o:[L("Nwayo","Le noyau","The nucleus","Ядро"),L("Manbràn","La membrane","The membrane","Мембрана"),L("Sitoplas","Le cytoplasme","The cytoplasm","Цитоплазма"),L("Miray","La paroi","The wall","Стенка")],a:0},
{q:L("Ki pati ki pwodui enèji ?","Quelle partie produit l'énergie ?","Which part makes energy?","Какая часть вырабатывает энергию?"),o:[L("Mitokondri","La mitochondrie","The mitochondrion","Митохондрия"),L("Nwayo","Le noyau","The nucleus","Ядро"),L("Manbràn","La membrane","The membrane","Мембрана"),L("Kloroplas","Le chloroplaste","The chloroplast","Хлоропласт")],a:0},
{q:L("Ki sa selil plant gen anplis ?","Qu'ont de plus les cellules végétales ?","What extra do plant cells have?","Что есть у растительных клеток дополнительно?"),o:[L("Miray selil ak kloroplas","Une paroi et des chloroplastes","A cell wall and chloroplasts","Клеточная стенка и хлоропласты"),L("Pwen","Des griffes","Claws","Когти"),L("Zo","Des os","Bones","Кости"),L("Anyen","Rien","Nothing","Ничего")],a:0}]});

ART.push({id:"son",s:"fizik",lv:1,min:4,img:"rays",lab:"son",w:[],
t:L("Son : vibrasyon ki rive nan zòrèy ou","Le son : des vibrations qui arrivent à vos oreilles","Sound: vibrations that reach your ears","Звук: колебания, доходящие до ваших ушей"),
sum:L("Ki jan son fòme, ki jan li vwayaje, desibèl ak pwoteksyon tande.","Comment le son se forme, voyage, les décibels et la protection de l'ouïe.","How sound forms and travels, decibels and protecting your hearing.","Как возникает и распространяется звук, децибелы и защита слуха."),
b:{
ht:["## Son se vibrasyon","Lè yon bagay vibre (kòd gita, vwa w), li fè lè a bouje an vag. Vag sa yo rive nan zòrèy nou epi sèvo a konprann yo kòm son.","## Li bezwen yon mwayen","Son pa vwayaje nan vid : li bezwen lè, dlo oswa yon solid. Nan lè, li ale anviwon **340 m/s**, pi vit nan dlo ak solid.","## Ki jan nou diferansye yo","**Frekans** (an hertz) bay ton an : wo oswa ba. **Amplitid** bay fòs la : fò oswa dou, mezire an **desibèl (dB)**.","## Pwoteje tande w","Pale nòmal fè anviwon 60 dB. Bri ki depase **85 dB** pandan lontan ka domaje tande a. Evite mizik fò nan kask, mete pwoteksyon zòrèy nan bri fò, epi fè zòrèy yo repoze.","> Tande se yon trezò : pwoteje l.","Si w santi zòrèy w ap sonnen oswa w tande mwens, wè yon pwofesyonèl sante."],
fr:["## Le son est une vibration","Quand un objet vibre (corde de guitare, votre voix), il fait bouger l'air en ondes. Ces ondes arrivent à nos oreilles et le cerveau les interprète comme du son.","## Il lui faut un milieu","Le son ne voyage pas dans le vide : il lui faut de l'air, de l'eau ou un solide. Dans l'air, il va à environ **340 m/s**, plus vite dans l'eau et les solides.","## Comment on les distingue","La **fréquence** (en hertz) donne la hauteur : aigu ou grave. L'**amplitude** donne l'intensité : fort ou doux, mesurée en **décibels (dB)**.","## Protéger son ouïe","Une conversation normale fait environ 60 dB. Un bruit supérieur à **85 dB** pendant longtemps peut abîmer l'ouïe. Évitez la musique forte au casque, portez des protections dans le bruit fort et laissez reposer vos oreilles.","> L'ouïe est un trésor : protégez-la.","Si vous avez des sifflements dans les oreilles ou entendez moins bien, consultez un professionnel de santé."],
en:["## Sound is vibration","When an object vibrates (a guitar string, your voice), it makes the air move in waves. These waves reach our ears and the brain interprets them as sound.","## It needs a medium","Sound does not travel through a vacuum: it needs air, water or a solid. In air it travels at about **340 m/s**, faster in water and solids.","## How we tell them apart","**Frequency** (in hertz) gives pitch: high or low. **Amplitude** gives loudness: loud or soft, measured in **decibels (dB)**.","## Protecting your hearing","Normal conversation is about 60 dB. Noise above **85 dB** for a long time can damage hearing. Avoid loud music in headphones, wear ear protection in loud noise and let your ears rest.","> Hearing is a treasure: protect it.","If you have ringing in the ears or hear less well, see a health professional."],
ru:["## Звук — это колебания","Когда предмет колеблется (струна гитары, ваш голос), он заставляет воздух двигаться волнами. Эти волны доходят до ушей, и мозг воспринимает их как звук.","## Нужна среда","Звук не распространяется в вакууме: ему нужен воздух, вода или твёрдое тело. В воздухе он идёт со скоростью около **340 м/с**, в воде и твёрдых телах быстрее.","## Чем звуки различаются","**Частота** (в герцах) задаёт высоту: высокий или низкий. **Амплитуда** задаёт громкость: громкий или тихий, измеряется в **децибелах (дБ)**.","## Берегите слух","Обычный разговор — около 60 дБ. Шум выше **85 дБ** в течение долгого времени может повредить слух. Избегайте громкой музыки в наушниках, надевайте защиту в сильном шуме и давайте ушам отдых.","> Слух — сокровище: берегите его.","Если звенит в ушах или вы стали хуже слышать, обратитесь к медработнику."]},
q:[{q:L("Son vwayaje nan vid ?","Le son voyage-t-il dans le vide ?","Does sound travel in a vacuum?","Распространяется ли звук в вакууме?"),o:[L("Non, li bezwen yon mwayen","Non, il lui faut un milieu","No, it needs a medium","Нет, нужна среда"),L("Wi, pi vit","Oui, plus vite","Yes, faster","Да, быстрее"),L("Wi, menm jan","Oui, pareil","Yes, the same","Да, так же"),L("Sèlman lannwit","Seulement la nuit","Only at night","Только ночью")],a:0},
{q:L("Ki inite fòs son an ?","Quelle est l'unité de l'intensité sonore ?","What is the unit of loudness?","Какова единица громкости?"),o:[L("Desibèl (dB)","Décibel (dB)","Decibel (dB)","Децибел (дБ)"),L("Volt","Volt","Volt","Вольт"),L("Mèt","Mètre","Metre","Метр"),L("Kilogram","Kilogramme","Kilogram","Килограмм")],a:0},
{q:L("Ki nivo bri ki ka domaje tande a ?","Quel niveau de bruit peut abîmer l'ouïe ?","Which noise level can damage hearing?","Какой уровень шума может повредить слух?"),o:[L("Plis pase 85 dB","Plus de 85 dB","Over 85 dB","Выше 85 дБ"),L("30 dB","30 dB","30 dB","30 дБ"),L("10 dB","10 dB","10 dB","10 дБ"),L("0 dB","0 dB","0 dB","0 дБ")],a:0}]});

ART.push({id:"desalin",s:"istwa",lv:2,min:5,img:"flag",lab:"dsl",w:[],
t:L("Jan-Jak Desalin : papa endepandans lan","Jean-Jacques Dessalines : le père de l'indépendance","Jean-Jacques Dessalines: father of independence","Жан-Жак Дессалин: отец независимости"),
sum:L("Ki moun li te ye, sa li te fè an 1804, ak lanmò li.","Qui il était, ce qu'il a fait en 1804, et sa mort.","Who he was, what he did in 1804, and his death.","Кем он был, что сделал в 1804 году и как погиб."),
b:{
ht:["## Yon ansyen esklav vin chèf","**Jan-Jak Desalin** te fèt anviwon 1758 kòm esklav nan Sendomeng. Li te vin yon ofisye enpòtan anba **Toussaint Louverture**, epi aprè depòtasyon Toussaint an 1802, li te vin chèf lame endijèn nan.","## Endepandans","Aprè viktwa Vètyè (1803), Desalin te pwoklame **endepandans Ayiti** nan **Gonayiv**, **1ye janvye 1804**. Se premye repiblik nwa ki libere tèt li, epi premye peyi nan Amerik ki aboli esklavaj pou tout tan. Li te pran non **Ayiti**, yon ansyen non zile a.","## Gouvènman li","An 1804, li te vin anperè anba non **Jak 1ye**. Li te vle pwoteje libète nasyon an. Li te kòmande pou bati fò pou defann peyi a.","## Lanmò","Li te asasinen nan **17 oktòb 1806** nan Pon Wouj, toupre Pòtoprens.","> Nan non li, nou selebre libète a chak 1ye janvye."],
fr:["## D'ancien esclave à chef","**Jean-Jacques Dessalines** est né vers 1758 comme esclave à Saint-Domingue. Il est devenu un officier important sous **Toussaint Louverture**, puis, après la déportation de Toussaint en 1802, chef de l'armée indigène.","## L'indépendance","Après la victoire de Vertières (1803), Dessalines a proclamé l'**indépendance d'Haïti** aux **Gonaïves**, le **1er janvier 1804**. C'est la première république noire à se libérer et le premier pays des Amériques à abolir l'esclavage pour toujours. Il a repris le nom **Haïti**, un ancien nom de l'île.","## Son gouvernement","En 1804, il est devenu empereur sous le nom de **Jacques Ier**. Il voulait protéger la liberté de la nation. Il a ordonné la construction de forts pour défendre le pays.","## Sa mort","Il a été assassiné le **17 octobre 1806** au Pont-Rouge, près de Port-au-Prince.","> En son nom, nous célébrons la liberté chaque 1er janvier."],
en:["## From enslaved man to leader","**Jean-Jacques Dessalines** was born around 1758 as an enslaved person in Saint-Domingue. He became an important officer under **Toussaint Louverture**, and after Toussaint's deportation in 1802 he became leader of the indigenous army.","## Independence","After the victory at Vertières (1803), Dessalines proclaimed **Haiti's independence** at **Gonaïves** on **1 January 1804**. It was the first Black republic to free itself and the first country in the Americas to abolish slavery for good. He took the name **Haiti**, an old name for the island.","## His government","In 1804 he became emperor under the name **Jacques I**. He wanted to protect the nation's freedom. He ordered forts to be built to defend the country.","## His death","He was assassinated on **17 October 1806** at Pont-Rouge, near Port-au-Prince.","> In his name we celebrate freedom every 1 January."],
ru:["## От раба до вождя","**Жан-Жак Дессалин** родился около 1758 года рабом в Сен-Доменге. Он стал важным офицером под началом **Туссена Лувертюра**, а после его депортации в 1802 году возглавил армию повстанцев.","## Независимость","После победы при Вертьере (1803) Дессалин провозгласил **независимость Гаити** в **Гонаиве** **1 января 1804 года**. Это первая чёрная республика, освободившаяся сама, и первая страна Америк, навсегда отменившая рабство. Он вернул название **Гаити** — старое имя острова.","## Его правление","В 1804 году он стал императором под именем **Жак I**. Он хотел защитить свободу нации. Он приказал строить форты для защиты страны.","## Смерть","Он был убит **17 октября 1806 года** на Пон-Руж близ Порт-о-Пренса.","> Во имя его мы празднуем свободу каждое 1 января."]},
q:[{q:L("Kote Desalin te pwoklame endepandans lan ?","Où Dessalines a-t-il proclamé l'indépendance ?","Where did Dessalines proclaim independence?","Где Дессалин провозгласил независимость?"),o:[L("Gonayiv","Gonaïves","Gonaïves","Гонаив"),L("Okap","Cap-Haïtien","Cap-Haïtien","Кап-Аитьен"),L("Jakmèl","Jacmel","Jacmel","Жакмель"),L("Pòtoprens","Port-au-Prince","Port-au-Prince","Порт-о-Пренс")],a:0},
{q:L("Ki dat endepandans lan ?","Quelle est la date de l'indépendance ?","What is the date of independence?","Какова дата независимости?"),o:[L("1ye janvye 1804","1er janvier 1804","1 January 1804","1 января 1804"),L("18 me 1803","18 mai 1803","18 May 1803","18 мая 1803"),L("18 novanm 1803","18 novembre 1803","18 November 1803","18 ноября 1803"),L("17 oktòb 1806","17 octobre 1806","17 October 1806","17 октября 1806")],a:0},
{q:L("Ki non anperè li te pran ?","Quel nom d'empereur a-t-il pris ?","What emperor name did he take?","Какое императорское имя он принял?"),o:["Jacques Ier","Napoléon","Henri Ier","Louis XVI"],a:0}]});

ART.push({id:"fakenyouz",s:"cyber",lv:1,min:4,img:"shield",lab:"fkn",w:[],
t:L("Ki jan pou verifye yon nouvèl anvan w pataje l","Comment vérifier une information avant de la partager","How to check a news item before sharing it","Как проверить новость перед тем, как поделиться"),
sum:L("Senk kesyon pou poze, ak ki jan pou chèche foto ak sous.","Cinq questions à se poser, et comment chercher photos et sources.","Five questions to ask, and how to check photos and sources.","Пять вопросов и как проверить фото и источники."),
b:{
ht:["## Fo enfòmasyon gaye vit","Yon nouvèl ki fè w kòlè oswa ki fè w pè gaye pi vit, e se konsa fo nouvèl yo gaye. Verifye anvan w pataje.","## Senk kesyon","**1. Ki moun ki pibliye l ?** Èske se yon sous ou konnen ? **2. Kilè ?** Gade dat la : yon vye nouvèl ka reprann. **3. Lòt sous yo di sa tou ?** Chèche nan 2 a 3 sous serye. **4. Ki prèv ki genyen ?** Chif, non, dokiman. **5. Tit la twò sansasyonèl ?** Mo tankou « CHOK » oswa « pataje vit » se yon siy atansyon.","## Foto ak videyo","Foto yo ka chanje oswa pran nan yon lòt kote. Fè yon **rechèch imaj envèse** (Google Images, TinEye) pou wè kote foto a te parèt pou premye fwa.","## Sa w ka fè","Si w pa sèten, **pa pataje**. Si w jwenn yon fo nouvèl, di moun ki pataje l ak dousè.","> Yon klik pou pataje se yon responsablite."],
fr:["## Les fausses informations circulent vite","Une nouvelle qui vous met en colère ou vous fait peur se diffuse plus vite, et c'est ainsi que les fausses nouvelles se propagent. Vérifiez avant de partager.","## Cinq questions","**1. Qui l'a publiée ?** Est-ce une source que vous connaissez ? **2. Quand ?** Regardez la date : une vieille nouvelle peut resurgir. **3. D'autres sources le disent-elles ?** Cherchez dans 2 ou 3 sources sérieuses. **4. Quelles preuves ?** Chiffres, noms, documents. **5. Le titre est-il trop sensationnel ?** Des mots comme « CHOC » ou « partagez vite » sont un signal d'alerte.","## Photos et vidéos","Les photos peuvent être modifiées ou venir d'ailleurs. Faites une **recherche d'image inversée** (Google Images, TinEye) pour voir où la photo est apparue pour la première fois.","## Ce que vous pouvez faire","Si vous n'êtes pas sûr, **ne partagez pas**. Si vous trouvez une fausse information, dites-le doucement à la personne qui l'a partagée.","> Un clic pour partager est une responsabilité."],
en:["## False information spreads fast","News that makes you angry or afraid spreads faster, and that is how fake news travels. Check before you share.","## Five questions","**1. Who published it?** Is it a source you know? **2. When?** Check the date: old news can resurface. **3. Do other sources say the same?** Look at 2 or 3 reliable sources. **4. What evidence is there?** Figures, names, documents. **5. Is the headline too sensational?** Words like “SHOCK” or “share fast” are a warning sign.","## Photos and videos","Photos can be edited or come from somewhere else. Do a **reverse image search** (Google Images, TinEye) to see where the photo first appeared.","## What you can do","If you are not sure, **do not share**. If you find false information, gently tell the person who shared it.","> One click to share is a responsibility."],
ru:["## Ложная информация распространяется быстро","Новость, которая вызывает гнев или страх, распространяется быстрее — так и расходятся фейки. Проверяйте, прежде чем делиться.","## Пять вопросов","**1. Кто это опубликовал?** Известный ли вам источник? **2. Когда?** Проверьте дату: старая новость может всплыть снова. **3. Говорят ли это другие источники?** Посмотрите 2–3 надёжных источника. **4. Какие есть доказательства?** Цифры, имена, документы. **5. Не слишком ли сенсационный заголовок?** Слова вроде «ШОК» или «срочно поделись» — тревожный сигнал.","## Фото и видео","Фото могут быть изменены или взяты из другого места. Сделайте **обратный поиск по изображению** (Google Images, TinEye), чтобы узнать, где фото появилось впервые.","## Что можно сделать","Если не уверены, **не делитесь**. Если нашли ложную информацию, мягко скажите тому, кто ею поделился.","> Один клик «поделиться» — это ответственность."]},
q:[{q:L("Si w pa sèten yon nouvèl, kisa pou w fè ?","Si vous doutez d'une nouvelle, que faire ?","If unsure about news, what to do?","Если вы не уверены в новости, что делать?"),o:[L("Pa pataje l","Ne pas la partager","Do not share it","Не делиться"),L("Pataje l vit","La partager vite","Share it quickly","Быстро поделиться"),L("Ajoute yon detay","Ajouter un détail","Add a detail","Добавить деталь"),L("Efase tout","Tout effacer","Delete everything","Удалить всё")],a:0},
{q:L("Kisa rechèch imaj envèse a fè ?","À quoi sert la recherche d'image inversée ?","What does reverse image search do?","Для чего обратный поиск по изображению?"),o:[L("Montre kote foto a te parèt premye fwa","Montre où la photo est apparue d'abord","Shows where the photo first appeared","Показывает, где фото появилось впервые"),L("Chanje foto a","Modifie la photo","Edits the photo","Меняет фото"),L("Efase foto a","Efface la photo","Deletes the photo","Удаляет фото"),L("Fè foto a pi bèl","Embellit la photo","Makes it prettier","Делает фото красивее")],a:0},
{q:L("Ki siy ki ka montre yon fo nouvèl ?","Quel signe peut révéler une fausse nouvelle ?","Which sign may reveal fake news?","Какой признак может выдать фейк?"),o:[L("Tit twò sansasyonèl ak « pataje vit »","Un titre sensationnel et « partagez vite »","A sensational headline and “share fast”","Сенсационный заголовок и «срочно поделись»"),L("Dat klè","Une date claire","A clear date","Чёткая дата"),L("Plizyè sous serye","Plusieurs sources sérieuses","Several reliable sources","Несколько надёжных источников"),L("Non otè a","Le nom de l'auteur","The author's name","Имя автора")],a:0}]});

 var W=300,H=150,x0=40,y0=170;function X(d){return x0+d/14*W}function Y(v){return y0-v*H}
 var s='<rect width="360" height="200" fill="#fff"/><path d="M'+x0+' 20V'+y0+'H'+(x0+W)+'" stroke="#4a2c6a" stroke-width="2" fill="none"/>';

 [0,2,4,6,8,10,12,14].forEach(function(d){s+='<text x="'+X(d)+'" y="188" font-size="10" fill="#555" text-anchor="middle">'+d+'</text>'});
 var a="",b="",S=1,t0=0,rv=[1,3,7];
 for(var d=0;d<=14;d+=.25){a+=(d?"L":"M")+X(d)+" "+Y(Math.exp(-d/1))+" ";}

 s+='<path d="'+a+'" fill="none" stroke="#A32020" stroke-width="3"/><path d="'+pts+'" fill="none" stroke="#6A1B9A" stroke-width="3"/>';rv.forEach(function(d){s+='<path d="M'+X(d)+' '+y0+'V'+Y(1)+'" stroke="#6A1B9A" stroke-dasharray="3 4"/>'});
 s+='<text x="'+(x0+W/2)+'" y="14" font-size="11" fill="#4a2c6a" text-anchor="middle">'+tr(LB.mem)+' / '+tr(LB.days)+'</text>';
 $("#fs",el).innerHTML=s};

/* ---------- quiz ---------- */
function quiz(a,el){
 var qs=a.q,i=0,ok=0,locked=false;
 function show(){var q=qs[i];
  el.innerHTML='<div class="qn">'+t("qn",i+1,qs.length)+'</div><div class="qq">'+esc(tr(q.q))+'</div><div class="qo">'+q.o.map(function(o,k){return'<button class="opt" data-k="'+k+'">'+esc(tr(o))+'</button>'}).join("")+'</div><div class="qf" id="qf" aria-live="polite"></div>';
  locked=false;
  $$(".opt",el).forEach(function(b){b.onclick=function(){if(locked)return;locked=true;var k=+b.getAttribute("data-k"),good=k===q.a;if(good)ok++;
   b.classList.add(good?"good":"bad");if(!good)$$(".opt",el)[q.a].classList.add("good");
   $("#qf",el).innerHTML='<b class="'+(good?"okc":"koc")+'">'+t(good?"good":"bad")+'</b> <button class="btn" id="qx">'+t(i+1<qs.length?"next":"finish")+'</button>';
   $("#qx",el).onclick=function(){i++;if(i<qs.length)show();else end()}}})}
 function end(){var best=Math.max(P.quiz[a.id]||0,ok);P.quiz[a.id]=best;touchDay();save();
  el.innerHTML='<div class="qend"><div class="big">'+t("score",ok,qs.length)+'</div><button class="btn" id="qr">'+t("retry")+'</button></div>';$("#qr",el).onclick=function(){i=0;ok=0;show()};refreshStats();afterQuiz(ok,qs.length)}
 show()}
