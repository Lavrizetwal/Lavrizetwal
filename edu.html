t:L("Kolera ak dlo pwòp : konprann, evite, trete","Choléra et eau propre : comprendre, éviter, soigner","Cholera and clean water: understand, prevent, treat","Холера и чистая вода: понять, предотвратить, лечить"),
sum:L("Ki jan kolera transmèt, ki sa pou w fè si yon moun malad, ak ki jan pou jwenn dlo san danje.","Comment le choléra se transmet, que faire si quelqu'un est malade, et comment rendre l'eau sûre.","How cholera spreads, what to do if someone is ill, and how to make water safe.","Как передаётся холера, что делать при болезни и как обезопасить воду.")  ,
b:{
ht:["## Ki sa kolera ye","**Kolera** se yon maladi ki koze pa yon bakteri (*Vibrio cholerae*). Moun ap pran l lè yo bwè dlo oswa manje ki kontamine ak poupou moun ki gen bakteri a. Li pa pase pa senp kontak nòmal ak yon moun, men li gaye vit kote dlo pa pwòp.","## Sentòm yo","Dyare anpil tankou dlo, souvan vomisman, krampe ak sechrès (dezidratasyon). Sechrès la ka fè yon moun mouri nan kèk èdtan si li pa trete, **men maladi a trete fasilman si w aji vit**.","## Sa pou w fè si yon moun malad","**1.** Ale nan yon sant sante san pèdi tan. **2.** Pandan w ap ale, bay moun nan **sèl reyidratasyon oral (SRO)** ti bwè pa ti bwè. Si w pa genyen, melanje **6 ti kiyè (plat) sik ak mwatye ti kiyè sèl nan 1 lit dlo pwòp**. **3.** Kontinye bay manje, epi alète tibebe yo si yo ap tete. **4.** Nan ka grav, doktè a bay lòt tretman (grenn oswa pèfizyon).","## Ki jan pou evite l","Bwè dlo ki bouyi oswa ki trete ak klò, kenbe dlo a nan yon veso kouvri, lave men ak savon apre latrin ak anvan manje, kwit manje byen, epi itilize latrin. Gen tou **vaksen oral** ki pwoteje yon tan, men li pa ranplase dlo pwòp.","> Se dlo pwòp ak sab ki sove lavi. Pa tann : sechrès ka fè kolera grav vit."],
fr:["## Qu'est-ce que le choléra","Le **choléra** est une maladie causée par une bactérie (*Vibrio cholerae*). On l'attrape en buvant de l'eau ou en mangeant des aliments contaminés par les selles d'une personne porteuse. Il ne se transmet pas par un simple contact normal, mais il se propage vite là où l'eau n'est pas propre.","## Les symptômes","Diarrhée abondante comme de l'eau, souvent des vomissements, des crampes et une déshydratation. La déshydratation peut tuer en quelques heures si elle n'est pas traitée, **mais la maladie se soigne facilement si l'on agit vite**.","## Que faire si quelqu'un est malade","**1.** Aller sans attendre dans un centre de santé. **2.** Pendant le trajet, donner à la personne une **solution de réhydratation orale (SRO)** par petites gorgées. À défaut, mélanger **6 cuillères à café rases de sucre et une demi-cuillère à café de sel dans 1 litre d'eau propre**. **3.** Continuer à nourrir, et allaiter les bébés. **4.** Dans les cas graves, le médecin donne d'autres traitements (comprimés ou perfusion).","## Comment l'éviter","Boire de l'eau bouillie ou traitée au chlore, la garder dans un récipient couvert, se laver les mains au savon après les toilettes et avant de manger, bien cuire les aliments et utiliser des latrines. Il existe aussi un **vaccin oral** qui protège un temps, mais il ne remplace pas l'eau propre.","> L'eau propre et l'assainissement sauvent des vies. N'attendez pas : la déshydratation peut aggraver le choléra très vite."],
en:["## What cholera is","**Cholera** is a disease caused by a bacterium (*Vibrio cholerae*). People catch it by drinking water or eating food contaminated with the faeces of an infected person. It is not spread by ordinary contact, but it spreads fast where water is not clean.","## Symptoms","Abundant watery diarrhoea, often vomiting, cramps and dehydration. Dehydration can kill within hours if untreated, **but the disease is easy to treat if you act quickly**.","## What to do if someone is ill","**1.** Go to a health centre without delay. **2.** On the way, give the person **oral rehydration solution (ORS)** in small sips. If you have none, mix **6 level teaspoons of sugar and half a teaspoon of salt in 1 litre of clean water**. **3.** Keep feeding, and keep breastfeeding babies. **4.** In severe cases the doctor gives other treatment (tablets or a drip).","## How to prevent it","Drink boiled or chlorine-treated water, keep it in a covered container, wash hands with soap after the toilet and before eating, cook food well and use latrines. There is also an **oral vaccine** that protects for a while, but it does not replace clean water.","> Clean water and sanitation save lives. Do not wait: dehydration can make cholera serious very fast."],
ru:["## Что такое холера","**Холера** — болезнь, которую вызывает бактерия (*Vibrio cholerae*). Заражаются, выпивая воду или съедая пищу, загрязнённую испражнениями больного. При обычном контакте она не передаётся, но быстро распространяется там, где вода нечистая.","## Симптомы","Обильный водянистый понос, часто рвота, судороги и обезвоживание. Обезвоживание без лечения может привести к смерти за несколько часов, **но болезнь легко лечится, если действовать быстро**.","## Что делать, если кто-то заболел","**1.** Немедленно идти в центр здоровья. **2.** По дороге давать **раствор для пероральной регидратации (ОРС)** маленькими глотками. Если его нет, смешайте **6 чайных ложек сахара без горки и полчайной ложки соли в 1 литре чистой воды**. **3.** Продолжать кормить, младенцев — грудью. **4.** При тяжёлом течении врач назначит другое лечение (таблетки или капельницу).","## Как предотвратить","Пейте кипячёную воду или воду, обработанную хлором, храните её в закрытой ёмкости, мойте руки с мылом после туалета и перед едой, хорошо готовьте пищу и пользуйтесь уборными. Есть **пероральная вакцина**, которая защищает на время, но она не заменяет чистую воду.","> Чистая вода и санитария спасают жизни. Не ждите: обезвоживание быстро делает холеру тяжёлой."]},
q:[{q:L("Ki jan kolera transmèt sitou ?","Comment le choléra se transmet-il surtout ?","How is cholera mainly spread?","Как в основном передаётся холера?"),o:[L("Dlo ak manje ki kontamine","Eau et aliments contaminés","Contaminated water and food","Заражённая вода и пища"),L("Anbrase","Les câlins","Hugs","Объятия"),L("Moustik","Les moustiques","Mosquitoes","Комары"),L("Van","Le vent","Wind","Ветер")],a:0},
{q:L("Kisa pou w bay yon moun ki ap fè dyare anpil ?","Que donner à quelqu'un qui a une forte diarrhée ?","What should you give someone with heavy diarrhoea?","Что дать человеку с сильным поносом?"),o:[L("SRO ti bwè pa ti bwè, epi mennen l nan sant sante","SRO par petites gorgées, et l'emmener au centre de santé","ORS in small sips, and take them to a health centre","ОРС маленькими глотками и отвезти в центр здоровья"),L("Anyen","Rien","Nothing","Ничего"),L("Sèlman kafe","Seulement du café","Only coffee","Только кофе"),L("Alkòl","De l'alcool","Alcohol","Алкоголь")],a:0},
{q:L("Ki sa ki pwoteje kont kolera ?","Qu'est-ce qui protège du choléra ?","What protects against cholera?","Что защищает от холеры?"),o:[L("Dlo pwòp, lave men, latrin","Eau propre, lavage des mains, latrines","Clean water, handwashing, latrines","Чистая вода, мытьё рук, уборные"),L("Pa soti","Ne pas sortir","Staying indoors","Не выходить из дома"),L("Bwè dlo rivyè","Boire l'eau de la rivière","Drinking river water","Пить речную воду"),L("Pa manje","Ne pas manger","Not eating","Не есть")],a:0}]});

sum:L("Ki manje bay enèji, ki bati kò a, ki pwoteje l, ak kijan pou fè yon asyèt bon.","Quels aliments donnent de l'énergie, construisent le corps, le protègent, et comment composer une bonne assiette.","Which foods give energy, build the body and protect it, and how to build a good plate.","Какие продукты дают энергию, строят тело и защищают его, и как составить хорошую тарелку."),
b:{
ht:["## Kò a bezwen plizyè bagay","Pa gen yon sèl manje ki bay tout sa kò a bezwen. Se konsa nou manje yon varyete. Nou ka divize manje yo an gwoup.","## Senk gwoup yo","**Manje ki bay enèji** : diri, mayi, pitimi, ble, bannann, patat, yanm, manyòk. **Manje ki bati kò a (pwoteyin)** : pwa, pwason, ze, vyann, poul, lèt. **Fwi ak legim** : mango, zoranj, papay, kawòt, epina, tomat. Yo bay vitamin ak mineral ki pwoteje kò a. **Matyè gra** an ti kantite : lwil, zaboka, nwa. **Dlo** : ou bezwen bwè ase chak jou.","## Yon asyèt ki bon","Eseye mete nan menm asyèt la yon manje enèji, yon pwoteyin, ak anpil fwi oswa legim. Chanje chak jou, epi chwazi manje ki nan sezon, souvan pi bon mache.","## Sa pou w limite","Limite sik anpil (sirèt, boutèy kola) ak twòp sèl, epi evite twòp manje fri. Pa bliye lave men, fwi ak legim anvan manje.","> Pou ti bebe : lèt manman an se pi bon manje pou 6 premye mwa yo, epi apre sa l ap kontinye ak manje solid."],
fr:["## Le corps a besoin de plusieurs choses","Aucun aliment ne donne tout ce dont le corps a besoin. C'est pourquoi on mange de façon variée. On peut classer les aliments en groupes.","## Les cinq groupes","**Aliments qui donnent de l'énergie** : riz, maïs, millet, blé, banane plantain, patate douce, igname, manioc. **Aliments qui construisent le corps (protéines)** : haricots, poisson, œufs, viande, volaille, lait. **Fruits et légumes** : mangue, orange, papaye, carotte, épinards, tomate. Ils apportent vitamines et minéraux qui protègent le corps. **Matières grasses** en petite quantité : huile, avocat, noix. **Eau** : il faut boire suffisamment chaque jour.","## Une bonne assiette","Essayez de mettre dans la même assiette un aliment énergétique, une protéine, et beaucoup de fruits ou de légumes. Variez chaque jour, et choisissez des produits de saison, souvent moins chers.","## À limiter","Limitez le sucre en excès (bonbons, sodas) et le trop de sel, et évitez trop de fritures. N'oubliez pas de laver vos mains, les fruits et légumes avant de manger.","> Pour les bébés : le lait maternel est le meilleur aliment pendant les 6 premiers mois, puis on le poursuit avec des aliments solides."],
en:["## The body needs several things","No single food gives the body everything it needs. That is why we eat a variety. We can sort foods into groups.","## The five groups","**Energy foods**: rice, maize, millet, wheat, plantain, sweet potato, yam, cassava. **Body-building foods (protein)**: beans, fish, eggs, meat, poultry, milk. **Fruit and vegetables**: mango, orange, papaya, carrot, spinach, tomato. They provide vitamins and minerals that protect the body. **Fats** in small amounts: oil, avocado, nuts. **Water**: you need to drink enough every day.","## A good plate","Try to put an energy food, a protein and plenty of fruit or vegetables on the same plate. Vary from day to day and choose seasonal foods, often cheaper.","## What to limit","Limit excess sugar (sweets, sodas) and too much salt, and avoid too many fried foods. Remember to wash your hands, fruit and vegetables before eating.","> For babies: breast milk is the best food for the first 6 months, then it continues alongside solid foods."],
ru:["## Телу нужно многое","Ни один продукт не даёт телу всё необходимое. Поэтому мы едим разнообразно. Продукты можно разделить на группы.","## Пять групп","**Продукты-энергия**: рис, кукуруза, просо, пшеница, плантан, батат, ямс, маниока. **Строительные продукты (белки)**: бобовые, рыба, яйца, мясо, птица, молоко. **Фрукты и овощи**: манго, апельсин, папайя, морковь, шпинат, помидор. Они дают витамины и минералы, которые защищают организм. **Жиры** в небольшом количестве: масло, авокадо, орехи. **Вода**: нужно пить достаточно каждый день.","## Хорошая тарелка","Старайтесь класть на одну тарелку энергетический продукт, белок и много фруктов или овощей. Меняйте рацион изо дня в день и выбирайте сезонные продукты — они часто дешевле.","## Что ограничивать","Ограничивайте избыток сахара (сладости, газировка) и соли, избегайте слишком жареной пищи. Не забывайте мыть руки, фрукты и овощи перед едой.","> Для младенцев: грудное молоко — лучшая еда первые 6 месяцев, затем его продолжают наряду с твёрдой пищей."]},
q:[{q:L("Ki manje ki bay enèji ?","Quel aliment donne de l'énergie ?","Which food gives energy?","Какой продукт даёт энергию?"),o:[L("Diri","Le riz","Rice","Рис"),L("Dlo","L'eau","Water","Вода"),L("Sèl","Le sel","Salt","Соль"),L("Vitamin C sèlman","La vitamine C seule","Vitamin C only","Только витамин C")],a:0},

ART.push({id:"modpas",s:"cyber",lv:1,min:4,img:"chip",lab:"mdp",w:[],
t:L("Modpas solid : ki jan pou pwoteje kont ou","Des mots de passe solides : protéger ses comptes","Strong passwords: protecting your accounts","Надёжные пароли: защита аккаунтов"),
sum:L("Longè, inisite, yon modpas pou chak kont, ak verifikasyon an de etap.","Longueur, unicité, un mot de passe par compte, et double vérification.","Length, uniqueness, one password per account, and two-step verification.","Длина, уникальность, свой пароль для каждого аккаунта и двухэтапная проверка."),
b:{
ht:["## Longè bat konplikasyon","Yon modpas long pi difisil pou devine pase yon modpas kout ak bonbon senbòl. Eseye yon **fraz modpas** : kat oswa senk mo o aza, tankou \"kabrit-lanp-nwaj-ziran-pòm\". Vize omwen **12 karaktè**.","## Yon modpas pou chak kont","Si yon sit pèdi modpas li yo, moun ki vòlè yo eseye menm modpas la sou lòt kont ou. Se poutèt sa chak kont (imèl, rezo sosyal, bank) dwe gen pwòp modpas li.","## Sa pou w pa fè","Pa itilize non w, dat nesans ou, \"123456\" oswa \"modpas\". Pa bay modpas ou ni kòd SMS ou pèsonn, menm yon moun ki di li soti nan sèvis kliyan. Pa ekri l kote tout moun ka wè l.","## Pwoteksyon an plis","Aktive **verifikasyon an de etap** (2FA) : menm si yon moun jwenn modpas ou, li bezwen yon dezyèm kòd. Yon **jesyonè modpas** ka sonje yo pou ou. Si w sispèk yon kont piratè, chanje modpas la touswit.","> Yon modpas se tankou kle lakay ou : pa bay l, pa kopye l pou tout pòt."],
fr:["## La longueur prime sur la complication","Un mot de passe long est plus difficile à deviner qu'un mot de passe court plein de symboles. Essayez une **phrase de passe** : quatre ou cinq mots au hasard, comme « chèvre-lampe-nuage-fourmi-pomme ». Visez au moins **12 caractères**.","## Un mot de passe par compte","Si un site perd ses mots de passe, les voleurs essaient le même sur vos autres comptes. Chaque compte (e-mail, réseaux sociaux, banque) doit donc avoir son propre mot de passe.","## À éviter","N'utilisez pas votre nom, votre date de naissance, « 123456 » ou « motdepasse ». Ne donnez votre mot de passe ni vos codes SMS à personne, même à quelqu'un qui dit venir du service client. Ne l'écrivez pas là où tout le monde peut le voir.","## Une protection de plus","Activez la **double vérification** (2FA) : même si quelqu'un trouve votre mot de passe, il lui faut un second code. Un **gestionnaire de mots de passe** peut les retenir pour vous. Si vous pensez qu'un compte est piraté, changez le mot de passe tout de suite.","> Un mot de passe est comme la clé de votre maison : ne la prêtez pas, ne l'utilisez pas pour toutes les portes."],
en:["## Length beats complexity","A long password is harder to guess than a short one full of symbols. Try a **passphrase**: four or five random words, like \"goat-lamp-cloud-ant-apple\". Aim for at least **12 characters**.","## One password per account","If a site loses its passwords, thieves try the same one on your other accounts. So every account (email, social media, bank) needs its own password.","## What to avoid","Do not use your name, your birth date, \"123456\" or \"password\". Never give your password or SMS codes to anyone, even someone claiming to be customer service. Do not write it where everyone can see.","## Extra protection","Turn on **two-step verification** (2FA): even if someone finds your password, they need a second code. A **password manager** can remember them for you. If you think an account is hacked, change the password straight away.","> A password is like your house key: do not lend it, and do not use one key for every door."],
ru:["## Длина важнее сложности","Длинный пароль угадать труднее, чем короткий, набитый символами. Попробуйте **парольную фразу**: четыре–пять случайных слов, например «коза-лампа-облако-муравей-яблоко». Стремитесь минимум к **12 символам**.","## Свой пароль для каждого аккаунта","Если сайт потеряет пароли, воры пробуют тот же пароль на других ваших аккаунтах. Поэтому у каждого аккаунта (почта, соцсети, банк) должен быть свой пароль.","## Чего избегать","Не используйте имя, дату рождения, «123456» или «password». Никому не сообщайте пароль и SMS-коды, даже тому, кто называет себя службой поддержки. Не записывайте пароль на виду.","## Дополнительная защита","Включите **двухэтапную проверку** (2FA): даже если пароль узнают, нужен второй код. **Менеджер паролей** запомнит их за вас. Если подозреваете взлом, сразу смените пароль.","> Пароль — как ключ от дома: не одалживайте и не используйте один ключ для всех дверей."]},

t:L("Arnak ak ameksonaj sou entènèt : ki jan pou w rekonèt yo","Hameçonnage et arnaques : les reconnaître","Phishing and scams: how to spot them","Фишинг и мошенничество: как их распознать"),
sum:L("Siy ki pa twonpe, ak sa pou w fè anvan w klike oswa voye lajan.","Les signes qui ne trompent pas, et que faire avant de cliquer ou d'envoyer de l'argent.","The telltale signs, and what to do before you click or send money.","Верные признаки и что делать, прежде чем нажимать или отправлять деньги."),
b:{
ht:["## Ki jan yo travay","**Ameksonaj (phishing)** se yon mesaj (SMS, imèl, WhatsApp, apèl) ki fè kòmsi li soti nan yon sous serye (bank, konpayi telefòn, yon fanmi) pou fè w bay modpas, kòd oswa lajan. Yo jwe sou **pè, ijans ak anvi**.","## Siy yo","Yon mesaj ki mete presyon (\"fè sa nan 1 èdtan\"), ki mande modpas, PIN oswa kòd ki vini sou telefòn ou, ki di w ou genyen yon pri ou pa t jwe pou li, ki mande w voye lajan pou w resevwa lajan, oswa ki soti nan yon moun ki di li fanmi w ki an danje men ki chanje nimewo. Lyen ki sanble ak sit ofisyèl la men ki gen yon ti diferans, ak fòt òtograf, se ankò yon siy.","## Sa pou w fè","**Pa klike**, pa reponn, pa bay kòd. Rele moun nan oswa òganizasyon an sou yon nimewo ou deja konnen. Pou yon kont, ale sou aplikasyon ofisyèl la oswa tape adrès la ou menm. Bloke epi siyale mesaj la.","## Si w te deja tonbe nan pyèj la","Chanje modpas la touswit, kontakte bank oswa sèvis mobil lajan an, epi pale ak yon moun ou fè konfyans. Pa wont : anpil moun gen eksperyans sa a.","> Yon vrè òganizasyon pa janm mande modpas ou, PIN ou oswa kòd SMS ou."],
fr:["## Comment ça marche","Le **hameçonnage (phishing)** est un message (SMS, e-mail, WhatsApp, appel) qui prétend venir d'une source sérieuse (banque, opérateur, un proche) pour vous faire donner un mot de passe, un code ou de l'argent. Il joue sur la **peur, l'urgence et l'envie**.","## Les signes","Un message qui met la pression (« faites-le dans l'heure »), qui demande un mot de passe, un code PIN ou un code reçu par SMS, qui annonce un gain à un jeu auquel vous n'avez pas joué, qui demande d'envoyer de l'argent pour en recevoir, ou qui vient d'un « proche en difficulté » avec un nouveau numéro. Un lien proche du site officiel avec une petite différence, ou des fautes d'orthographe, sont d'autres signaux.","## Que faire","**Ne cliquez pas**, ne répondez pas, ne donnez aucun code. Appelez la personne ou l'organisation sur un numéro que vous connaissez déjà. Pour un compte, ouvrez l'application officielle ou tapez vous-même l'adresse. Bloquez et signalez le message.","## Si vous êtes déjà tombé dans le piège","Changez le mot de passe tout de suite, contactez votre banque ou le service d'argent mobile, et parlez à quelqu'un de confiance. N'ayez pas honte : beaucoup de gens y ont été pris.","> Une vraie organisation ne vous demande jamais votre mot de passe, votre PIN ou un code SMS."],
en:["## How it works","**Phishing** is a message (SMS, email, WhatsApp, call) pretending to come from a trusted source (bank, phone company, a relative) to make you give a password, a code or money. It plays on **fear, urgency and desire**.","## The signs","A message that pressures you (\"do this within an hour\"), asks for a password, PIN or a code sent to your phone, says you won a prize in something you did not enter, asks you to send money to receive money, or comes from a \"relative in trouble\" with a new number. A link that looks like the official site but differs slightly, or spelling mistakes, are further signs.","## What to do","**Do not click**, do not reply, do not give any code. Call the person or organisation on a number you already know. For an account, open the official app or type the address yourself. Block and report the message.","## If you already fell for it","Change the password at once, contact your bank or mobile-money service, and talk to someone you trust. Do not be ashamed: many people have been caught.","> A real organisation never asks for your password, PIN or SMS code."],
ru:["## Как это работает","**Фишинг** — сообщение (SMS, e-mail, WhatsApp, звонок), которое выдаёт себя за надёжный источник (банк, оператор, родственник), чтобы вы выдали пароль, код или деньги. Оно играет на **страхе, спешке и желании**.","## Признаки","Сообщение давит на срочность («сделайте за час»), просит пароль, PIN или код из SMS, сообщает о выигрыше в игре, в которой вы не участвовали, просит отправить деньги, чтобы получить деньги, или приходит от «родственника в беде» с нового номера. Ссылка, похожая на официальный сайт, но с небольшим отличием, и ошибки в тексте — тоже признаки.","## Что делать","**Не нажимайте**, не отвечайте, не называйте коды. Позвоните человеку или в организацию по номеру, который вы уже знаете. Для аккаунта откройте официальное приложение или введите адрес сами. Заблокируйте и сообщите об этом сообщении.","## Если вы уже попались","Сразу смените пароль, свяжитесь с банком или сервисом мобильных денег и поговорите с кем-то, кому доверяете. Не стыдитесь: попадались многие.","> Настоящая организация никогда не спрашивает пароль, PIN или код из SMS."]},

sum:L("Plak tektonik, magnitid, ak gwo jès pou sove lavi.","Plaques tectoniques, magnitude, et les gestes qui sauvent.","Tectonic plates, magnitude, and the actions that save lives.","Тектонические плиты, магнитуда и действия, которые спасают жизнь."),
b:{
ht:["## Ki jan yon tranbleman tè fèt","Kwout Latè a kase an gwo moso ki rele **plak tektonik**. Yo ap deplase dousman. Lè de plak bloke youn kont lòt, enèji a ap akimile jiskaske woch la kase sibitman sou yon **fay** : se sa ki kreye yon tranbleman tè. Pwen kote woch la kase anba tè a se **foyè**, epi pwen ki nan sifas la dirèkteman anwo se **episant**.","## Poukisa Ayiti ekspoze","Ayiti sitiye sou fwontyè ant **plak Karayib la** ak **plak Amerik di Nò a**. Fay yo travèse peyi a. Sa eksplike poukisa gen tranbleman tè, tankou sa ki te frape **12 janvye 2010**, ak yon **magnitid 7,0**, tou pre Pòtoprens.","## Magnitid","**Magnitid** mezire fòs yon tranbleman tè sou yon echèl logaritmik : chak ogmantasyon 1 pwen vle di sekous la anviwon **10 fwa pi gwo**, ak anviwon 32 fwa plis enèji. Danje a depann tou de pwofondè, distans, tèren ak kalite bilding yo.","## Ki sa pou w fè","**Pandan jès la** : **Bese, Kouvri, Kenbe** (anba yon tab solid, pwoteje tèt ak kou, kenbe l). Pa kouri deyò si w anndan. Si w deyò, ale nan yon espas ouvè, lwen bilding, fil elektrik ak miray. Si w bò lanmè e jès la fò oswa long, ale nan yon kote ki wo. **Apre** : atann replik, tcheke blese yo, pa antre nan bilding ki domaje, epi pa sèvi ak flanm.","> Se bilding ki kraze ki touye, pa tranbleman an li menm. Bon konstriksyon sove lavi."],
fr:["## Comment naît un séisme","La croûte terrestre est brisée en grands morceaux appelés **plaques tectoniques**. Elles bougent lentement. Quand deux plaques se bloquent, l'énergie s'accumule jusqu'à ce que la roche casse brusquement le long d'une **faille** : c'est un séisme. Le point de rupture sous terre est le **foyer**, et le point à la surface juste au-dessus est l'**épicentre**.","## Pourquoi Haïti est exposée","Haïti se trouve à la frontière entre la **plaque Caraïbe** et la **plaque Amérique du Nord**. Des failles traversent le pays. Cela explique des séismes comme celui du **12 janvier 2010**, de **magnitude 7,0**, près de Port-au-Prince.","## La magnitude","La **magnitude** mesure la force d'un séisme sur une échelle logarithmique : chaque point de plus signifie une secousse environ **10 fois plus grande**, et environ 32 fois plus d'énergie. Le danger dépend aussi de la profondeur, de la distance, du sol et de la qualité des bâtiments.","## Que faire","**Pendant la secousse** : **Se baisser, se couvrir, se maintenir** (sous une table solide, protéger la tête et la nuque, s'y tenir). Ne courez pas dehors si vous êtes à l'intérieur. Si vous êtes dehors, allez dans un espace dégagé, loin des bâtiments, des fils électriques et des murs. Au bord de la mer, si la secousse est forte ou longue, allez en hauteur. **Après** : attendez les répliques, vérifiez les blessés, n'entrez pas dans les bâtiments endommagés et n'utilisez pas de flamme.","> Ce sont les bâtiments qui s'effondrent qui tuent, pas le séisme lui-même. Bien construire sauve des vies."],
en:["## How an earthquake forms","Earth's crust is broken into huge pieces called **tectonic plates**. They move slowly. When two plates lock, energy builds up until the rock suddenly breaks along a **fault**: that is an earthquake. The break point underground is the **focus**, and the point on the surface right above is the **epicentre**.","## Why Haiti is exposed","Haiti lies on the boundary between the **Caribbean plate** and the **North American plate**. Faults cross the country. This explains earthquakes such as the one on **12 January 2010**, of **magnitude 7.0**, near Port-au-Prince.","## Magnitude","**Magnitude** measures the strength of an earthquake on a logarithmic scale: each extra point means shaking about **10 times larger**, and about 32 times more energy. Danger also depends on depth, distance, ground and building quality.","## What to do","**During shaking**: **Drop, Cover, Hold on** (under a sturdy table, protect head and neck, hold on). Do not run outside if you are indoors. If you are outside, move to an open area away from buildings, power lines and walls. By the sea, if shaking is strong or long, go to high ground. **Afterwards**: expect aftershocks, check for injured people, do not enter damaged buildings and do not use flames.","> It is collapsing buildings that kill, not the earthquake itself. Building well saves lives."],
ru:["## Как возникает землетрясение","Земная кора разбита на огромные части — **тектонические плиты**. Они медленно движутся. Когда две плиты зацепляются, энергия накапливается, пока порода внезапно не разрушится по **разлому**: это и есть землетрясение. Точка разрыва под землёй — **гипоцентр**, точка на поверхности прямо над ним — **эпицентр**.","## Почему Гаити уязвима","Гаити расположена на границе **Карибской** и **Северо-Американской** плит. Страну пересекают разломы. Этим объясняются такие землетрясения, как **12 января 2010 года** магнитудой **7,0** близ Порт-о-Пренса.","## Магнитуда","**Магнитуда** измеряет силу землетрясения по логарифмической шкале: каждая лишняя единица — колебания примерно в **10 раз** сильнее и энергия примерно в 32 раза больше. Опасность зависит также от глубины, расстояния, грунта и качества зданий.","## Что делать","**Во время толчков**: **пригнуться, укрыться, держаться** (под прочным столом, защитить голову и шею, держаться). Не выбегайте наружу, если вы внутри. Если вы на улице, идите на открытое место подальше от зданий, проводов и стен. На побережье при сильных или долгих толчках уходите на возвышенность. **После**: ждите повторных толчков, проверьте пострадавших, не входите в повреждённые здания и не пользуйтесь огнём.","> Убивают рушащиеся здания, а не само землетрясение. Хорошее строительство спасает жизни."]},

sum:L("Pwoblèm vre : enklinezon aks Latè a, ak sa sa chanje nan Karayib la.","La vraie raison : l'inclinaison de l'axe de la Terre, et ce que cela change aux Caraïbes.","The real reason: the tilt of Earth's axis, and what it changes in the Caribbean.","Настоящая причина: наклон оси Земли и что он меняет в Карибском регионе."),
b:{
ht:["## Yon mit komen","Anpil moun panse ete a vini lè Latè pi pre solèy la. **Sa pa vre.** Latè pi pre solèy la nan kòmansman janvye, nan sezon ivè nan emisfè nò a.","## Vre rezon an : enklinezon","Aks Latè a enkline anviwon **23,4 degre**. Pandan Latè ap vire otou solèy la, yon emisfè pi enkline vè solèy la : limyè solèy la frape l pi dirèk, jou yo pi long, epi li fè pi cho. Se **ete** pou emisfè sa a, pandan emisfè opoze a gen **ivè**.","## Ekinòks ak solstis","Nan **solstis yo** (alantou 21 jen ak 21 desanm) yon emisfè resevwa pi plis oswa pi mwens limyè. Nan **ekinòks yo** (alantou 20 mas ak 22 sektanm), jou ak nwit yo prèske egal.","## Ak Ayiti ?","Ayiti nan zòn twopikal (anviwon 18–20° nò), kidonk tanperati a chanje mwens pase nan peyi ki pi lwen ekwatè a. Anjeneral, nou pale pito de **sezon sèk ak sezon lapli** : sezon siklòn lan ale 1 jen rive 30 novanm.","> Si distans la te kreye sezon yo, tout Latè ta gen menm sezon an menm lè. Men non : lè li ete nan nò, li ivè nan sid."],
fr:["## Une idée fausse très répandue","Beaucoup pensent que l'été vient quand la Terre est plus près du Soleil. **C'est faux.** La Terre est le plus près du Soleil début janvier, en plein hiver dans l'hémisphère nord.","## La vraie raison : l'inclinaison","L'axe de la Terre est incliné d'environ **23,4 degrés**. Pendant que la Terre tourne autour du Soleil, un hémisphère est plus incliné vers lui : la lumière arrive plus directement, les jours sont plus longs, et il fait plus chaud. C'est l'**été** pour cet hémisphère, tandis que l'hémisphère opposé a l'**hiver**.","## Équinoxes et solstices","Aux **solstices** (vers le 21 juin et le 21 décembre) un hémisphère reçoit le plus ou le moins de lumière. Aux **équinoxes** (vers le 20 mars et le 22 septembre), jour et nuit sont presque égaux.","## Et en Haïti ?","Haïti est dans la zone tropicale (environ 18–20° nord), donc la température varie moins que dans les pays éloignés de l'équateur. On parle surtout de **saison sèche et de saison des pluies** ; la saison cyclonique va du 1er juin au 30 novembre.","> Si la distance créait les saisons, toute la Terre aurait la même saison en même temps. Or non : quand c'est l'été au nord, c'est l'hiver au sud."],
en:["## A very common myth","Many people think summer comes when Earth is closest to the Sun. **That is false.** Earth is closest to the Sun in early January, in the middle of winter in the northern hemisphere.","## The real reason: tilt","Earth's axis is tilted by about **23.4 degrees**. As Earth goes around the Sun, one hemisphere leans more toward it: sunlight arrives more directly, days are longer, and it is warmer. That is **summer** for that hemisphere, while the opposite hemisphere has **winter**.","## Equinoxes and solstices","At the **solstices** (around 21 June and 21 December) one hemisphere gets the most or the least light. At the **equinoxes** (around 20 March and 22 September), day and night are almost equal.","## And in Haiti?","Haiti is in the tropics (about 18–20° north), so temperature varies less than in countries far from the equator. People mostly talk about the **dry season and the rainy season**; the hurricane season runs from 1 June to 30 November.","> If distance created the seasons, the whole Earth would have the same season at once. It does not: when it is summer in the north, it is winter in the south."],
ru:["## Очень распространённый миф","Многие думают, что лето наступает, когда Земля ближе к Солнцу. **Это неверно.** Земля ближе всего к Солнцу в начале января — посреди зимы в северном полушарии.","## Настоящая причина: наклон","Ось Земли наклонена примерно на **23,4 градуса**. Пока Земля движется вокруг Солнца, одно полушарие больше обращено к нему: лучи падают прямее, дни длиннее, теплее. Это **лето** для этого полушария, а в противоположном — **зима**.","## Равноденствия и солнцестояния","В дни **солнцестояний** (около 21 июня и 21 декабря) одно полушарие получает больше или меньше всего света. В дни **равноденствий** (около 20 марта и 22 сентября) день и ночь почти равны.","## А на Гаити?","Гаити находится в тропиках (примерно 18–20° с. ш.), поэтому температура колеблется меньше, чем в странах, далёких от экватора. Чаще говорят о **сухом и дождливом сезонах**; сезон ураганов длится с 1 июня по 30 ноября.","> Если бы времена года создавало расстояние, на всей Земле одновременно был бы один сезон. Но когда на севере лето, на юге зима."]},
q:[{q:L("Poukisa gen sezon ?","Pourquoi y a-t-il des saisons ?","Why are there seasons?","Почему бывают времена года?"),o:[L("Aks Latè a enkline","L'axe de la Terre est incliné","Earth's axis is tilted","Ось Земли наклонена"),L("Latè pre solèy la","La Terre se rapproche du Soleil","Earth gets closer to the Sun","Земля приближается к Солнцу"),L("Lalin","La Lune","The Moon","Луна"),L("Van","Le vent","Wind","Ветер")],a:0},
{q:L("Lè l ete nan nò, kisa l ye nan sid ?","Quand c'est l'été au nord, qu'est-ce au sud ?","When it is summer in the north, what is it in the south?","Когда на севере лето, что на юге?"),o:[L("Ivè","L'hiver","Winter","Зима"),L("Ete","L'été","Summer","Лето"),L("Prentan","Le printemps","Spring","Весна"),L("Menm bagay","Pareil","The same","То же")],a:0},
{q:L("Ki lè sezon siklòn lan ye ?","Quand a lieu la saison cyclonique ?","When is the hurricane season?","Когда сезон ураганов?"),o:[L("1 jen – 30 novanm","1er juin – 30 novembre","1 June – 30 November","1 июня – 30 ноября"),L("1 janvye – 28 fevriye","1er janvier – 28 février","1 January – 28 February","1 января – 28 февраля"),L("Tout ane","Toute l'année","All year","Круглый год"),L("Sèlman desanm","Seulement décembre","Only December","Только декабрь")],a:0}]});

ART.push({id:"pouvwa",s:"polit",lv:1,min:5,img:"scale",lab:"powers",w:[],
t:L("Separasyon pouvwa yo : kijan yon eta limite tèt li","La séparation des pouvoirs : comment un État se limite lui-même","Separation of powers: how a state limits itself","Разделение властей: как государство ограничивает само себя"),
sum:L("Pouvwa lejislatif, egzekitif ak jidisyè : ki sa chak youn fè epi poukisa yo dwe separe.","Pouvoirs législatif, exécutif et judiciaire : leur rôle et pourquoi ils doivent être séparés.","Legislative, executive and judicial powers: their roles and why they must be separate.","Законодательная, исполнительная и судебная власть: их роль и зачем их разделять."),
b:{
ht:["## Yon lide ki vyèl","Si yon sèl moun oswa yon sèl gwoup fè lwa yo, aplike yo epi jije moun, li ka abize. Pou evite sa, anpil peyi separe pouvwa a an twa. Montesquieu, yon filozòf franse nan 18yèm syèk la, te popilarize lide sa a.","## Twa pouvwa yo","**Pouvwa lejislatif** : fè lwa yo ak vote bidjè a (palman an : depite ak senatè). **Pouvwa egzekitif** : aplike lwa yo ak dirije administrasyon an (prezidan an, premye minis, minis yo). **Pouvwa jidisyè** : jije dispit ak kriminèl (tribinal yo ak jij yo).","## Kontwòl youn sou lòt","Chak pouvwa ka limite lòt yo : palman an ka kontwole gouvènman an, tribinal yo ka di si yon lwa oswa yon desizyon respekte konstitisyon an, epi egzekitif la ka pwopoze lwa. Sa yo rele **chèk ak balans**.","## Ak Ayiti","Konstitisyon 1987 la òganize pouvwa Leta yo nan twa branch sa yo. Fason yo travay nan pratik, ak ki sa ki mache oswa ki pa mache, se yon gwo debat sivik ou ka etidye.","> Yon eta de dwa se yon eta kote pouvwa a limite pa lwa."],
fr:["## Une idée ancienne","Si une seule personne ou un seul groupe fait les lois, les applique et juge, il peut abuser. Pour l'éviter, beaucoup de pays séparent le pouvoir en trois. Montesquieu, philosophe français du XVIIIe siècle, a popularisé cette idée.","## Les trois pouvoirs","**Pouvoir législatif** : faire les lois et voter le budget (le parlement : députés et sénateurs). **Pouvoir exécutif** : appliquer les lois et diriger l'administration (le président, le premier ministre, les ministres). **Pouvoir judiciaire** : juger les litiges et les crimes (les tribunaux et les juges).","## Se contrôler mutuellement","Chaque pouvoir peut limiter les autres : le parlement peut contrôler le gouvernement, les tribunaux peuvent dire si une loi ou une décision respecte la constitution, et l'exécutif peut proposer des lois. On parle de **poids et contrepoids**.","## Et en Haïti ?","La Constitution de 1987 organise les pouvoirs de l'État en ces trois branches. Leur fonctionnement dans la pratique, ce qui marche ou non, est un grand débat civique que vous pouvez étudier.","> Un État de droit est un État où le pouvoir est limité par la loi."],
en:["## An old idea","If one person or one group makes the laws, applies them and judges people, it can abuse its power. To avoid this, many countries split power in three. Montesquieu, an 18th-century French philosopher, popularised the idea.","## The three powers","**Legislative power**: making laws and voting the budget (parliament: deputies and senators). **Executive power**: applying laws and running the administration (the president, prime minister, ministers). **Judicial power**: judging disputes and crimes (courts and judges).","## Checking each other","Each power can limit the others: parliament can oversee the government, courts can say whether a law or decision respects the constitution, and the executive can propose laws. These are called **checks and balances**.","## And in Haiti?","The 1987 Constitution organises the powers of the State into these three branches. How they work in practice, what works and what does not, is a big civic debate you can study.","> A state under the rule of law is one where power is limited by law."],
ru:["## Давняя идея","Если один человек или одна группа издаёт законы, применяет их и судит, возможны злоупотребления. Чтобы этого избежать, многие страны делят власть на три. Идею популяризировал Монтескьё, французский философ XVIII века.","## Три власти","**Законодательная власть**: принимает законы и утверждает бюджет (парламент: депутаты и сенаторы). **Исполнительная власть**: применяет законы и руководит администрацией (президент, премьер-министр, министры). **Судебная власть**: разрешает споры и судит преступления (суды и судьи).","## Взаимный контроль","Каждая власть может ограничивать другие: парламент контролирует правительство, суды решают, соответствуют ли закон или решение конституции, а исполнительная власть может вносить законопроекты. Это называется **система сдержек и противовесов**.","## А на Гаити?","Конституция 1987 года организует власть государства по этим трём ветвям. Как они работают на практике, что получается, а что нет, — большая гражданская дискуссия, которую можно изучать.","> Правовое государство — это государство, где власть ограничена законом."]},
q:[{q:L("Ki pouvwa ki fè lwa yo ?","Quel pouvoir fait les lois ?","Which power makes the laws?","Какая власть принимает законы?"),o:[L("Lejislatif","Le législatif","Legislative","Законодательная"),L("Egzekitif","L'exécutif","Executive","Исполнительная"),L("Jidisyè","Le judiciaire","Judicial","Судебная"),L("Pèsonn","Personne","Nobody","Никто")],a:0},
{q:L("Ki moun ki jije dispit yo ?","Qui juge les litiges ?","Who judges disputes?","Кто разрешает споры?"),o:[L("Tribinal yo","Les tribunaux","The courts","Суды"),L("Prezidan an","Le président seul","The president alone","Только президент"),L("Palman an","Le parlement","Parliament","Парламент"),L("Jounalis yo","Les journalistes","Journalists","Журналисты")],a:0},
{q:L("Poukisa pouvwa yo separe ?","Pourquoi sépare-t-on les pouvoirs ?","Why separate powers?","Зачем разделять власти?"),o:[L("Pou evite abi","Pour éviter les abus","To prevent abuse","Чтобы не было злоупотреблений"),L("Pou fè l pi chè","Pour que ça coûte plus cher","To cost more","Чтобы стало дороже"),L("Pou pa gen lwa","Pour qu'il n'y ait pas de lois","So there are no laws","Чтобы не было законов"),L("San rezon","Sans raison","No reason","Без причины")],a:0}]});

ART.push({id:"premyesen",s:"sp",lv:1,min:5,img:"heart",lab:"aid",w:[],
t:L("Premye swen : san, boule ak malèz","Premiers secours : saignement, brûlure et malaise","First aid: bleeding, burns and fainting","Первая помощь: кровотечение, ожог и обморок"),
sum:L("Gwo jès senp ki ka sove lavi anvan èd medikal la rive.","Des gestes simples qui peuvent sauver une vie avant l'arrivée de l'aide médicale.","Simple actions that can save a life before medical help arrives.","Простые действия, которые могут спасти жизнь до прибытия врача."),
b:{
ht:["## Anvan tout bagay","Asire w ke zòn nan an sekirite pou ou ak pou viktim nan. Si sitiyasyon an grav, rele èd oswa voye yon moun chèche yon sant sante epi kontinye ede pandan w ap tann. Lave men w si w kapab.","## Si gen san k ap koule","**Peze fò** sou blesi a ak yon twal pwòp, epi kenbe presyon an san ou pa leve l pou gade. Leve manm nan si se posib. Si twal la tranpe ak san, mete yon lòt sou li. Si san an pa sispann, ale nan sant sante a vit.","## Si gen yon boule","**Mete boule a anba dlo frèt ki koule pandan 20 minit.** Retire bag oswa rad ki pa kole sou po a. Kouvri ak yon twal pwòp ki pa kole. **Pa mete** bè, dantifris, lwil, glas oswa blan ze. Konsilte si boule a gwo, nan figi, men oswa pye, oswa si se yon timoun.","## Si yon moun malèz","Kouche l sou do, leve janm li yo. Desere rad ki sere, kite l respire. Si li pa reveye apre yon minit oswa li pa respire, rele èd touswit epi kontinye siveye. Pa ba l manje ni bwason jiskaske li reveye byen.","> Premye swen se pa ranplase yon doktè : se bay tan jiskaske doktè a rive."],
fr:["## Avant tout","Assurez-vous que la zone est sûre pour vous et pour la victime. Si la situation est grave, appelez les secours ou envoyez quelqu'un chercher un centre de santé, et continuez à aider en attendant. Lavez-vous les mains si possible.","## S'il y a un saignement","**Appuyez fort** sur la plaie avec un tissu propre, et maintenez la pression sans le retirer pour regarder. Surélevez le membre si possible. Si le tissu est imbibé, ajoutez-en un autre par-dessus. Si le sang ne s'arrête pas, allez vite au centre de santé.","## S'il y a une brûlure","**Placez la brûlure sous l'eau fraîche qui coule pendant 20 minutes.** Retirez les bagues ou vêtements qui ne collent pas à la peau. Couvrez avec un linge propre non adhérent. **N'appliquez pas** de beurre, dentifrice, huile, glace ou blanc d'œuf. Consultez si la brûlure est étendue, au visage, aux mains ou aux pieds, ou si c'est un enfant.","## Si quelqu'un fait un malaise","Allongez-le sur le dos, surélevez ses jambes. Desserrez les vêtements, laissez-le respirer. S'il ne reprend pas conscience après une minute ou s'il ne respire pas, appelez les secours tout de suite et continuez à surveiller. Ne lui donnez ni nourriture ni boisson tant qu'il n'est pas bien réveillé.","> Les premiers secours ne remplacent pas un médecin : ils font gagner du temps jusqu'à son arrivée."],
en:["## First of all","Make sure the area is safe for you and the victim. If the situation is serious, call for help or send someone to a health centre, and keep helping while you wait. Wash your hands if you can.","## If there is bleeding","**Press firmly** on the wound with a clean cloth and keep the pressure without lifting it to look. Raise the limb if possible. If the cloth soaks through, add another on top. If the bleeding does not stop, go to a health centre quickly.","## If there is a burn","**Hold the burn under cool running water for 20 minutes.** Remove rings or clothing that is not stuck to the skin. Cover with a clean non-stick cloth. **Do not apply** butter, toothpaste, oil, ice or egg white. Seek care if the burn is large, on the face, hands or feet, or if it is a child.","## If someone faints","Lay them on their back and raise their legs. Loosen tight clothing and let them breathe. If they do not wake after a minute or are not breathing, call for help at once and keep watching them. Give no food or drink until they are fully awake.","> First aid does not replace a doctor: it buys time until the doctor arrives."],
ru:["## Прежде всего","Убедитесь, что место безопасно для вас и пострадавшего. Если ситуация серьёзная, позовите на помощь или отправьте кого-то в центр здоровья и продолжайте помогать, пока ждёте. Если можно, вымойте руки.","## Если кровотечение","**Сильно прижмите** рану чистой тканью и держите давление, не приподнимая ткань, чтобы посмотреть. По возможности поднимите конечность. Если ткань пропитывается, положите сверху ещё одну. Если кровь не останавливается, быстро идите в центр здоровья.","## Если ожог","**Держите ожог под прохладной проточной водой 20 минут.** Снимите кольца и одежду, которые не прилипли к коже. Накройте чистой нелипкой тканью. **Не наносите** масло, зубную пасту, жир, лёд или яичный белок. Обратитесь за помощью, если ожог большой, на лице, руках или ногах или это ребёнок.","## Если человеку стало дурно","Положите его на спину и приподнимите ноги. Расстегните тесную одежду, дайте дышать. Если он не приходит в себя за минуту или не дышит, немедленно вызывайте помощь и продолжайте наблюдать. Не давайте еду и питьё, пока он полностью не очнётся.","> Первая помощь не заменяет врача: она выигрывает время до его прибытия."]},
q:[{q:L("Kisa pou w fè ak yon boule ?","Que faire pour une brûlure ?","What to do for a burn?","Что делать при ожоге?"),o:[L("Dlo frèt k ap koule pandan 20 minit","Eau fraîche qui coule pendant 20 minutes","Cool running water for 20 minutes","Прохладная проточная вода 20 минут"),L("Mete bè","Mettre du beurre","Put butter on","Намазать маслом"),L("Mete glas dirèk","Mettre de la glace directe","Apply ice directly","Приложить лёд"),L("Mete dantifris","Mettre du dentifrice","Use toothpaste","Нанести зубную пасту")],a:0},
{q:L("Si gen san k ap koule anpil ?","Si un saignement est abondant ?","If bleeding is heavy?","Если сильное кровотечение?"),o:[L("Peze fò ak yon twal pwòp","Appuyer fort avec un tissu propre","Press firmly with a clean cloth","Сильно прижать чистой тканью"),L("Lave l ak alkòl sèlman","Seulement alcool","Just alcohol","Только спирт"),L("Tann","Attendre","Wait","Ждать"),L("Retire twal la chak 10 segonn","Retirer le tissu toutes les 10 s","Lift the cloth every 10 s","Приподнимать ткань каждые 10 с")],a:0},
{q:L("Yon moun malèz, kisa pou w fè ?","Quelqu'un fait un malaise, que faire ?","Someone faints, what to do?","Человеку стало дурно, что делать?"),o:[L("Kouche l, leve janm li","L'allonger, surélever les jambes","Lay them down, raise their legs","Уложить, приподнять ноги"),L("Ba l manje","Lui donner à manger","Give food","Дать еду"),L("Kenbe l kanpe","Le tenir debout","Keep them standing","Держать стоя"),L("Jete dlo sou li an gwo kantite","Lui jeter beaucoup d'eau","Throw lots of water","Облить водой")],a:0}]});

ART.push({id:"gonayiv",s:"istwa",lv:1,min:5,img:"flag",lab:"gon",w:[],
t:L("Gonayiv, 1ye janvye 1804 : nesans yon nasyon","Les Gonaïves, 1er janvier 1804 : la naissance d'une nation","Gonaïves, 1 January 1804: the birth of a nation","Гонаив, 1 января 1804: рождение нации"),
sum:L("Ki jan Ayiti te vin endepandan, ki moun ki te la, ak poukisa dat sa a enpòtan.","Comment Haïti est devenue indépendante, qui était là, et pourquoi cette date compte.","How Haiti became independent, who was there, and why this date matters.","Как Гаити стала независимой, кто был там и почему эта дата важна."),
b:{
ht:["## Yon revolisyon ki te genyen","Soti nan 1791, esklav yo nan Sendomeng te revòlte kont sistèm esklavaj la. Apre plizyè ane lagè kont twoup franse, angle ak espanyòl, nan lidèchip moun tankou **Toussaint Louverture** epi answit **Jean-Jacques Dessalines**, yo te genyen. Dènye gwo batay la se **Vètyè** (18 novanm 1803).","## Gonayiv, 1ye janvye 1804","Nan **Gonayiv**, 1ye janvye 1804, yo te pwoklame **Akt Endepandans lan**, ekri pa sekretè Dessalines, **Boisrond-Tonnerre**. Yo te chwazi non **Ayiti**, yon non ki soti nan lang tayino yo (premye moun ki te rete zile a) e ki vle di \"peyi mòn yo\".","## Poukisa sa enpòtan","Ayiti te vin dezyèm eta endepandan nan Amerik yo, apre Etazini, e premye eta ki fèt apre yon revolisyon esklav ki reyisi. Li te abolisyon esklavaj pou tout tan nan peyi a, epi li te vin yon senbòl pou moun ki te anba esklavaj nan lemonn.","## Yon eritaj konplèks","Endepandans lan te vin ak pri ki te lou : lagè a te kite peyi a devaste, epi plizyè nasyon te refize rekonèt Ayiti pandan lontan. Se yon istwa pou n konprann ak fyète ak sans kritik.","> Gonayiv rele \"vil endepandans lan\" paske se la 1ye janvye 1804 la te pwoklame."],
fr:["## Une révolution victorieuse","À partir de 1791, les esclaves de Saint-Domingue se sont révoltés contre le système esclavagiste. Après des années de guerre contre des troupes françaises, anglaises et espagnoles, sous la direction de figures comme **Toussaint Louverture** puis **Jean-Jacques Dessalines**, ils ont gagné. La dernière grande bataille est celle de **Vertières** (18 novembre 1803).","## Les Gonaïves, 1er janvier 1804","Aux **Gonaïves**, le 1er janvier 1804, l'**Acte d'indépendance** a été proclamé, rédigé par le secrétaire de Dessalines, **Boisrond-Tonnerre**. Le nom **Ayiti** a été choisi ; il vient de la langue des Taïnos (premiers habitants de l'île) et signifie « terre de hautes montagnes ».","## Pourquoi c'est important","Haïti est devenue le deuxième État indépendant des Amériques, après les États-Unis, et le premier né d'une révolution d'esclaves réussie. L'esclavage y a été aboli pour toujours, et le pays est devenu un symbole pour les personnes asservies dans le monde.","## Un héritage complexe","L'indépendance a eu un prix lourd : la guerre a laissé le pays dévasté, et plusieurs nations ont refusé de reconnaître Haïti pendant longtemps. C'est une histoire à comprendre avec fierté et esprit critique.","> Les Gonaïves sont appelées « la cité de l'indépendance » parce que c'est là que le 1er janvier 1804 a été proclamé."],
en:["## A revolution that won","From 1791, the enslaved people of Saint-Domingue rose up against slavery. After years of war against French, British and Spanish troops, under leaders such as **Toussaint Louverture** and then **Jean-Jacques Dessalines**, they won. The last major battle was **Vertières** (18 November 1803).","## Gonaïves, 1 January 1804","In **Gonaïves**, on 1 January 1804, the **Act of Independence** was proclaimed, written by Dessalines's secretary, **Boisrond-Tonnerre**. The name **Ayiti** was chosen; it comes from the Taíno language (the first inhabitants of the island) and means \"land of high mountains\".","## Why it matters","Haiti became the second independent state in the Americas, after the United States, and the first born from a successful slave revolution. Slavery was abolished there for good, and the country became a symbol for enslaved people around the world.","## A complex legacy","Independence came at a heavy price: the war left the country devastated, and several nations refused to recognise Haiti for a long time. It is a story to understand with pride and a critical mind.","> Gonaïves is called \"the city of independence\" because it is where 1 January 1804 was proclaimed."],
ru:["## Победившая революция","С 1791 года рабы Сен-Доменга восстали против рабства. После лет войны с французскими, британскими и испанскими войсками под руководством **Туссена Лувертюра**, а затем **Жан-Жака Дессалина** они победили. Последнее крупное сражение — **Вертьер** (18 ноября 1803).","## Гонаив, 1 января 1804","В **Гонаиве** 1 января 1804 года был провозглашён **Акт о независимости**, который написал секретарь Дессалина **Буаронд-Тоннер**. Выбрали название **Айити**; оно из языка таино (первых жителей острова) и означает «земля высоких гор».","## Почему это важно","Гаити стала вторым независимым государством в Америке после США и первым, возникшим в результате успешной революции рабов. Рабство там было отменено навсегда, а страна стала символом для порабощённых людей по всему миру.","## Сложное наследие","Независимость далась дорогой ценой: война опустошила страну, а многие государства долго отказывались признавать Гаити. Эту историю нужно понимать с гордостью и критическим умом.","> Гонаив называют «городом независимости», потому что именно там провозгласили 1 января 1804 года."]},
q:[{q:L("Kote yo te pwoklame endepandans lan ?","Où l'indépendance a-t-elle été proclamée ?","Where was independence proclaimed?","Где провозгласили независимость?"),o:["Gonayiv / Gonaïves","Okap / Cap-Haïtien","Pòtoprens / Port-au-Prince","Jakmèl / Jacmel"],a:0},

sum:L("Kreyòl la pa chanje vèb la : li ajoute ti mo devan l.","Le créole ne conjugue pas le verbe : il ajoute de petits mots devant.","Creole does not conjugate the verb: it adds small words in front.","Креольский не спрягает глагол: он добавляет маленькие слова перед ним."),
b:{
ht:["## Vèb la rete menm","Nan kreyòl, vèb la pa chanje : **manje** rete **manje**. Pou di kilè aksyon an fèt, ou mete yon ti mo devan l. Sa fè kreyòl la senp pou konjige.","## Senk modèl","**Mwen manje** : mwen manje (abitid) oswa mwen te manje selon kontèks. **Mwen te manje** : mwen te manje deja (pase). **Mwen ap manje** : mwen ap manje kounye a (aksyon k ap pase). **Mwen pral manje** (oswa **mwen va manje**) : mwen pral manje (fiti). **Mwen pa manje** : mwen pa manje (negasyon).","## Negasyon nan pase","Pou di \"mwen pa t manje\", ou konbine : **pa + te → pa t** : *Mwen pa t manje.* Gen anpil lòt konbinezon : *Li pa ap manje* (li pa ap manje kounye a), *Nou pa pral manje* (nou pa pral manje).","## Pwonon yo","**Mwen** (mwen), **ou** (ou), **li** (li, li), **nou** (nou, nou menm), **yo** (yo). Pa gen diferans ant gason ak fi : **li** sèvi pou tou de.","> Eseye ak yon lòt vèb : *li ap travay, mwen te wè l, nou pral ale, yo pa vini.*"],
fr:["## Le verbe ne change pas","En créole, le verbe ne change pas : **manje** reste **manje**. Pour dire quand l'action a lieu, on place un petit mot devant. Cela rend la conjugaison très simple.","## Cinq modèles","**Mwen manje** : je mange (habitude) ou j'ai mangé selon le contexte. **Mwen te manje** : j'avais mangé / j'ai mangé (passé). **Mwen ap manje** : je suis en train de manger (action en cours). **Mwen pral manje** (ou **mwen va manje**) : je vais manger (futur). **Mwen pa manje** : je ne mange pas (négation).","## La négation au passé","Pour dire « je n'ai pas mangé », on combine : **pa + te → pa t** : *Mwen pa t manje.* Il y a d'autres combinaisons : *Li pa ap manje* (il ne mange pas en ce moment), *Nou pa pral manje* (nous n'allons pas manger).","## Les pronoms","**Mwen** (je/moi), **ou** (tu/vous), **li** (il/elle), **nou** (nous/vous), **yo** (ils/elles). Il n'y a pas de différence entre masculin et féminin : **li** sert pour les deux.","> Essayez avec un autre verbe : *li ap travay, mwen te wè l, nou pral ale, yo pa vini.*"],
en:["## The verb does not change","In Creole the verb does not change: **manje** stays **manje**. To say when the action happens, you put a small word in front. This makes conjugation very simple.","## Five patterns","**Mwen manje**: I eat (habit) or I ate, depending on context. **Mwen te manje**: I ate / I had eaten (past). **Mwen ap manje**: I am eating (ongoing). **Mwen pral manje** (or **mwen va manje**): I am going to eat (future). **Mwen pa manje**: I do not eat (negative).","## Negation in the past","To say \"I did not eat\", you combine: **pa + te → pa t**: *Mwen pa t manje.* There are other combinations: *Li pa ap manje* (he is not eating right now), *Nou pa pral manje* (we are not going to eat).","## Pronouns","**Mwen** (I/me), **ou** (you), **li** (he/she/it), **nou** (we/you plural), **yo** (they). There is no masculine/feminine difference: **li** works for both.","> Try another verb: *li ap travay, mwen te wè l, nou pral ale, yo pa vini.*"],
ru:["## Глагол не изменяется","В креольском глагол не изменяется: **manje** остаётся **manje**. Чтобы показать время действия, перед глаголом ставят маленькое слово. Поэтому «спряжение» очень простое.","## Пять моделей","**Mwen manje**: я ем (привычка) или я ел, по контексту. **Mwen te manje**: я поел / я ел (прошедшее). **Mwen ap manje**: я ем сейчас (действие идёт). **Mwen pral manje** (или **mwen va manje**): я собираюсь поесть (будущее). **Mwen pa manje**: я не ем (отрицание).","## Отрицание в прошедшем","Чтобы сказать «я не ел», соединяют: **pa + te → pa t**: *Mwen pa t manje.* Есть и другие сочетания: *Li pa ap manje* (он сейчас не ест), *Nou pa pral manje* (мы не собираемся есть).","## Местоимения","**Mwen** (я), **ou** (ты/вы), **li** (он/она/оно), **nou** (мы/вы мн.), **yo** (они). Различия между мужским и женским нет: **li** подходит для обоих.","> Попробуйте с другим глаголом: *li ap travay, mwen te wè l, nou pral ale, yo pa vini.*"]},
q:[{q:L("Kijan pou w di \"mwen ap manje kounye a\" ?","Comment dire « je suis en train de manger » ?","How do you say \"I am eating right now\"?","Как сказать «я сейчас ем»?"),o:["Mwen ap manje","Mwen te manje","Mwen pral manje","Mwen pa manje"],a:0},
{q:L("Ki sa \"Mwen pa t manje\" vle di ?","Que veut dire « Mwen pa t manje » ?","What does \"Mwen pa t manje\" mean?","Что значит «Mwen pa t manje»?"),o:[L("Mwen pa t manje","Je n'ai pas mangé","I did not eat","Я не ел"),L("Mwen pral manje","Je vais manger","I will eat","Я поем"),L("Mwen ap manje","Je mange","I am eating","Я ем"),L("Mwen manje anpil","Je mange beaucoup","I eat a lot","Я много ем")],a:0},

t:L("Estrès : sa k ap pase nan kò w ak ki jan pou w jere l","Le stress : ce qui se passe dans le corps et comment le gérer","Stress: what happens in the body and how to manage it","Стресс: что происходит в теле и как с ним справляться"),
sum:L("Estrès nòmal kont estrès ki dire, senp teknik, ak ki lè pou w mande èd.","Stress normal ou prolongé, techniques simples, et quand demander de l'aide.","Normal and long-lasting stress, simple techniques, and when to ask for help.","Нормальный и затяжной стресс, простые приёмы и когда просить помощи."),
b:{
ht:["## Yon repons nòmal","**Estrès** se repons kò a ak yon sitiyasyon ki mande anpil nan nou. Kè a bat pi vit, respirasyon an akselere, misk yo vin tansyone : kò a prepare l pou aji. Yon ti estrès ka ede w, pa egzanp anvan yon egzamen. Pwoblèm lan se lè estrès la dire twò lontan.","## Siy ki dire","Pwoblèm pou dòmi, tèt fè mal, doulè nan vant, irite fasil, difikilte pou konsantre, oswa santi w akable pandan plizyè semèn.","## Sa ki ede","**Respire dousman** : rale lè pandan 4 segonn, soufle pandan 6 segonn, repete plizyè fwa. **Bouje** : mache oswa fè egzèsis chak jou. **Dòmi** regilyèman. **Pale** ak yon moun ou fè konfyans. **Divize** yon gwo travay an ti etap. Limite alkòl ak kafe anpil.","## Ki lè pou mande èd","Si estrès la dire plis pase de semèn, si li anpeche w travay, etidye oswa viv nòmalman, oswa si w santi w dezespere, ale wè yon pwofesyonèl sante oswa yon sikològ. **Si w gen lide fè tèt ou mal, di yon moun touswit oswa ale nan yon sant sante ou lopital : ou pa pou kont ou.**","> Mande èd se yon siy fòs, pa yon feblès."],
fr:["## Une réaction normale","Le **stress** est la réaction du corps face à une situation exigeante. Le cœur bat plus vite, la respiration s'accélère, les muscles se tendent : le corps se prépare à agir. Un peu de stress peut aider, par exemple avant un examen. Le problème apparaît quand le stress dure trop longtemps.","## Les signes qui durent","Troubles du sommeil, maux de tête, douleurs au ventre, irritabilité, difficulté à se concentrer, ou sentiment d'être dépassé pendant plusieurs semaines.","## Ce qui aide","**Respirer lentement** : inspirer 4 secondes, expirer 6 secondes, répéter plusieurs fois. **Bouger** : marcher ou faire de l'exercice chaque jour. **Dormir** régulièrement. **Parler** à une personne de confiance. **Découper** une grosse tâche en petites étapes. Limiter l'alcool et le café.","## Quand demander de l'aide","Si le stress dure plus de deux semaines, s'il empêche de travailler, d'étudier ou de vivre normalement, ou si vous vous sentez désespéré, consultez un professionnel de santé ou un psychologue. **Si vous avez des idées de vous faire du mal, dites-le à quelqu'un tout de suite ou allez dans un centre de santé ou un hôpital : vous n'êtes pas seul.**","> Demander de l'aide est un signe de force, pas de faiblesse."],
en:["## A normal reaction","**Stress** is the body's reaction to a demanding situation. The heart beats faster, breathing speeds up, muscles tense: the body prepares to act. A little stress can help, for example before an exam. The problem appears when stress lasts too long.","## Signs that last","Sleep problems, headaches, stomach pain, irritability, trouble concentrating, or feeling overwhelmed for several weeks.","## What helps","**Breathe slowly**: breathe in for 4 seconds, out for 6, repeat several times. **Move**: walk or exercise every day. **Sleep** regularly. **Talk** to someone you trust. **Break** a big task into small steps. Limit alcohol and coffee.","## When to ask for help","If stress lasts more than two weeks, stops you working, studying or living normally, or you feel hopeless, see a health professional or a psychologist. **If you have thoughts of harming yourself, tell someone right away or go to a health centre or hospital: you are not alone.**","> Asking for help is a sign of strength, not weakness."],
ru:["## Нормальная реакция","**Стресс** — реакция организма на трудную ситуацию. Сердце бьётся быстрее, дыхание учащается, мышцы напрягаются: тело готовится действовать. Небольшой стресс может помочь, например перед экзаменом. Проблема возникает, когда стресс затягивается.","## Признаки затянувшегося стресса","Проблемы со сном, головная боль, боль в животе, раздражительность, трудности с концентрацией или ощущение, что всё слишком тяжело, в течение нескольких недель.","## Что помогает","**Медленное дыхание**: вдох 4 секунды, выдох 6, повторить несколько раз. **Движение**: ходьба или упражнения каждый день. **Регулярный сон.** **Разговор** с человеком, которому доверяете. **Разбивайте** большую задачу на маленькие шаги. Ограничьте алкоголь и кофе.","## Когда просить помощи","Если стресс длится больше двух недель, мешает работать, учиться или жить нормально либо вы чувствуете безысходность, обратитесь к медработнику или психологу. **Если у вас есть мысли причинить себе вред, сразу скажите кому-нибудь или идите в центр здоровья или больницу: вы не одни.**","> Просить о помощи — признак силы, а не слабости."]},
q:[{q:L("Ki sa ki ka ede lè w estrese ?","Qu'est-ce qui peut aider quand on est stressé ?","What can help when you are stressed?","Что может помочь при стрессе?"),o:[L("Respire dousman ak bouje","Respirer lentement et bouger","Slow breathing and moving","Медленное дыхание и движение"),L("Pa dòmi","Ne pas dormir","Not sleeping","Не спать"),L("Bwè alkòl anpil","Boire beaucoup d'alcool","Drinking lots of alcohol","Много алкоголя"),L("Izole w","S'isoler","Isolating yourself","Изолироваться")],a:0},
{q:L("Ki lè pou w mande èd ?","Quand demander de l'aide ?","When should you ask for help?","Когда просить помощи?"),o:[L("Si estrès la dire plis pase de semèn oswa anpeche w viv nòmalman","Si le stress dure plus de 2 semaines ou empêche de vivre normalement","If stress lasts over 2 weeks or stops normal life","Если стресс длится более 2 недель или мешает жить"),L("Pa janm","Jamais","Never","Никогда"),L("Sèlman si w pa dòmi yon jou","Seulement après une nuit blanche","Only after one bad night","Только после одной бессонной ночи"),L("Sèlman si w malad","Seulement si malade","Only if ill","Только если болеете")],a:0},
{q:L("Èske yon ti estrès ka itil ?","Un peu de stress peut-il être utile ?","Can a little stress be useful?","Может ли небольшой стресс быть полезным?"),o:[L("Wi, pa egzanp anvan yon egzamen","Oui, par exemple avant un examen","Yes, for example before an exam","Да, например перед экзаменом"),L("Non, jamais","Non, jamais","No, never","Нет, никогда"),L("Sèlman nan timoun","Seulement chez les enfants","Only in children","Только у детей"),L("Se toujou yon maladi","C'est toujours une maladie","It is always a disease","Это всегда болезнь")],a:0}]});

ART.push({id:"tansyon",s:"med",lv:2,min:5,img:"heart",lab:"ten",w:[],
t:L("Tansyon wo : yon danje silansye ki ka evite","L'hypertension : un danger silencieux qu'on peut éviter","High blood pressure: a silent danger you can prevent","Высокое давление: тихая опасность, которую можно предотвратить"),
sum:L("Ki sa li ye, poukisa li danjere, ak senp bagay pou w fè chak jou.","Ce que c'est, pourquoi c'est dangereux, et les gestes simples du quotidien.","What it is, why it is dangerous, and simple everyday actions.","Что это, почему опасно и простые ежедневные действия."),
b:{
ht:["## Ki sa tansyon an ye","**Tansyon** se fòs san an peze sou miray atè yo. Yo ekri l ak de nimewo, tankou **120/80** (mmHg) : premye a pou lè kè a kontrakte, dezyèm lan pou lè li repoze. Yon tansyon ki toujou wo (anjeneral **140/90 oswa plis**, mezire plizyè fwa) rele **tansyon wo** oswa **ipètansyon**.","## Poukisa li danjere","Souvan li pa bay okenn sentòm, se poutèt sa yo rele l \"asasen silansye\". Pandan plizyè ane, li ka domaje kè a, sèvo a (**AVC**), ren yo ak je yo.","## Ki jan pou mezire l","Chita, repoze 5 minit, pye atè, bra a nan wotè kè a, epi pa pale. Mezire plizyè fwa pou gen yon vre ide. Yon pwofesyonèl sante ka di w ki chif ki bon pou ou.","## Sa ki ede","**Diminye sèl** (mwens pase anviwon 5 g pa jou, sa vle di yon ti kiyè), manje plis fwi, legim ak pwa, bouje omwen 150 minit pa semèn, evite sigarèt ak twòp alkòl, kenbe yon pwa ki an sante. Si doktè a preskri medikaman, **pa kanpe yo poukont ou** menm si w santi w byen.","> Yon tansyon ki wo ka pa fè mal : fè mezire l regilyèman, sitou apre 40 an oswa si gen ipètansyon nan fanmi an."],
fr:["## Ce qu'est la tension","La **tension artérielle** est la force avec laquelle le sang appuie sur la paroi des artères. On l'écrit avec deux chiffres, comme **120/80** (mmHg) : le premier quand le cœur se contracte, le second quand il se repose. Une tension qui reste élevée (en général **140/90 ou plus**, mesurée plusieurs fois) est appelée **hypertension**.","## Pourquoi c'est dangereux","Souvent, elle ne donne aucun symptôme, c'est pourquoi on l'appelle « tueur silencieux ». Pendant des années, elle peut abîmer le cœur, le cerveau (**AVC**), les reins et les yeux.","## Comment la mesurer","Assis, au repos 5 minutes, les pieds au sol, le bras à hauteur du cœur, sans parler. Mesurez plusieurs fois pour avoir une vraie idée. Un professionnel de santé peut vous dire quel chiffre est bon pour vous.","## Ce qui aide","**Réduire le sel** (moins d'environ 5 g par jour, soit une cuillère à café), manger plus de fruits, de légumes et de légumineuses, bouger au moins 150 minutes par semaine, éviter le tabac et l'excès d'alcool, garder un poids sain. Si le médecin prescrit des médicaments, **ne les arrêtez pas seul** même si vous vous sentez bien.","> Une tension élevée peut ne faire aucun mal : faites-la mesurer régulièrement, surtout après 40 ans ou s'il y a de l'hypertension dans la famille."],
en:["## What blood pressure is","**Blood pressure** is the force of blood pushing on the walls of your arteries. It is written with two numbers, like **120/80** (mmHg): the first when the heart contracts, the second when it rests. A pressure that stays high (usually **140/90 or more**, measured several times) is called **hypertension**.","## Why it is dangerous","It often causes no symptoms, which is why it is called the \"silent killer\". Over years it can damage the heart, the brain (**stroke**), the kidneys and the eyes.","## How to measure it","Sit, rest for 5 minutes, feet on the floor, arm at heart level, no talking. Measure several times to get a true picture. A health professional can tell you which numbers are right for you.","## What helps","**Cut salt** (less than about 5 g a day, a teaspoon), eat more fruit, vegetables and pulses, move at least 150 minutes a week, avoid tobacco and too much alcohol, keep a healthy weight. If the doctor prescribes medicines, **do not stop them on your own** even if you feel fine.","> High blood pressure may not hurt: have it checked regularly, especially after 40 or if it runs in the family."],
ru:["## Что такое давление","**Артериальное давление** — сила, с которой кровь давит на стенки артерий. Его записывают двумя числами, например **120/80** (мм рт. ст.): первое — когда сердце сокращается, второе — когда расслабляется. Давление, которое стабильно повышено (обычно **140/90 и выше**, при нескольких измерениях), называют **гипертонией**.","## Чем она опасна","Часто она не вызывает симптомов, поэтому её называют «тихим убийцей». За годы она может повредить сердце, мозг (**инсульт**), почки и глаза.","## Как измерять","Сядьте, отдохните 5 минут, ноги на полу, рука на уровне сердца, не разговаривайте. Измеряйте несколько раз, чтобы получить верную картину. Медработник скажет, какие значения нормальны для вас.","## Что помогает","**Меньше соли** (менее примерно 5 г в день, чайная ложка), больше фруктов, овощей и бобовых, движение не менее 150 минут в неделю, отказ от табака и избытка алкоголя, здоровый вес. Если врач назначил лекарства, **не прекращайте их сами**, даже если чувствуете себя хорошо.","> Высокое давление может не болеть: измеряйте регулярно, особенно после 40 лет или если гипертония есть в семье."]},
q:[{q:L("Ki valè tansyon yo konsidere kòm wo anjeneral ?","À partir de quelle valeur parle-t-on en général d'hypertension ?","At what level is blood pressure usually called high?","С каких значений давление обычно считают высоким?"),o:["140/90","100/60","90/50","120/80"],a:0},
{q:L("Poukisa yo rele l \"asasen silansye\" ?","Pourquoi l'appelle-t-on « tueur silencieux » ?","Why is it called the \"silent killer\"?","Почему её называют «тихим убийцей»?"),o:[L("Li souvan pa gen sentòm","Elle n'a souvent pas de symptômes","It often has no symptoms","Часто нет симптомов"),L("Li gen anpil sentòm","Elle a beaucoup de symptômes","It has many symptoms","Много симптомов"),L("Li pa danjere","Elle n'est pas dangereuse","It is not dangerous","Она не опасна"),L("Li pa egziste","Elle n'existe pas","It does not exist","Её не существует")],a:0},
