t:L("Lòb sèvo yo ak ka Phineas Gage","Les lobes cérébraux et le cas Phineas Gage","The brain's lobes and the case of Phineas Gage","Доли мозга и случай Финеаса Гейджа"),
sum:L("Ki fonksyon chak zòn nan kòtèks la genyen, epi ki sa ka domaj yo montre nou.","Quelle fonction a chaque région du cortex et ce que nous apprennent les lésions.","What each region of the cortex does and what injuries teach us.","Какие функции у областей коры и чему нас учат повреждения."),
b:{
ht:["## Kat lòb ak yon ti sèvo","Kòtèks la gen kat lòb nan chak emisfè : **frontal** (planifikasyon, desizyon, kontwòl konpòtman, mouvman volontè), **parietal** (sans touche, espas, atansyon), **tanporal** (tande, lang, memwa) ak **okspital** (vizyon). **Ti sèvo a** (serebèl) kowòdone mouvman ak ekilib.","## Zòn lang yo","Nan emisfè gòch la pou pifò moun, **zòn Broca** (lòb frontal) enplike nan pwodiksyon lang, epi **zòn Wernicke** (lòb tanporal) nan konpreyansyon li. Domaj yo bay afazi diferan.","## Ka Phineas Gage (1848)","Yon baton fè te travèse devan sèvo a Phineas Gage nan yon aksidan. Li te siviv, men antouraj li te rapòte chanjman nan pèsonalite. Ka sa a te montre ke lòb frontal la jwe yon wòl nan kontwòl konpòtman, men detay istwa a anpil fwa egzaje.","## Ka H.M. (1953)","Henry Molaison te pèdi pati nan lòb tanporal li, ak ipokanp la, pou trete epilepsi. Apre sa li pat ka fòme nouvo souvni (**amnezi antewogad**), men li te kapab aprann nouvo abilite motè. Sa te montre ke gen plizyè sistèm memwa.","> Chak zòn travay ak lòt yo : pa gen yon fonksyon ki sèlman nan yon sèl kote.","## Eseye pa ou","Klike sou chak zòn nan laboratwa a pou li fonksyon li."],
fr:["## Quatre lobes et un petit cerveau","Le cortex compte quatre lobes dans chaque hémisphère : **frontal** (planification, décision, contrôle du comportement, mouvement volontaire), **pariétal** (toucher, espace, attention), **temporal** (audition, langage, mémoire) et **occipital** (vision). Le **cervelet** coordonne mouvement et équilibre.","## Les aires du langage","Dans l'hémisphère gauche chez la plupart des gens, l'**aire de Broca** (lobe frontal) intervient dans la production du langage et l'**aire de Wernicke** (lobe temporal) dans sa compréhension. Leurs lésions donnent des aphasies différentes.","## Le cas Phineas Gage (1848)","Une barre de fer a traversé l'avant du cerveau de Phineas Gage lors d'un accident. Il a survécu, mais son entourage a rapporté des changements de personnalité. Ce cas a montré le rôle du lobe frontal dans le contrôle du comportement, mais les détails de l'histoire sont souvent exagérés.","## Le cas H.M. (1953)","Henry Molaison a perdu une partie de ses lobes temporaux, dont l'hippocampe, pour traiter son épilepsie. Il ne pouvait plus former de nouveaux souvenirs (**amnésie antérograde**), mais pouvait apprendre de nouvelles habiletés motrices. Cela a montré qu'il existe plusieurs systèmes de mémoire.","> Chaque région travaille avec les autres : aucune fonction n'est localisée à un seul endroit.","## À toi de jouer","Clique sur chaque région dans le laboratoire pour lire sa fonction."],
en:["## Four lobes and a little brain","The cortex has four lobes in each hemisphere: **frontal** (planning, decisions, behaviour control, voluntary movement), **parietal** (touch, space, attention), **temporal** (hearing, language, memory) and **occipital** (vision). The **cerebellum** coordinates movement and balance.","## Language areas","In the left hemisphere for most people, **Broca's area** (frontal lobe) is involved in producing language and **Wernicke's area** (temporal lobe) in understanding it. Damage to them causes different aphasias.","## The case of Phineas Gage (1848)","An iron rod passed through the front of Phineas Gage's brain in an accident. He survived, but people around him reported personality changes. The case showed the frontal lobe's role in behaviour control, though details of the story are often exaggerated.","## The case of H.M. (1953)","Henry Molaison had parts of his temporal lobes, including the hippocampus, removed to treat epilepsy. Afterwards he could not form new memories (**anterograde amnesia**), yet he could learn new motor skills. This showed there are several memory systems.","> Regions work together: no function lives in one place only.","## Try it","Click each region in the lab to read its function."],
ru:["## Четыре доли и «малый мозг»","В коре каждого полушария четыре доли: **лобная** (планирование, решения, контроль поведения, произвольные движения), **теменная** (осязание, пространство, внимание), **височная** (слух, речь, память) и **затылочная** (зрение). **Мозжечок** координирует движения и равновесие.","## Речевые зоны","В левом полушарии у большинства людей **зона Брока** (лобная доля) участвует в порождении речи, а **зона Вернике** (височная доля) — в её понимании. Их повреждения вызывают разные афазии.","## Случай Финеаса Гейджа (1848)","Железный прут пробил переднюю часть мозга Финеаса Гейджа в несчастном случае. Он выжил, но окружающие сообщали об изменениях личности. Случай показал роль лобной доли в контроле поведения, хотя подробности часто преувеличивают.","## Случай Г. М. (1953)","Генри Молезону удалили части височных долей, включая гиппокамп, для лечения эпилепсии. После этого он не мог формировать новые воспоминания (**антероградная амнезия**), но мог осваивать новые двигательные навыки. Это показало, что существует несколько систем памяти.","> Области работают вместе: ни одна функция не находится только в одном месте.","## Попробуй сам","Нажимай на области в лаборатории, чтобы прочитать их функцию."]},

{q:L("Ki pati kowòdone ekilib ?","Quelle partie coordonne l'équilibre ?","Which part coordinates balance?","Какая часть координирует равновесие?"),o:[L("Serebèl","Cervelet","Cerebellum","Мозжечок"),L("Lòb frontal","Lobe frontal","Frontal lobe","Лобная доля"),L("Zòn Broca","Aire de Broca","Broca's area","Зона Брока"),L("Ipokanp","Hippocampe","Hippocampus","Гиппокамп")],a:0}]});

t:L("DSM ak ICD : ki jan yo klase twoub mantal yo","DSM et CIM : comment on classe les troubles mentaux","DSM and ICD: how mental disorders are classified","DSM и МКБ: как классифицируют психические расстройства"),
sum:L("De manyèl referans, ki sa yo ye, ki sa yo pa ye, ak poukisa estigma a fè mal.","Deux manuels de référence : ce qu'ils sont, ce qu'ils ne sont pas, et pourquoi la stigmatisation fait mal.","Two reference manuals: what they are, what they are not, and why stigma hurts.","Два справочных руководства: что это, чем они не являются и почему стигма вредит."),
b:{
ht:["## De liv referans","**DSM** (Manyèl dyagnostik ak estatistik twoub mantal) se liv Asosyasyon Sikyatrik Ameriken an pibliye ; vèsyon aktyèl la se **DSM-5-TR** (2022). **ICD** (Klasifikasyon entènasyonal maladi yo) se pa Òganizasyon Mondyal Sante a ; vèsyon aktyèl la se **ICD-11**. Yo bay non komen ak kritè pou pwofesyonèl yo konprann youn lòt.","## Ki jan yon dyagnostik fèt","Yon **dyagnostik** fèt pa yon pwofesyonèl fòme (sikyat, sikològ klinik…) apre yon antretyen ak, si sa nesesè, tès. Li gade sentòm yo, konbyen tan yo dire, konbyen yo difikilize lavi moun nan, epi li elimine lòt eksplikasyon (medikal, sibstans…). Yon lis sentòm sou entènèt pa ase.","## Gwo fanmi twoub yo","Pami fanmi prensipal yo : twoub **nèwodevlopman** (tankou TDAH, otis), **depresyon**, **enkyetid**, **twoub ki gen rapò ak trawma**, **twoub psikotik**, **twoub alimantè**, **twoub rapò ak sibstans**. Yo trè komen : anpil moun ap viv ak youn.","## Lilit ak estigma","Yon dyagnostik se yon zouti pou jwenn èd, pa yon etikèt pou jije yon moun. Twoub mantal pa yon fòlt, ni yon feblès. Anpil trètman efikas egziste. Si ou oswa yon moun ou konnen ap soufri, pale ak yon pwofesyonèl sante oswa yon moun ou fè konfyans.","> Si gen danje imedya pou ou oswa yon moun, rele sèvis ijans lokal la oswa ale nan pi pwòch sant sante.","## Eseye pa ou","Nan laboratwa a, eksplore chak fanmi twoub epi li yon deskripsyon senp."],
fr:["## Deux livres de référence","Le **DSM** (Manuel diagnostique et statistique des troubles mentaux) est publié par l'Association américaine de psychiatrie ; la version actuelle est le **DSM-5-TR** (2022). La **CIM** (Classification internationale des maladies) est celle de l'Organisation mondiale de la santé ; la version actuelle est la **CIM-11**. Ils donnent des noms et critères communs pour que les professionnels se comprennent.","## Comment se fait un diagnostic","Un **diagnostic** est posé par un professionnel formé (psychiatre, psychologue clinicien…) après un entretien et, si nécessaire, des tests. Il examine les symptômes, leur durée, leur impact sur la vie de la personne, et écarte d'autres explications (médicales, substances…). Une liste de symptômes trouvée sur internet ne suffit pas.","## Les grandes familles","Parmi les principales familles : troubles **neurodéveloppementaux** (comme le TDAH, l'autisme), **dépressifs**, **anxieux**, **liés aux traumatismes**, **psychotiques**, **des conduites alimentaires**, **liés aux substances**. Ils sont très fréquents : beaucoup de personnes vivent avec l'un d'eux.","## Respect et stigmatisation","Un diagnostic est un outil pour trouver de l'aide, pas une étiquette pour juger quelqu'un. Un trouble mental n'est ni une faute ni une faiblesse. Beaucoup de traitements efficaces existent. Si vous ou un proche souffrez, parlez à un professionnel de santé ou à une personne de confiance.","> En cas de danger immédiat pour vous ou pour quelqu'un, appelez les secours locaux ou rendez-vous au centre de santé le plus proche.","## À toi de jouer","Dans le laboratoire, explore chaque famille de troubles et lis une description simple."],
en:["## Two reference books","The **DSM** (Diagnostic and Statistical Manual of Mental Disorders) is published by the American Psychiatric Association; the current version is **DSM-5-TR** (2022). The **ICD** (International Classification of Diseases) is the World Health Organization's; the current version is **ICD-11**. They give shared names and criteria so professionals understand each other.","## How a diagnosis is made","A **diagnosis** is made by a trained professional (psychiatrist, clinical psychologist…) after an interview and, if needed, tests. They look at symptoms, how long they last, how much they affect the person's life, and rule out other explanations (medical, substances…). A symptom list found online is not enough.","## The main families","Main families include **neurodevelopmental** disorders (such as ADHD, autism), **depressive**, **anxiety**, **trauma-related**, **psychotic**, **eating** and **substance-related** disorders. They are very common: many people live with one.","## Respect and stigma","A diagnosis is a tool for finding help, not a label to judge someone. A mental disorder is not a fault or a weakness. Many effective treatments exist. If you or someone close is suffering, talk to a health professional or someone you trust.","> If there is immediate danger to you or someone else, call local emergency services or go to the nearest health centre.","## Try it","In the lab, explore each family of disorders and read a simple description."],
ru:["## Два справочника","**DSM** (Диагностическое и статистическое руководство по психическим расстройствам) издаётся Американской психиатрической ассоциацией; текущая версия — **DSM-5-TR** (2022). **МКБ** (Международная классификация болезней) принадлежит Всемирной организации здравоохранения; текущая версия — **МКБ-11**. Они дают общие названия и критерии, чтобы специалисты понимали друг друга.","## Как ставят диагноз","**Диагноз** ставит подготовленный специалист (психиатр, клинический психолог…) после беседы и, при необходимости, тестов. Он оценивает симптомы, их длительность, влияние на жизнь человека и исключает другие объяснения (медицинские, вещества…). Список симптомов из интернета недостаточен.","## Основные группы","Среди основных групп: **нейроразвитие** (например, СДВГ, аутизм), **депрессивные**, **тревожные**, **связанные с травмой**, **психотические**, **расстройства пищевого поведения**, **связанные с веществами**. Они очень распространены: многие люди живут с одним из них.","## Уважение и стигма","Диагноз — инструмент для поиска помощи, а не ярлык для осуждения. Психическое расстройство — не вина и не слабость. Существует много эффективных методов лечения. Если вам или близкому плохо, поговорите со специалистом в области здравоохранения или с человеком, которому доверяете.","> При непосредственной опасности для вас или другого человека звоните в местные экстренные службы или обратитесь в ближайший медицинский центр.","## Попробуй сам","В лаборатории изучай каждую группу расстройств и читай простое описание."]},
q:[{q:L("Ki moun ki ka bay yon dyagnostik ?","Qui peut poser un diagnostic ?","Who can make a diagnosis?","Кто может поставить диагноз?"),o:[L("Yon pwofesyonèl fòme","Un professionnel formé","A trained professional","Подготовленный специалист"),L("Nenpòt ki moun sou entènèt","N'importe qui sur internet","Anyone on the internet","Любой человек в интернете"),L("Yon zanmi","Un ami","A friend","Друг"),L("Yon robo","Un robot seul","A robot alone","Один только робот")],a:0},

{q:L("Ki òganizasyon ki pibliye ICD ?","Quelle organisation publie la CIM (ICD) ?","Which organisation publishes the ICD?","Какая организация издаёт МКБ (ICD)?"),o:[L("Òganizasyon Mondyal Sante","Organisation mondiale de la santé","World Health Organization","Всемирная организация здравоохранения"),L("FIFA","FIFA","FIFA","ФИФА"),L("NASA","NASA","NASA","НАСА"),L("UNESCO","UNESCO","UNESCO","ЮНЕСКО")],a:0},
{q:L("Ki jan nou dwe konsidere yon twoub mantal ?","Comment faut-il considérer un trouble mental ?","How should we regard a mental disorder?","Как следует относиться к психическому расстройству?"),o:[L("Se yon pwoblèm sante ki ka jwenn èd","Un problème de santé pour lequel on peut trouver de l'aide","A health issue for which help exists","Проблема со здоровьем, при которой можно получить помощь"),L("Se yon fòlt","Une faute","A fault","Вина"),L("Se yon feblès","Une faiblesse","A weakness","Слабость"),L("Se yon bagay pou wont","Une honte","Something shameful","Нечто постыдное")],a:0}]});

t:L("Ki jan lwa yo klase : piramid dwa a","La hiérarchie des normes : la pyramide du droit","The hierarchy of laws: the pyramid of law","Иерархия норм: пирамида права"),
sum:L("Konstitisyon, trete, lwa, dekrè : ki sa ki pi fò, epi pou ki sa.","Constitution, traités, lois, décrets : qui l'emporte sur qui, et pourquoi.","Constitution, treaties, laws, decrees: which prevails over which, and why.","Конституция, договоры, законы, указы: что главнее и почему."),
b:{
ht:["## Pa tout règ gen menm pouvwa","Yon peyi gen anpil règ : konstitisyon, lwa, dekrè, règleman lokal, kontra. Yo pa gen menm fòs. Yon règ ki pi ba pa ka kontredi yon règ ki pi wo : se sa ki rele **ierachi nòm yo**.","## Piramid la (jeneral)","Anjeneral, nan tèt la gen **konstitisyon an** ; apre sa **trete entènasyonal** yo (selon sistèm nan) ; **lwa** Palman an vote ; **dekrè ak arete** ekzekitif la pran ; epi **règleman lokal** ak **kontra** yo. Detay yo chanje selon peyi.","## Gwo branch dwa a","**Dwa sivil** (kontra, fanmi, pwopriyete), **dwa penal** (enfraksyon ak pinisyon), **dwa travay** (anplwayè ak anplwaye), **dwa konstitisyonèl** (òganizasyon pouvwa yo), **dwa entènasyonal**.","## Prensip debaz","Pèsonn pa dwe jije san yon pwosè jis ; yon moun inosan jiskaske yo pwouve lòt jan (**prezonpsyon inosans**) ; lwa a pa ka retwoaji pou pini yon aksyon ki te pèmèt lè li te fèt.","> Se enfòmasyon jeneral pou edike ; li pa se yon konsèy jiridik. Pou yon ka reyèl, konsilte yon avoka.","## Eseye pa ou","Klike sou chak etaj nan piramid la nan laboratwa a."],
fr:["## Toutes les règles n'ont pas le même poids","Un pays a beaucoup de règles : constitution, lois, décrets, règlements locaux, contrats. Elles n'ont pas la même force. Une règle inférieure ne peut pas contredire une règle supérieure : c'est la **hiérarchie des normes**.","## La pyramide (en général)","En général, au sommet on trouve la **constitution** ; puis les **traités internationaux** (selon le système) ; les **lois** votées par le Parlement ; les **décrets et arrêtés** pris par l'exécutif ; enfin les **règlements locaux** et les **contrats**. Les détails varient selon les pays.","## Les grandes branches du droit","**Droit civil** (contrats, famille, propriété), **droit pénal** (infractions et sanctions), **droit du travail** (employeurs et salariés), **droit constitutionnel** (organisation des pouvoirs), **droit international**.","## Principes de base","Nul ne doit être jugé sans procès équitable ; toute personne est présumée innocente jusqu'à preuve du contraire (**présomption d'innocence**) ; la loi pénale ne peut pas rétroagir pour punir un acte qui était permis au moment des faits.","> Information générale à but éducatif ; ce n'est pas un conseil juridique. Pour un cas réel, consultez un avocat.","## À toi de jouer","Clique sur chaque étage de la pyramide dans le laboratoire."],
en:["## Not all rules weigh the same","A country has many rules: constitution, laws, decrees, local regulations, contracts. They do not have equal force. A lower rule cannot contradict a higher one: this is the **hierarchy of norms**.","## The pyramid (in general)","In general the **constitution** sits at the top; then **international treaties** (depending on the system); **laws** passed by the legislature; **decrees and orders** issued by the executive; then **local regulations** and **contracts**. Details vary by country.","## The main branches of law","**Civil law** (contracts, family, property), **criminal law** (offences and punishment), **labour law** (employers and employees), **constitutional law** (organisation of powers), **international law**.","## Basic principles","No one should be judged without a fair trial; everyone is presumed innocent until proven otherwise (**presumption of innocence**); criminal law cannot be retroactive to punish an act that was allowed when it happened.","> General educational information; not legal advice. For a real case, consult a lawyer.","## Try it","Click each level of the pyramid in the lab."],
ru:["## Не все правила равны по силе","В стране много правил: конституция, законы, указы, местные акты, договоры. Их сила разная. Нижестоящее правило не может противоречить вышестоящему: это **иерархия норм**.","## Пирамида (в общем виде)","Обычно на вершине **конституция**; затем **международные договоры** (в зависимости от системы); **законы**, принятые парламентом; **указы и постановления** исполнительной власти; наконец **местные акты** и **договоры**. Детали различаются по странам.","## Основные отрасли права","**Гражданское право** (договоры, семья, собственность), **уголовное право** (преступления и наказания), **трудовое право** (работодатели и работники), **конституционное право** (организация власти), **международное право**.","## Базовые принципы","Никого нельзя судить без справедливого суда; каждый считается невиновным, пока не доказано иное (**презумпция невиновности**); уголовный закон не имеет обратной силы для наказания за деяние, которое было разрешено на момент совершения.","> Общая образовательная информация, не юридическая консультация. По реальному делу обратитесь к юристу.","## Попробуй сам","Нажимай на каждый уровень пирамиды в лаборатории."]},
q:[{q:L("Ki règ ki nan tèt piramid la anjeneral ?","Quelle règle est au sommet de la pyramide en général ?","Which rule is usually at the top of the pyramid?","Какое правило обычно на вершине пирамиды?"),o:[L("Konstitisyon an","La constitution","The constitution","Конституция"),L("Yon kontra","Un contrat","A contract","Договор"),L("Yon règleman lokal","Un règlement local","A local regulation","Местный акт"),L("Yon dekrè","Un décret","A decree","Указ")],a:0},
{q:L("Ki sa prezonpsyon inosans vle di ?","Que signifie la présomption d'innocence ?","What does the presumption of innocence mean?","Что означает презумпция невиновности?"),o:[L("Inosan jiskaske yo pwouve lòt jan","Innocent jusqu'à preuve du contraire","Innocent until proven otherwise","Невиновен, пока не доказано иное"),L("Kupab jiskaske li pwouve inosans li","Coupable jusqu'à preuve de son innocence","Guilty until proven innocent","Виновен, пока не докажет обратное"),L("Pa gen pwosè","Pas de procès","No trial","Суда нет"),L("Jij la deside san prèv","Le juge décide sans preuve","The judge decides without proof","Судья решает без доказательств")],a:0},

ART.push({id:"emosyon",s:"psy",lv:1,min:4,img:"mind",lab:"emo",w:["emotion"],
t:L("Emosyon yo : sis emosyon debaz ak sa yo sèvi","Les émotions : six émotions de base et à quoi elles servent","Emotions: six basic emotions and what they are for","Эмоции: шесть базовых эмоций и зачем они нужны"),
sum:L("Pè, kòlè, tristès… chak emosyon gen yon wòl.","Peur, colère, tristesse… chaque émotion a un rôle.","Fear, anger, sadness… every emotion has a role.","Страх, гнев, грусть… у каждой эмоции своя роль."),
b:{
ht:["## Emosyon se pa yon feblès","Yon **emosyon** se yon repons kò ak lespri bay yon bagay ki enpòtan pou ou : kè k bat vit, tansyon nan misk, yon lide, yon dezi pou aji. Yo sèvi pou pwoteje nou, kominike ak lòt moun epi pran desizyon.","## Sis emosyon debaz","Sikològ **Paul Ekman** te dekri sis emosyon ki gen ekspresyon sou figi yo ki sanble nan anpil kilti : **jwa, tristès, kòlè, laperèz, sipriz, degou**. Gen anpil lòt emosyon pi konplèks (wont, fyète, jalouzi) ki melanje yo.","## Pa gen emosyon ki move","Kòlè ka siyale yon enjistis ; laperèz ka sove ou ; tristès ka mande sipò. Sa ki konte se sa ou fè ak emosyon an. Respire dousman, non li (\"mwen santi mwen…\"), pale ak yon moun ou fè konfyans, epi bay tèt ou tan.","> Si yon emosyon twò fò dire lontan epi anpeche ou viv, pale ak yon pwofesyonèl sante.","## Eseye pa ou","Klike sou chak emosyon nan laboratwa a pou wè wòl li ak yon konsèy."],
fr:["## Une émotion n'est pas une faiblesse","Une **émotion** est une réponse du corps et de l'esprit à quelque chose qui compte pour vous : cœur qui s'accélère, muscles tendus, une pensée, une envie d'agir. Elles servent à nous protéger, à communiquer et à décider.","## Six émotions de base","Le psychologue **Paul Ekman** a décrit six émotions dont les expressions du visage se ressemblent dans de nombreuses cultures : **joie, tristesse, colère, peur, surprise, dégoût**. Il existe beaucoup d'émotions plus complexes (honte, fierté, jalousie) qui les mélangent.","## Aucune émotion n'est mauvaise","La colère peut signaler une injustice ; la peur peut vous sauver ; la tristesse peut appeler du soutien. Ce qui compte, c'est ce que vous faites de l'émotion. Respirez lentement, nommez-la (« je ressens… »), parlez à une personne de confiance et laissez-vous du temps.","> Si une émotion trop forte dure longtemps et vous empêche de vivre, parlez à un professionnel de santé.","## À toi de jouer","Clique sur chaque émotion dans le laboratoire pour voir son rôle et un conseil."],
en:["## An emotion is not a weakness","An **emotion** is a response of body and mind to something that matters to you: a racing heart, tense muscles, a thought, an urge to act. They help protect us, communicate and decide.","## Six basic emotions","Psychologist **Paul Ekman** described six emotions whose facial expressions look alike across many cultures: **joy, sadness, anger, fear, surprise, disgust**. Many more complex emotions (shame, pride, jealousy) blend them.","## No emotion is bad","Anger can signal an injustice; fear can save you; sadness can call for support. What matters is what you do with the emotion. Breathe slowly, name it (\"I feel…\"), talk to someone you trust and give yourself time.","> If a very strong emotion lasts a long time and stops you living, talk to a health professional.","## Try it","Click each emotion in the lab to see its role and a tip."],
ru:["## Эмоция — не слабость","**Эмоция** — реакция тела и психики на то, что для вас важно: учащённое сердце, напряжённые мышцы, мысль, желание действовать. Эмоции помогают защищаться, общаться и принимать решения.","## Шесть базовых эмоций","Психолог **Пол Экман** описал шесть эмоций, выражение лица при которых похоже у многих культур: **радость, грусть, гнев, страх, удивление, отвращение**. Более сложные эмоции (стыд, гордость, ревность) смешивают их.","## Плохих эмоций нет","Гнев может сигнализировать о несправедливости; страх может спасти; грусть может звать на поддержку. Важно, что вы делаете с эмоцией. Дышите медленно, назовите её («я чувствую…»), поговорите с тем, кому доверяете, дайте себе время.","> Если очень сильная эмоция длится долго и мешает жить, поговорите со специалистом в области здравоохранения.","## Попробуй сам","Нажимай на эмоции в лаборатории, чтобы увидеть их роль и совет."]},
q:[{q:L("Konbyen emosyon debaz Ekman te dekri ?","Combien d'émotions de base Ekman a-t-il décrites ?","How many basic emotions did Ekman describe?","Сколько базовых эмоций описал Экман?"),o:["3","6","12","20"],a:1},
{q:L("Ki wòl laperèz ?","Quel est le rôle de la peur ?","What is fear for?","Для чего нужен страх?"),o:[L("Pwoteje nou kont danje","Nous protéger du danger","Protect us from danger","Защищать нас от опасности"),L("Fè nou bliye","Nous faire oublier","Make us forget","Заставлять забывать"),L("Anyen","Rien","Nothing","Ни для чего"),L("Fè nou grandi","Nous faire grandir","Make us grow","Заставлять расти")],a:0},
{q:L("Ki bagay ki bon pou jere yon emosyon fò ?","Que faire face à une émotion forte ?","What helps with a strong emotion?","Что помогает при сильной эмоции?"),o:[L("Respire dousman epi non emosyon an","Respirer lentement et la nommer","Breathe slowly and name it","Медленно дышать и назвать её"),L("Kache l tout tan","La cacher toujours","Always hide it","Всегда скрывать"),L("Pa pale ak pèsonn","Ne parler à personne","Tell no one","Никому не говорить"),L("Kriye sou lòt moun","Se défouler sur autrui","Take it out on others","Срываться на других")],a:0}]});

ART.push({id:"neurotrans",s:"neuro",lv:3,min:5,img:"neuron",lab:"ntx",w:["synapse"],
t:L("Nèwotransmetè : mesajè chimik sèvo a","Les neurotransmetteurs : les messagers chimiques du cerveau","Neurotransmitters: the brain's chemical messengers","Нейромедиаторы: химические посланники мозга"),
sum:L("Dopamin, serotonin, GABA… ki sa chak youn fè, san mit.","Dopamine, sérotonine, GABA… ce que fait chacun, sans mythes.","Dopamine, serotonin, GABA… what each does, without myths.","Дофамин, серотонин, ГАМК… что делает каждый, без мифов."),
b:{
ht:["## De fason pou pase yon mesaj","Nan sinaps la, yon nèwòn lage **nèwotransmetè** ki fikse sou **reseptè** nèwòn k ap vini an, tankou yon kle nan yon sèrin. Sa ka ekside li oswa inibe li. Apre sa, sibstans la retire oswa dekonpoze.","## Gwo mesajè yo","**Glutamat** se prensipal eksitatè a ; **GABA** se prensipal inibitè a. **Dopamin** enplike nan motivasyon, rekonpans ak mouvman. **Serotonin** ede regle imè, somèy ak apeti. **Asetilkolin** travay nan mouvman misk, atansyon ak memwa. **Endòfin** diminye doulè.","## Atansyon ak mit yo","Yo di souvan \"dopamin se molekil plezi a\" ou \"serotonin se molekil kontantman an\" : sa twò senp. Chak sibstans gen plizyè wòl epi li travay ansanm ak lòt.","## Ki jan medikaman yo aji","Anpil medikaman aji sou sinaps yo : yo ka ogmante oswa diminye yon mesajè, oswa bloke yon reseptè. Se poutèt sa yo dwe pran sou konsèy pwofesyonèl.","> Se yon senplifikasyon edikatif. Pa chanje oswa kanpe yon medikaman san konsilte doktè ou.","## Eseye pa ou","Klike sou chak mesajè nan laboratwa a pou li wòl li."],
fr:["## Deux façons de passer un message","À la synapse, un neurone libère des **neurotransmetteurs** qui se fixent sur des **récepteurs** du neurone suivant, comme une clé dans une serrure. Cela peut l'exciter ou l'inhiber. Ensuite, la substance est retirée ou dégradée.","## Les grands messagers","Le **glutamate** est le principal excitateur ; le **GABA** le principal inhibiteur. La **dopamine** intervient dans la motivation, la récompense et le mouvement. La **sérotonine** aide à réguler l'humeur, le sommeil et l'appétit. L'**acétylcholine** agit sur le mouvement des muscles, l'attention et la mémoire. Les **endorphines** atténuent la douleur.","## Attention aux mythes","On dit souvent « la dopamine est la molécule du plaisir » ou « la sérotonine est la molécule du bonheur » : c'est trop simple. Chaque substance a plusieurs rôles et travaille avec les autres.","## Comment agissent les médicaments","Beaucoup de médicaments agissent sur les synapses : ils peuvent augmenter ou diminuer un messager, ou bloquer un récepteur. C'est pourquoi ils se prennent sur avis professionnel.","> Simplification éducative. Ne changez ni n'arrêtez un médicament sans consulter votre médecin.","## À toi de jouer","Clique sur chaque messager dans le laboratoire pour lire son rôle."],
en:["## A way to pass a message","At the synapse a neuron releases **neurotransmitters** that bind to **receptors** on the next neuron, like a key in a lock. This can excite or inhibit it. Afterwards the substance is removed or broken down.","## The main messengers","**Glutamate** is the main excitatory one; **GABA** the main inhibitory one. **Dopamine** is involved in motivation, reward and movement. **Serotonin** helps regulate mood, sleep and appetite. **Acetylcholine** works in muscle movement, attention and memory. **Endorphins** reduce pain.","## Beware of myths","People often say \"dopamine is the pleasure molecule\" or \"serotonin is the happiness molecule\": that is too simple. Each substance has several roles and works with others.","## How medicines act","Many medicines act on synapses: they can raise or lower a messenger, or block a receptor. That is why they should be taken on professional advice.","> Educational simplification. Do not change or stop a medicine without consulting your doctor.","## Try it","Click each messenger in the lab to read its role."],
ru:["## Способ передать сообщение","В синапсе нейрон выделяет **нейромедиаторы**, которые связываются с **рецепторами** следующего нейрона, как ключ с замком. Это может возбудить или затормозить его. Затем вещество удаляется или разрушается.","## Основные посланники","**Глутамат** — главный возбуждающий; **ГАМК** — главный тормозной. **Дофамин** участвует в мотивации, вознаграждении и движении. **Серотонин** помогает регулировать настроение, сон и аппетит. **Ацетилхолин** работает в движении мышц, внимании и памяти. **Эндорфины** снижают боль.","## Осторожно, мифы","Часто говорят «дофамин — молекула удовольствия» или «серотонин — молекула счастья»: это слишком просто. У каждого вещества несколько ролей, и они работают вместе.","## Как действуют лекарства","Многие лекарства действуют на синапсы: они могут повышать или снижать уровень посланника или блокировать рецептор. Поэтому их принимают по назначению специалиста.","> Образовательное упрощение. Не меняйте и не прекращайте приём лекарства без консультации врача.","## Попробуй сам","Нажимай на посланников в лаборатории, чтобы прочитать их роль."]},
q:[{q:L("Ki nèwotransmetè ki prensipal inibitè a ?","Quel neurotransmetteur est le principal inhibiteur ?","Which neurotransmitter is the main inhibitor?","Какой нейромедиатор — главный тормозной?"),o:["Glutamat","GABA","Dopamin","Endòfin"],a:1},
{q:L("Ki mesajè ki enplike nan rekonpans ak motivasyon ?","Quel messager intervient dans la récompense et la motivation ?","Which messenger is involved in reward and motivation?","Какой посланник участвует в вознаграждении и мотивации?"),o:["Dopamin","GABA","Asetilkolin","Glutamat"],a:0},
{q:L("Èske dopamin se sèlman \"molekil plezi\" ?","La dopamine est-elle seulement la « molécule du plaisir » ?","Is dopamine only the \"pleasure molecule\"?","Дофамин — это только «молекула удовольствия»?"),o:[L("Non, li gen plizyè wòl","Non, elle a plusieurs rôles","No, it has several roles","Нет, у него несколько ролей"),L("Wi, sèlman sa","Oui, seulement cela","Yes, only that","Да, только это"),L("Li pa egziste","Elle n'existe pas","It does not exist","Его не существует"),L("Se yon vitamin","C'est une vitamine","It is a vitamin","Это витамин")],a:0}]});

sum:L("Broca, Wernicke ak lòt fòm : ki sa yo ye ak ki sa pou fè.","Broca, Wernicke et autres formes : ce que c'est et que faire.","Broca's, Wernicke's and other forms: what they are and what to do.","Брока, Вернике и другие формы: что это и что делать."),
b:{
ht:["## Lang ak sèvo a","**Afazi** se yon pwoblèm lang ki vini apre yon domaj nan sèvo a, souvan nan emisfè gòch la, ak yon konsekans kou **aksidan vaskilè serebral (AVC)**, yon chòk nan tèt oswa yon tumè. Moun nan pa pèdi entèlijans li : se aksè a mo yo ki afekte.","## Gwo fòm yo","**Afazi Broca** : pale a difisil, ralanti, ak kèk mo, men konpreyansyon an ankò byen. **Afazi Wernicke** : pale a koule, men li pa gen sans, epi konpreyansyon an pòv. **Afazi global** : pwoblèm grav nan tou de. **Afazi anomik** : difikilte pou jwenn mo yo (non bagay).","## Ki sa ki ede","Terapi lang ak yon òtofonis (oswa terapèt lang) ka ede anpil, espesyalman si li kòmanse bonè. Fanmi an ka ede : pale dousman, fraz kout, bay tan, pa fini fraz yo pou li, itilize jès ak imaj.","## Siy ijans","Si yon moun gen difikilte pou pale oswa konprann toudenkou, si figi li tonbe yon bò oswa yon bra fèb, se ijans : rele sèvis ijans oswa mennen l nan pi pwòch lopital imedyatman.","> Enfòmasyon edikatif. Se yon pwofesyonèl sante ki fè dyagnostik.","## Eseye pa ou","Klike sou chak fòm nan laboratwa a pou wè diferans yo."],
fr:["## Langage et cerveau","L'**aphasie** est un trouble du langage qui apparaît après une lésion du cerveau, souvent dans l'hémisphère gauche, à la suite d'un **accident vasculaire cérébral (AVC)**, d'un traumatisme crânien ou d'une tumeur. La personne ne perd pas son intelligence : c'est l'accès aux mots qui est touché.","## Les grandes formes","**Aphasie de Broca** : parole difficile, lente, avec peu de mots, mais compréhension encore bonne. **Aphasie de Wernicke** : parole fluide mais sans sens, et compréhension pauvre. **Aphasie globale** : atteinte sévère des deux. **Aphasie anomique** : difficulté à trouver les mots (noms des choses).","## Ce qui aide","La rééducation avec un orthophoniste peut beaucoup aider, surtout si elle commence tôt. L'entourage peut aider : parler lentement, phrases courtes, laisser du temps, ne pas finir les phrases à sa place, utiliser gestes et images.","## Signes d'urgence","Si quelqu'un a soudain du mal à parler ou à comprendre, si son visage s'affaisse d'un côté ou si un bras est faible, c'est une urgence : appelez les secours ou conduisez-le immédiatement à l'hôpital le plus proche.","> Information éducative. Seul un professionnel de santé pose un diagnostic.","## À toi de jouer","Clique sur chaque forme dans le laboratoire pour voir les différences."],
en:["## Language and the brain","**Aphasia** is a language disorder that follows brain damage, often in the left hemisphere, from a **stroke**, head injury or tumour. The person does not lose intelligence: access to words is affected.","## The main forms","**Broca's aphasia**: speech is hard, slow, with few words, but comprehension is still good. **Wernicke's aphasia**: speech is fluent but meaningless, and comprehension is poor. **Global aphasia**: severe loss of both. **Anomic aphasia**: trouble finding words (names of things).","## What helps","Therapy with a speech-language therapist can help a lot, especially if started early. Family can help: speak slowly, use short sentences, give time, do not finish their sentences, use gestures and pictures.","## Emergency signs","If someone suddenly has trouble speaking or understanding, a drooping face on one side or a weak arm, it is an emergency: call emergency services or take them to the nearest hospital immediately.","> Educational information. Only a health professional makes a diagnosis.","## Try it","Click each form in the lab to see the differences."],
ru:["## Речь и мозг","**Афазия** — нарушение речи после повреждения мозга, чаще левого полушария, из-за **инсульта**, черепно-мозговой травмы или опухоли. Интеллект человека не теряется: страдает доступ к словам.","## Основные формы","**Афазия Брока**: речь трудная, медленная, мало слов, но понимание ещё хорошее. **Афазия Вернике**: речь плавная, но бессмысленная, понимание слабое. **Глобальная афазия**: тяжёлое нарушение обеих функций. **Амнестическая афазия**: трудность с поиском слов (названий предметов).","## Что помогает","Занятия с логопедом-афазиологом могут сильно помочь, особенно если начать рано. Близкие могут помочь: говорить медленно, короткими фразами, давать время, не договаривать за человека, использовать жесты и картинки.","## Тревожные признаки","Если у человека внезапно затруднились речь или понимание, перекосило лицо или ослабла рука, это неотложная ситуация: вызовите скорую помощь или немедленно доставьте его в ближайшую больницу.","> Образовательная информация. Диагноз ставит только специалист здравоохранения.","## Попробуй сам","Нажимай на формы в лаборатории, чтобы увидеть различия."]},

t:L("Vaksen : ki jan yo mache epi poukisa yo enpòtan","Les vaccins : comment ils fonctionnent et pourquoi ils comptent","Vaccines: how they work and why they matter","Вакцины: как они работают и почему важны"),
sum:L("Sistèm iminitè a aprann san pa malad, epi iminite kolektif la pwoteje tout moun.","Le système immunitaire apprend sans tomber malade, et l'immunité collective protège tout le monde.","The immune system learns without getting sick, and herd immunity protects everyone.","Иммунная система учится, не болея, а коллективный иммунитет защищает всех."),
b:{
ht:["## Yon antrènman pou defans kò a","Lè yon mikwòb antre nan kò a, sistèm iminitè a fè **antikò** ak selil memwa pou goumen avè l. Yon **vaksen** montre sistèm iminitè a yon vèsyon san danje (mikwòb touye, afebli, yon moso, oswa enstriksyon pou fè yon moso) pou li aprann san ou pa malad. Si ou rankontre vrè mikwòb la pita, kò a reponn pi vit.","## Iminite kolektif","Lè ase moun pwoteje, maladi a gen difikilte pou gaye. Sa pwoteje bebe yo, moun malad ak lòt ki pa ka vaksine. Pousantaj nesesè a depann de kontaji maladi a : pi li kontajye (**R0** wo), pi gen bezwen plis moun pwoteje. Fòmil senplifye a se **1 − 1/R0**. Nan lawoujòl (R0 anviwon 12 a 18), sa fè apeprè 92 a 95 %.","## Sekirite","Vaksen yo teste anpil epi yo kontinye siveye apre yo fin otorize. Efè segondè yo anjeneral lejè (doulè nan zòn piki a, ti lafyèv) epi yo pase vit. Maladi yo anpeche yo se pi danjere.","## Ki sa pou fè","Swiv kalandriye vaksinasyon ofisyèl la ak ajan sante a oswa sant sante ki pi pwòch la, epi poze kesyon ou yo ba li.","> Enfòmasyon edikatif ; pou ka pèsonèl ou, konsilte yon pwofesyonèl sante.","## Eseye pa ou","Nan laboratwa a, chanje R0 ak kouvèti vaksinal la pou wè si pwoteksyon kolektif la rive."],
fr:["## Un entraînement pour les défenses du corps","Quand un microbe entre dans le corps, le système immunitaire fabrique des **anticorps** et des cellules mémoire pour le combattre. Un **vaccin** montre au système immunitaire une version sans danger (microbe tué ou affaibli, un fragment, ou des instructions pour fabriquer un fragment) pour qu'il apprenne sans que vous soyez malade. Si vous rencontrez plus tard le vrai microbe, le corps réagit plus vite.","## L'immunité collective","Quand assez de personnes sont protégées, la maladie a du mal à circuler. Cela protège les bébés, les malades et d'autres personnes qui ne peuvent pas être vaccinées. Le pourcentage nécessaire dépend de la contagiosité : plus la maladie est contagieuse (**R0** élevé), plus il faut de personnes protégées. La formule simplifiée est **1 − 1/R0**. Pour la rougeole (R0 d'environ 12 à 18), cela donne environ 92 à 95 %.","## Sécurité","Les vaccins sont très testés et continuent d'être surveillés après autorisation. Les effets secondaires sont en général légers (douleur au point d'injection, petite fièvre) et passent vite. Les maladies qu'ils préviennent sont bien plus dangereuses.","## Que faire","Suivez le calendrier vaccinal officiel avec un agent de santé ou le centre de santé le plus proche, et posez-lui vos questions.","> Information éducative ; pour votre cas personnel, consultez un professionnel de santé.","## À toi de jouer","Dans le laboratoire, change R0 et la couverture vaccinale pour voir si la protection collective est atteinte."],
en:["## Training for the body's defences","When a germ enters the body the immune system makes **antibodies** and memory cells to fight it. A **vaccine** shows the immune system a safe version (killed or weakened germ, a fragment, or instructions to make a fragment) so it learns without you getting sick. If you meet the real germ later, the body responds faster.","## Herd immunity","When enough people are protected, a disease struggles to spread. This protects babies, the sick and others who cannot be vaccinated. The share needed depends on how contagious the disease is: the more contagious (**higher R0**), the more people must be protected. The simplified formula is **1 − 1/R0**. For measles (R0 about 12 to 18) that gives roughly 92 to 95%.","## Safety","Vaccines are heavily tested and keep being monitored after approval. Side effects are usually mild (soreness at the injection site, slight fever) and pass quickly. The diseases they prevent are far more dangerous.","## What to do","Follow the official vaccination schedule with a health worker or the nearest health centre, and ask them your questions.","> Educational information; for your own case, consult a health professional.","## Try it","In the lab, change R0 and vaccination coverage to see whether herd protection is reached."],
ru:["## Тренировка защит организма","Когда микроб попадает в организм, иммунная система вырабатывает **антитела** и клетки памяти для борьбы с ним. **Вакцина** показывает иммунной системе безопасную версию (убитый или ослабленный микроб, фрагмент или инструкцию для его производства), чтобы она научилась, а вы не заболели. Если позже вы встретите настоящий микроб, организм ответит быстрее.","## Коллективный иммунитет","Когда защищено достаточно людей, болезни трудно распространяться. Это защищает младенцев, больных и других, кого нельзя вакцинировать. Нужная доля зависит от заразности болезни: чем она заразнее (**выше R0**), тем больше людей нужно защитить. Упрощённая формула: **1 − 1/R0**. Для кори (R0 около 12–18) получается примерно 92–95 %.","## Безопасность","Вакцины тщательно проверяют, и наблюдение продолжается после разрешения. Побочные эффекты обычно лёгкие (болезненность в месте укола, небольшая температура) и быстро проходят. Болезни, которые они предотвращают, гораздо опаснее.","## Что делать","Следуйте официальному календарю прививок с медработником или в ближайшем медицинском центре и задавайте ему вопросы.","> Образовательная информация; по вашему случаю обратитесь к специалисту здравоохранения.","## Попробуй сам","В лаборатории меняй R0 и охват вакцинацией и смотри, достигается ли коллективная защита."]},
q:[{q:L("Ki fòmil senplifye pou limit iminite kolektif la ?","Quelle est la formule simplifiée du seuil d'immunité collective ?","What is the simplified herd-immunity threshold formula?","Какова упрощённая формула порога коллективного иммунитета?"),o:["1 − 1/R0","R0 × 2","R0 + 1","1/R0"],a:0},
{q:L("Ki sa vaksen montre sistèm iminitè a ?","Que montre le vaccin au système immunitaire ?","What does a vaccine show the immune system?","Что вакцина показывает иммунной системе?"),o:[L("Yon vèsyon san danje nan mikwòb la","Une version sans danger du microbe","A safe version of the germ","Безопасную версию микроба"),L("Yon vitamin","Une vitamine","A vitamin","Витамин"),L("Yon medikaman kont doulè","Un antidouleur","A painkiller","Обезболивающее"),L("Anyen","Rien","Nothing","Ничего")],a:0},
{q:L("Efè segondè vaksen yo anjeneral…","Les effets secondaires des vaccins sont en général…","Vaccine side effects are usually…","Побочные эффекты вакцин обычно…"),o:[L("lejè epi pase vit","légers et brefs","mild and short","лёгкими и короткими"),L("toujou grav","toujours graves","always severe","всегда тяжёлыми"),L("pèmanan","permanents","permanent","постоянными"),L("pa janm genyen","inexistants","never present","отсутствуют")],a:0}]});

t:L("Dwa timoun yo : sa chak timoun gen dwa","Les droits de l'enfant : ce à quoi chaque enfant a droit","Children's rights: what every child is entitled to","Права ребёнка: на что имеет право каждый ребёнок"),
sum:L("Konvansyon sou dwa timoun (1989) ak kat gwoup dwa.","La Convention relative aux droits de l'enfant (1989) et ses quatre groupes de droits.","The Convention on the Rights of the Child (1989) and its four groups of rights.","Конвенция о правах ребёнка (1989) и четыре группы прав."),
b:{
ht:["## Yon tèks pou tout timoun","An **1989**, Nasyon Zini te adopte **Konvansyon sou dwa timoun yo**. Li konsidere kòm **timoun** nenpòt moun ki gen mwens pase 18 an. Prèske tout peyi nan mond lan te siyen l epi ratifye l, Ayiti gen ladan yo (nan ane 1995).","## Kat gwoup dwa","**Dwa pou siviv** (sante, manje, yon non ak yon nasyonalite) ; **dwa pou devlope** (lekòl, jwèt, repo, kilti) ; **dwa pou pwoteje** (kont vyolans, abi, travay ki danjere, trafik) ; **dwa pou patisipe** (di opinyon li epi yo koute l).","## Enterè siperyè timoun nan","Prensip santral la : nan chak desizyon ki konsène yon timoun, **enterè siperyè timoun nan** dwe pase an premye. Sa vle di fanmi, lekòl, jistis ak leta dwe chèche sa ki pi bon pou li.","## Si yon timoun an danje","Si ou konnen yon timoun ki viktim abi oswa ki an danje, pale ak yon granmoun responsab ou fè konfyans, yon travayè sosyal, lapolis oswa yon òganizasyon pwoteksyon timoun lokal.","> Enfòmasyon jeneral edikatif ; li pa konsèy jiridik.","## Eseye pa ou","Klike sou chak gwoup nan laboratwa a pou wè egzanp."],
fr:["## Un texte pour tous les enfants","En **1989**, les Nations unies ont adopté la **Convention relative aux droits de l'enfant**. Elle considère comme **enfant** toute personne de moins de 18 ans. Presque tous les pays du monde l'ont signée et ratifiée, dont Haïti (en 1995).","## Quatre groupes de droits","**Droits de survie** (santé, nourriture, un nom et une nationalité) ; **droits de développement** (école, jeu, repos, culture) ; **droits de protection** (contre la violence, les abus, les travaux dangereux, la traite) ; **droits de participation** (exprimer son opinion et être écouté).","## L'intérêt supérieur de l'enfant","Le principe central : dans toute décision qui concerne un enfant, son **intérêt supérieur** doit passer en premier. La famille, l'école, la justice et l'État doivent chercher ce qui est le mieux pour lui.","## Si un enfant est en danger","Si vous savez qu'un enfant est victime d'abus ou en danger, parlez à un adulte responsable de confiance, à un travailleur social, à la police ou à une organisation locale de protection de l'enfance.","> Information générale éducative ; ce n'est pas un conseil juridique.","## À toi de jouer","Clique sur chaque groupe dans le laboratoire pour voir des exemples."],
en:["## A text for every child","In **1989** the United Nations adopted the **Convention on the Rights of the Child**. It treats anyone under 18 as a **child**. Almost every country has signed and ratified it, including Haiti (in 1995).","## Four groups of rights","**Survival rights** (health, food, a name and a nationality); **development rights** (school, play, rest, culture); **protection rights** (from violence, abuse, dangerous work, trafficking); **participation rights** (to express an opinion and be heard).","## The best interests of the child","The central principle: in every decision about a child, the child's **best interests** must come first. Family, school, courts and the State must look for what is best for them.","## If a child is in danger","If you know a child is being abused or is in danger, talk to a trusted responsible adult, a social worker, the police or a local child-protection organisation.","> General educational information; not legal advice.","## Try it","Click each group in the lab to see examples."],
ru:["## Документ для каждого ребёнка","В **1989** году ООН приняла **Конвенцию о правах ребёнка**. Ребёнком считается любой человек младше 18 лет. Почти все страны подписали и ратифицировали её, включая Гаити (в 1995 году).","## Четыре группы прав","**Права на выживание** (здоровье, питание, имя и гражданство); **права на развитие** (школа, игра, отдых, культура); **права на защиту** (от насилия, жестокого обращения, опасного труда, торговли людьми); **права на участие** (высказывать мнение и быть услышанным).","## Наилучшие интересы ребёнка","Центральный принцип: в любом решении о ребёнке на первом месте его **наилучшие интересы**. Семья, школа, суд и государство должны искать лучшее для него.","## Если ребёнок в опасности","Если вы знаете, что ребёнка обижают или он в опасности, поговорите с ответственным взрослым, которому доверяете, социальным работником, полицией или местной организацией по защите детей.","> Общая образовательная информация; не юридическая консультация.","## Попробуй сам","Нажимай на группы в лаборатории, чтобы увидеть примеры."]},
q:[{q:L("Ki laj limit pou yon moun konsidere kòm timoun selon Konvansyon an ?","Jusqu'à quel âge est-on un enfant selon la Convention ?","Up to what age is someone a child under the Convention?","До какого возраста человек считается ребёнком по Конвенции?"),o:["12","15","18","21"],a:2},
{q:L("Ki ane Konvansyon sou dwa timoun yo te adopte ?","En quelle année la Convention a-t-elle été adoptée ?","In what year was the Convention adopted?","В каком году принята Конвенция?"),o:["1804","1948","1989","2010"],a:2},
{q:L("Ki dwa ki pa nan gwoup \"pwoteje\" ?","Quel droit n'est pas dans le groupe « protection » ?","Which right is not in the \"protection\" group?","Какое право не входит в группу «защита»?"),o:[L("Pwoteje kont abi","Protection contre les abus","Protection from abuse","Защита от жестокого обращения"),L("Pwoteje kont trafik","Protection contre la traite","Protection from trafficking","Защита от торговли людьми"),L("Dwa pou jwe","Droit de jouer","The right to play","Право на игру"),L("Pwoteje kont travay danjere","Protection contre les travaux dangereux","Protection from dangerous work","Защита от опасного труда")],a:2}]});

t:L("Entèlijans atifisyèl : kijan machin yo aprann","L'intelligence artificielle : comment les machines apprennent","Artificial intelligence: how machines learn","Искусственный интеллект: как учатся машины"),
sum:L("Aprantisaj otomatik, done, limit ak prekosyon.","Apprentissage automatique, données, limites et précautions.","Machine learning, data, limits and precautions.","Машинное обучение, данные, ограничения и меры предосторожности."),
b:{
ht:["## Pa règ ekri, men egzanp","Yon pwogram òdinè swiv **règ** yon moun ekri. Yon sistèm **IA** ki itilize **aprantisaj otomatik** jwenn pwòp règ li apati de **egzanp** (done). Egzanp : yo montre li mil foto bèt ak non yo, epi li aprann rekonèt yo.","## De kote li pran ‘entèlijans’ li","Li pa panse tankou moun. Li jwenn **modèl** nan done yo epi li fè **prediksyon**. Tradiksyon otomatik, filtre spam, rekòmandasyon videyo ak debloke telefòn ak figi ou tout itilize sa.","## Limit ak risk","IA ka **fè erè** epi di l ak konfyans. Si done yo gen **prejije** (egzanp pa ase moun ak kèk kalite po), rezilta yo ka enjis. Done pèsonèl ou meritè pwoteksyon. Toujou verifye enfòmasyon enpòtan (sante, lajan, jistis).","## Ki jan pou itilize l byen","Itilize l tankou yon asistan, pa yon òrak : mande l eksplike, konpare ak sous serye, epi kenbe jijman pa w.","> Pa antre modpas oswa enfòmasyon trè pèsonèl nan yon sèvis IA ou pa konnen.","## Eseye pa ou","Nan laboratwa a, ajoute pwen epi gade ki jan machin nan devine klas yo ak vwazen ki pi pwòch yo."],
fr:["## Pas des règles écrites, mais des exemples","Un programme ordinaire suit des **règles** écrites par un humain. Un système d'**IA** qui utilise l'**apprentissage automatique** trouve ses propres règles à partir d'**exemples** (des données). Exemple : on lui montre mille photos d'animaux avec leurs noms, et il apprend à les reconnaître.","## D'où vient son « intelligence »","Elle ne pense pas comme un humain. Elle trouve des **motifs** dans les données et fait des **prédictions**. Traduction automatique, filtres anti-spam, recommandations de vidéos et déverrouillage du téléphone par le visage utilisent cela.","## Limites et risques","Une IA peut **se tromper** et le dire avec assurance. Si les données contiennent des **biais** (par exemple trop peu de personnes de certaines peaux), les résultats peuvent être injustes. Vos données personnelles méritent d'être protégées. Vérifiez toujours les informations importantes (santé, argent, justice).","## Bien l'utiliser","Utilisez-la comme un assistant, pas comme un oracle : demandez-lui d'expliquer, comparez avec des sources fiables et gardez votre jugement.","> Ne saisissez pas de mot de passe ni d'informations très personnelles dans un service d'IA que vous ne connaissez pas.","## À toi de jouer","Dans le laboratoire, ajoute des points et regarde comment la machine devine les classes avec ses voisins les plus proches."],
en:["## Not written rules, but examples","An ordinary program follows **rules** a person wrote. An **AI** system using **machine learning** finds its own rules from **examples** (data). For instance, it is shown a thousand animal photos with their names and learns to recognise them.","## Where its ‘intelligence’ comes from","It does not think like a person. It finds **patterns** in data and makes **predictions**. Machine translation, spam filters, video recommendations and face unlock all use this.","## Limits and risks","An AI can **be wrong** and sound confident. If the data contain **bias** (for example too few people with certain skin tones), results can be unfair. Your personal data deserves protection. Always check important information (health, money, justice).","## Using it well","Use it as an assistant, not an oracle: ask it to explain, compare with reliable sources and keep your own judgement.","> Do not enter passwords or very personal information into an AI service you do not know.","## Try it","In the lab, add points and watch how the machine guesses classes from its nearest neighbours."],
ru:["## Не заданные правила, а примеры","Обычная программа следует **правилам**, написанным человеком. Система **ИИ** с **машинным обучением** сама находит правила по **примерам** (данным). Например, ей показывают тысячу фото животных с названиями, и она учится их узнавать.","## Откуда «интеллект»","Он не думает как человек. Он находит **закономерности** в данных и делает **прогнозы**. Машинный перевод, спам-фильтры, рекомендации видео и разблокировка телефона по лицу используют это.","## Ограничения и риски","ИИ может **ошибаться** и говорить уверенно. Если в данных есть **предвзятость** (например, слишком мало людей с некоторым цветом кожи), результаты могут быть несправедливыми. Личные данные нужно защищать. Всегда проверяйте важную информацию (здоровье, деньги, право).","## Как пользоваться","Используйте как помощника, а не оракула: просите объяснить, сравнивайте с надёжными источниками и сохраняйте собственное суждение.","> Не вводите пароли и очень личную информацию в незнакомые ИИ-сервисы.","## Попробуй сам","В лаборатории добавляй точки и смотри, как машина угадывает классы по ближайшим соседям."]},
q:[{q:L("Ki jan yon sistèm aprantisaj otomatik jwenn règ li yo ?","Comment un système d'apprentissage automatique trouve-t-il ses règles ?","How does a machine-learning system find its rules?","Как система машинного обучения находит свои правила?"),o:[L("Apati de egzanp (done)","À partir d'exemples (données)","From examples (data)","По примерам (данным)"),L("Yon moun ekri yo tout","Un humain les écrit toutes","A person writes them all","Человек пишет их все"),L("Pa gen règ","Il n'y en a pas","There are none","Правил нет"),L("Nan rèv","En rêvant","By dreaming","Во сне")],a:0},
{q:L("Poukisa nou dwe verifye repons yon IA ?","Pourquoi vérifier les réponses d'une IA ?","Why check an AI's answers?","Почему нужно проверять ответы ИИ?"),o:[L("Li ka fè erè ak konfyans","Elle peut se tromper avec assurance","It can be wrong with confidence","Она может ошибаться уверенно"),L("Li pa janm fè erè","Elle ne se trompe jamais","It is never wrong","Она никогда не ошибается"),L("Li pa bay repons","Elle ne répond pas","It does not answer","Она не отвечает"),L("Se yon moun","C'est une personne","It is a person","Это человек")],a:0},
{q:L("Ki sa prejije nan done yo ka lakòz ?","Que peut causer un biais dans les données ?","What can bias in data cause?","К чему может привести предвзятость данных?"),o:[L("Rezilta enjis","Des résultats injustes","Unfair results","Несправедливые результаты"),L("Pi bon rezilta","De meilleurs résultats","Better results","Лучшие результаты"),L("Anyen","Rien","Nothing","Ничего"),L("Pi vit","Plus de vitesse","More speed","Больше скорости")],a:0}]});

ART.push({id:"oni",s:"relint",lv:1,min:5,img:"globe",lab:"council",w:["veto"],
t:L("ONI : ki jan peyi yo travay ansanm","L'ONU : comment les États travaillent ensemble","The UN: how countries work together","ООН: как страны работают вместе"),
sum:L("Asanble Jeneral, Konsèy Sekirite ak dwa veto.","L'Assemblée générale, le Conseil de sécurité et le droit de veto.","The General Assembly, the Security Council and the veto.","Генеральная Ассамблея, Совет Безопасности и право вето."),
b:{
ht:["## Poukisa ONI egziste","**Nasyon Zini (ONI)** te kreye an **1945**, apre Dezyèm Lagè Mondyal, pou kenbe lapè, pwoteje dwa moun epi ankouraje devlopman. Ayiti se youn nan manm fondatè yo. Jodi a gen **193 peyi manm**.","## Gwo òjàn yo","**Asanble Jeneral** : tout peyi gen yon vòt. **Konsèy Sekirite** : 15 manm, 5 pèmanan (**Chin, Etazini, Frans, Larisi, Wayòm Ini**) ak 10 eli pou 2 an ; li pran desizyon sou lapè ak sekirite. **Sekretarya** ak sekretè jeneral la. **Kou Entènasyonal Jistis** pou diferan ant leta yo.","## Dwa veto","Yon rezolisyon nan Konsèy Sekirite bezwen **9 vòt sou 15** epi **pa gen veto** nan men okenn nan 5 manm pèmanan yo. Yon sèl veto ase pou bloke l.","## Ajans yo","Anpil ajans travay anba ONI : **OMS** (sante), **UNESCO** (edikasyon, kilti), **UNICEF** (timoun), **FAO** (agrikilti ak manje), **PAM** (manje).","> Chak peyi manm gen enterè pa l : ONI se yon espas negosyasyon, pa yon gouvènman mondyal.","## Eseye pa ou","Nan laboratwa a, deside vòt chak manm epi gade si rezolisyon an pase."],
fr:["## Pourquoi l'ONU existe","L'**Organisation des Nations unies (ONU)** a été créée en **1945**, après la Seconde Guerre mondiale, pour maintenir la paix, protéger les droits humains et encourager le développement. Haïti est l'un des membres fondateurs. Aujourd'hui, elle compte **193 États membres**.","## Les grands organes","**Assemblée générale** : chaque pays a une voix. **Conseil de sécurité** : 15 membres, dont 5 permanents (**Chine, États-Unis, France, Russie, Royaume-Uni**) et 10 élus pour 2 ans ; il décide sur la paix et la sécurité. **Secrétariat** et secrétaire général. **Cour internationale de justice** pour les différends entre États.","## Le droit de veto","Une résolution du Conseil de sécurité exige **9 voix sur 15** et **aucun veto** de l'un des 5 membres permanents. Un seul veto suffit à la bloquer.","## Les agences","De nombreuses agences travaillent sous l'ONU : **OMS** (santé), **UNESCO** (éducation, culture), **UNICEF** (enfance), **FAO** (agriculture et alimentation), **PAM** (programme alimentaire).","> Chaque État membre a ses intérêts : l'ONU est un espace de négociation, pas un gouvernement mondial.","## À toi de jouer","Dans le laboratoire, décide du vote de chaque membre et regarde si la résolution passe."],
en:["## Why the UN exists","The **United Nations (UN)** was founded in **1945**, after the Second World War, to keep peace, protect human rights and encourage development. Haiti is one of its founding members. Today it has **193 member states**.","## The main bodies","**General Assembly**: every country has one vote. **Security Council**: 15 members, 5 permanent (**China, France, Russia, the United Kingdom, the United States**) and 10 elected for 2 years; it decides on peace and security. **Secretariat** and the Secretary-General. **International Court of Justice** for disputes between states.","## The veto","A Security Council resolution needs **9 votes out of 15** and **no veto** from any of the 5 permanent members. A single veto is enough to block it.","## The agencies","Many agencies work under the UN: **WHO** (health), **UNESCO** (education, culture), **UNICEF** (children), **FAO** (agriculture and food), **WFP** (food programme).","> Each member state has its own interests: the UN is a negotiating space, not a world government.","## Try it","In the lab, decide each member's vote and see whether the resolution passes."],
ru:["## Зачем нужна ООН","**Организация Объединённых Наций (ООН)** создана в **1945** году, после Второй мировой войны, чтобы поддерживать мир, защищать права человека и содействовать развитию. Гаити — одно из государств-основателей. Сегодня в ней **193 государства-члена**.","## Главные органы","**Генеральная Ассамблея**: у каждой страны один голос. **Совет Безопасности**: 15 членов, из них 5 постоянных (**Китай, Россия, США, Франция, Великобритания**) и 10 избираемых на 2 года; он принимает решения по миру и безопасности. **Секретариат** и Генеральный секретарь. **Международный суд** для споров между государствами.","## Право вето","Резолюция Совета Безопасности требует **9 голосов из 15** и **отсутствия вето** любого из 5 постоянных членов. Одного вето достаточно, чтобы заблокировать её.","## Агентства","Под эгидой ООН работает много агентств: **ВОЗ** (здоровье), **ЮНЕСКО** (образование, культура), **ЮНИСЕФ** (дети), **ФАО** (сельское хозяйство и питание), **ВПП** (продовольственная программа).","> У каждого государства свои интересы: ООН — площадка для переговоров, а не мировое правительство.","## Попробуй сам","В лаборатории реши голос каждого члена и посмотри, пройдёт ли резолюция."]},
q:[{q:L("Ki lè ONI te kreye ?","Quand l'ONU a-t-elle été créée ?","When was the UN founded?","Когда создана ООН?"),o:["1804","1919","1945","1989"],a:2},
{q:L("Konbyen vòt yon rezolisyon nan Konsèy Sekirite bezwen ?","Combien de voix faut-il pour une résolution du Conseil de sécurité ?","How many votes does a Security Council resolution need?","Сколько голосов нужно для резолюции Совета Безопасности?"),o:["5","8","9","15"],a:2},
{q:L("Konbyen manm pèmanan Konsèy Sekirite genyen ?","Combien de membres permanents au Conseil de sécurité ?","How many permanent members on the Security Council?","Сколько постоянных членов в Совете Безопасности?"),o:["3","5","10","15"],a:1}]});

ART.push({id:"solare",s:"astro",lv:1,min:5,img:"planets",lab:"grav",w:["planete"],
t:L("Sistèm solè a : Solèy la ak wit planèt li yo","Le système solaire : le Soleil et ses huit planètes","The Solar System: the Sun and its eight planets","Солнечная система: Солнце и восемь планет"),
sum:L("Planèt yo, distans yo ak ki jan ou ta peze sou chak.","Les planètes, les distances et ce que vous pèseriez sur chacune.","The planets, distances and what you would weigh on each.","Планеты, расстояния и сколько вы весили бы на каждой."),
b:{
ht:["## Yon zetwal ak pitit li yo","**Solèy la** se yon zetwal ki gen apeprè **99,8 %** mas sistèm solè a. Wit **planèt** vire otou li : **Mèkiri, Vènis, Latè, Mas** (planèt wòch), **Jipitè, Satin** (jeyan gaz), **Iranis, Neptin** (jeyan glas). Pliton se yon **planèt nen** depi 2006.","## Distans ak limyè","Latè se apeprè **150 milyon km** de Solèy la (yon **inite astwonomik**). Limyè Solèy la bezwen apeprè **8 minit** pou rive jwenn nou. Sa vle di nou wè Solèy la jan li te ye 8 minit pase.","## Gravite ak pwa","Gravite sou chak planèt depann de mas li ak gwosè li. Sou Mas, ou ta peze apeprè **38 %** sa ou peze sou Latè ; sou Jipitè, apeprè **253 %**. Mas ou pa chanje : se pwa a ki chanje.","## Poukisa Latè espesyal","Latè se jis ant twò cho ak twò fwad pou dlo likid, epi li gen yon atmosfè ak yon jaden mayetik ki pwoteje lavi.","> Fè atansyon : pa gade Solèy la dirèkteman, menm ak lunèt òdinè.","## Eseye pa ou","Antre pwa ou nan laboratwa a pou wè pwa ou sou chak planèt."],
fr:["## Une étoile et ses enfants","Le **Soleil** est une étoile qui contient environ **99,8 %** de la masse du système solaire. Huit **planètes** tournent autour : **Mercure, Vénus, Terre, Mars** (planètes rocheuses), **Jupiter, Saturne** (géantes gazeuses), **Uranus, Neptune** (géantes de glace). Pluton est une **planète naine** depuis 2006.","## Distances et lumière","La Terre est à environ **150 millions de km** du Soleil (une **unité astronomique**). La lumière du Soleil met environ **8 minutes** à nous atteindre. Nous voyons donc le Soleil tel qu'il était il y a 8 minutes.","## Gravité et poids","La gravité sur chaque planète dépend de sa masse et de sa taille. Sur Mars, vous pèseriez environ **38 %** de votre poids sur Terre ; sur Jupiter, environ **253 %**. Votre masse ne change pas : c'est le poids qui change.","## Pourquoi la Terre est spéciale","La Terre est juste entre trop chaude et trop froide pour l'eau liquide, et elle a une atmosphère et un champ magnétique qui protègent la vie.","> Attention : ne regardez jamais le Soleil directement, même avec des lunettes ordinaires.","## À toi de jouer","Entre ton poids dans le laboratoire pour voir ton poids sur chaque planète."],
en:["## A star and its children","The **Sun** is a star holding about **99.8%** of the Solar System's mass. Eight **planets** orbit it: **Mercury, Venus, Earth, Mars** (rocky planets), **Jupiter, Saturn** (gas giants), **Uranus, Neptune** (ice giants). Pluto has been a **dwarf planet** since 2006.","## Distances and light","Earth is about **150 million km** from the Sun (one **astronomical unit**). Sunlight takes about **8 minutes** to reach us, so we see the Sun as it was 8 minutes ago.","## Gravity and weight","Gravity on each planet depends on its mass and size. On Mars you would weigh about **38%** of your Earth weight; on Jupiter, about **253%**. Your mass does not change: your weight does.","## Why Earth is special","Earth sits between too hot and too cold for liquid water, and has an atmosphere and magnetic field that protect life.","> Careful: never look directly at the Sun, even with ordinary sunglasses.","## Try it","Enter your weight in the lab to see it on every planet."],
ru:["## Звезда и её дети","**Солнце** — звезда, содержащая около **99,8 %** массы Солнечной системы. Вокруг него обращаются восемь **планет**: **Меркурий, Венера, Земля, Марс** (каменные), **Юпитер, Сатурн** (газовые гиганты), **Уран, Нептун** (ледяные гиганты). Плутон с 2006 года — **карликовая планета**.","## Расстояния и свет","Земля находится примерно в **150 миллионах км** от Солнца (одна **астрономическая единица**). Свет Солнца идёт до нас около **8 минут**, поэтому мы видим Солнце таким, каким оно было 8 минут назад.","## Гравитация и вес","Гравитация на каждой планете зависит от её массы и размера. На Марсе вы весили бы около **38 %** от земного веса, на Юпитере — около **253 %**. Масса не меняется, меняется вес.","## Чем особенна Земля","Земля находится между «слишком жарко» и «слишком холодно» для жидкой воды, а атмосфера и магнитное поле защищают жизнь.","> Осторожно: никогда не смотрите на Солнце напрямую, даже в обычных тёмных очках.","## Попробуй сам","Введи свой вес в лаборатории и посмотри его на каждой планете."]},
q:[{q:L("Konbyen planèt ki genyen nan sistèm solè a ?","Combien de planètes dans le système solaire ?","How many planets in the Solar System?","Сколько планет в Солнечной системе?"),o:["7","8","9","10"],a:1},
{q:L("Konbyen tan limyè Solèy la pran pou rive sou Latè ?","Combien de temps la lumière du Soleil met-elle pour atteindre la Terre ?","How long does sunlight take to reach Earth?","Сколько идёт свет Солнца до Земли?"),o:[L("8 minit","8 minutes","8 minutes","8 минут"),L("8 segonn","8 secondes","8 seconds","8 секунд"),L("8 èdtan","8 heures","8 hours","8 часов"),L("8 jou","8 jours","8 days","8 дней")],a:0},
{q:L("Ki sa ki chanje lè ou ale sou Mas : mas ou oswa pwa ou ?","Qu'est-ce qui change sur Mars : votre masse ou votre poids ?","What changes on Mars: your mass or your weight?","Что меняется на Марсе: масса или вес?"),o:[L("Pwa ou","Votre poids","Your weight","Вес"),L("Mas ou","Votre masse","Your mass","Масса"),L("Tou de","Les deux","Both","И то, и другое"),L("Pa youn","Aucun","Neither","Ничего")],a:0}]});

ART.push({id:"moyenne",s:"stat",lv:1,min:4,img:"bars",lab:"mean",w:["mediane"],
t:L("Mwayèn ak medyàn : ki sa ki reprezante byen yon gwoup ?","Moyenne et médiane : qu'est-ce qui représente bien un groupe ?","Mean and median: what represents a group well?","Среднее и медиана: что хорошо описывает группу?"),
sum:L("Yon sèl moun trè rich ka chanje mwayèn nan, men medyàn nan rete menm.","Une seule personne très riche peut changer la moyenne, mais la médiane reste la même.","One very rich person can change the mean, but the median stays put.","Один очень богатый человек может изменить среднее, но медиана почти не меняется."),
b:{
ht:["## Twa fason pou rezime done","**Mwayèn** : ou adisyone tout valè yo epi ou divize pa kantite yo. **Medyàn** : valè ki nan mitan lè ou ranje yo pi piti pi gran. **Mòd** : valè ki parèt pi souvan.","## Yon egzanp ak revni","Sèt moun touche (an mil goud) : 100, 120, 130, 140, 150, 160, 170. Mwayèn = **138,6** ; medyàn = **140**. Kounye a yon moun trè rich ki touche 2 000 antre nan gwoup la : mwayèn nan monte nan **371** men medyàn nan se 145.","## Ki sa pou chwazi","Lè gen **valè ekstrèm**, medyàn nan souvan reprezante moun nòmal la pi byen. Se poutèt sa yo itilize medyàn pou revni ak pri kay. Mwayèn nan bon lè done yo ekilibre.","## Gade byen","Yon mwayèn pa di ki jan done yo gaye. De gwoup ka gen menm mwayèn men yo diferan anpil. Toujou mande ki done, konbyen, ak ki kalite mwayèn.","> Lè yon jounal di ‘mwayèn revni a se…’, mande si se mwayèn oswa medyàn.","## Eseye pa ou","Nan laboratwa a, ajoute yon valè ekstrèm epi gade ki sa ki chanje."],
fr:["## Trois façons de résumer des données","**Moyenne** : on additionne toutes les valeurs et on divise par leur nombre. **Médiane** : la valeur du milieu quand on les range du plus petit au plus grand. **Mode** : la valeur qui apparaît le plus souvent.","## Un exemple avec des revenus","Sept personnes gagnent (en milliers de gourdes) : 100, 120, 130, 140, 150, 160, 170. Moyenne = **138,6** ; médiane = **140**. Maintenant une personne très riche gagnant 2 000 entre dans le groupe : la moyenne monte à environ **371**, mais la médiane est 145.","## Que choisir","Quand il y a des **valeurs extrêmes**, la médiane représente souvent mieux la personne ordinaire. C'est pourquoi on utilise la médiane pour les revenus et les prix des logements. La moyenne est bonne quand les données sont équilibrées.","## Soyez attentif","Une moyenne ne dit pas comment les données sont dispersées. Deux groupes peuvent avoir la même moyenne et être très différents. Demandez toujours quelles données, combien, et quelle sorte de moyenne.","> Quand un journal dit « le revenu moyen est… », demandez s'il s'agit de la moyenne ou de la médiane.","## À toi de jouer","Dans le laboratoire, ajoute une valeur extrême et regarde ce qui change."],
en:["## Three ways to summarise data","**Mean**: add all values and divide by how many there are. **Median**: the middle value when sorted smallest to largest. **Mode**: the value that appears most often.","## An example with incomes","Seven people earn (in thousands of gourdes): 100, 120, 130, 140, 150, 160, 170. Mean = **138.6**; median = **140**. Now a very rich person earning 2,000 joins: the mean jumps to about **371**, but the median is 145.","## Which to choose","With **extreme values**, the median often describes the ordinary person better. That is why the median is used for incomes and house prices. The mean works well when data are balanced.","## Be careful","A mean does not tell how spread out the data are. Two groups can share a mean and be very different. Always ask which data, how many, and which kind of average.","> When a newspaper says ‘the average income is…’, ask whether it is the mean or the median.","## Try it","In the lab, add an extreme value and see what changes."],
ru:["## Три способа описать данные","**Среднее**: сложить все значения и разделить на их количество. **Медиана**: серединное значение при упорядочивании по возрастанию. **Мода**: самое частое значение.","## Пример с доходами","Семь человек зарабатывают (в тысячах гурдов): 100, 120, 130, 140, 150, 160, 170. Среднее = **138,6**; медиана = **140**. Теперь в группу вошёл очень богатый человек с доходом 2 000: среднее вырастает примерно до **371**, а медиана — 145.","## Что выбрать","При **экстремальных значениях** медиана часто лучше описывает обычного человека. Поэтому медиану используют для доходов и цен на жильё. Среднее хорошо работает при сбалансированных данных.","## Будьте внимательны","Среднее не показывает разброс данных. Две группы могут иметь одинаковое среднее и сильно отличаться. Всегда спрашивайте, какие данные, сколько и какое среднее.","> Когда газета пишет «средний доход…», уточните, это среднее или медиана.","## Попробуй сам","В лаборатории добавь экстремальное значение и посмотри, что изменится."]},
q:[{q:L("Ki medyàn : 3, 5, 9 ?","Quelle est la médiane de : 3, 5, 9 ?","What is the median of 3, 5, 9?","Какова медиана чисел 3, 5, 9?"),o:["3","5","9","6,3"],a:1},
{q:L("Ki mwayèn : 2, 4, 6 ?","Quelle est la moyenne de : 2, 4, 6 ?","What is the mean of 2, 4, 6?","Каково среднее чисел 2, 4, 6?"),o:["3","4","5","6"],a:1},
{q:L("Ki mezi ki mwens afekte pa yon valè ekstrèm ?","Quelle mesure est la moins touchée par une valeur extrême ?","Which measure is least affected by an extreme value?","Какая мера меньше всего зависит от экстремального значения?"),o:[L("Medyàn","Médiane","Median","Медиана"),L("Mwayèn","Moyenne","Mean","Среднее"),L("Total","Total","Total","Сумма"),L("Okenn","Aucune","None","Никакая")],a:0}]});
