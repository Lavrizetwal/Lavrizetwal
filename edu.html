t:L("Pwobabilite : mezire chans","Les probabilités : mesurer la chance","Probability: measuring chance","Вероятность: измеряем шанс"),
sum:L("Pil ou fas, dè, lwa gwo kantite ak erè jwè a.","Pile ou face, dés, loi des grands nombres et erreur du joueur.","Heads or tails, dice, the law of large numbers and the gambler's fallacy.","Орёл или решка, кости, закон больших чисел и ошибка игрока."),
b:{
ht:["## Yon nonm ant 0 ak 1","**Pwobabilite** yon evènman se yon nonm ant **0** (enposib) ak **1** (sèten). Lè rezilta yo egalman posib : **P = kantite ka favorab / kantite ka posib**. Yon pyès monnen : P(pil) = 1/2. Yon dè : P(6) = 1/6.","## Evènman endepandan","Si de evènman pa enfliyanse youn lòt, ou miltipliye pwobabilite yo. Egzanp : P(de pil) = 1/2 × 1/2 = **1/4**. P(de fwa 6 ak dè) = 1/6 × 1/6 = **1/36**.","## Lwa gwo kantite yo","Si ou voye pyès monnen an yon sèl fwa, ou ka jwenn 100 % pil. Men si ou voye l **plizyè milye fwa**, pousantaj pil la apwoche **50 %**. Se lwa gwo kantite yo.","## Erè jwè a","Apre senk pil youn dèyè lòt, pyès monnen an **pa gen memwa** : pwochen voye a toujou 1/2. Kwè ke ‘li dwe bay fas kounye a’ se **erè jwè a**. Sa se youn nan rezon jwèt lajan fè moun pèdi.","> Pwobabilite pa janm garanti yon rezilta pou yon sèl esè.","## Eseye pa ou","Nan laboratwa a, voye pyès monnen an 1, 10, 100 oswa 1 000 fwa epi obsève pousantaj la."],
fr:["## Un nombre entre 0 et 1","La **probabilité** d'un événement est un nombre entre **0** (impossible) et **1** (certain). Quand les résultats sont également possibles : **P = nombre de cas favorables / nombre de cas possibles**. Une pièce : P(pile) = 1/2. Un dé : P(6) = 1/6.","## Événements indépendants","Si deux événements ne s'influencent pas, on multiplie les probabilités. Exemple : P(deux piles) = 1/2 × 1/2 = **1/4**. P(deux fois 6 avec un dé) = 1/6 × 1/6 = **1/36**.","## La loi des grands nombres","Si vous lancez la pièce une seule fois, vous pouvez obtenir 100 % de piles. Mais si vous la lancez **des milliers de fois**, le pourcentage de piles se rapproche de **50 %**. C'est la loi des grands nombres.","## L'erreur du joueur","Après cinq piles de suite, la pièce **n'a pas de mémoire** : le prochain lancer est toujours 1/2. Croire que « face doit sortir maintenant » est l'**erreur du joueur**. C'est l'une des raisons pour lesquelles les jeux d'argent font perdre.","> La probabilité ne garantit jamais un résultat pour un seul essai.","## À toi de jouer","Dans le laboratoire, lance la pièce 1, 10, 100 ou 1 000 fois et observe le pourcentage."],
en:["## A number between 0 and 1","The **probability** of an event is a number from **0** (impossible) to **1** (certain). When outcomes are equally likely: **P = favourable cases / possible cases**. A coin: P(heads) = 1/2. A die: P(6) = 1/6.","## Independent events","If two events do not influence each other, multiply their probabilities. Example: P(two heads) = 1/2 × 1/2 = **1/4**. P(two sixes with a die) = 1/6 × 1/6 = **1/36**.","## The law of large numbers","Toss a coin once and you may get 100% heads. But toss it **thousands of times** and the share of heads gets close to **50%**. That is the law of large numbers.","## The gambler's fallacy","After five heads in a row the coin **has no memory**: the next toss is still 1/2. Believing ‘tails is due’ is the **gambler's fallacy**. It is one reason gambling makes people lose.","> Probability never guarantees a result for a single trial.","## Try it","In the lab, toss the coin 1, 10, 100 or 1,000 times and watch the percentage."],
ru:["## Число от 0 до 1","**Вероятность** события — число от **0** (невозможно) до **1** (достоверно). При равновозможных исходах: **P = благоприятные случаи / возможные случаи**. Монета: P(орёл) = 1/2. Кость: P(6) = 1/6.","## Независимые события","Если события не влияют друг на друга, вероятности перемножают. Пример: P(два орла) = 1/2 × 1/2 = **1/4**. P(две шестёрки на кости) = 1/6 × 1/6 = **1/36**.","## Закон больших чисел","Подбросив монету один раз, можно получить 100 % орлов. Но если подбросить её **тысячи раз**, доля орлов приблизится к **50 %**. Это закон больших чисел.","## Ошибка игрока","После пяти орлов подряд у монеты **нет памяти**: следующий бросок снова 1/2. Вера в то, что «пора выпасть решке», — это **ошибка игрока**. Она — одна из причин, почему азартные игры разоряют.","> Вероятность никогда не гарантирует результат единичной попытки.","## Попробуй сам","В лаборатории подбрось монету 1, 10, 100 или 1 000 раз и следи за процентом."]},
q:[{q:L("Ki P(6) ak yon dè ?","Quelle est P(6) avec un dé ?","What is P(6) with a die?","Чему равна P(6) на кости?"),o:["1/2","1/3","1/6","1/36"],a:2},
{q:L("Ki P(de pil) ak de pyès monnen ?","Quelle est P(deux piles) avec deux pièces ?","What is P(two heads) with two coins?","Чему равна P(два орла) для двух монет?"),o:["1/2","1/3","1/4","1/8"],a:2},
{q:L("Apre 5 pil, ki P pil nan pwochen voye a ?","Après 5 piles, quelle est P(pile) au lancer suivant ?","After 5 heads, what is P(heads) on the next toss?","После 5 орлов какова P(орёл) в следующем броске?"),o:["1/2","1/32","0","1"],a:0}]});

ART.push({id:"religions",s:"relig",lv:1,min:5,img:"rays",lab:"rel",w:[],
t:L("Gwo relijyon mond lan : konprann san jije","Les grandes religions du monde : comprendre sans juger","The world's major religions: understanding without judging","Мировые религии: понимать, не осуждая"),
sum:L("Orijin, tèks ak lye lapriyè, ak respè pou tout kwayans.","Origines, textes et lieux de culte, avec respect pour toutes les croyances.","Origins, texts and places of worship, with respect for all beliefs.","Истоки, тексты и места богослужения с уважением ко всем убеждениям."),
b:{
ht:["## Etidye relijyon san pran pozisyon","Yon **relijyon** se yon sistèm kwayans, pratik, valè ak yon kominote. Nan edikasyon, nou **dekri** sa moun kwè epi nou eksplike, san di ki relijyon ki **vre**. Se pa pou chanje kwayans pèsonn : se pou konprann.","## Gwo kouran yo","**Kretyen** (Jezi ; Bib ; legliz) ; **Islam** (Mouhammad ; Koran ; moske) ; **Jidayis** (Tora ; senagòg) ; **Endouyis** (Veda ak lòt tèks ; tanp) ; **Boudis** (Siddhartha Gautama ; tanp ak monastè). Kretyen ak Mizilman se de pi gwo gwoup yo pa kantite. Gen tou relijyon tradisyonèl ak moun ki pa relijye.","## Nan Ayiti","Ayiti gen anpil katolik ak pwotestan, epi **Vodou** : yon relijyon ki soti nan eritaj Lafrik lwès ak santral, ki pase an Ayiti epi ki rete vivan. Leta ayisyen te rekonèt Vodou ofisyèlman kòm relijyon an **2003**. Konstitisyon 1987 la garanti libète relijyon.","## Respè","Chak moun gen dwa kwè, chanje relijyon oswa pa kwè. Pale ak kiryozite, poze kesyon ak bon fwa, epi evite jeneralizasyon : yon relijyon pa defini pa youn nan moun ki swiv li.","> Edikasyon ofri enfòmasyon ; chwa kwayans lan se pèsonèl.","## Eseye pa ou","Klike sou chak relijyon nan laboratwa a pou wè orijin li, tèks li ak lye lapriyè li."],
fr:["## Étudier les religions sans prendre parti","Une **religion** est un système de croyances, de pratiques, de valeurs et une communauté. En éducation, on **décrit** ce que les gens croient et on explique, sans dire quelle religion est **vraie**. Il ne s'agit pas de changer les croyances de quiconque : il s'agit de comprendre.","## Les grands courants","**Christianisme** (Jésus ; la Bible ; l'église) ; **Islam** (Mahomet ; le Coran ; la mosquée) ; **Judaïsme** (Torah ; synagogue) ; **Hindouisme** (Védas et autres textes ; temple) ; **Bouddhisme** (Siddhartha Gautama ; temples et monastères). Les chrétiens et les musulmans sont les deux plus grands groupes en nombre. Il existe aussi des religions traditionnelles et des personnes sans religion.","## En Haïti","Haïti compte beaucoup de catholiques et de protestants, et le **Vodou** : une religion issue de l'héritage de l'Afrique de l'Ouest et centrale, passée en Haïti et toujours vivante. L'État haïtien a reconnu officiellement le Vodou comme religion en **2003**. La Constitution de 1987 garantit la liberté de religion.","## Le respect","Chacun a le droit de croire, de changer de religion ou de ne pas croire. Parlez avec curiosité, posez vos questions de bonne foi et évitez les généralisations : une religion ne se résume pas à l'un de ses fidèles.","> L'éducation apporte des informations ; le choix de croyance est personnel.","## À toi de jouer","Clique sur chaque religion dans le laboratoire pour voir ses origines, son texte et son lieu de culte."],
en:["## Studying religions without taking sides","A **religion** is a system of beliefs, practices, values and a community. In education we **describe** what people believe and explain it, without saying which religion is **true**. The aim is not to change anyone's beliefs but to understand.","## The major traditions","**Christianity** (Jesus; the Bible; the church); **Islam** (Muhammad; the Quran; the mosque); **Judaism** (the Torah; the synagogue); **Hinduism** (the Vedas and other texts; the temple); **Buddhism** (Siddhartha Gautama; temples and monasteries). Christians and Muslims are the two largest groups by number. There are also traditional religions and people with no religion.","## In Haiti","Haiti has many Catholics and Protestants, and **Vodou**: a religion rooted in West and Central African heritage, carried to Haiti and still alive. The Haitian State officially recognised Vodou as a religion in **2003**. The 1987 Constitution guarantees freedom of religion.","## Respect","Everyone has the right to believe, change religion or not believe. Speak with curiosity, ask questions in good faith and avoid generalisations: a religion is not summed up by any one follower.","> Education gives information; the choice of belief is personal.","## Try it","Click each religion in the lab to see its origins, text and place of worship."],
ru:["## Изучать религии, не принимая сторону","**Религия** — система верований, практик, ценностей и сообщество. В образовании мы **описываем**, во что верят люди, и объясняем это, не утверждая, какая религия **истинна**. Цель — не изменить чьи-то убеждения, а понять.","## Основные традиции","**Христианство** (Иисус; Библия; церковь); **ислам** (Мухаммед; Коран; мечеть); **иудаизм** (Тора; синагога); **индуизм** (Веды и другие тексты; храм); **буддизм** (Сиддхартха Гаутама; храмы и монастыри). Христиане и мусульмане — две самые многочисленные группы. Есть также традиционные религии и люди, не исповедующие никакой религии.","## На Гаити","На Гаити много католиков и протестантов, а также **вуду**: религия, уходящая корнями в наследие Западной и Центральной Африки, перенесённая на Гаити и живая до сих пор. Гаитянское государство официально признало вуду религией в **2003** году. Конституция 1987 года гарантирует свободу вероисповедания.","## Уважение","У каждого есть право верить, менять религию или не верить. Говорите с любопытством, задавайте вопросы добросовестно и избегайте обобщений: религию нельзя свести к одному верующему.","> Образование даёт информацию; выбор убеждений — личное дело.","## Попробуй сам","Нажимай на религии в лаборатории, чтобы увидеть их истоки, текст и место богослужения."]},
q:[{q:L("Ki sa yon etid relijyon nan edikasyon fè ?","Que fait une étude des religions en éducation ?","What does religious studies in education do?","Что делает изучение религий в образовании?"),o:[L("Dekri epi eksplike san jije","Décrit et explique sans juger","Describes and explains without judging","Описывает и объясняет, не осуждая"),L("Fòse moun chanje relijyon","Force à changer de religion","Forces people to change religion","Заставляет менять религию"),L("Pwouve ki relijyon ki vre","Prouve quelle religion est vraie","Proves which religion is true","Доказывает, какая религия истинна"),L("Entèdi kwayans","Interdit de croire","Bans belief","Запрещает верить")],a:0},
{q:L("Ki ane Leta ayisyen te rekonèt Vodou kòm relijyon ?","En quelle année l'État haïtien a-t-il reconnu le Vodou comme religion ?","In what year did the Haitian State recognise Vodou as a religion?","В каком году Гаити признало вуду религией?"),o:["1804","1987","2003","2010"],a:2},
{q:L("Ki tèks sakre Mizilman yo ?","Quel est le texte sacré des musulmans ?","What is the sacred text of Muslims?","Каков священный текст мусульман?"),o:[L("Koran","Coran","Quran","Коран"),L("Bib","Bible","Bible","Библия"),L("Tora","Torah","Torah","Тора"),L("Veda","Védas","Vedas","Веды")],a:0}]});

U("vpriv","Konfidansyalite : pa voye okenn dokiman nan fòm lan. Nou gade yo sèlman pandan apèl la epi nou pa kenbe kopi. Nou sèlman anrejistre si ou montre yo. Enfòmasyon w yo (non, imèl) sèvi sèlman pou sa, epi ou ka mande nou efase yo.","Confidentialité : n'envoyez aucun document dans ce formulaire. Nous les regardons seulement pendant l'appel et n'en gardons aucune copie ; nous notons seulement que vous les avez présentés. Vos informations (nom, e-mail) ne servent qu'à cela et vous pouvez demander leur effacement.","Privacy: do not send any document in this form. We only look at them during the call and keep no copy; we only record that you showed them. Your details (name, email) are used only for this and you can ask us to delete them.","Конфиденциальность: не отправляйте документы через форму. Мы смотрим их только во время звонка и не храним копий; мы лишь отмечаем, что вы их показали. Ваши данные (имя, e-mail) используются только для этого, и вы можете попросить их удалить.");

sum:L("Ou gen dwa deside sa ki rive kò w. Konnen règ sekirite yo.","Vous avez le droit de décider de ce qui arrive à votre corps. Les règles de sécurité à connaître.","You have the right to decide what happens to your body. The safety rules to know.","У вас есть право решать, что происходит с вашим телом. Правила безопасности."),
b:{
ht:["## Kò w se pa w","Kò w se pa w. Pèsonn pa gen dwa touche w, gade w oswa fè w fè bagay ki fè w pè oswa ki pa fè w plezi. Sa vre pou tout moun : timoun, jèn ak granmoun.","## Pati prive yo","Pati prive yo se pati kò a ki kouvri ak rad anba. Yo gen non yo (tankou anndan kwis, pwatrin, fès) epi se pou nou aprann yo ak non vre yo. Sèl moun ki ka touche yo se ou menm, oswa yon doktè oswa yon paran ki ap bay swen ou, e sa dwe fèt ak rezon sante epi pa an kachèt.","## Touche ki bon, touche ki pa bon","Gen touche ki fè w santi w byen (yon gwo bra, yon kalen). Gen touche ki fè w santi w mal, ki fè w pè oswa ki mele. Si yon touche pa fè w plezi, ou gen dwa di **non**, ale, epi di yon granmoun ou fè konfyans.","> Règ enpòtan : yon sekrè ki fè w pè oswa ki fè w mal pa janm yon bon sekrè. Ou ka toujou rakonte l.","## Si yon moun fè w mal","Se pa fòt ou. Pa gen moun, menm yon moun ou konnen oswa ou renmen, ki gen dwa mande w kenbe sekrè sou yon bagay ki fè w mal. Pale ak yon granmoun ou fè konfyans, jiskaske yon moun koute w."],
fr:["## Votre corps est à vous","Votre corps est à vous. Personne n'a le droit de vous toucher, de vous regarder ou de vous faire faire des choses qui vous font peur ou que vous ne voulez pas. C'est vrai pour tout le monde : enfants, adolescents et adultes.","## Les parties intimes","Les parties intimes sont celles que couvrent les sous-vêtements. Elles ont des noms (comme l'intérieur des cuisses, la poitrine, les fesses) et il est utile de les appeler par leur vrai nom. Seuls vous-même, ou un médecin ou un parent qui vous soigne, peuvent les toucher, pour une raison de santé et jamais en cachette.","## Les touchers qui font du bien, ceux qui ne vont pas","Certains touchers font du bien (un câlin, une caresse). D'autres font mal, font peur ou mettent mal à l'aise. Si un toucher ne vous convient pas, vous avez le droit de dire **non**, de partir, et d'en parler à un adulte de confiance.","> Règle importante : un secret qui fait peur ou qui fait mal n'est jamais un bon secret. Vous pouvez toujours le raconter.","## Si quelqu'un vous fait du mal","Ce n'est pas votre faute. Personne, même quelqu'un que vous connaissez ou aimez, n'a le droit de vous demander de garder le secret sur ce qui vous fait du mal. Parlez à un adulte de confiance, jusqu'à ce que quelqu'un vous écoute."],
en:["## Your body is yours","Your body is yours. Nobody has the right to touch you, look at you or make you do things that scare you or that you do not want. This is true for everyone: children, teenagers and adults.","## Private parts","Private parts are the ones covered by underwear. They have proper names (such as the inner thighs, chest, buttocks) and it helps to use the real names. Only you, or a doctor or a parent who is caring for you, may touch them, for a health reason and never in secret.","## Touches that feel good and touches that are not okay","Some touches feel good (a hug, a pat). Others hurt, scare you or make you uncomfortable. If a touch is not okay with you, you have the right to say **no**, to leave, and to tell a trusted adult.","> Important rule: a secret that scares you or hurts you is never a good secret. You can always tell.","## If someone hurts you","It is not your fault. Nobody, even someone you know or love, may ask you to keep secret something that hurts you. Talk to a trusted adult, until someone listens."],
ru:["## Ваше тело принадлежит вам","Ваше тело принадлежит вам. Никто не имеет права трогать вас, разглядывать или заставлять делать то, что пугает или чего вы не хотите. Это верно для всех: детей, подростков и взрослых.","## Интимные части тела","Интимные части — те, что закрыты нижним бельём. У них есть правильные названия, и полезно называть их по-настоящему. Трогать их могут только вы сами, а также врач или родитель, который ухаживает за вами, — по медицинской причине и никогда тайком.","## Прикосновения: приятные и неприемлемые","Одни прикосновения приятны (объятие, поглаживание). Другие причиняют боль, пугают или вызывают неловкость. Если прикосновение вам не подходит, вы вправе сказать **«нет»**, уйти и рассказать доверенному взрослому.","> Важное правило: секрет, который пугает или причиняет боль, никогда не бывает хорошим секретом. Вы всегда можете рассказать.","## Если кто-то причиняет вам вред","Это не ваша вина. Никто, даже знакомый или близкий человек, не вправе просить вас хранить в тайне то, что причиняет вам боль. Говорите с доверенным взрослым, пока вас не услышат."]},

b:{
ht:["## Rekonèt siy yo","Kèk siy ka di ou ke yon sitiyasyon pa an sekirite : yon moun mande w kenbe yon sekrè, ba w kado pou w kenbe bouch, mande w fè bagay an kachèt, oswa ensiste lè w di non. Sa ka rive ak yon moun ou konnen, tankou ak yon moun ou pa konnen, epi sou entènèt tou.","## Di non klè","Ou ka di : **\"Non, mwen pa vle.\"** Ou pa oblije eksplike. Ou gen dwa ale oswa rele. Si w pè di li, ou ka ale jwenn yon moun dirèkteman.","## Chwazi moun ou fè konfyans","Ou ka chwazi 2 oswa 3 granmoun ou fè konfyans (yon paran, yon pwofesè, yon gran fanmi, yon dokter). Si premye a pa koute w, ale jwenn yon lòt. Kontinye jiskaske yon moun koute w.","> Si w nan danje imedyat, ale kote gen moun epi mande èd.","## Sou entènèt","Pa voye foto prive. Si yon moun mande w sa, di non, kenbe mesaj yo epi montre yo ak yon granmoun ou fè konfyans. Ou pa fè anyen ki mal lè w rapòte l."],
fr:["## Reconnaître les signes","Certains signes montrent qu'une situation n'est pas sûre : on vous demande de garder un secret, on vous offre des cadeaux pour que vous vous taisiez, on vous demande de faire des choses en cachette, ou on insiste quand vous dites non. Cela peut venir d'une personne connue comme d'un inconnu, et aussi sur Internet.","## Dire non clairement","Vous pouvez dire : **« Non, je ne veux pas. »** Vous n'avez pas à vous justifier. Vous avez le droit de partir ou d'appeler. Si c'est trop difficile à dire, allez directement vers quelqu'un.","## Choisir ses adultes de confiance","Vous pouvez choisir 2 ou 3 adultes de confiance (un parent, un enseignant, un grand-parent, un médecin). Si le premier ne vous écoute pas, allez voir un autre. Continuez jusqu'à ce que quelqu'un vous écoute.","> En cas de danger immédiat, allez là où il y a du monde et demandez de l'aide.","## Sur Internet","N'envoyez pas de photos intimes. Si quelqu'un vous le demande, dites non, gardez les messages et montrez-les à un adulte de confiance. Vous ne faites rien de mal en le signalant."],
en:["## Spot the signs","Some signs show a situation is not safe: you are asked to keep a secret, given gifts to keep quiet, asked to do things in private, or pushed when you say no. This can come from someone you know or a stranger, and also online.","## Say no clearly","You can say: **\"No, I don't want to.\"** You do not have to explain. You have the right to leave or call out. If it is too hard to say, go straight to someone.","## Choose your trusted adults","You can pick 2 or 3 trusted adults (a parent, a teacher, a grandparent, a doctor). If the first one does not listen, go to another. Keep going until someone listens.","> In immediate danger, go where there are people and ask for help.","## Online","Do not send private pictures. If someone asks, say no, keep the messages and show them to a trusted adult. You are doing nothing wrong by reporting it."],
ru:["## Признаки опасности","Некоторые признаки показывают, что ситуация небезопасна: вас просят хранить секрет, дарят подарки за молчание, просят делать что-то тайком или настаивают после вашего «нет». Это может исходить от знакомого и от незнакомца, а также в интернете.","## Скажите «нет» ясно","Можно сказать: **«Нет, я не хочу».** Объяснять не обязательно. Вы вправе уйти или позвать на помощь. Если трудно сказать, просто идите к людям.","## Выберите доверенных взрослых","Выберите 2–3 доверенных взрослых (родитель, учитель, бабушка или дедушка, врач). Если первый не слушает, идите к другому. Продолжайте, пока вас не услышат.","> При непосредственной опасности идите туда, где есть люди, и просите о помощи.","## В интернете","Не отправляйте интимные фото. Если просят, откажитесь, сохраните сообщения и покажите доверенному взрослому. Вы ничего плохого не делаете, когда сообщаете об этом."]},

ART.push({id:"sx-pibete",s:"sexo",lv:2,age:14,min:5,img:"heart",lab:"sxmyth",w:["puberte"],
t:L("Pibète : sa k ap chanje nan kò w","La puberté : ce qui change dans le corps","Puberty: what changes in your body","Половое созревание: что меняется в теле"),
sum:L("Chanjman nòmal pou fi ak gason, ijyèn ak ki lè pou w pale ak yon doktè.","Changements normaux chez les filles et les garçons, hygiène, et quand en parler à un médecin.","Normal changes in girls and boys, hygiene, and when to talk to a doctor.","Нормальные изменения у девочек и мальчиков, гигиена и когда говорить с врачом."),
b:{
ht:["## Yon chanjman nòmal","**Pibète** se peryòd kote kò a chanje pou vin kò yon granmoun. Li kòmanse anjeneral ant 8 ak 13 an pou fi, ak ant 9 ak 14 an pou gason, men chak moun gen pwòp ritm li. Gen moun ki kòmanse bonè, gen lòt ki kòmanse reta, epi tou de nòmal.","## Sa k ap chanje","Kò a grandi vit, po a vin pi gra, plis plim ak pwal parèt, sant swè a vin pi fò, epi vwa a ka chanje (sitou nan gason). Nan fi, tete yo grandi epi règ yo kòmanse, anjeneral alantou 12 an men ant 9 ak 15 an se nòmal. Nan gason, ògàn jenital yo grandi epi ka gen ejakilasyon pandan nuit.","## Règ yo (règ fi)","Règ yo se yon sik natirèl, anjeneral chak 21 a 35 jou, ki dire 3 a 7 jou. Nan kòmansman, sik la ka iregilye. Itilize sèvyèt oswa tanpon pwòp epi chanje yo souvan. Kèk doulè nan vant se komen, men si doulè a twò fò oswa san an twòp, wè yon doktè.","## Ijyèn ak emosyon","Lave kò w chak jou ak savon, chanje rad ak soulye ou, epi bwose dan. Emosyon yo ka chanje vit pandan pibète : sa nòmal. Pale ak yon granmoun ou fè konfyans oswa yon pwofesyonèl sante si w gen kesyon.","> Pa gen yon kò \"nòmal\" ki sanble ak tout lòt yo. Chak kò diferan."],
fr:["## Un changement normal","La **puberté** est la période où le corps se transforme en corps d'adulte. Elle commence en général entre 8 et 13 ans chez les filles et entre 9 et 14 ans chez les garçons, mais chacun a son rythme. Certains commencent tôt, d'autres tard : les deux sont normaux.","## Ce qui change","Le corps grandit vite, la peau devient plus grasse, des poils apparaissent, la transpiration sent plus fort, et la voix peut changer (surtout chez les garçons). Chez les filles, la poitrine se développe et les règles apparaissent, en général vers 12 ans mais entre 9 et 15 ans reste normal. Chez les garçons, les organes génitaux grandissent et des éjaculations peuvent survenir la nuit.","## Les règles","Les règles sont un cycle naturel, en général tous les 21 à 35 jours, et durent 3 à 7 jours. Au début, le cycle peut être irrégulier. Utilisez des serviettes ou des tampons propres et changez-les souvent. Quelques douleurs au ventre sont courantes ; si la douleur est très forte ou les saignements très abondants, consultez un médecin.","## Hygiène et émotions","Lavez-vous chaque jour avec du savon, changez de vêtements et de chaussettes, brossez-vous les dents. Les émotions peuvent varier vite pendant la puberté : c'est normal. Parlez à un adulte de confiance ou à un professionnel de santé si vous avez des questions.","> Il n'existe pas de corps « normal » qui ressemblerait à tous les autres. Chaque corps est différent."],
en:["## A normal change","**Puberty** is the period when the body changes into an adult body. It usually starts between ages 8 and 13 in girls and between 9 and 14 in boys, but everyone has their own pace. Some start early and some late: both are normal.","## What changes","The body grows fast, skin gets oilier, body hair appears, sweat smells stronger, and the voice may change (especially in boys). In girls the breasts develop and periods begin, usually around age 12 but anywhere from 9 to 15 is normal. In boys the genitals grow and nocturnal emissions may happen.","## Periods","A period is a natural cycle, usually every 21 to 35 days, lasting 3 to 7 days. At first the cycle may be irregular. Use clean pads or tampons and change them often. Some tummy pain is common; if pain is very strong or bleeding is very heavy, see a doctor.","## Hygiene and feelings","Wash daily with soap, change clothes and socks, brush your teeth. Feelings can swing quickly during puberty: this is normal. Talk to a trusted adult or a health professional if you have questions.","> There is no single \"normal\" body that everyone should look like. Every body is different."],
ru:["## Нормальное изменение","**Половое созревание** — период, когда тело становится телом взрослого. Обычно оно начинается у девочек в 8–13 лет, у мальчиков в 9–14, но у каждого свой темп. Кто-то начинает рано, кто-то поздно: оба варианта нормальны.","## Что меняется","Тело быстро растёт, кожа становится жирнее, появляются волосы на теле, усиливается запах пота, у мальчиков может меняться голос. У девочек развивается грудь и начинаются месячные — обычно около 12 лет, но от 9 до 15 лет тоже нормально. У мальчиков растут половые органы, возможны ночные поллюции.","## Месячные","Месячные — естественный цикл, обычно раз в 21–35 дней, длятся 3–7 дней. Вначале цикл может быть нерегулярным. Пользуйтесь чистыми прокладками или тампонами и меняйте их часто. Лёгкая боль внизу живота обычна; если боль очень сильная или кровотечение очень обильное, обратитесь к врачу.","## Гигиена и эмоции","Мойтесь ежедневно с мылом, меняйте одежду и носки, чистите зубы. Эмоции в этот период быстро меняются — это нормально. Если есть вопросы, поговорите с доверенным взрослым или медработником.","> Не существует единого «нормального» тела, на которое все должны быть похожи. Каждое тело особенное."]},
q:[{q:L("Ki laj pibète kòmanse anjeneral nan fi ?","À quel âge la puberté commence-t-elle en général chez les filles ?","At what age does puberty usually start in girls?","В каком возрасте обычно начинается половое созревание у девочек?"),o:["8–13","3–5","20–25","30+"],a:0},
{q:L("Èske li nòmal si pibète kòmanse reta pou yon moun ?","Est-il normal que la puberté commence plus tard pour certains ?","Is it normal for puberty to start later for some people?","Нормально ли, что у кого-то половое созревание начинается позже?"),o:[L("Wi, chak moun gen pwòp ritm li","Oui, chacun a son rythme","Yes, everyone has their own pace","Да, у каждого свой темп"),L("Non, sa grav","Non, c'est grave","No, it is serious","Нет, это серьёзно"),L("Se fòt moun nan","C'est de sa faute","It is their fault","Это его вина"),L("Se yon maladi toujou","C'est toujours une maladie","It is always a disease","Это всегда болезнь")],a:0},
{q:L("Ki lè pou w wè yon doktè pou règ ?","Quand voir un médecin pour les règles ?","When should you see a doctor about periods?","Когда обратиться к врачу из-за месячных?"),o:[L("Si doulè a twò fò oswa san an twòp","Si la douleur est très forte ou les saignements très abondants","If pain is very strong or bleeding very heavy","Если боль очень сильная или кровотечение обильное"),L("Pa janm","Jamais","Never","Никогда"),L("Chak jou","Chaque jour","Every day","Каждый день"),L("Sèlman nan laj 30 an","Seulement à 30 ans","Only at age 30","Только в 30 лет")],a:0}]});

t:L("Konsantman : yon wi ki lib, klè epi ki ka chanje","Le consentement : un oui libre, clair et réversible","Consent: a free, clear and reversible yes","Согласие: свободное, ясное и обратимое «да»"),
sum:L("Ki sa konsantman vle di, ak ki sitiyasyon kote li pa posib.","Ce que veut dire le consentement, et les situations où il n'est pas possible.","What consent means, and the situations where it is not possible.","Что такое согласие и когда оно невозможно."),
b:{
ht:["## Ki sa konsantman ye","**Konsantman** se yon \"wi\" ki **lib** (san presyon), **klè**, pou yon bagay **presi**, epi ki ka **chanje nenpòt ki lè**. Si w te di wi yon fwa, ou toujou gen dwa di non apre.","## Sa ki pa konsantman","Silans pa konsantman. Yon moun ki pa di non pa vle di li dakò. Yon \"wi\" ki soti nan menas, chantaj, presyon, ensistans, pè oswa dwòg pa yon vrè wi. Yon moun ki dòmi, ki sou dwòg, ki sou alkòl, oswa ki twò jèn pa ka bay konsantman.","## Ki jan pou mande ak koute","Mande klèman : \"Èske sa fè w plezi ?\" \"Èske w vle sa ?\" Si repons lan se non, si moun nan ezite, oswa si li rete silans, sispann. Respekte repons lan san ensiste.","> Konsantman an aplike nan tout relasyon, menm ant moun ki marye oswa ki ansanm depi lontan.","## Lalwa","Lwa chak peyi fikse yon laj minimòm ak règ presi sou vyolans seksyèl. Pou konnen sa lalwa ayisyen di egzakteman, mande yon avoka oswa otorite lokal yo. Konsantman morèl la rete menm bagay kèlkeswa lalwa a : pa fòse pèsonn."],
fr:["## Ce qu'est le consentement","Le **consentement** est un « oui » **libre** (sans pression), **clair**, pour une chose **précise**, et qui peut **changer à tout moment**. Si vous avez dit oui une fois, vous avez toujours le droit de dire non ensuite.","## Ce qui n'est pas du consentement","Le silence n'est pas un consentement. Ne pas dire non ne veut pas dire être d'accord. Un « oui » obtenu par menace, chantage, pression, insistance, peur ou drogue n'est pas un vrai oui. Une personne endormie, sous l'effet de drogues ou d'alcool, ou trop jeune ne peut pas donner son consentement.","## Demander et écouter","Demandez clairement : « Est-ce que ça te va ? » « Tu en as envie ? » Si la réponse est non, si la personne hésite ou reste silencieuse, arrêtez. Respectez la réponse sans insister.","> Le consentement s'applique dans toutes les relations, y compris entre personnes mariées ou ensemble depuis longtemps.","## La loi","La loi de chaque pays fixe un âge minimum et des règles précises sur les violences sexuelles. Pour savoir exactement ce que dit la loi haïtienne, demandez à un avocat ou aux autorités locales. Le consentement moral reste le même quelle que soit la loi : ne forcez jamais personne."],
en:["## What consent is","**Consent** is a **free** (no pressure), **clear** \"yes\" to one **specific** thing, and it can **change at any time**. If you said yes once, you always have the right to say no afterwards.","## What is not consent","Silence is not consent. Not saying no does not mean agreeing. A \"yes\" obtained by threats, blackmail, pressure, pushing, fear or drugs is not a real yes. A person who is asleep, under drugs or alcohol, or too young cannot give consent.","## Asking and listening","Ask clearly: \"Is this okay with you?\" \"Do you want this?\" If the answer is no, if the person hesitates or stays silent, stop. Respect the answer without pushing.","> Consent applies in every relationship, including between married people or people together for a long time.","## The law","Each country's law sets a minimum age and precise rules on sexual violence. To know exactly what Haitian law says, ask a lawyer or the local authorities. Moral consent is the same whatever the law: never force anyone."],
ru:["## Что такое согласие","**Согласие** — это **свободное** (без давления), **ясное** «да» на что-то **конкретное**, которое можно **изменить в любой момент**. Если вы однажды сказали «да», вы всегда вправе потом сказать «нет».","## Что не является согласием","Молчание — не согласие. Отсутствие «нет» не означает «да». «Да», полученное угрозами, шантажом, давлением, настойчивостью, страхом или наркотиками, — не настоящее «да». Человек, который спит, находится под действием наркотиков или алкоголя либо слишком юн, не может дать согласие.","## Спросить и услышать","Спрашивайте прямо: «Тебе это подходит?» «Ты этого хочешь?» Если ответ «нет», если человек колеблется или молчит — остановитесь. Уважайте ответ, не настаивая.","> Согласие нужно в любых отношениях, в том числе между супругами и давними партнёрами.","## Закон","Закон каждой страны устанавливает минимальный возраст и точные правила о сексуальном насилии. Чтобы узнать, что именно говорит гаитянское право, обратитесь к юристу или местным властям. Моральное согласие не зависит от закона: никогда никого не принуждайте."]},
q:[{q:L("Silans vle di wi ?","Le silence veut-il dire oui ?","Does silence mean yes?","Означает ли молчание «да»?"),o:[L("Non, pa janm","Non, jamais","No, never","Нет, никогда"),L("Wi toujou","Oui, toujours","Yes, always","Да, всегда"),L("Wi si li dire lontan","Oui, s'il dure","Yes, if it lasts","Да, если долго"),L("Sa depann de moun nan","Cela dépend de la personne","It depends on the person","Зависит от человека")],a:0},
{q:L("Èske yon moun ki te di wi ka chanje lide ?","Une personne qui a dit oui peut-elle changer d'avis ?","Can someone who said yes change their mind?","Может ли человек, сказавший «да», передумать?"),o:[L("Wi, nenpòt ki lè","Oui, à tout moment","Yes, at any time","Да, в любой момент"),L("Non, li twò ta","Non, trop tard","No, it is too late","Нет, поздно"),L("Sèlman yon fwa","Une seule fois","Only once","Только один раз"),L("Sèlman si lòt la dakò","Seulement si l'autre est d'accord","Only if the other agrees","Только если другой согласен")],a:0},
{q:L("Moun ki sou dwòg oswa alkòl ka bay konsantman ?","Une personne sous drogue ou alcool peut-elle consentir ?","Can someone under drugs or alcohol consent?","Может ли человек под действием наркотиков или алкоголя дать согласие?"),o:[L("Non","Non","No","Нет"),L("Wi","Oui","Yes","Да"),L("Si li di wi","Si elle dit oui","If they say yes","Если сказал «да»"),L("Si se yon zanmi","Si c'est un ami","If it is a friend","Если это друг")],a:0}]});

ART.push({id:"sx-relasyon",s:"sexo",lv:2,age:14,min:5,img:"heart",lab:"sxrel",w:["consentement"],
t:L("Relasyon ki an sante ak siy danje","Relations saines et signes d'alerte","Healthy relationships and warning signs","Здоровые отношения и тревожные признаки"),
sum:L("Rekonèt sa ki an sante, sa ki kontwòl, ak kote pou w jwenn èd.","Reconnaître ce qui est sain, ce qui est du contrôle, et où trouver de l'aide.","Tell healthy from controlling, and where to find help.","Отличить здоровое от контроля и узнать, где искать помощь."),
b:{
ht:["## Yon relasyon ki an sante","Nan yon relasyon ki an sante, de moun yo respekte youn lòt, di verite, kapab di non san pè, gen pwòp zanmi yo ak pwòp lide yo, epi rezoud pwoblèm yo san kriye sou yo, san menas ak san vyolans.","## Siy ki dwe alète w","Jalouzi ki twòp, kontwòl telefòn ou, entèdi w wè zanmi oswa fanmi w, joure w, imilye w, menas, kraze bagay, pouse oswa frape w, fòse w fè bagay ou pa vle. Sa yo se vyolans oswa kontwòl, menm si moun nan di li renmen w.","## Sik vyolans lan","Souvan, vyolans lan vini ak eskiz, kado oswa pwomès pou chanje. Apre sa li rekòmanse. Sa pa fòt ou. Moun ki fè vyolans lan sèl responsab.","> Renmen pa janm bay dwa pou fè mal.","## Ki sa pou w fè","Pale ak yon zanmi, yon fanmi, yon pwofesè, yon doktè oswa yon òganizasyon ki ede moun. Si w pè pou sekirite w, planifye yon kote ki an sekirite pou w ale, epi kenbe nimewo moun ou fè konfyans yo."],
fr:["## Une relation saine","Dans une relation saine, les deux personnes se respectent, disent la vérité, peuvent dire non sans crainte, gardent leurs amis et leurs idées, et règlent les désaccords sans cris, sans menaces et sans violence.","## Les signes d'alerte","Jalousie excessive, contrôle du téléphone, interdiction de voir ses amis ou sa famille, insultes, humiliations, menaces, objets cassés, bousculades ou coups, pression pour faire ce qu'on ne veut pas. Ce sont des violences ou du contrôle, même si la personne dit vous aimer.","## Le cycle de la violence","Souvent, la violence est suivie d'excuses, de cadeaux ou de promesses de changer. Puis elle recommence. Ce n'est pas votre faute. La personne qui fait violence est seule responsable.","> L'amour ne donne jamais le droit de faire mal.","## Que faire","Parlez à un ami, un proche, un enseignant, un médecin ou une organisation d'aide. Si vous craignez pour votre sécurité, prévoyez un endroit sûr où aller et gardez sous la main les numéros de personnes de confiance."],
en:["## A healthy relationship","In a healthy relationship, both people respect each other, tell the truth, can say no without fear, keep their own friends and ideas, and settle disagreements without shouting, threats or violence.","## Warning signs","Excessive jealousy, checking your phone, forbidding you to see friends or family, insults, humiliation, threats, breaking things, pushing or hitting, pressure to do what you do not want. These are violence or control, even if the person says they love you.","## The cycle of violence","Violence is often followed by apologies, gifts or promises to change. Then it starts again. It is not your fault. The person who is violent is solely responsible.","> Love never gives the right to hurt.","## What to do","Talk to a friend, a relative, a teacher, a doctor or a support organisation. If you fear for your safety, plan a safe place to go and keep the numbers of people you trust at hand."],
ru:["## Здоровые отношения","В здоровых отношениях двое уважают друг друга, говорят правду, могут сказать «нет» без страха, сохраняют друзей и свои взгляды и решают споры без крика, угроз и насилия.","## Тревожные признаки","Чрезмерная ревность, проверка телефона, запрет видеться с друзьями или семьёй, оскорбления, унижения, угрозы, битьё вещей, толчки или удары, давление, чтобы вы делали то, чего не хотите. Это насилие или контроль, даже если человек говорит, что любит вас.","## Цикл насилия","За насилием часто следуют извинения, подарки или обещания измениться. Потом всё повторяется. Это не ваша вина. Ответственность лежит только на том, кто применяет насилие.","> Любовь никогда не даёт права причинять боль.","## Что делать","Поговорите с другом, родственником, учителем, врачом или организацией помощи. Если опасаетесь за безопасность, продумайте безопасное место, куда можно уйти, и держите под рукой номера людей, которым доверяете."]},
q:[{q:L("Ki sa ki se yon siy alèt ?","Lequel est un signe d'alerte ?","Which is a warning sign?","Что является тревожным признаком?"),o:[L("Entèdi w wè zanmi w","Vous interdire de voir vos amis","Forbidding you to see friends","Запрет видеться с друзьями"),L("Di verite","Dire la vérité","Telling the truth","Говорить правду"),L("Respekte non","Respecter un non","Respecting a no","Уважать «нет»"),L("Gen pwòp lide","Avoir ses idées","Having own ideas","Иметь свои взгляды")],a:0},
{q:L("Ki moun ki responsab vyolans lan ?","Qui est responsable de la violence ?","Who is responsible for the violence?","Кто отвечает за насилие?"),o:[L("Moun ki fè vyolans lan","La personne violente","The person who is violent","Тот, кто применяет насилие"),L("Viktim nan","La victime","The victim","Жертва"),L("Zanmi yo","Les amis","The friends","Друзья"),L("Pèsonn","Personne","Nobody","Никто")],a:0},

t:L("Kontrasepsyon ak gwosès : fè yon chwa enfòme","Contraception et grossesse : faire un choix éclairé","Contraception and pregnancy: making an informed choice","Контрацепция и беременность: осознанный выбор"),
sum:L("Metòd yo, ki jan yo mache, ak mit yo ki pa vre.","Les méthodes, comment elles fonctionnent, et les idées fausses.","The methods, how they work, and common myths.","Методы, как они работают и распространённые мифы."),
b:{
ht:["## Yon gwosès ka rive nenpòt ki lè","Yon gwosès ka rive depi yon fi gen ovilasyon, menm nan premye relasyon li. Se pa vre ke yon fi pa ka ansent \"nan premye fwa\" oswa \"si li kanpe\". Reti anvan ejakilasyon (retrè) pa fyab.","## Metòd prensipal yo","**Kondòm** (maskilen oswa fimèl) : li bloke espèm lan epi li pwoteje tou kont anpil IST, men li dwe itilize kòrèkteman chak fwa. **Pilil, enplan, piki, andedan (DIU)** : yo anpeche gwosès men yo pa pwoteje kont IST. Yon doktè oswa yon enfimyè ka ede w chwazi sa ki bon pou ou.","## Kontrasepsyon dijans","Si yon relasyon te fèt san pwoteksyon oswa si yon metòd te echwe, gen yon pilil dijans ki ka evite gwosès si w pran l **le pli vit posib**, ideyalman nan 3 jou ; kèk metòd mache jiska 5 jou. Mande yon famasyen oswa yon sant sante. Li pa fè avòtman.","## Mit ki pa vre","Pa gen okenn \"remèd lakay\" ki fyab pou evite gwosès. Pilil kontrasepsyon pa fè moun enfètil. Pa gen yon laj kote w \"twò jèn\" pou mande enfòmasyon.","> Si w ansent oswa w panse w ansent, ale wè yon doktè oswa yon sant sante pi vit posib pou swen ak sipò."],
fr:["## Une grossesse peut arriver à tout moment","Une grossesse peut survenir dès qu'une fille a des ovulations, même lors du premier rapport. Il est faux qu'on ne peut pas être enceinte « la première fois » ou « debout ». Le retrait avant l'éjaculation n'est pas fiable.","## Les principales méthodes","Le **préservatif** (masculin ou féminin) bloque les spermatozoïdes et protège aussi contre de nombreuses IST, mais il doit être bien utilisé à chaque fois. La **pilule, l'implant, l'injection, le stérilet (DIU)** évitent une grossesse mais ne protègent pas des IST. Un médecin ou une infirmière peut aider à choisir.","## La contraception d'urgence","Après un rapport non protégé ou l'échec d'une méthode, une pilule d'urgence peut éviter une grossesse si elle est prise **le plus tôt possible**, idéalement dans les 3 jours ; certaines méthodes agissent jusqu'à 5 jours. Demandez à un pharmacien ou à un centre de santé. Ce n'est pas une pilule abortive.","## Idées fausses","Aucun « remède de grand-mère » n'est fiable pour éviter une grossesse. La pilule ne rend pas stérile. Il n'y a pas d'âge où l'on serait « trop jeune » pour demander des informations.","> Si vous êtes enceinte ou pensez l'être, consultez un médecin ou un centre de santé le plus tôt possible pour des soins et un soutien."],
en:["## Pregnancy can happen at any time","Pregnancy can happen as soon as a girl ovulates, even the first time. It is false that you cannot get pregnant \"the first time\" or \"standing up\". Withdrawal before ejaculation is not reliable.","## The main methods","The **condom** (male or female) blocks sperm and also protects against many STIs, but it must be used correctly every time. **The pill, implant, injection and intrauterine device (IUD)** prevent pregnancy but do not protect against STIs. A doctor or nurse can help you choose.","## Emergency contraception","After unprotected sex or a method failure, an emergency pill can prevent pregnancy if taken **as soon as possible**, ideally within 3 days; some methods work up to 5 days. Ask a pharmacist or a health centre. It is not an abortion pill.","## Myths","No home remedy is reliable for preventing pregnancy. The pill does not make you infertile. There is no age at which you are \"too young\" to ask for information.","> If you are pregnant or think you might be, see a doctor or a health centre as soon as possible for care and support."],
ru:["## Беременность возможна в любой момент","Беременность может наступить, как только у девушки происходит овуляция, даже при первом контакте. Неверно, что нельзя забеременеть «в первый раз» или «стоя». Прерванный половой акт ненадёжен.","## Основные методы","**Презерватив** (мужской или женский) задерживает сперматозоиды и защищает от многих ИППП, но использовать его нужно правильно и каждый раз. **Таблетки, имплант, инъекции, спираль (ВМС)** предотвращают беременность, но не защищают от ИППП. Выбрать метод поможет врач или медсестра.","## Экстренная контрацепция","После незащищённого контакта или сбоя метода экстренная таблетка может предотвратить беременность, если принять её **как можно раньше**, в идеале в течение 3 дней; некоторые средства действуют до 5 дней. Спросите в аптеке или центре здоровья. Это не абортивная таблетка.","## Мифы","Ни одно «домашнее средство» не защищает надёжно от беременности. Таблетки не делают бесплодной. Нет возраста, в котором вы «слишком молоды», чтобы спрашивать.","> Если вы беременны или думаете, что беременны, как можно скорее обратитесь к врачу или в центр здоровья за помощью и поддержкой."]},
q:[{q:L("Ki metòd ki pwoteje kont IST ?","Quelle méthode protège aussi des IST ?","Which method also protects against STIs?","Какой метод защищает и от ИППП?"),o:[L("Kondòm","Le préservatif","The condom","Презерватив"),L("Pilil","La pilule","The pill","Таблетки"),L("Reti","Le retrait","Withdrawal","Прерванный акт"),L("Anyen","Aucune","None","Никакой")],a:0},

{q:L("Pilil dijans lan se yon pilil avòtman ?","La pilule d'urgence est-elle abortive ?","Is the emergency pill an abortion pill?","Является ли экстренная таблетка абортивной?"),o:[L("Non","Non","No","Нет"),L("Wi","Oui","Yes","Да"),L("Sèlman pafwa","Parfois","Sometimes","Иногда"),L("Se menm bagay","C'est la même chose","It is the same thing","Это одно и то же")],a:0}]});

t:L("IST ak VIH : prevni, teste, trete","IST et VIH : prévenir, dépister, soigner","STIs and HIV: prevent, test, treat","ИППП и ВИЧ: предупредить, проверить, лечить"),
sum:L("Sa ki vre ak sa ki mit, ak ki jan pou pwoteje w.","Ce qui est vrai et ce qui est faux, et comment se protéger.","What is true, what is myth, and how to protect yourself.","Что правда, что миф и как защититься."),
b:{
ht:["## Ki sa IST yo ye","**IST** (enfeksyon seksyèlman transmisib) se enfeksyon ki pase pa kontak seksyèl. Anpil pa gen okenn sentòm, kidonk yon moun ka gen yonn san li pa konnen. Se sèl yon tès ki ka konfime.","## Ki sa ki ka geri","IST ki soti nan bakteri (tankou klamidya, gonore, sifilis) ka **geri** ak antibyotik si w trete yo bonè. Sa ki soti nan viris (tankou VIH, èpès, HPV, epatit B) pa toujou geri men anpil ka kontwole. Gen **vaksen** kont HPV ak epatit B.","## VIH an kèk mo","**VIH** febli sistèm defans kò a. Li transmèt pa relasyon san pwoteksyon, pa san kontamine, ak de manman bay pitit li pandan gwosès, akouchman oswa alètman. Li **pa** pase pa anbrase, pataje manje, kouvèti, oswa moustik. Gen **tretman** (ARV) ki kenbe viris la anba kontwòl : yon moun ki sou tretman e ki gen chaj viral **endetektab** pa transmèt VIH pa relasyon seksyèl. Gen tou **PrEP** (medikaman pou prevni) ak **PEP** (tretman dijans ki dwe kòmanse le pli vit posib, ideyalman nan 72 èdtan apre yon risk).","## Ki jan pou pwoteje w","Itilize kondòm kòrèkteman chak fwa, fè tès regilyèman, fè vaksen yo, pale ak patnè w, epi pa pataje zegui. Si w gen yon sentòm (ekoulman, doulè, boutòn, fè mal pou pipi) oswa si w gen yon risk, ale nan yon sant sante.","> Ou pa dwe wont pou w fè tès. Se yon aksyon responsab ki pwoteje w ak lòt moun."],
fr:["## Ce que sont les IST","Les **IST** (infections sexuellement transmissibles) sont des infections transmises lors de rapports sexuels. Beaucoup n'ont aucun symptôme : on peut en avoir une sans le savoir. Seul un test permet de le confirmer.","## Ce qui se guérit","Les IST dues à des bactéries (comme la chlamydia, la gonorrhée, la syphilis) se **guérissent** par antibiotiques si elles sont traitées tôt. Celles dues à des virus (comme le VIH, l'herpès, le HPV, l'hépatite B) ne guérissent pas toujours, mais beaucoup peuvent être contrôlées. Il existe des **vaccins** contre le HPV et l'hépatite B.","## Le VIH en bref","Le **VIH** affaiblit le système de défense du corps. Il se transmet par rapports non protégés, par du sang contaminé, et de la mère à l'enfant pendant la grossesse, l'accouchement ou l'allaitement. Il **ne** se transmet **pas** en s'embrassant, en partageant un repas, des couverts ou par les moustiques. Des **traitements** (ARV) maintiennent le virus sous contrôle : une personne sous traitement dont la charge virale est **indétectable** ne transmet pas le VIH par voie sexuelle. Il existe aussi la **PrEP** (médicament préventif) et le **TPE** (traitement d'urgence à commencer le plus tôt possible, idéalement dans les 72 heures après un risque).","## Se protéger","Utilisez correctement un préservatif à chaque rapport, faites-vous dépister régulièrement, faites les vaccins, parlez avec votre partenaire et ne partagez pas les aiguilles. Si vous avez un symptôme (écoulement, douleur, boutons, brûlures en urinant) ou si vous avez pris un risque, allez dans un centre de santé.","> Il n'y a pas à avoir honte de se faire dépister. C'est un geste responsable qui protège vous et les autres."],
en:["## What STIs are","**STIs** (sexually transmitted infections) are infections passed on through sexual contact. Many have no symptoms, so a person can have one without knowing. Only a test can confirm.","## What can be cured","STIs caused by bacteria (such as chlamydia, gonorrhoea, syphilis) can be **cured** with antibiotics if treated early. Those caused by viruses (such as HIV, herpes, HPV, hepatitis B) are not always curable, but many can be controlled. There are **vaccines** against HPV and hepatitis B.","## HIV in brief","**HIV** weakens the body's defences. It is passed on through unprotected sex, contaminated blood, and from mother to child during pregnancy, birth or breastfeeding. It is **not** passed on by hugging, sharing food or utensils, or by mosquitoes. **Treatment** (ART) keeps the virus under control: a person on treatment with an **undetectable** viral load does not pass HIV on sexually. There is also **PrEP** (preventive medicine) and **PEP** (emergency treatment to start as soon as possible, ideally within 72 hours after a risk).","## Protecting yourself","Use a condom correctly every time, get tested regularly, get the vaccines, talk with your partner and never share needles. If you have a symptom (discharge, pain, sores, burning when passing urine) or took a risk, go to a health centre.","> There is nothing shameful in getting tested. It is a responsible act that protects you and others."],
ru:["## Что такое ИППП","**ИППП** (инфекции, передающиеся половым путём) передаются при половом контакте. Многие протекают без симптомов, поэтому человек может болеть и не знать об этом. Подтвердить можно только анализом.","## Что излечимо","ИППП бактериальной природы (хламидиоз, гонорея, сифилис) **излечиваются** антибиотиками при раннем лечении. Вирусные (ВИЧ, герпес, ВПЧ, гепатит B) не всегда излечимы, но многие можно контролировать. Есть **вакцины** от ВПЧ и гепатита B.","## ВИЧ коротко","**ВИЧ** ослабляет защитные силы организма. Передаётся при незащищённом половом контакте, через заражённую кровь и от матери ребёнку во время беременности, родов или кормления. Он **не** передаётся при объятиях, через общую еду, посуду или комаров. **Лечение** (АРВ-терапия) держит вирус под контролем: человек на лечении с **неопределяемой** вирусной нагрузкой не передаёт ВИЧ половым путём. Есть также **ДКП** (профилактический препарат) и **ПКП** (экстренное лечение, которое нужно начать как можно раньше, в идеале в течение 72 часов после риска).","## Как защититься","Правильно используйте презерватив каждый раз, регулярно сдавайте анализы, делайте прививки, говорите с партнёром и не пользуйтесь общими иглами. При симптомах (выделения, боль, высыпания, жжение при мочеиспускании) или после риска обратитесь в центр здоровья.","> Стыдиться анализов не нужно. Это ответственный поступок, который защищает вас и других."]},
q:[{q:L("Ki jan VIH pa transmèt ?","Comment le VIH ne se transmet-il PAS ?","How is HIV NOT passed on?","Как ВИЧ НЕ передаётся?"),o:[L("Pa anbrase ak pataje manje","En s'embrassant et en partageant un repas","By hugging and sharing food","Объятиями и общей едой"),L("Relasyon san pwoteksyon","Rapports non protégés","Unprotected sex","Незащищённым контактом"),L("San kontamine","Sang contaminé","Contaminated blood","Заражённой кровью"),L("De manman bay pitit","De la mère à l'enfant","Mother to child","От матери к ребёнку")],a:0},
{q:L("Ki IST ki ka geri ak antibyotik ?","Quelle IST se guérit par antibiotiques ?","Which STI can be cured with antibiotics?","Какая ИППП излечивается антибиотиками?"),o:[L("Sifilis","La syphilis","Syphilis","Сифилис"),L("VIH","Le VIH","HIV","ВИЧ"),L("Epatit B","L'hépatite B","Hepatitis B","Гепатит B"),L("Okenn","Aucune","None","Никакая")],a:0},
{q:L("Èske anpil IST ka pa gen sentòm ?","Beaucoup d'IST peuvent-elles ne donner aucun symptôme ?","Can many STIs have no symptoms?","Могут ли многие ИППП не давать симптомов?"),o:[L("Wi, se poutèt sa tès yo enpòtan","Oui, c'est pourquoi le dépistage compte","Yes, which is why testing matters","Да, поэтому анализы важны"),L("Non, toujou gen sentòm","Non, il y a toujours des symptômes","No, there are always symptoms","Нет, симптомы есть всегда"),L("Sèlman nan fi","Seulement chez les filles","Only in girls","Только у девочек"),L("Sèlman nan gason","Seulement chez les garçons","Only in boys","Только у мальчиков")],a:0}]});

ART.push({id:"sx-vyolans",s:"sexo",lv:3,age:14,min:6,img:"hands",lab:"sxhelp",w:["consentement"],
t:L("Vyolans seksyèl : se pa fòt ou, ak kote pou w jwenn èd","Violences sexuelles : ce n'est pas votre faute, et où trouver de l'aide","Sexual violence: it is not your fault, and where to find help","Сексуальное насилие: это не ваша вина, и где найти помощь"),
sum:L("Sa pou w fè apre yon agresyon, epi ki jan pou ede yon moun ki viktim.","Que faire après une agression, et comment soutenir une victime.","What to do after an assault, and how to support a victim.","Что делать после нападения и как поддержать пострадавшего."),
b:{
ht:["## Se pa fòt ou","Vyolans seksyèl se nenpòt kontak seksyèl san konsantman. Li ka rive ak nenpòt moun, fi kou gason, timoun kou granmoun, e souvan pa yon moun viktim nan konnen. **Viktim nan pa janm responsab.** Sa ou te mete, kote w te ye, oswa sa ou te di pa chanje sa.","## Sa pou w fè le pli vit posib","1. Ale kote w an sekirite epi rete avèk yon moun ou fè konfyans. 2. Ale nan yon sant sante oswa lopital **le pli vit posib**, ideyalman nan 72 èdtan : yo ka bay tretman pou evite VIH (PEP), kontrasepsyon dijans, tretman pou IST, ak swen pou blesi yo. 3. Si w kapab, pa lave w ni chanje rad anvan egzamen an, pou prezève prèv, men si w te deja fè sa, se pa yon pwoblèm epi ou ka toujou jwenn èd. 4. Ou deside si w pote plent la ak kilè ; pa gen pwès.","## Si yon moun di w sa te rive li","Koute san jije. Di : \"Mwen kwè w. Se pa fòt ou. Mwen la.\" Pa mande l poukisa li pat fè sa oswa sa li te mete. Ofri l pou akonpaye l kote yon pwofesyonèl, men kite l deside.","> Si w nan danje kounye a, rele moun ki toupre w oswa ale kote gen moun. Zetwal ap ajoute nimewo ak kote lokal ki verifye yo nan atik sa a.","## Sipò emosyonèl","Chòk, wont, kolè, tristès oswa pè se repons nòmal. Yon sikològ oswa yon òganizasyon ki ede viktim yo ka ede w sou tout wout la."],
fr:["## Ce n'est pas votre faute","Une violence sexuelle est tout contact sexuel sans consentement. Elle peut arriver à n'importe qui, filles comme garçons, enfants comme adultes, et souvent par quelqu'un que la victime connaît. **La victime n'est jamais responsable.** Ce qu'elle portait, où elle était ou ce qu'elle a dit n'y change rien.","## Que faire le plus tôt possible","1. Allez dans un endroit sûr et restez avec une personne de confiance. 2. Rendez-vous dans un centre de santé ou un hôpital **le plus tôt possible**, idéalement dans les 72 heures : on peut proposer un traitement pour éviter le VIH (TPE), une contraception d'urgence, un traitement des IST et des soins pour les blessures. 3. Si c'est possible, ne vous lavez pas et ne changez pas de vêtements avant l'examen, pour préserver les preuves ; mais si c'est déjà fait, ce n'est pas un problème et vous pouvez toujours être aidé. 4. Vous décidez si et quand porter plainte ; rien ne presse.","## Si quelqu'un vous dit que cela lui est arrivé","Écoutez sans juger. Dites : « Je te crois. Ce n'est pas ta faute. Je suis là. » Ne demandez pas pourquoi elle n'a pas fait ceci ou ce qu'elle portait. Proposez de l'accompagner auprès d'un professionnel, mais laissez-la décider.","> Si vous êtes en danger maintenant, appelez une personne proche ou allez là où il y a du monde. Zetwal ajoutera dans cet article les numéros et lieux locaux vérifiés.","## Soutien émotionnel","Choc, honte, colère, tristesse ou peur sont des réactions normales. Un psychologue ou une association d'aide aux victimes peut accompagner à chaque étape."],
en:["## It is not your fault","Sexual violence is any sexual contact without consent. It can happen to anyone, girls and boys, children and adults, and often by someone the victim knows. **The victim is never responsible.** What they wore, where they were or what they said changes nothing.","## What to do as soon as possible","1. Go somewhere safe and stay with someone you trust. 2. Go to a health centre or hospital **as soon as possible**, ideally within 72 hours: they can offer treatment to prevent HIV (PEP), emergency contraception, STI treatment and care for injuries. 3. If you can, do not wash or change clothes before the examination, to preserve evidence; but if you already have, it is not a problem and you can still get help. 4. You decide whether and when to report; there is no rush.","## If someone tells you it happened to them","Listen without judging. Say: \"I believe you. It is not your fault. I am here.\" Do not ask why they did not do something or what they wore. Offer to go with them to a professional, but let them decide.","> If you are in danger now, call someone near you or go where there are people. Zetwal will add verified local numbers and places to this article.","## Emotional support","Shock, shame, anger, sadness or fear are normal reactions. A psychologist or a victim-support organisation can help at every step."],
ru:["## Это не ваша вина","Сексуальное насилие — любой сексуальный контакт без согласия. Оно может случиться с кем угодно: девочками и мальчиками, детьми и взрослыми, и часто со стороны знакомого. **Пострадавший никогда не виноват.** Что он носил, где находился или что говорил, ничего не меняет.","## Что делать как можно скорее","1. Идите в безопасное место и оставайтесь с человеком, которому доверяете. 2. Обратитесь в центр здоровья или больницу **как можно скорее**, в идеале в течение 72 часов: могут предложить лечение для предотвращения ВИЧ (ПКП), экстренную контрацепцию, лечение ИППП и помощь при травмах. 3. По возможности не мойтесь и не меняйте одежду до осмотра, чтобы сохранить доказательства; но если вы уже это сделали, это не страшно, помощь всё равно возможна. 4. Вы сами решаете, подавать ли заявление и когда; спешить не нужно.","## Если кто-то рассказал вам, что с ним это случилось","Слушайте, не осуждая. Скажите: «Я тебе верю. Это не твоя вина. Я рядом». Не спрашивайте, почему он не сделал того или иного и что был одет. Предложите сопровождать к специалисту, но пусть решает сам.","> Если вам сейчас угрожает опасность, позвоните близкому человеку или идите туда, где есть люди. Zetwal добавит в эту статью проверенные местные номера и адреса.","## Эмоциональная поддержка","Шок, стыд, гнев, грусть или страх — нормальные реакции. Психолог или организация помощи пострадавшим могут поддержать на каждом шаге."]},

t:L("Sante seksyèl granmoun : pwoteje w ak patnè w","Santé sexuelle de l'adulte : se protéger et protéger son ou sa partenaire","Adult sexual health: protecting yourself and your partner","Сексуальное здоровье взрослых: защита себя и партнёра"),
sum:L("Pwoteksyon, tès, planifikasyon ak kominikasyon, nan yon ton edikatif.","Protection, dépistage, planification et communication, sur un ton éducatif.","Protection, testing, planning and communication, in an educational tone.","Защита, обследования, планирование и общение в образовательном тоне."),
b:{
ht:["## Sante seksyèl se yon pati sante jeneral","Sante seksyèl se pa sèlman absans maladi : se tou ka santi w byen, an sekirite epi respekte nan relasyon w, san fòse ni vyolans. Li enpòtan nan tout laj.","## Pwoteksyon ak tès","Itilize kondòm ak nouvo patnè oswa lè w pa konnen estati patnè a. Fè tès IST ak VIH regilyèman, espesyalman si w chanje patnè : yon doktè oswa yon sant sante ka di w ki frekans ki apwopriye. Fè vaksen kont HPV ak epatit B si w pa t fè yo. Si w fè yon tès pozitif, trete w epi enfòme patnè yo pou yo ka teste yo tou.","## Konsantman ak alkòl","Konsantman ap toujou nesesè, e li pa posib si yon moun twò sou alkòl oswa dwòg. Nan yon relasyon dire lontan, konsantman an kontinye vo : yon wi yè pa vle di wi jodi a.","## Planifye gwosès","Si w vle yon pitit, ale wè yon pwofesyonèl anvan gwosès la : li ka verifye sante w, vaksen ou, ak preskri asid folik pou diminye risk defo nan tiyo newral. Si w pa vle yon pitit kounye a, chwazi yon metòd ki apwopriye pou ou ak yon pwofesyonèl.","## Kominikasyon","Pale ak patnè w ak ouvètè sou limit, sante, ak atant nou yo. Yon bon kominikasyon se youn nan pi bon pwoteksyon pou sante ak relasyon an."],
fr:["## La santé sexuelle fait partie de la santé globale","La santé sexuelle n'est pas seulement l'absence de maladie : c'est aussi se sentir bien, en sécurité et respecté dans ses relations, sans contrainte ni violence. Elle compte à tout âge.","## Protection et dépistage","Utilisez un préservatif avec un nouveau partenaire ou si vous ne connaissez pas le statut de votre partenaire. Faites-vous dépister régulièrement pour les IST et le VIH, surtout si vous changez de partenaire : un médecin ou un centre de santé peut indiquer la fréquence adaptée. Faites les vaccins contre le HPV et l'hépatite B si ce n'est pas fait. En cas de test positif, faites-vous soigner et prévenez vos partenaires pour qu'ils se fassent dépister.","## Consentement et alcool","Le consentement est toujours nécessaire, et il n'est pas possible si une personne est sous l'emprise de l'alcool ou de drogues. Dans une relation de longue durée, le consentement reste valable à chaque fois : un oui d'hier ne vaut pas oui aujourd'hui.","## Planifier une grossesse","Si vous souhaitez un enfant, consultez un professionnel avant la grossesse : il peut vérifier votre santé, vos vaccins et prescrire de l'acide folique pour réduire le risque d'anomalies du tube neural. Si vous n'en voulez pas pour l'instant, choisissez avec un professionnel une méthode adaptée.","## Communiquer","Parlez avec votre partenaire, ouvertement, de limites, de santé et d'attentes. Une bonne communication est l'une des meilleures protections pour la santé et pour la relation."],
en:["## Sexual health is part of overall health","Sexual health is not only the absence of disease: it is also feeling well, safe and respected in your relationships, without coercion or violence. It matters at every age.","## Protection and testing","Use a condom with a new partner or when you do not know your partner's status. Get tested regularly for STIs and HIV, especially if you change partners: a doctor or health centre can tell you the right frequency. Get the HPV and hepatitis B vaccines if you have not had them. If a test is positive, get treated and tell your partners so they can be tested.","## Consent and alcohol","Consent is always needed, and it is not possible if someone is under the influence of alcohol or drugs. In a long relationship consent still applies each time: yesterday's yes is not today's yes.","## Planning a pregnancy","If you want a child, see a professional before pregnancy: they can check your health and vaccinations and prescribe folic acid to reduce the risk of neural tube defects. If you do not want a child for now, choose a suitable method with a professional.","## Communicating","Talk openly with your partner about limits, health and expectations. Good communication is one of the best protections for health and for the relationship."],
ru:["## Сексуальное здоровье — часть общего здоровья","Сексуальное здоровье — это не только отсутствие болезней, но и ощущение благополучия, безопасности и уважения в отношениях, без принуждения и насилия. Оно важно в любом возрасте.","## Защита и обследование","Используйте презерватив с новым партнёром или если не знаете статус партнёра. Регулярно сдавайте анализы на ИППП и ВИЧ, особенно при смене партнёра: врач или центр здоровья подскажет подходящую частоту. Сделайте прививки от ВПЧ и гепатита B, если не делали. При положительном результате лечитесь и сообщите партнёрам, чтобы они тоже обследовались.","## Согласие и алкоголь","Согласие нужно всегда, и оно невозможно, если человек находится под действием алкоголя или наркотиков. В долгих отношениях согласие нужно каждый раз: вчерашнее «да» не равно сегодняшнему.","## Планирование беременности","Если вы хотите ребёнка, обратитесь к специалисту до беременности: он проверит здоровье и прививки и назначит фолиевую кислоту для снижения риска пороков нервной трубки. Если пока ребёнка не хотите, подберите подходящий метод с врачом.","## Общение","Открыто говорите с партнёром о границах, здоровье и ожиданиях. Хорошее общение — одна из лучших защит для здоровья и отношений."]},

t:L("Difikilte seksyèl : komen, ki gen sa ki ka fè, ak ki lè pou konsilte","Difficultés sexuelles : fréquentes, souvent traitables, et quand consulter","Sexual difficulties: common, often treatable, and when to see someone","Сексуальные трудности: распространены, часто излечимы, и когда обращаться"),
sum:L("Ki rezon yo ye, ak poukisa pale ak yon pwofesyonèl ka chanje bagay yo.","Quelles en sont les causes, et pourquoi en parler à un professionnel peut aider.","What causes them, and why talking to a professional can help.","Причины и почему разговор со специалистом может помочь."),
b:{
ht:["## Se yon bagay komen","Anpil granmoun gen difikilte seksyèl yon moman nan lavi yo : mwens dezi, difikilte pou ereksyon, ejakilasyon twò rapid, doulè pandan relasyon, oswa difikilte pou rive nan plezi. Sa pa yon feblès pèsonèl.","## Ki rezon yo ka genyen","Rezon yo ka fizik (dyabèt, tansyon, maladi kè, medikaman, balans òmòn, fatig, doulè), sikolojik (estrès, enkyetid, depresyon, move eksperyans) oswa relasyonèl. Souvan gen plizyè rezon ansanm.","## Ki sa ki ka ede","Anpil difikilte yo trete. Yon doktè ka chèche rezon fizik yo epi bay tretman, epi yon sikològ oswa yon sèksològ ka ede ak lòt rezon yo. Pale ak patnè w ede anpil. Pa achte medikaman san preskripsyon oswa sou entènèt : yo ka danjere.","## Ki lè pou konsilte","Konsilte si difikilte a dire, si li fè w soufri oswa si li afekte relasyon w, si w gen doulè, si li vini toudenkou, oswa si li vini apre yon nouvo medikaman. Doulè pandan relasyon pa nòmal epi li merite yon konsiltasyon.","> Pale ak yon pwofesyonèl sante pa dwe fè w wont. Yo tande sa chak jou."],
fr:["## C'est fréquent","Beaucoup d'adultes ont des difficultés sexuelles à un moment de leur vie : baisse de désir, difficultés d'érection, éjaculation trop rapide, douleurs pendant les rapports, ou difficulté à atteindre le plaisir. Ce n'est pas une faiblesse personnelle.","## Les causes possibles","Elles peuvent être physiques (diabète, hypertension, maladies du cœur, médicaments, équilibre hormonal, fatigue, douleur), psychologiques (stress, anxiété, dépression, mauvaise expérience) ou liées à la relation. Souvent, plusieurs causes s'ajoutent.","## Ce qui peut aider","Beaucoup de difficultés se traitent. Un médecin peut rechercher les causes physiques et proposer un traitement, et un psychologue ou un sexologue peut aider pour les autres causes. En parler avec son ou sa partenaire aide beaucoup. N'achetez pas de médicaments sans ordonnance ou sur Internet : ils peuvent être dangereux.","## Quand consulter","Consultez si la difficulté dure, si elle vous fait souffrir ou affecte votre relation, si vous avez des douleurs, si elle apparaît brutalement ou après un nouveau médicament. Une douleur pendant les rapports n'est pas normale et mérite une consultation.","> Parler à un professionnel de santé n'a rien de honteux. Ils entendent cela tous les jours."],
en:["## It is common","Many adults have sexual difficulties at some point: lower desire, erection problems, ejaculating too quickly, pain during sex, or difficulty reaching pleasure. It is not a personal weakness.","## Possible causes","They can be physical (diabetes, high blood pressure, heart disease, medicines, hormone balance, tiredness, pain), psychological (stress, anxiety, depression, a bad experience) or related to the relationship. Often several causes add up.","## What can help","Many difficulties are treatable. A doctor can look for physical causes and offer treatment, and a psychologist or sex therapist can help with other causes. Talking with your partner helps a lot. Do not buy medicines without a prescription or online: they can be dangerous.","## When to see someone","See someone if the difficulty lasts, if it distresses you or affects your relationship, if there is pain, if it appears suddenly or after a new medicine. Pain during sex is not normal and deserves a consultation.","> Talking to a health professional is nothing to be ashamed of. They hear this every day."],
ru:["## Это распространено","Многие взрослые в какой-то период сталкиваются с сексуальными трудностями: снижение желания, проблемы с эрекцией, слишком быстрое семяизвержение, боль при близости или трудности с достижением удовольствия. Это не личная слабость.","## Возможные причины","Они могут быть физическими (диабет, давление, болезни сердца, лекарства, гормональный баланс, усталость, боль), психологическими (стресс, тревога, депрессия, неприятный опыт) или связанными с отношениями. Часто причин несколько.","## Что может помочь","Многие трудности поддаются лечению. Врач найдёт физические причины и предложит лечение, а психолог или сексолог поможет с остальными. Очень помогает разговор с партнёром. Не покупайте лекарства без рецепта или в интернете: они могут быть опасны.","## Когда обратиться","Обратитесь, если трудность длится, причиняет страдание или влияет на отношения, если есть боль, если она появилась внезапно или после нового лекарства. Боль при близости ненормальна и требует консультации.","> Обращаться к медицинскому специалисту не стыдно. Они слышат это каждый день."]},
q:[{q:L("Èske difikilte seksyèl yo komen ?","Les difficultés sexuelles sont-elles fréquentes ?","Are sexual difficulties common?","Распространены ли сексуальные трудности?"),o:[L("Wi, anpil granmoun gen yonn","Oui, beaucoup d'adultes en ont","Yes, many adults have them","Да, у многих взрослых"),L("Non, trè ra","Non, très rares","No, very rare","Нет, очень редки"),L("Sèlman nan granmoun aje","Seulement les personnes âgées","Only in older adults","Только у пожилых"),L("Sèlman nan gason","Seulement les hommes","Only men","Только у мужчин")],a:0},
{q:L("Doulè pandan relasyon an nòmal ?","La douleur pendant les rapports est-elle normale ?","Is pain during sex normal?","Нормальна ли боль при близости?"),o:[L("Non, li merite yon konsiltasyon","Non, elle mérite une consultation","No, it deserves a consultation","Нет, нужна консультация"),L("Wi toujou","Oui toujours","Yes, always","Да, всегда"),L("Sèlman premye fwa","Seulement la première fois","Only the first time","Только в первый раз"),L("Se fòt patnè a","C'est la faute du partenaire","It is the partner's fault","Виноват партнёр")],a:0},
{q:L("Èske w ta dwe achte medikaman sou entènèt san preskripsyon ?","Faut-il acheter des médicaments sur Internet sans ordonnance ?","Should you buy medicines online without a prescription?","Стоит ли покупать лекарства в интернете без рецепта?"),o:[L("Non, sa ka danjere","Non, c'est dangereux","No, it can be dangerous","Нет, это опасно"),L("Wi, se pi senp","Oui, c'est plus simple","Yes, it is simpler","Да, так проще"),L("Wi si l pa chè","Oui si pas cher","Yes if cheap","Да, если дёшево"),L("Wi pou tout moun","Oui pour tous","Yes for everyone","Да, всем")],a:0}]});

sum:L("Ki sa zo yo fè, konbyen yo ye, ak ki jan pou pwoteje yo.","À quoi servent les os, combien il y en a, et comment les protéger.","What bones do, how many there are, and how to protect them.","Зачем нужны кости, сколько их и как их беречь."),
b:{
ht:["## Yon kadriyaj ki vivan","Yon granmoun gen **206 zo**. Yon tibebe gen plis (anviwon 270 a 300) paske anpil nan yo kole ansanm pandan li ap grandi. Zo yo pa mouri : yo se yon tisi vivan ki ap renouvle tèt li.","## Senk wòl zo yo","**1. Soutni** kò a. **2. Pwoteje** ògàn yo : zo kòn tèt la pwoteje sèvo a, kòt yo pwoteje kè ak poumon. **3. Pèmèt mouvman** ansanm ak misk yo ak jwenti yo. **4. Fabrike selil san** nan mwèl zo a. **5. Estoke kalsyòm** ak fosfò.","## Kèk zo enpòtan","**Kolòn vètebral** gen 33 vètebr, li pwoteje mwèl epinyè a. **Fèmi** (zo kwis la) se pi long ak pi fò zo nan kò a. Pi piti zo yo se twa ti zo nan zòrèy, tankou **etriye** a.","## Pwoteje zo w","Bwè lèt oswa manje manje ki gen kalsyòm (pwason ak zo, legim vèt, pwa), jwenn solèy yon ti moman pou vitamin D, fè egzèsis, epi pa fimen. Zo yo vin pi frajil ak laj, se poutèt sa sa enpòtan depi jèn.","> Yon zo kase geri ! Doktè a mete l nan plas epi kenbe l an plas pou li ka repouse."],
fr:["## Une charpente vivante","Un adulte a **206 os**. Un bébé en a plus (environ 270 à 300) car beaucoup se soudent en grandissant. Les os ne sont pas morts : c'est un tissu vivant qui se renouvelle.","## Cinq rôles des os","**1. Soutenir** le corps. **2. Protéger** les organes : le crâne protège le cerveau, les côtes le cœur et les poumons. **3. Permettre le mouvement** avec les muscles et les articulations. **4. Fabriquer les cellules du sang** dans la moelle osseuse. **5. Stocker le calcium** et le phosphore.","## Quelques os importants","La **colonne vertébrale** compte 33 vertèbres et protège la moelle épinière. Le **fémur** (os de la cuisse) est le plus long et le plus solide. Les plus petits os sont trois osselets de l'oreille, dont l'**étrier**.","## Protéger ses os","Consommez des aliments riches en calcium (poisson avec ses arêtes, légumes verts, haricots, lait), exposez-vous un peu au soleil pour la vitamine D, faites de l'exercice et ne fumez pas. Les os fragilisent avec l'âge, c'est pourquoi il est utile de s'en occuper dès le plus jeune âge.","> Un os cassé guérit ! Le médecin le remet en place et le maintient immobile pour qu'il se ressoude."],
en:["## A living framework","An adult has **206 bones**. A baby has more (about 270 to 300) because many fuse together as they grow. Bones are not dead: they are living tissue that renews itself.","## Five jobs of bones","**1. Support** the body. **2. Protect** organs: the skull protects the brain, the ribs protect the heart and lungs. **3. Allow movement** together with muscles and joints. **4. Make blood cells** in the bone marrow. **5. Store calcium** and phosphorus.","## A few important bones","The **spine** has 33 vertebrae and protects the spinal cord. The **femur** (thigh bone) is the longest and strongest. The smallest bones are three tiny ones in the ear, including the **stapes**.","## Protecting your bones","Eat foods rich in calcium (fish eaten with the bones, green vegetables, beans, milk), get a little sunlight for vitamin D, exercise and do not smoke. Bones weaken with age, so looking after them from a young age matters.","> A broken bone heals! The doctor sets it in place and keeps it still so it can knit back together."],
ru:["## Живой каркас","У взрослого **206 костей**. У младенца их больше (около 270–300), потому что многие срастаются по мере роста. Кости не мёртвые: это живая ткань, которая обновляется.","## Пять функций костей","**1. Опора** тела. **2. Защита** органов: череп защищает мозг, рёбра — сердце и лёгкие. **3. Движение** вместе с мышцами и суставами. **4. Образование клеток крови** в костном мозге. **5. Запас кальция** и фосфора.","## Несколько важных костей","**Позвоночник** состоит из 33 позвонков и защищает спинной мозг. **Бедренная кость** — самая длинная и прочная. Самые маленькие кости — три косточки уха, среди них **стремя**.","## Как беречь кости","Ешьте продукты с кальцием (рыба с костями, зелёные овощи, бобовые, молоко), немного бывайте на солнце ради витамина D, занимайтесь спортом и не курите. С возрастом кости слабеют, поэтому заботиться о них важно с юности.","> Сломанная кость срастается! Врач ставит её на место и фиксирует, чтобы она срослась."]},
q:[{q:L("Konbyen zo yon granmoun genyen ?","Combien d'os a un adulte ?","How many bones does an adult have?","Сколько костей у взрослого?"),o:["106","206","306","406"],a:1},

{q:L("Ki mineral ki enpòtan pou zo yo ?","Quel minéral est important pour les os ?","Which mineral matters for bones?","Какой минерал важен для костей?"),o:[L("Kalsyòm","Le calcium","Calcium","Кальций"),L("Plon","Le plomb","Lead","Свинец"),L("Mèki","Le mercure","Mercury","Ртуть"),L("Anyen","Aucun","None","Никакой")],a:0}]});
