t:L("Kontra : yon akò ki mare moun ki siyen l","Le contrat : un accord qui engage ceux qui le signent","Contracts: an agreement that binds those who sign","Договор: соглашение, которое обязывает подписавших"),
sum:L("Sa ki fè yon kontra valab, ak ki refleks pou w genyen anvan w siyen.","Ce qui rend un contrat valable, et les réflexes à avoir avant de signer.","What makes a contract valid, and what to do before you sign.","Что делает договор действительным и что сделать перед подписанием."),
b:{
ht:["## Ki sa yon kontra ye","Yon **kontra** se yon akò ant de moun oswa plis ki kreye obligasyon legal : lwe yon kay, travay, achte yon machin, prete lajan. Lè yo respekte kondisyon yo, yon jij ka fòse moun ki pa respekte kontra a pou l fè sa li te pwomèt.","## Sa ki fè l valab (prensip jeneral)","Anjeneral, nou bezwen : **konsantman lib** (pa gen fòse, ni twonpe), **kapasite** (pa twò jèn, pa anba tutèl), yon **objè** ki pèmèt pa lwa, ak yon **rezon** legal. Règ egzak yo depann de lwa chak peyi.","## Anvan w siyen","**Li tout** dokiman an, menm ti lèt yo. Mande eksplikasyon sou sa ou pa konprann. Verifye **non, montan, dat, dire ak penalite**. Pa siyen yon papye vid oswa san w pa konprann. Garde yon **kopi**. Si l posib, ekri kondisyon yo, paske yon kontra ekri pi fasil pou pwouve.","## Si gen pwoblèm","Chèche yon avoka oswa yon notè anvan yon kontra enpòtan (kay, tè, prè). Gen kontra ki dwe pase devan notè pa lwa, tankou vant tè.","> Siyen se angaje w. Pa janm siyen anba presyon.","> Atik sa a se edikasyon jeneral, li pa ranplase konsèy yon avoka pou ka ou."],
fr:["## Ce qu'est un contrat","Un **contrat** est un accord entre deux personnes ou plus qui crée des obligations légales : louer une maison, travailler, acheter une voiture, prêter de l'argent. Quand les conditions sont réunies, un juge peut contraindre celui qui ne respecte pas le contrat à tenir sa promesse.","## Ce qui le rend valable (principes généraux)","En général, il faut : un **consentement libre** (ni forcé, ni trompé), la **capacité** (ni trop jeune, ni sous tutelle), un **objet** permis par la loi, et une **cause** légale. Les règles exactes dépendent de la loi de chaque pays.","## Avant de signer","**Lisez tout** le document, même les petites lignes. Demandez des explications sur ce que vous ne comprenez pas. Vérifiez les **noms, le montant, la date, la durée et les pénalités**. Ne signez jamais un papier vide ni sans comprendre. Gardez une **copie**. Si possible, mettez les conditions par écrit, car un contrat écrit se prouve plus facilement.","## En cas de problème","Consultez un avocat ou un notaire avant un contrat important (maison, terrain, prêt). Certains contrats doivent passer devant un notaire selon la loi, comme la vente d'un terrain.","> Signer, c'est s'engager. Ne signez jamais sous la pression.","> Cet article est une information générale, il ne remplace pas le conseil d'un avocat pour votre cas."],
en:["## What a contract is","A **contract** is an agreement between two or more people that creates legal obligations: renting a house, working, buying a car, lending money. When the conditions are met, a judge can force someone who breaks the contract to keep their promise.","## What makes it valid (general principles)","Generally you need: **free consent** (not forced or tricked), **capacity** (not too young, not under guardianship), a lawful **subject matter** and a lawful **reason**. The exact rules depend on each country's law.","## Before you sign","**Read everything**, even the small print. Ask for explanations of what you do not understand. Check **names, amount, date, duration and penalties**. Never sign a blank paper or something you do not understand. Keep a **copy**. If possible, put the terms in writing, because a written contract is easier to prove.","## If there is a problem","See a lawyer or a notary before an important contract (house, land, loan). Some contracts must go through a notary by law, such as selling land.","> To sign is to commit. Never sign under pressure.","> This article is general information and does not replace a lawyer's advice for your case."],
ru:["## Что такое договор","**Договор** — соглашение двух или более лиц, создающее юридические обязательства: аренда дома, работа, покупка машины, заём. Если условия соблюдены, суд может заставить нарушителя выполнить обещанное.","## Что делает его действительным (общие принципы)","Как правило, нужны: **свободное согласие** (без принуждения и обмана), **дееспособность** (не слишком юный, не под опекой), допустимый законом **предмет** и законное **основание**. Точные правила зависят от закона каждой страны.","## Перед подписанием","**Прочитайте всё**, даже мелкий шрифт. Просите объяснить непонятное. Проверьте **имена, сумму, дату, срок и штрафы**. Никогда не подписывайте пустой лист или то, что не понимаете. Сохраните **копию**. По возможности фиксируйте условия письменно: письменный договор проще доказать.","## Если возникла проблема","Обратитесь к юристу или нотариусу перед важным договором (дом, земля, заём). Некоторые договоры по закону оформляются у нотариуса, например продажа земли.","> Подписать — значит взять на себя обязательство. Никогда не подписывайте под давлением.","> Эта статья — общая информация и не заменяет совет юриста по вашему случаю."]},
q:[{q:L("Ki sa ou dwe fè anvan w siyen ?","Que faire avant de signer ?","What should you do before signing?","Что сделать перед подписанием?"),o:[L("Li tout dokiman an epi garde yon kopi","Tout lire et garder une copie","Read everything and keep a copy","Прочитать всё и сохранить копию"),L("Siyen vit","Signer vite","Sign quickly","Быстро подписать"),L("Siyen yon papye vid","Signer un papier vide","Sign a blank paper","Подписать пустой лист"),L("Pa li","Ne pas lire","Not read it","Не читать")],a:0},
{q:L("Ki sa ki nesesè pou yon kontra valab ?","Que faut-il pour qu'un contrat soit valable ?","What is needed for a valid contract?","Что нужно для действительного договора?"),o:[L("Konsantman lib","Un consentement libre","Free consent","Свободное согласие"),L("Menas","Une menace","A threat","Угроза"),L("Twonpe moun nan","Tromper l'autre","Tricking the other","Обман"),L("Anyen","Rien","Nothing","Ничего")],a:0},
{q:L("Ki moun pou w konsilte pou yon vant tè ?","Qui consulter pour une vente de terrain ?","Who should you see for a land sale?","К кому обратиться при продаже земли?"),o:[L("Yon notè oswa avoka","Un notaire ou un avocat","A notary or lawyer","Нотариус или юрист"),L("Okenn moun","Personne","Nobody","Ни к кому"),L("Yon vwazen","Un voisin","A neighbour","Сосед"),L("Yon zanmi sou entènèt","Un ami en ligne","An online friend","Знакомый из сети")],a:0}]});

ART.push({id:"enter",s:"eco",lv:2,min:5,img:"coins",lab:"int",w:[],
t:L("Enterè senp ak enterè konpoze : poukisa lajan ap grandi (oswa dèt la)","Intérêts simples et composés : pourquoi l'argent grossit (ou la dette)","Simple and compound interest: why money (or debt) grows","Простые и сложные проценты: почему деньги (или долг) растут"),
sum:L("Konprann diferans lan, règ 72 la, ak kisa pou w mande anvan w prete lajan.","Comprendre la différence, la règle de 72, et que demander avant d'emprunter.","Understand the difference, the rule of 72, and what to ask before borrowing.","Понять разницу, правило 72 и что спросить перед займом."),
b:{
ht:["## Enterè senp","**Enterè** se pri yon moun peye pou l itilize lajan yon lòt, oswa lajan labank ba w pou lajan w kenbe l. Nan **enterè senp**, enterè a kalkile chak ane sou menm kapital la. Egzanp : **1 000 goud a 10 % pa ane** bay **100 goud chak ane**. Apre 3 ane : 1 000 + 300 = **1 300 goud**.","## Enterè konpoze","Nan **enterè konpoze**, enterè yo ajoute sou kapital la epi yo menm yo ap pwodui enterè. 1 000 goud a 10 % : ane 1 → 1 100 ; ane 2 → 1 210 ; ane 3 → **1 331 goud**. Plis ane yo pase, plis diferans lan grandi.","## Règ 72 la","Pou konnen apeprè konbyen ane lajan w ap double, divize **72 pa to enterè a** : a 8 % pa ane, 72 ÷ 8 = **9 ane**. Se yon apwoksimasyon.","## Pou prè yo","Enterè konpoze travay tou kont ou lè w prete. Anvan w pran yon prè, mande : **to anyèl la**, **dire a**, **tout frè yo**, epi **total w ap peye a la fen**. Konpare plizyè òf. Si pri a twò wo pou w kapab peye, pa pran l.","> Lajan w ap kenbe lontan travay pou ou ak enterè konpoze. Dèt ki pa peye grandi tou menm jan."],
fr:["## L'intérêt simple","L'**intérêt** est le prix payé pour utiliser l'argent d'autrui, ou ce que la banque vous verse pour l'argent que vous lui laissez. Avec l'**intérêt simple**, l'intérêt est calculé chaque année sur le même capital. Exemple : **1 000 gourdes à 10 % par an** donnent **100 gourdes par an**. Après 3 ans : 1 000 + 300 = **1 300 gourdes**.","## L'intérêt composé","Avec l'**intérêt composé**, les intérêts s'ajoutent au capital et produisent eux-mêmes des intérêts. 1 000 gourdes à 10 % : année 1 → 1 100 ; année 2 → 1 210 ; année 3 → **1 331 gourdes**. Plus le temps passe, plus l'écart grandit.","## La règle de 72","Pour estimer en combien d'années l'argent double, divisez **72 par le taux d'intérêt** : à 8 % par an, 72 ÷ 8 = **9 ans**. C'est une approximation.","## Pour les emprunts","L'intérêt composé joue aussi contre vous quand vous empruntez. Avant un prêt, demandez : **le taux annuel**, **la durée**, **tous les frais** et **le total à payer à la fin**. Comparez plusieurs offres. Si le coût est trop élevé pour vous, n'empruntez pas.","> L'argent placé longtemps travaille pour vous grâce à l'intérêt composé. Une dette non payée grandit de la même façon."],
en:["## Simple interest","**Interest** is the price paid for using someone else's money, or what a bank pays you for money you leave with it. With **simple interest**, interest is calculated each year on the same capital. Example: **1,000 gourdes at 10% a year** gives **100 gourdes a year**. After 3 years: 1,000 + 300 = **1,300 gourdes**.","## Compound interest","With **compound interest**, interest is added to the capital and earns interest itself. 1,000 gourdes at 10%: year 1 → 1,100; year 2 → 1,210; year 3 → **1,331 gourdes**. The longer the time, the bigger the gap.","## The rule of 72","To estimate how many years money takes to double, divide **72 by the interest rate**: at 8% a year, 72 ÷ 8 = **9 years**. It is an approximation.","## For loans","Compound interest also works against you when you borrow. Before taking a loan, ask: **the annual rate**, **the term**, **all fees** and **the total you will pay at the end**. Compare several offers. If the cost is too high for you, do not borrow.","> Money kept for a long time works for you through compound interest. An unpaid debt grows the same way."],
ru:["## Простые проценты","**Процент** — плата за пользование чужими деньгами или то, что банк платит вам за деньги, которые вы у него оставили. При **простых процентах** проценты каждый год считаются от одной и той же суммы. Пример: **1 000 гурдов под 10 % годовых** дают **100 гурдов в год**. Через 3 года: 1 000 + 300 = **1 300 гурдов**.","## Сложные проценты","При **сложных процентах** проценты добавляются к сумме и сами приносят проценты. 1 000 гурдов под 10 %: 1-й год → 1 100; 2-й → 1 210; 3-й → **1 331 гурд**. Чем больше времени, тем больше разрыв.","## Правило 72","Чтобы оценить, за сколько лет деньги удвоятся, разделите **72 на процентную ставку**: при 8 % годовых 72 ÷ 8 = **9 лет**. Это приблизительная оценка.","## Для займов","Сложные проценты работают и против вас, когда вы занимаете. Перед займом спросите: **годовую ставку**, **срок**, **все комиссии** и **общую сумму к выплате**. Сравните несколько предложений. Если стоимость вам не по силам, не занимайте.","> Деньги, лежащие долго, работают на вас благодаря сложным процентам. Неоплаченный долг растёт так же."]},
q:[{q:L("1 000 goud a 10 % konpoze pandan 3 ane bay…","1 000 gourdes à 10 % composé pendant 3 ans donnent…","1,000 gourdes at 10% compounded for 3 years give…","1 000 гурдов под 10 % сложных за 3 года дают…"),o:["1 331","1 300","1 100","1 500"],a:0},
{q:L("Règ 72 la : a 8 %, lajan an double nan…","Règle de 72 : à 8 %, l'argent double en…","Rule of 72: at 8%, money doubles in…","Правило 72: при 8 % деньги удваиваются за…"),o:[L("9 ane","9 ans","9 years","9 лет"),L("8 ane","8 ans","8 years","8 лет"),L("72 ane","72 ans","72 years","72 года"),L("2 ane","2 ans","2 years","2 года")],a:0},
{q:L("Anvan w prete, ki sa ou dwe mande ?","Avant d'emprunter, que demander ?","Before borrowing, what to ask?","Перед займом что спросить?"),o:[L("To anyèl, frè yo ak total la","Le taux annuel, les frais et le total","The annual rate, fees and total","Годовую ставку, комиссии и итог"),L("Anyen","Rien","Nothing","Ничего"),L("Sèlman montan an","Seulement le montant","Only the amount","Только сумму"),L("Non moun ki prete a","Le nom du prêteur","The lender's name","Имя кредитора")],a:0}]});

ART.push({id:"somey",s:"psy",lv:1,min:4,img:"mind",lab:"som",w:[],
t:L("Somèy : poukisa nou bezwen l ak ki jan pou dòmi pi byen","Le sommeil : pourquoi on en a besoin et comment mieux dormir","Sleep: why we need it and how to sleep better","Сон: зачем он нужен и как спать лучше"),
sum:L("Kantite èdtan ki bon pou chak laj, ak abitid ki ede w dòmi.","Les heures qui conviennent à chaque âge, et les habitudes qui aident.","How many hours suit each age, and habits that help.","Сколько часов нужно в каждом возрасте и какие привычки помогают."),
b:{
ht:["## Somèy se pa tan pèdi","Pandan nou dòmi, sèvo a klase sa nou te aprann, kò a repare l, epi sistèm defans lan ranfòse. Yon moun ki pa dòmi ase gen plis difikilte pou konsantre, li pi irite, epi li gen plis risk pou maladi.","## Konbyen èdtan ?","An mwayèn : tibebe yo dòmi anpil, **timoun 6 a 12 an** bezwen anviwon **9 a 12 èdtan**, **adolesan** 8 a 10 èdtan, **granmoun** 7 a 9 èdtan. Chak moun gen yon ti diferans.","## Abitid ki ede","Kouche epi leve a menm lè chak jou. Fè chanm nan fre, nwa ak trankil. **Evite ekran (telefòn, TV) 1 èdtan anvan dòmi.** Pa bwè kafe oswa te fò nan aprè midi. Pa manje twòp ni fè egzèsis fò twò ta nan aswè. Yon ti mache pandan jounen an ede.","## Ki lè pou konsilte","Si w gen difikilte pou dòmi plizyè swa chak semèn pandan plis pase 3 mwa, si w ap wonfle fò ak pòz nan respirasyon, oswa si w toujou fatige menm apre w fin dòmi, wè yon pwofesyonèl sante.","> Yon bon nwit pa yon luks : se yon pati nan sante."],
fr:["## Dormir n'est pas du temps perdu","Pendant le sommeil, le cerveau trie ce qu'on a appris, le corps se répare et les défenses se renforcent. Quelqu'un qui ne dort pas assez a plus de mal à se concentrer, est plus irritable et risque davantage de tomber malade.","## Combien d'heures ?","En moyenne : les bébés dorment beaucoup, les **enfants de 6 à 12 ans** ont besoin d'environ **9 à 12 heures**, les **adolescents** de 8 à 10 heures, les **adultes** de 7 à 9 heures. Chacun varie un peu.","## Les habitudes qui aident","Se coucher et se lever à la même heure chaque jour. Garder la chambre fraîche, sombre et calme. **Éviter les écrans (téléphone, télé) 1 heure avant de dormir.** Pas de café ni de thé fort l'après-midi. Pas de gros repas ni de sport intense trop tard le soir. Un peu de marche dans la journée aide.","## Quand consulter","Si vous avez du mal à dormir plusieurs soirs par semaine pendant plus de 3 mois, si vous ronflez fort avec des pauses respiratoires, ou si vous êtes toujours fatigué malgré le sommeil, consultez un professionnel de santé.","> Une bonne nuit n'est pas un luxe : c'est une partie de la santé."],
en:["## Sleeping is not wasted time","During sleep the brain sorts what we learned, the body repairs itself and the defences get stronger. Someone who sleeps too little has more trouble concentrating, is more irritable and more likely to fall ill.","## How many hours?","On average: babies sleep a lot, **children aged 6 to 12** need about **9 to 12 hours**, **teenagers** 8 to 10 hours, **adults** 7 to 9 hours. Everyone varies a little.","## Habits that help","Go to bed and get up at the same time every day. Keep the room cool, dark and quiet. **Avoid screens (phone, TV) for 1 hour before bed.** No coffee or strong tea in the afternoon. No heavy meals or hard exercise too late in the evening. Some walking during the day helps.","## When to see someone","If you have trouble sleeping several nights a week for more than 3 months, if you snore loudly with pauses in breathing, or if you are always tired despite sleeping, see a health professional.","> A good night is not a luxury: it is part of health."],
ru:["## Сон — не потерянное время","Во сне мозг сортирует то, чему мы научились, тело восстанавливается, а защитные силы укрепляются. Тот, кто мало спит, хуже концентрируется, раздражительнее и чаще болеет.","## Сколько часов нужно","В среднем: младенцы спят много, **дети 6–12 лет** — около **9–12 часов**, **подростки** — 8–10 часов, **взрослые** — 7–9 часов. У каждого есть небольшие отличия.","## Привычки, которые помогают","Ложитесь и вставайте в одно и то же время. Держите комнату прохладной, тёмной и тихой. **Не смотрите на экраны (телефон, ТВ) за час до сна.** Без кофе и крепкого чая во второй половине дня. Без плотного ужина и тяжёлых тренировок поздно вечером. Прогулки днём помогают.","## Когда обратиться","Если трудно засыпать несколько ночей в неделю дольше 3 месяцев, если вы громко храпите с остановками дыхания или всегда устали, несмотря на сон, обратитесь к медработнику.","> Хороший сон — не роскошь, а часть здоровья."]},
q:[{q:L("Konbyen èdtan yon granmoun bezwen anjeneral ?","Combien d'heures un adulte a-t-il en général besoin ?","How many hours does an adult generally need?","Сколько часов обычно нужно взрослому?"),o:["7–9","3–4","12–14","1–2"],a:0},
{q:L("Kisa pou w evite anvan w dòmi ?","Que faut-il éviter avant de dormir ?","What should you avoid before bed?","Чего избегать перед сном?"),o:[L("Ekran (telefòn, TV)","Les écrans (téléphone, télé)","Screens (phone, TV)","Экраны (телефон, ТВ)"),L("Chanm fre","Une chambre fraîche","A cool room","Прохладную комнату"),L("Silans","Le silence","Quiet","Тишину"),L("Yon lè regilye","Une heure régulière","A regular time","Постоянное время")],a:0},
{q:L("Ki lè pou w wè yon pwofesyonèl pou somèy ?","Quand voir un professionnel pour le sommeil ?","When to see a professional about sleep?","Когда обратиться из-за сна?"),o:[L("Si pwoblèm nan dire plis pase 3 mwa","Si le problème dure plus de 3 mois","If the problem lasts over 3 months","Если проблема длится более 3 месяцев"),L("Apre yon sèl move nwit","Après une seule mauvaise nuit","After one bad night","После одной плохой ночи"),L("Pa janm","Jamais","Never","Никогда"),L("Sèlman nan timoun","Seulement chez l'enfant","Only in children","Только у детей")],a:0}]});

t:L("Sik dlo a : ki jan dlo a toujou ap vwayaje","Le cycle de l'eau : le grand voyage de l'eau","The water cycle: water's endless journey","Круговорот воды: вечное путешествие воды"),
sum:L("Evaporasyon, kondansasyon, lapli ak koule : tout etap yo ak sa yo vle di pou nou.","Évaporation, condensation, pluie et ruissellement : toutes les étapes et ce que cela change pour nous.","Evaporation, condensation, rain and runoff: all the stages and what they mean for us.","Испарение, конденсация, осадки и сток: все этапы и что они значат для нас."),
b:{
ht:["## Dlo a pa fini","Dlo ki sou Latè a toujou ap sikile : se menm dlo a depi dè milyon d lane. Li chanje fòm epi li chanje plas, men li pa disparèt.","## Kat gwo etap","**1. Evaporasyon** : solèy la chofe lanmè, rivyè ak tè a, epi dlo a vin vapè nan lè a. Plant yo ede tou ak **transpirasyon**. **2. Kondansasyon** : nan lè a ki frèt, vapè a vin ti gout epi fòme nwaj. **3. Presipitasyon** : lè gout yo twò lou, yo tonbe kòm lapli, lagrèl oswa nèj. **4. Koule ak enfiltrasyon** : lapli a koule nan rivyè, antre nan tè a pou ranpli nap dlo ak sous, epi retounen nan lanmè.","## Pou Ayiti","Lè fòè yo koupe, tè a pa kenbe dlo a menm jan, kidonk gen plis inondasyon pandan lapli epi plis sechrès apre. Plante pyebwa epi pwoteje sous yo ede kenbe sik la an sante.","## Pwoteje dlo","Dlo dous la ra : mwens pase 3 % nan dlo Latè. Pa kontamine rivyè ak sous yo, epi pa gaspiye.","> Gout dlo ou bwè jodi a ka te pase nan nwaj, nan rivyè epi nan lanmè anvan."],
fr:["## L'eau ne disparaît pas","L'eau de la Terre circule sans cesse : c'est la même eau depuis des millions d'années. Elle change de forme et de lieu, mais ne disparaît pas.","## Quatre grandes étapes","**1. Évaporation** : le soleil chauffe la mer, les rivières et le sol, et l'eau devient vapeur dans l'air. Les plantes y contribuent par la **transpiration**. **2. Condensation** : dans l'air froid, la vapeur forme de minuscules gouttes et des nuages. **3. Précipitations** : quand les gouttes sont trop lourdes, elles tombent en pluie, grêle ou neige. **4. Ruissellement et infiltration** : la pluie coule dans les rivières, s'infiltre dans le sol pour alimenter les nappes et les sources, et retourne à la mer.","## Pour Haïti","Quand les forêts sont coupées, le sol retient moins l'eau : il y a plus d'inondations pendant les pluies et plus de sécheresse après. Planter des arbres et protéger les sources aide à garder le cycle en bonne santé.","## Protéger l'eau","L'eau douce est rare : moins de 3 % de l'eau de la Terre. Ne polluez pas les rivières et les sources, et ne la gaspillez pas.","> La goutte que vous buvez aujourd'hui a peut-être déjà été dans un nuage, une rivière et la mer."],
en:["## Water does not run out","Earth's water circulates constantly: it is the same water for millions of years. It changes form and place, but does not disappear.","## Four big stages","**1. Evaporation**: the sun heats the sea, rivers and ground, and water becomes vapour in the air. Plants help too through **transpiration**. **2. Condensation**: in cold air the vapour forms tiny droplets and clouds. **3. Precipitation**: when droplets get too heavy they fall as rain, hail or snow. **4. Runoff and infiltration**: rain flows into rivers, soaks into the ground to feed groundwater and springs, and returns to the sea.","## For Haiti","When forests are cut, the soil holds less water: more floods during rains and more drought afterwards. Planting trees and protecting springs helps keep the cycle healthy.","## Protecting water","Fresh water is scarce: less than 3% of Earth's water. Do not pollute rivers and springs, and do not waste it.","> The drop you drink today may already have been in a cloud, a river and the sea."],
ru:["## Вода не исчезает","Вода Земли постоянно циркулирует: это та же самая вода миллионы лет. Она меняет форму и место, но не исчезает.","## Четыре главных этапа","**1. Испарение**: солнце нагревает море, реки и землю, вода становится паром. Растения тоже участвуют через **транспирацию**. **2. Конденсация**: в холодном воздухе пар образует мельчайшие капли и облака. **3. Осадки**: когда капли становятся тяжёлыми, они падают дождём, градом или снегом. **4. Сток и просачивание**: дождь стекает в реки, просачивается в землю, питая грунтовые воды и родники, и возвращается в море.","## Для Гаити","Когда вырубают леса, почва хуже удерживает воду: больше наводнений во время дождей и больше засухи после. Посадка деревьев и защита родников помогают сохранить цикл здоровым.","## Берегите воду","Пресной воды мало: менее 3 % воды Земли. Не загрязняйте реки и родники и не расходуйте воду зря.","> Капля, которую вы пьёте сегодня, возможно, уже была в облаке, в реке и в море."]},
q:[{q:L("Ki etap ki fè dlo a vin vapè ?","Quelle étape transforme l'eau en vapeur ?","Which stage turns water into vapour?","Какой этап превращает воду в пар?"),o:[L("Evaporasyon","L'évaporation","Evaporation","Испарение"),L("Kondansasyon","La condensation","Condensation","Конденсация"),L("Enfiltrasyon","L'infiltration","Infiltration","Просачивание"),L("Presipitasyon","Les précipitations","Precipitation","Осадки")],a:0},
{q:L("Ki jan nwaj yo fòme ?","Comment se forment les nuages ?","How do clouds form?","Как образуются облака?"),o:[L("Vapè a vin ti gout nan lè frèt","La vapeur devient de petites gouttes dans l'air froid","Vapour becomes tiny droplets in cold air","Пар становится каплями в холодном воздухе"),L("Van pouse fimen","Le vent pousse de la fumée","Wind pushes smoke","Ветер гонит дым"),L("Lalin fè yo","La Lune les fait","The Moon makes them","Их делает Луна"),L("Yo soti nan tè","Ils sortent de terre","They come from the ground","Они идут из земли")],a:0},

ART.push({id:"matye",s:"fizik",lv:1,min:4,img:"rays",lab:"mat",w:[],
t:L("Twa eta matyè : solid, likid, gaz","Trois états de la matière : solide, liquide, gaz","Three states of matter: solid, liquid, gas","Три состояния вещества: твёрдое, жидкое, газообразное"),
sum:L("Ki jan yon bagay chanje eta, ak poukisa glas, dlo ak vapè se menm bagay.","Comment une chose change d'état, et pourquoi glace, eau et vapeur sont la même substance.","How a substance changes state, and why ice, water and steam are the same thing.","Как вещество меняет состояние и почему лёд, вода и пар — одно и то же."),
b:{
ht:["## Tout bagay fèt ak patikil","Tout sa ki egziste fèt ak patikil trè piti. Fason patikil sa yo òganize ak bouje bay **eta** matyè a.","## Twa eta","**Solid** : patikil yo sere epi yo sèlman vibre ; fòm nan fiks (wòch, glas, bwa). **Likid** : patikil yo pi lib, yo glise youn sou lòt ; li pran fòm veso a men volim nan rete menm (dlo, lwil). **Gaz** : patikil yo byen lwen epi yo bouje vit ; li ranpli tout espas la (lè, vapè).","## Chanjman eta yo","**Fizyon** : solid → likid (glas k ap fonn). **Solidifikasyon** : likid → solid. **Vaporizasyon** : likid → gaz (dlo k ap bouyi). **Kondansasyon** : gaz → likid. Nan nivo lanmè, dlo a fonn a **0 °C** epi li bouyi a **100 °C**. Se menm dlo a chak fwa ; sèlman patikil yo bouje diferan.","## Kisa ki fè l chanje","Se **chalè**. Plis ou chofe, plis patikil yo bouje vit. Lè ou retire chalè, yo ralanti. Sa eksplike poukisa glas fonn nan solèy.","> Glas, dlo ak vapè se menm substans (H₂O) nan twa eta."],
fr:["## Tout est fait de particules","Tout ce qui existe est fait de particules minuscules. La façon dont elles s'organisent et bougent donne l'**état** de la matière.","## Trois états","**Solide** : les particules sont serrées et ne font que vibrer ; la forme est fixe (pierre, glace, bois). **Liquide** : les particules sont plus libres et glissent les unes sur les autres ; il prend la forme du récipient mais garde son volume (eau, huile). **Gaz** : les particules sont très éloignées et bougent vite ; il remplit tout l'espace (air, vapeur).","## Les changements d'état","**Fusion** : solide → liquide (glace qui fond). **Solidification** : liquide → solide. **Vaporisation** : liquide → gaz (eau qui bout). **Condensation** : gaz → liquide. Au niveau de la mer, l'eau fond à **0 °C** et bout à **100 °C**. C'est toujours la même eau ; seules les particules bougent différemment.","## Qu'est-ce qui le provoque","C'est la **chaleur**. Plus on chauffe, plus les particules bougent vite. Quand on retire de la chaleur, elles ralentissent. Cela explique pourquoi la glace fond au soleil.","> Glace, eau et vapeur sont la même substance (H₂O) dans trois états."],
en:["## Everything is made of particles","Everything that exists is made of tiny particles. How they are arranged and how they move gives the **state** of matter.","## Three states","**Solid**: particles are packed and only vibrate; the shape is fixed (stone, ice, wood). **Liquid**: particles are freer and slide past each other; it takes the shape of its container but keeps its volume (water, oil). **Gas**: particles are far apart and move fast; it fills all the space (air, steam).","## Changes of state","**Melting**: solid → liquid (ice melting). **Freezing**: liquid → solid. **Vaporisation**: liquid → gas (water boiling). **Condensation**: gas → liquid. At sea level, water melts at **0 °C** and boils at **100 °C**. It is always the same water; only the particles move differently.","## What causes it","It is **heat**. The more you heat, the faster particles move. When you remove heat they slow down. This explains why ice melts in the sun.","> Ice, water and steam are the same substance (H₂O) in three states."],
ru:["## Всё состоит из частиц","Всё существующее состоит из мельчайших частиц. То, как они расположены и движутся, определяет **состояние** вещества.","## Три состояния","**Твёрдое**: частицы плотно упакованы и лишь колеблются; форма постоянна (камень, лёд, дерево). **Жидкое**: частицы свободнее и скользят друг по другу; принимает форму сосуда, но сохраняет объём (вода, масло). **Газ**: частицы далеко друг от друга и быстро движутся; заполняет всё пространство (воздух, пар).","## Переходы между состояниями","**Плавление**: твёрдое → жидкое (тает лёд). **Замерзание**: жидкое → твёрдое. **Парообразование**: жидкое → газ (вода кипит). **Конденсация**: газ → жидкое. На уровне моря вода плавится при **0 °C** и кипит при **100 °C**. Это всегда та же вода; лишь частицы движутся по-другому.","## Что вызывает переход","**Тепло**. Чем сильнее нагрев, тем быстрее движутся частицы. Когда тепло убирают, они замедляются. Поэтому лёд тает на солнце.","> Лёд, вода и пар — одно вещество (H₂O) в трёх состояниях."]},
q:[{q:L("Nan ki eta patikil yo pi lwen youn ak lòt ?","Dans quel état les particules sont-elles les plus éloignées ?","In which state are particles farthest apart?","В каком состоянии частицы дальше всего друг от друга?"),o:[L("Gaz","Gaz","Gas","Газ"),L("Solid","Solide","Solid","Твёрдое"),L("Likid","Liquide","Liquid","Жидкое"),L("Tout menm","Toutes pareil","All the same","Одинаково")],a:0},

{q:L("Kisa ki fè glas fonn ?","Qu'est-ce qui fait fondre la glace ?","What makes ice melt?","Что заставляет лёд таять?"),o:[L("Chalè","La chaleur","Heat","Тепло"),L("Fredi","Le froid","Cold","Холод"),L("Lonbraj","L'ombre","Shade","Тень"),L("Son","Le bruit","Noise","Шум")],a:0}]});

ART.push({id:"toussaint",s:"istwa",lv:2,min:5,img:"flag",lab:"tou",w:[],
t:L("Toussaint Louverture : chèf revolisyon ayisyen an","Toussaint Louverture : le chef de la révolution haïtienne","Toussaint Louverture: leader of the Haitian Revolution","Туссен Лувертюр: вождь гаитянской революции"),
sum:L("Ki moun li te ye, sa li te fè, ak ki jan lavi li te fini.","Qui il était, ce qu'il a fait, et comment sa vie s'est terminée.","Who he was, what he did, and how his life ended.","Кем он был, что сделал и как закончилась его жизнь."),
b:{
ht:["## Yon gason ki te leve nan esklavaj","**Toussaint Louverture** te fèt anviwon 1743 nan Sendomeng, nan yon fanmi esklav. Li te aprann li ak ekri, li te vin gen libète anvan revolisyon an, epi li te gen yon konesans pwofon sou plant ak medikaman.","## Chèf revolisyon an","Lè revolt esklav yo te kòmanse an 1791, li te rantre ladan l. Pita, li te vin yon chèf militè ak politik trè abil, li te ini twoup yo epi li te genyen kont twoup franse, angle ak espanyòl. An 1801, li te pwomilge yon **konstitisyon** ki te abolisyon esklavaj pou tout tan nan koloni an.","## Kaptire ak lanmò","An 1802, Napoleyon Bonapat te voye yon gwo ekspedisyon pou retabli esklavaj. Toussaint te arete pa twoup franse epi yo te depòte l an Frans. Li te mouri nan **Fò de Joux** an **avril 1803**, anvan Ayiti te pwoklame endepandans.","## Eritaj li","Lide li ak lit li te kontinye avèk **Dessalines** ki te kondi dènye batay yo. Toussaint rete yon senbòl libète nan Ayiti ak nan tout monn nan.","> Li pat wè endepandans lan, men se li menm ki te prepare chemen an."],
fr:["## Un homme né dans l'esclavage","**Toussaint Louverture** est né vers 1743 à Saint-Domingue, dans une famille d'esclaves. Il a appris à lire et à écrire, il a été affranchi avant la révolution, et il avait une connaissance profonde des plantes et des remèdes.","## Chef de la révolution","Quand la révolte des esclaves a commencé en 1791, il l'a rejointe. Il est devenu un chef militaire et politique très habile, a uni les troupes et a vaincu des armées françaises, anglaises et espagnoles. En 1801, il a promulgué une **constitution** qui abolissait l'esclavage pour toujours dans la colonie.","## Capture et mort","En 1802, Napoléon Bonaparte a envoyé une grande expédition pour rétablir l'esclavage. Toussaint a été arrêté par les troupes françaises et déporté en France. Il est mort au **fort de Joux** en **avril 1803**, avant la proclamation de l'indépendance d'Haïti.","## Son héritage","Ses idées et son combat ont continué avec **Dessalines**, qui a mené les dernières batailles. Toussaint reste un symbole de liberté en Haïti et dans le monde.","> Il n'a pas vu l'indépendance, mais c'est lui qui a préparé le chemin."],
en:["## A man born into slavery","**Toussaint Louverture** was born around 1743 in Saint-Domingue, into an enslaved family. He learned to read and write, was freed before the revolution, and had deep knowledge of plants and remedies.","## Leader of the revolution","When the slave revolt began in 1791, he joined it. He later became a very skilled military and political leader, united the troops and defeated French, British and Spanish armies. In 1801 he promulgated a **constitution** that abolished slavery for good in the colony.","## Capture and death","In 1802 Napoleon Bonaparte sent a large expedition to restore slavery. Toussaint was arrested by French troops and deported to France. He died at **Fort de Joux** in **April 1803**, before Haiti proclaimed independence.","## His legacy","His ideas and struggle continued with **Dessalines**, who led the final battles. Toussaint remains a symbol of freedom in Haiti and around the world.","> He did not see independence, but he prepared the way."],
ru:["## Человек, рождённый в рабстве","**Туссен Лувертюр** родился около 1743 года в Сен-Доменге в семье рабов. Он научился читать и писать, получил свободу до революции и глубоко знал растения и лекарства.","## Вождь революции","Когда в 1791 году началось восстание рабов, он присоединился к нему. Позже он стал очень способным военным и политическим лидером, объединил войска и победил французские, британские и испанские армии. В 1801 году он провозгласил **конституцию**, навсегда отменявшую рабство в колонии.","## Плен и смерть","В 1802 году Наполеон Бонапарт отправил большую экспедицию, чтобы восстановить рабство. Туссена арестовали французские войска и вывезли во Францию. Он умер в **форте-де-Жу** в **апреле 1803 года**, до провозглашения независимости Гаити.","## Наследие","Его идеи и борьбу продолжил **Дессалин**, который вёл последние сражения. Туссен остаётся символом свободы на Гаити и во всём мире.","> Он не увидел независимости, но подготовил путь."]},
q:[{q:L("Kote Toussaint te mouri ?","Où Toussaint est-il mort ?","Where did Toussaint die?","Где умер Туссен?"),o:[L("Fò de Joux, Frans","Fort de Joux, France","Fort de Joux, France","Форт-де-Жу, Франция"),L("Gonayiv","Gonaïves","Gonaïves","Гонаив"),L("Pòtoprens","Port-au-Prince","Port-au-Prince","Порт-о-Пренс"),L("Ayiti","Haïti","Haiti","Гаити")],a:0},
{q:L("Kisa konstitisyon 1801 la te fè ?","Que faisait la constitution de 1801 ?","What did the 1801 constitution do?","Что сделала конституция 1801 года?"),o:[L("Abolisyon esklavaj","Abolir l'esclavage","Abolished slavery","Отменила рабство"),L("Retabli esklavaj","Rétablir l'esclavage","Restored slavery","Восстановила рабство"),L("Pwoklame lamonachi","Proclamer la monarchie","Proclaimed a monarchy","Объявила монархию"),L("Anyen","Rien","Nothing","Ничего")],a:0},

ART.push({id:"dijesyon",s:"anat",lv:2,min:5,img:"hands",lab:"dig",w:[],
t:L("Sistèm dijestif : vwayaj manje a nan kò w","Le système digestif : le voyage des aliments dans le corps","The digestive system: a food's journey through the body","Пищеварительная система: путь еды по организму"),
sum:L("Bouch, lestomak, trip, fwa ak pankreyas : ki sa chak ògàn fè.","Bouche, estomac, intestins, foie et pancréas : le rôle de chaque organe.","Mouth, stomach, intestines, liver and pancreas: what each organ does.","Рот, желудок, кишечник, печень и поджелудочная железа: роль каждого органа."),
b:{
ht:["## Poukisa nou dijere","Manje nou manje twò gwo pou kò a itilize l dirèkteman. Dijesyon an kase l an ti eleman (sik, asid amine, asid gra, vitamin) ki ka pase nan san.","## Etap yo","**Bouch** : dan yo kraze manje a epi saliv la kòmanse kase amidon. **Ezofaj** : yon tiyo ki pouse manje a anba. **Lestomak** : asid ak anzim kase pwoteyin yo, epi li melanje manje a. **Trip fen** : sa ki fè anviwon sis mèt ; se la ki gen pi gwo absòpsyon eleman nitritif yo. **Gwo trip** : li absòbe dlo epi li fòme poupou.","## Ògàn ki ede","**Fwa** fè bil ki ede dijere grès. **Pankreyas** bay anzim ak ensilin. **Vezikil bilyè** estoke bil la.","## Pou pwoteje sistèm nan","Manje fib (legim, fwi, pwa), bwè dlo pwòp, lave men anvan manje, epi pa kenbe manje twò lontan san fri. Si w gen dyare ki dire, doulè nan vant ki fò, oswa san nan poupou, wè yon pwofesyonèl sante.","> Dijesyon kòmanse nan bouch : moulen byen epi pran tan."],
fr:["## Pourquoi on digère","Les aliments sont trop gros pour être utilisés directement par le corps. La digestion les découpe en petits éléments (sucres, acides aminés, acides gras, vitamines) qui peuvent passer dans le sang.","## Les étapes","**Bouche** : les dents broient et la salive commence à digérer l'amidon. **Œsophage** : un tube qui pousse les aliments vers le bas. **Estomac** : acide et enzymes décomposent les protéines et brassent les aliments. **Intestin grêle** : environ six mètres ; c'est là que se fait l'essentiel de l'absorption des nutriments. **Gros intestin** : absorbe l'eau et forme les selles.","## Organes qui aident","Le **foie** produit la bile qui aide à digérer les graisses. Le **pancréas** fournit des enzymes et l'insuline. La **vésicule biliaire** stocke la bile.","## Protéger son système digestif","Mangez des fibres (légumes, fruits, légumineuses), buvez de l'eau propre, lavez-vous les mains avant de manger, et ne gardez pas trop longtemps les aliments sans les réfrigérer. En cas de diarrhée prolongée, de forte douleur au ventre ou de sang dans les selles, consultez un professionnel de santé.","> La digestion commence dans la bouche : mâchez bien et prenez votre temps."],
en:["## Why we digest","Food is too big for the body to use directly. Digestion breaks it into small pieces (sugars, amino acids, fatty acids, vitamins) that can pass into the blood.","## The stages","**Mouth**: teeth crush food and saliva starts breaking down starch. **Oesophagus**: a tube that pushes food down. **Stomach**: acid and enzymes break down proteins and churn the food. **Small intestine**: about six metres long; most absorption of nutrients happens here. **Large intestine**: absorbs water and forms stool.","## Helper organs","The **liver** makes bile that helps digest fats. The **pancreas** supplies enzymes and insulin. The **gallbladder** stores bile.","## Protecting your digestive system","Eat fibre (vegetables, fruit, pulses), drink clean water, wash hands before eating, and do not keep food too long without refrigeration. For lasting diarrhoea, strong stomach pain or blood in the stool, see a health professional.","> Digestion starts in the mouth: chew well and take your time."],
ru:["## Зачем нужно пищеварение","Еда слишком крупная, чтобы организм использовал её напрямую. Пищеварение расщепляет её на мелкие части (сахара, аминокислоты, жирные кислоты, витамины), которые могут попасть в кровь.","## Этапы","**Рот**: зубы измельчают пищу, слюна начинает расщеплять крахмал. **Пищевод**: трубка, проталкивающая еду вниз. **Желудок**: кислота и ферменты расщепляют белки и перемешивают пищу. **Тонкая кишка**: около шести метров; здесь происходит основное всасывание питательных веществ. **Толстая кишка**: всасывает воду и формирует кал.","## Помогающие органы","**Печень** вырабатывает желчь, помогающую переваривать жиры. **Поджелудочная железа** даёт ферменты и инсулин. **Жёлчный пузырь** хранит желчь.","## Как беречь пищеварение","Ешьте клетчатку (овощи, фрукты, бобовые), пейте чистую воду, мойте руки перед едой и не храните еду долго без холода. При затяжном поносе, сильной боли в животе или крови в кале обратитесь к медработнику.","> Пищеварение начинается во рту: хорошо жуйте и не торопитесь."]},
q:[{q:L("Kote pi gwo absòpsyon eleman nitritif yo fèt ?","Où se fait l'essentiel de l'absorption des nutriments ?","Where does most nutrient absorption happen?","Где происходит основное всасывание питательных веществ?"),o:[L("Trip fen","L'intestin grêle","Small intestine","Тонкая кишка"),L("Bouch","La bouche","Mouth","Рот"),L("Ezofaj","L'œsophage","Oesophagus","Пищевод"),L("Lestomak","L'estomac","Stomach","Желудок")],a:0},
{q:L("Ki ògàn ki fè bil la ?","Quel organe fabrique la bile ?","Which organ makes bile?","Какой орган вырабатывает желчь?"),o:[L("Fwa","Le foie","The liver","Печень"),L("Ren","Le rein","The kidney","Почка"),L("Kè","Le cœur","The heart","Сердце"),L("Poumon","Le poumon","The lung","Лёгкое")],a:0},
{q:L("Ki sa ki ede pou pwoteje sistèm dijestif la ?","Qu'est-ce qui protège le système digestif ?","What helps protect the digestive system?","Что помогает защитить пищеварение?"),o:[L("Fib, dlo pwòp, lave men","Fibres, eau propre, lavage des mains","Fibre, clean water, handwashing","Клетчатка, чистая вода, мытьё рук"),L("Pa manje","Ne pas manger","Not eating","Не есть"),L("Manje vit","Manger vite","Eating fast","Есть быстро"),L("Bwè dlo sal","Boire de l'eau sale","Drinking dirty water","Пить грязную воду")],a:0}]});

t:L("Vitamin ak mineral : ti kantite ki fè gwo diferans","Vitamines et minéraux : de petites quantités, une grande différence","Vitamins and minerals: small amounts, big difference","Витамины и минералы: малые количества, большая разница"),
sum:L("Ki manje ki bay yo, ak ki manke ki pi komen.","Quels aliments les apportent, et les carences les plus courantes.","Which foods provide them, and the most common deficiencies.","В каких продуктах они есть и какие дефициты самые частые."),
b:{
ht:["## Ti kantite, gwo wòl","Vitamin ak mineral pa bay enèji, men kò a pa kapab fonksyone san yo. Nou bezwen yo an ti kantite chak jou, epi nou jwenn yo nan manje.","## Kèk egzanp","**Vitamin A** (kawòt, mango, papay, epina) : pou je ak defans kò a. **Vitamin C** (zoranj, sitwon, gwayav) : ede geri blesi epi absòbe fè. **Fè** (pwa, vyann, legim vèt fonse) : pou san an ; kèk manke bay **anemi**. **Yòd** (sèl ki gen yòd, pwason) : pou tiwoyid la. **Kalsyòm ak vitamin D** : pou zo yo.","## Manke ki komen","**Anemi** (manke fè) bay fatig ak po pal, sitou nan fanm ansent ak timoun. Manke **yòd** ka bay gwo kou. Manke **vitamin A** ka domaje je yo nan timoun.","## Ki jan pou jwenn yo","Manje yon varyete : fwi ak legim koulè diferan chak jou, pwa, grenn, ak pwason oswa vyann. Sèl ki gen yòd. Si gen siy manke (fatig ki dire, po pal), wè yon pwofesyonèl sante. **Pa pran gwo dòz sipleman san konsèy.**","> Yon asyèt ki gen anpil koulè anjeneral bay anpil vitamin."],
fr:["## Petites quantités, grand rôle","Vitamines et minéraux ne donnent pas d'énergie, mais le corps ne peut pas fonctionner sans eux. Il en faut de petites quantités chaque jour, qu'on trouve dans l'alimentation.","## Quelques exemples","**Vitamine A** (carotte, mangue, papaye, épinards) : pour les yeux et les défenses. **Vitamine C** (orange, citron, goyave) : aide à cicatriser et à absorber le fer. **Fer** (haricots, viande, légumes verts foncés) : pour le sang ; un manque cause l'**anémie**. **Iode** (sel iodé, poisson) : pour la thyroïde. **Calcium et vitamine D** : pour les os.","## Carences fréquentes","L'**anémie** (manque de fer) donne fatigue et pâleur, surtout chez les femmes enceintes et les enfants. Le manque d'**iode** peut causer un goitre. Le manque de **vitamine A** peut abîmer les yeux des enfants.","## Comment en avoir assez","Mangez varié : fruits et légumes de couleurs différentes chaque jour, légumineuses, céréales, et poisson ou viande. Utilisez du sel iodé. En cas de signes de carence (fatigue qui dure, pâleur), consultez un professionnel de santé. **Ne prenez pas de fortes doses de compléments sans conseil.**","> Une assiette très colorée apporte en général beaucoup de vitamines."],
en:["## Small amounts, big role","Vitamins and minerals do not give energy, but the body cannot work without them. We need small amounts every day, and we get them from food.","## A few examples","**Vitamin A** (carrot, mango, papaya, spinach): for eyes and defences. **Vitamin C** (orange, lemon, guava): helps wounds heal and iron absorption. **Iron** (beans, meat, dark green vegetables): for blood; a lack causes **anaemia**. **Iodine** (iodised salt, fish): for the thyroid. **Calcium and vitamin D**: for bones.","## Common deficiencies","**Anaemia** (lack of iron) causes tiredness and pale skin, especially in pregnant women and children. Lack of **iodine** can cause a goitre. Lack of **vitamin A** can damage children's eyes.","## How to get enough","Eat a variety: fruit and vegetables of different colours every day, pulses, grains, and fish or meat. Use iodised salt. If you have signs of deficiency (lasting tiredness, pallor), see a health professional. **Do not take high doses of supplements without advice.**","> A very colourful plate usually provides plenty of vitamins."],
ru:["## Малые количества, большая роль","Витамины и минералы не дают энергии, но без них организм не работает. Нужны небольшие количества каждый день, и мы получаем их с едой.","## Несколько примеров","**Витамин A** (морковь, манго, папайя, шпинат): для зрения и защитных сил. **Витамин C** (апельсин, лимон, гуава): помогает заживлению ран и усвоению железа. **Железо** (бобовые, мясо, тёмно-зелёные овощи): для крови; дефицит вызывает **анемию**. **Йод** (йодированная соль, рыба): для щитовидной железы. **Кальций и витамин D**: для костей.","## Частые дефициты","**Анемия** (нехватка железа) вызывает усталость и бледность, особенно у беременных и детей. Нехватка **йода** может вызвать зоб. Нехватка **витамина A** может повредить глаза детей.","## Как получать достаточно","Ешьте разнообразно: фрукты и овощи разных цветов каждый день, бобовые, крупы, рыбу или мясо. Используйте йодированную соль. При признаках дефицита (стойкая усталость, бледность) обратитесь к медработнику. **Не принимайте высокие дозы добавок без совета.**","> Очень разноцветная тарелка обычно даёт много витаминов."]},
q:[{q:L("Ki manke ki bay anemi ?","Quel manque cause l'anémie ?","What deficiency causes anaemia?","Какой дефицит вызывает анемию?"),o:[L("Fè","Le fer","Iron","Железо"),L("Yòd","L'iode","Iodine","Йод"),L("Vitamin C sèlman","La vitamine C seule","Vitamin C only","Только витамин C"),L("Sik","Le sucre","Sugar","Сахар")],a:0},
{q:L("Ki sèl ki pwoteje tiwoyid la ?","Quel sel protège la thyroïde ?","Which salt protects the thyroid?","Какая соль защищает щитовидную железу?"),o:[L("Sèl ki gen yòd","Le sel iodé","Iodised salt","Йодированная соль"),L("Sèl lanmè sèlman","Le sel de mer seul","Sea salt only","Только морская соль"),L("Okenn","Aucun","None","Никакая"),L("Sik","Le sucre","Sugar","Сахар")],a:0},
{q:L("Ki sa ki bon pou gen anpil vitamin ?","Que faire pour avoir beaucoup de vitamines ?","How to get plenty of vitamins?","Как получить много витаминов?"),o:[L("Manje yon varyete fwi ak legim","Manger une variété de fruits et légumes","Eat a variety of fruit and vegetables","Есть разнообразные фрукты и овощи"),L("Manje sèlman diri","Manger seulement du riz","Eat only rice","Есть только рис"),L("Pa manje fwi","Ne pas manger de fruits","Skip fruit","Не есть фрукты"),L("Pran gwo dòz san konsèy","Forte dose sans conseil","High doses without advice","Высокие дозы без совета")],a:0}]});

t:L("Ayiti sou kat la : kote l ye, ki jan l fèt","Haïti sur la carte : où elle se trouve, comment elle est faite","Haiti on the map: where it is and what it looks like","Гаити на карте: где она находится и какая она"),
sum:L("Zile a, vwazen yo, depatman yo ak mòn ki pi wo a.","L'île, les voisins, les départements et le plus haut sommet.","The island, neighbours, departments and highest peak.","Остров, соседи, департаменты и высшая вершина."),
b:{
ht:["## Yon peyi nan Karayib la","Ayiti okipe twaka lwès zile **Ispanyola** a, dezyèm pi gwo zile nan Karayib la apre Kiba. Mwatye lès zile a se **Repiblik Dominikèn**. Sou lanmè, Ayiti toupre Kiba (nò) ak Jamayik (sidwès).","## Gwosè ak jewografi","Peyi a gen anviwon **27 750 km²**. Li gen anpil mòn, ak kèk plèn ak vale. Pi gwo mòn lan se **Pik la Sèl**, anviwon **2 680 m**. Pi gwo lak la se **Etan Somat** (Lak Azuei).","## Òganizasyon","Ayiti gen **10 depatman**. Kapital la se **Pòtoprens**. Lang ofisyèl yo se **kreyòl ayisyen ak fransè**.","## Poukisa sa enpòtan","Konnen kote peyi a ye ede nou konprann istwa l, klima l ak risk natirèl li yo, tankou siklòn ak tranblemanntè.","> Konnen kat peyi w se premye pa pou konprann li."],
fr:["## Un pays des Caraïbes","Haïti occupe le tiers ouest de l'île d'**Hispaniola**, la deuxième plus grande île des Caraïbes après Cuba. Les deux tiers est de l'île forment la **République dominicaine**. Par la mer, Haïti est proche de Cuba (au nord) et de la Jamaïque (au sud-ouest).","## Taille et géographie","Le pays couvre environ **27 750 km²**. Il compte beaucoup de montagnes, ainsi que quelques plaines et vallées. Le plus haut sommet est le **pic la Selle**, vers **2 680 m**. Le plus grand lac est l'**étang Saumâtre** (lac Azuei).","## Organisation","Haïti compte **10 départements**. La capitale est **Port-au-Prince**. Les langues officielles sont le **créole haïtien et le français**.","## Pourquoi c'est important","Savoir où se trouve le pays aide à comprendre son histoire, son climat et ses risques naturels, comme les cyclones et les séismes.","> Connaître la carte de son pays est le premier pas pour le comprendre."],
en:["## A Caribbean country","Haiti occupies the western third of the island of **Hispaniola**, the second-largest island in the Caribbean after Cuba. The eastern two thirds form the **Dominican Republic**. By sea, Haiti is close to Cuba (north) and Jamaica (south-west).","## Size and geography","The country covers about **27,750 km²**. It has many mountains, plus some plains and valleys. The highest peak is **Pic la Selle**, around **2,680 m**. The largest lake is **Étang Saumâtre** (Lake Azuei).","## Organisation","Haiti has **10 departments**. The capital is **Port-au-Prince**. The official languages are **Haitian Creole and French**.","## Why it matters","Knowing where the country lies helps explain its history, climate and natural hazards such as hurricanes and earthquakes.","> Knowing your country's map is the first step to understanding it."],
ru:["## Страна Карибского бассейна","Гаити занимает западную треть острова **Эспаньола**, второго по величине острова Карибского моря после Кубы. Восточные две трети острова — **Доминиканская Республика**. По морю Гаити близка к Кубе (на севере) и Ямайке (на юго-западе).","## Размер и география","Площадь страны — около **27 750 км²**. Здесь много гор, а также несколько равнин и долин. Высшая точка — **Пик-ла-Сель**, около **2 680 м**. Крупнейшее озеро — **Этан-Сомат** (Асуэй).","## Устройство","На Гаити **10 департаментов**. Столица — **Порт-о-Пренс**. Официальные языки — **гаитянский креольский и французский**.","## Почему это важно","Знание того, где находится страна, помогает понять её историю, климат и природные риски, такие как ураганы и землетрясения.","> Знать карту своей страны — первый шаг к тому, чтобы понять её."]},
q:[{q:L("Ki lòt peyi ki sou zile Ispanyola a ?","Quel autre pays est sur l'île d'Hispaniola ?","Which other country is on Hispaniola?","Какая ещё страна находится на острове Эспаньола?"),o:[L("Repiblik Dominikèn","République dominicaine","Dominican Republic","Доминиканская Республика"),L("Kiba","Cuba","Cuba","Куба"),L("Jamayik","Jamaïque","Jamaica","Ямайка"),L("Pòtoriko","Porto Rico","Puerto Rico","Пуэрто-Рико")],a:0},

ART.push({id:"chenalim",s:"byoloji",lv:1,min:4,img:"leaf",lab:"chn",w:[],
t:L("Chèn alimantè : ki moun ki manje ki moun","Chaîne alimentaire : qui mange qui","Food chains: who eats whom","Пищевые цепи: кто кого ест"),
sum:L("Pwodiktè, konsomatè ak dekonpozè, ak ki jan enèji pase.","Producteurs, consommateurs et décomposeurs, et comment l'énergie circule.","Producers, consumers and decomposers, and how energy flows.","Продуценты, консументы и редуценты, и как течёт энергия."),
b:{
ht:["## Tout vivan depann youn de lòt","Yon chèn alimantè montre ki jan enèji pase soti nan yon vivan pou ale nan yon lòt lè youn manje lòt.","## Twa gwoup","**Pwodiktè** : plant yo, ki fè pwòp manje yo ak limyè solèy la (fotosentèz). **Konsomatè** : bèt ki manje lòt vivan. Erbivò manje plant (konsomatè primè), kanivò manje lòt bèt (konsomatè segondè). **Dekonpozè** : chanpiyon ak bakteri ki dekonpoze sa ki mouri epi remèt eleman nan tè a.","## Yon egzanp","Zèb → krikèt → ti zwazo → malfini. Lè youn nan yo disparèt, tout chèn nan ka chanje.","## Enèji pèdi","Chak fwa enèji pase nan yon nivo, pi gwo pati l pèdi (anviwon 90 % an mwayèn). Se poutèt sa gen mwens kanivò pase erbivò.","> Si yon moun rache yon fil nan chèn nan, tout rezo a souke."],
fr:["## Tous les êtres vivants dépendent les uns des autres","Une chaîne alimentaire montre comment l'énergie passe d'un être vivant à un autre quand l'un mange l'autre.","## Trois groupes","**Producteurs** : les plantes, qui fabriquent leur nourriture avec la lumière du soleil (photosynthèse). **Consommateurs** : animaux qui mangent d'autres êtres vivants. Les herbivores mangent des plantes (consommateurs primaires), les carnivores mangent d'autres animaux (consommateurs secondaires). **Décomposeurs** : champignons et bactéries qui décomposent ce qui meurt et rendent les éléments au sol.","## Un exemple","Herbe → criquet → petit oiseau → faucon. Quand l'un d'eux disparaît, toute la chaîne peut changer.","## L'énergie se perd","À chaque niveau, la plus grande partie de l'énergie est perdue (environ 90 % en moyenne). C'est pourquoi il y a moins de carnivores que d'herbivores.","> Si on retire un maillon, tout le réseau tremble."],
en:["## Living things depend on each other","A food chain shows how energy passes from one living thing to another when one eats the other.","## Three groups","**Producers**: plants, which make their own food from sunlight (photosynthesis). **Consumers**: animals that eat other living things. Herbivores eat plants (primary consumers), carnivores eat other animals (secondary consumers). **Decomposers**: fungi and bacteria that break down what dies and return nutrients to the soil.","## An example","Grass → grasshopper → small bird → hawk. When one of them disappears, the whole chain can change.","## Energy is lost","At each level most of the energy is lost (about 90% on average). That is why there are fewer carnivores than herbivores.","> Remove one link and the whole web shakes."],
ru:["## Все живые существа зависят друг от друга","Пищевая цепь показывает, как энергия переходит от одного живого существа к другому, когда одно ест другое.","## Три группы","**Продуценты**: растения, которые создают пищу из солнечного света (фотосинтез). **Консументы**: животные, питающиеся другими живыми существами. Травоядные едят растения (консументы первого порядка), хищники едят других животных (консументы второго порядка). **Редуценты**: грибы и бактерии, которые разлагают умершее и возвращают вещества в почву.","## Пример","Трава → кузнечик → маленькая птица → ястреб. Если одно звено исчезает, вся цепь может измениться.","## Энергия теряется","На каждом уровне большая часть энергии теряется (в среднем около 90 %). Поэтому хищников меньше, чем травоядных.","> Уберите одно звено — и вся сеть задрожит."]},
q:[{q:L("Ki moun ki fè pwòp manje li ak solèy ?","Qui fabrique sa nourriture avec le soleil ?","Who makes its own food using sunlight?","Кто создаёт пищу с помощью солнца?"),o:[L("Plant yo","Les plantes","Plants","Растения"),L("Kanivò yo","Les carnivores","Carnivores","Хищники"),L("Dekonpozè yo","Les décomposeurs","Decomposers","Редуценты"),L("Erbivò yo","Les herbivores","Herbivores","Травоядные")],a:0},
{q:L("Kisa dekonpozè yo fè ?","Que font les décomposeurs ?","What do decomposers do?","Что делают редуценты?"),o:[L("Dekonpoze sa ki mouri","Ils décomposent ce qui meurt","They break down dead matter","Разлагают умершее"),L("Fè fotosentèz","Ils font la photosynthèse","They photosynthesise","Занимаются фотосинтезом"),L("Manje sèlman plant","Ils ne mangent que des plantes","They only eat plants","Едят только растения"),L("Pa fè anyen","Ils ne font rien","They do nothing","Ничего не делают")],a:0},
{q:L("Poukisa gen mwens kanivò pase erbivò ?","Pourquoi y a-t-il moins de carnivores que d'herbivores ?","Why are there fewer carnivores than herbivores?","Почему хищников меньше, чем травоядных?"),o:[L("Enèji a pèdi nan chak nivo","L'énergie se perd à chaque niveau","Energy is lost at each level","Энергия теряется на каждом уровне"),L("Yo pi frajil","Ils sont plus fragiles","They are weaker","Они слабее"),L("Yo pa manje","Ils ne mangent pas","They do not eat","Они не едят"),L("Pa gen rezon","Aucune raison","No reason","Нет причины")],a:0}]});

ART.push({id:"dlopwop",s:"sp",lv:1,min:4,img:"shield",lab:"dlp",w:[],
t:L("Dlo pou bwè : ki jan pou fè l pwòp","L'eau à boire : comment la rendre sûre","Drinking water: how to make it safe","Питьевая вода: как сделать её безопасной"),
sum:L("Filtre, bouyi oswa dezenfekte : etap senp yo ak sa pou w evite.","Filtrer, bouillir ou désinfecter : les gestes simples et ce qu'il faut éviter.","Filter, boil or disinfect: the simple steps and what to avoid.","Процедить, прокипятить или обеззаразить: простые шаги и чего избегать."),
b:{
ht:["## Dlo klè pa toujou pwòp","Dlo ki sanble klè ka gen mikwòb ki bay dyare, kolera ak lòt maladi. Dlo sal se youn nan gwo kòz maladi nan timoun.","## Etap yo","**1. Kite li poze epi filtre l** nan yon twal pwòp si l twoub. **2. Bouyi l** : kite l bouyi byen (gwo boul) pandan **1 minit** (3 minit si w nan gwo mòn). Kite l refwadi ak kouvèti sou li. **3. Oswa dezenfekte l** ak pwodui klò (tankou Aquatabs oswa gout klò) swiv enstriksyon ki sou etikèt la.","## Kenbe l pwòp","Estoke dlo a nan yon veso pwòp ki gen kouvèti. Sèvi ak yon tas pwòp ak yon manch, pa men w. Lave men w anvan w manyen dlo pou bwè.","## Si w malad","Si w gen dyare ak vomisman, bwè anpil likid (tankou sèl rehidratasyon) epi ale nan yon sant sante rapidman.","> Dlo pwòp pwoteje tout fanmi an."],
fr:["## Une eau claire n'est pas toujours propre","Une eau qui paraît claire peut contenir des microbes qui causent diarrhée, choléra et d'autres maladies. L'eau sale est l'une des grandes causes de maladie chez les enfants.","## Les étapes","**1. La laisser reposer et la filtrer** à travers un tissu propre si elle est trouble. **2. La faire bouillir** : laissez bouillir à gros bouillons pendant **1 minute** (3 minutes en haute montagne). Laissez refroidir avec un couvercle. **3. Ou la désinfecter** avec un produit chloré (comme Aquatabs ou des gouttes de chlore) en suivant les instructions de l'étiquette.","## La garder propre","Conservez l'eau dans un récipient propre avec un couvercle. Servez-vous d'une louche propre avec un manche, pas de vos mains. Lavez-vous les mains avant de toucher l'eau potable.","## En cas de maladie","En cas de diarrhée et de vomissements, buvez beaucoup de liquides (comme un sel de réhydratation) et allez vite dans un centre de santé.","> Une eau propre protège toute la famille."],
en:["## Clear water is not always clean","Water that looks clear can carry germs that cause diarrhoea, cholera and other diseases. Dirty water is one of the main causes of illness in children.","## The steps","**1. Let it settle and filter it** through a clean cloth if it is cloudy. **2. Boil it**: bring it to a rolling boil for **1 minute** (3 minutes at high altitude). Let it cool with a lid on. **3. Or disinfect it** with a chlorine product (such as Aquatabs or chlorine drops), following the label instructions.","## Keep it clean","Store the water in a clean container with a lid. Use a clean ladle with a handle, not your hands. Wash your hands before touching drinking water.","## If someone is ill","With diarrhoea and vomiting, drink plenty of fluids (such as oral rehydration salts) and go to a health centre quickly.","> Clean water protects the whole family."],
ru:["## Прозрачная вода не всегда чистая","Вода, которая выглядит прозрачной, может содержать микробы, вызывающие понос, холеру и другие болезни. Грязная вода — одна из главных причин болезней у детей.","## Шаги","**1. Дайте воде отстояться и процедите** её через чистую ткань, если она мутная. **2. Прокипятите**: кипятите на сильном огне **1 минуту** (3 минуты высоко в горах). Остудите под крышкой. **3. Или обеззаразьте** хлорсодержащим средством (например, Aquatabs или капли хлора), следуя инструкции на этикетке.","## Держите воду чистой","Храните воду в чистой ёмкости с крышкой. Берите воду чистым черпаком с ручкой, а не руками. Мойте руки перед тем, как касаться питьевой воды.","## Если кто-то заболел","При поносе и рвоте пейте много жидкости (например, раствор для регидратации) и быстро обратитесь в медицинский центр.","> Чистая вода защищает всю семью."]},
q:[{q:L("Konbyen tan pou w bouyi dlo a (nivo lanmè) ?","Combien de temps faire bouillir l'eau (niveau de la mer) ?","How long should you boil water (sea level)?","Сколько кипятить воду (на уровне моря)?"),o:[L("1 minit","1 minute","1 minute","1 минуту"),L("5 segonn","5 secondes","5 seconds","5 секунд"),L("1 èdtan","1 heure","1 hour","1 час"),L("Pa bezwen","Inutile","Not needed","Не нужно")],a:0},
{q:L("Kijan pou w pran dlo nan veso a ?","Comment prendre l'eau du récipient ?","How should you take water from the container?","Как брать воду из ёмкости?"),o:[L("Ak yon tas pwòp ki gen manch","Avec une louche propre à manche","With a clean ladle with a handle","Чистым черпаком с ручкой"),L("Ak men w","Avec la main","With your hand","Рукой"),L("Ak yon bokit sal","Avec un seau sale","With a dirty bucket","Грязным ведром"),L("Sa pa gen enpòtans","Peu importe","Does not matter","Неважно")],a:0},
{q:L("Si dlo a twoub, kisa pou w fè anvan ?","Si l'eau est trouble, que faire d'abord ?","If the water is cloudy, what first?","Если вода мутная, что сделать сначала?"),o:[L("Filtre l nan yon twal pwòp","La filtrer dans un tissu propre","Filter it through clean cloth","Процедить через чистую ткань"),L("Bwè l konsa","La boire telle quelle","Drink it as is","Пить как есть"),L("Ajoute sik","Ajouter du sucre","Add sugar","Добавить сахар"),L("Mete l nan solèy sèlman","La mettre au soleil seulement","Only put it in the sun","Только оставить на солнце")],a:0}]});

ART.push({id:"newton",s:"fizik",lv:2,min:5,img:"rays",lab:"nwt",w:[],
t:L("Twa lwa Newton : poukisa bagay yo bouje","Les trois lois de Newton : pourquoi les choses bougent","Newton's three laws: why things move","Три закона Ньютона: почему тела движутся"),
sum:L("Inèsi, fòs ak aselerasyon, aksyon ak reyaksyon.","Inertie, force et accélération, action et réaction.","Inertia, force and acceleration, action and reaction.","Инерция, сила и ускорение, действие и противодействие."),
b:{
ht:["## Fòs chanje mouvman","Isaac Newton te dekri twa lwa senp ki eksplike mouvman prèske tout bagay, depi yon bal ki woule jiska yon motosiklèt.","## Lwa 1 : inèsi","Yon bagay ki rete an repo ap rete an repo, epi yon bagay ki ap bouje ap kontinye bouje menm vitès nan menm direksyon, **sof si yon fòs aji sou li**. Se poutèt sa w pouse devan lè otobis la fren sibitman.","## Lwa 2 : fòs ak aselerasyon","**F = m × a**. Plis yon bagay lou (mas pi gwo), plis li bezwen fòs pou chanje vitès li. Menm fòs la fè yon bagay lejè akselere plis.","## Lwa 3 : aksyon ak reyaksyon","Lè yon bagay pouse yon lòt, dezyèm lan pouse premye a ak menm fòs la nan direksyon opoze. Yon pwason ak yon bato ap deplase pa pouse dlo a an dèyè.","> Pa gen fòs ki pa gen yon fòs opoze.","Pou sekirite : senti sekirite a pwoteje w gras ak lwa 1."],
fr:["## La force change le mouvement","Isaac Newton a décrit trois lois simples qui expliquent le mouvement de presque tout, d'une bille qui roule à une moto.","## Loi 1 : l'inertie","Un objet au repos reste au repos, et un objet en mouvement continue à la même vitesse dans la même direction, **sauf si une force agit sur lui**. C'est pourquoi on est projeté vers l'avant quand le bus freine brusquement.","## Loi 2 : force et accélération","**F = m × a**. Plus un objet est lourd (masse plus grande), plus il faut de force pour changer sa vitesse. La même force fait accélérer davantage un objet léger.","## Loi 3 : action et réaction","Quand un objet pousse un autre, le second pousse le premier avec la même force dans le sens opposé. Un poisson ou un bateau avancent en repoussant l'eau vers l'arrière.","> Il n'y a pas de force sans force opposée.","Pour la sécurité : la ceinture de sécurité vous protège à cause de la loi 1."],
en:["## Force changes motion","Isaac Newton described three simple laws that explain the motion of almost everything, from a rolling marble to a motorbike.","## Law 1: inertia","An object at rest stays at rest, and an object in motion keeps moving at the same speed in the same direction, **unless a force acts on it**. That is why you lurch forward when a bus brakes suddenly.","## Law 2: force and acceleration","**F = m × a**. The heavier an object (the greater its mass), the more force it takes to change its speed. The same force accelerates a light object more.","## Law 3: action and reaction","When one object pushes another, the second pushes the first with the same force in the opposite direction. A fish or a boat moves forward by pushing water backwards.","> There is no force without an opposite force.","For safety: a seat belt protects you because of law 1."],
ru:["## Сила меняет движение","Исаак Ньютон описал три простых закона, объясняющих движение почти всего — от катящегося шарика до мотоцикла.","## Закон 1: инерция","Тело в покое остаётся в покое, а движущееся тело продолжает двигаться с той же скоростью в том же направлении, **пока на него не подействует сила**. Поэтому нас бросает вперёд, когда автобус резко тормозит.","## Закон 2: сила и ускорение","**F = m × a**. Чем тяжелее тело (больше масса), тем больше силы нужно, чтобы изменить его скорость. Одна и та же сила ускоряет лёгкое тело сильнее.","## Закон 3: действие и противодействие","Когда одно тело толкает другое, второе толкает первое с такой же силой в противоположном направлении. Рыба или лодка движутся вперёд, отталкивая воду назад.","> Не бывает силы без противоположной силы.","Для безопасности: ремень безопасности защищает вас благодаря первому закону."]},
q:[{q:L("Ki fòmil lwa 2 a ?","Quelle est la formule de la loi 2 ?","What is the formula of law 2?","Какова формула второго закона?"),o:["F = m × a","F = m + a","F = m / a","F = a − m"],a:0},
{q:L("Poukisa nou pouse devan lè otobis fren sibitman ?","Pourquoi est-on projeté en avant quand le bus freine ?","Why do we lurch forward when a bus brakes?","Почему нас бросает вперёд при торможении автобуса?"),o:[L("Inèsi : kò a vle kontinye bouje","L'inertie : le corps veut continuer à bouger","Inertia: the body keeps moving","Инерция: тело продолжает двигаться"),L("Lalin rale nou","La Lune nous attire","The Moon pulls us","Нас тянет Луна"),L("Otobis la pouse nou devan","Le bus nous pousse","The bus pushes us","Автобус толкает нас"),L("Se hazad","Par hasard","By chance","Случайно")],a:0},
{q:L("Ki lwa ki di aksyon ak reyaksyon egal ?","Quelle loi parle d'action et de réaction égales ?","Which law speaks of equal action and reaction?","Какой закон о равных действии и противодействии?"),o:[L("Lwa 3","Loi 3","Law 3","Закон 3"),L("Lwa 1","Loi 1","Law 1","Закон 1"),L("Lwa 2","Loi 2","Law 2","Закон 2"),L("Okenn","Aucune","None","Никакой")],a:0}]});

ART.push({id:"pousantaj",s:"math",lv:1,min:4,img:"pie",lab:"pct",w:[],
t:L("Pousantaj : kalkile % san pwoblèm","Les pourcentages : calculer sans difficulté","Percentages: calculating with ease","Проценты: считать без труда"),
sum:L("Ki sa % vle di, ki jan pou kalkile l, ak rabè ak enterè.","Ce que veut dire %, comment le calculer, et les réductions et intérêts.","What % means, how to calculate it, and discounts and interest.","Что значит %, как его считать, скидки и проценты."),
b:{
ht:["## Yon pati sou 100","**%** vle di « sou 100 ». 25 % vle di 25 sou chak 100, se 25/100 oswa **0,25**.","## Twa kalkil debaz","**% yon kantite** : fè kantite a × pousantaj la ÷ 100. Egzanp : 20 % de 50 = 50 × 20 ÷ 100 = **10**. **Ki pousantaj** : (pati ÷ total) × 100. Egzanp : 15 sou 60 = 15 ÷ 60 × 100 = **25 %**. **Total** : si 20 % se 10, total la se 10 ÷ 0,20 = **50**.","## Yon rakousi","Pou jwenn **10 %**, divize pa 10. Pou 5 %, pran mwatye 10 % la. Egzanp : 10 % de 300 = **30**.","## Rabè ak enterè","Si yon bagay ki koute 200 gourd gen **15 % rabè**, ou ekonomize 200 × 0,15 = 30 gourd epi w peye **170**. Pou yon prè, enterè a se yon pousantaj sou kantite w prete a : toujou mande ki pousantaj la ye ak pou konbyen tan.","> Pousantaj yo se zouti pou konpare kantite ki pa menm gwosè."],
fr:["## Une partie sur 100","**%** signifie « sur 100 ». 25 % veut dire 25 sur chaque 100, soit 25/100 ou **0,25**.","## Trois calculs de base","**% d'une quantité** : quantité × pourcentage ÷ 100. Exemple : 20 % de 50 = 50 × 20 ÷ 100 = **10**. **Quel pourcentage** : (partie ÷ total) × 100. Exemple : 15 sur 60 = 15 ÷ 60 × 100 = **25 %**. **Le total** : si 20 % valent 10, le total est 10 ÷ 0,20 = **50**.","## Un raccourci","Pour trouver **10 %**, divisez par 10. Pour 5 %, prenez la moitié de 10 %. Exemple : 10 % de 300 = **30**.","## Réductions et intérêts","Si un article à 200 gourdes a **15 % de réduction**, vous économisez 200 × 0,15 = 30 gourdes et vous payez **170**. Pour un prêt, l'intérêt est un pourcentage de la somme empruntée : demandez toujours le taux et la durée.","> Les pourcentages sont l'outil pour comparer des quantités de tailles différentes."],
en:["## A part out of 100","**%** means “out of 100”. 25% means 25 out of every 100, that is 25/100 or **0.25**.","## Three basic calculations","**% of an amount**: amount × percentage ÷ 100. Example: 20% of 50 = 50 × 20 ÷ 100 = **10**. **What percentage**: (part ÷ total) × 100. Example: 15 out of 60 = 15 ÷ 60 × 100 = **25%**. **The total**: if 20% is 10, the total is 10 ÷ 0.20 = **50**.","## A shortcut","To find **10%**, divide by 10. For 5%, take half of 10%. Example: 10% of 300 = **30**.","## Discounts and interest","If a 200-gourde item has **15% off**, you save 200 × 0.15 = 30 gourdes and pay **170**. For a loan, interest is a percentage of the amount borrowed: always ask for the rate and the duration.","> Percentages are the tool for comparing amounts of different sizes."],
ru:["## Часть от ста","**%** означает «из ста». 25 % — это 25 из каждых 100, то есть 25/100 или **0,25**.","## Три базовых расчёта","**% от количества**: количество × процент ÷ 100. Пример: 20 % от 50 = 50 × 20 ÷ 100 = **10**. **Какой процент**: (часть ÷ целое) × 100. Пример: 15 из 60 = 15 ÷ 60 × 100 = **25 %**. **Целое**: если 20 % — это 10, целое равно 10 ÷ 0,20 = **50**.","## Быстрый способ","Чтобы найти **10 %**, разделите на 10. Для 5 % возьмите половину от 10 %. Пример: 10 % от 300 = **30**.","## Скидки и проценты по займу","Если товар за 200 гурдов продаётся со **скидкой 15 %**, вы экономите 200 × 0,15 = 30 гурдов и платите **170**. По займу проценты — это доля от занятой суммы: всегда спрашивайте ставку и срок.","> Проценты — инструмент для сравнения величин разного размера."]},

t:L("Ki jan pou etidye pi byen","Comment mieux étudier","How to study better","Как лучше учиться"),
sum:L("Rapèl aktif, repetisyon espase ak pòz : metòd ki fonksyone.","Rappel actif, répétition espacée et pauses : des méthodes qui marchent.","Active recall, spaced repetition and breaks: methods that work.","Активное вспоминание, интервальное повторение и перерывы: методы, которые работают."),
b:{
ht:["## Relijen pa ase","Pou anpil moun, relijen yon leson plizyè fwa santi l tankou aprantisaj, men se pa metòd ki pi efikas. Rechèch sou memwa montre pi bon fason.","## Rapèl aktif","Fèmen liv la epi eseye **sonje** sa w aprann : ekri l, di l ak vwa wo, oswa reponn kesyon. Si w bloke, gade repons lan epi eseye ankò. Sa fòtifye memwa a plis pase relijen.","## Repetisyon espase","Revize yon leson **aprè 1 jou, aprè 3 jou, aprè 1 semèn** olye de tout nan yon sèl jou. Memwa a kenbe pi byen lè w repete ak espas.","## Pòz ak somèy","Etidye nan peryòd kout (egzanp 25 minit) ak yon ti pòz 5 minit. Dòmi ase : se pandan somèy sèvo a kenbe sa w aprann.","## Eksplike a yon lòt","Eseye eksplike leson an ak mo senp bay yon zanmi. Kote w bloke, se la w poko konprann byen.","> Etidye pa vle di gade, men eseye sonje."],
fr:["## Relire ne suffit pas","Pour beaucoup, relire une leçon plusieurs fois donne l'impression d'apprendre, mais ce n'est pas la méthode la plus efficace. La recherche sur la mémoire montre de meilleures façons.","## Le rappel actif","Fermez le livre et essayez de **vous rappeler** ce que vous avez appris : écrivez-le, dites-le à voix haute ou répondez à des questions. Si vous bloquez, regardez la réponse et réessayez. Cela renforce davantage la mémoire que la relecture.","## La répétition espacée","Révisez une leçon **après 1 jour, après 3 jours, après 1 semaine** plutôt que tout en une seule fois. La mémoire retient mieux quand on répète en espaçant.","## Pauses et sommeil","Étudiez par périodes courtes (par exemple 25 minutes) avec une pause de 5 minutes. Dormez assez : c'est pendant le sommeil que le cerveau fixe ce qu'on a appris.","## Expliquer à quelqu'un","Essayez d'expliquer la leçon avec des mots simples à un ami. Là où vous bloquez, c'est que vous ne comprenez pas encore bien.","> Étudier, ce n'est pas regarder, c'est essayer de se rappeler."],
en:["## Rereading is not enough","For many people, rereading a lesson several times feels like learning, but it is not the most effective method. Memory research shows better ways.","## Active recall","Close the book and try to **remember** what you learned: write it down, say it aloud or answer questions. If you get stuck, check the answer and try again. This strengthens memory more than rereading.","## Spaced repetition","Review a lesson **after 1 day, after 3 days, after 1 week** rather than all at once. Memory holds better when you repeat with gaps.","## Breaks and sleep","Study in short periods (for example 25 minutes) with a 5-minute break. Sleep enough: the brain fixes what you learned during sleep.","## Explain it to someone","Try explaining the lesson in simple words to a friend. Where you get stuck is where you do not yet understand well.","> Studying is not looking, it is trying to remember."],
ru:["## Перечитывания недостаточно","Многим кажется, что многократное перечитывание урока — это обучение, но это не самый эффективный метод. Исследования памяти показывают способы лучше.","## Активное вспоминание","Закройте книгу и постарайтесь **вспомнить** выученное: запишите, скажите вслух или ответьте на вопросы. Если застряли, посмотрите ответ и попробуйте снова. Это укрепляет память сильнее, чем перечитывание.","## Интервальное повторение","Повторяйте урок **через 1 день, через 3 дня, через неделю**, а не всё сразу. Память держится лучше, когда повторяешь с промежутками.","## Перерывы и сон","Занимайтесь короткими периодами (например, 25 минут) с 5-минутным перерывом. Высыпайтесь: мозг закрепляет выученное во сне.","## Объясните другому","Попробуйте простыми словами объяснить урок другу. Там, где вы запнулись, вы ещё не поняли как следует.","> Учиться — значит не смотреть, а пытаться вспомнить."]},
q:[{q:L("Ki metòd ki fòtifye memwa a plis ?","Quelle méthode renforce le plus la mémoire ?","Which method strengthens memory most?","Какой метод сильнее укрепляет память?"),o:[L("Eseye sonje san gade liv la","Essayer de se rappeler sans regarder","Trying to recall without looking","Вспоминать, не глядя в книгу"),L("Relijen sèlman","Relire seulement","Rereading only","Только перечитывать"),L("Etidye tout nan yon sèl nwit","Tout étudier en une nuit","Cramming in one night","Учить всё за одну ночь"),L("Pa dòmi","Ne pas dormir","Not sleeping","Не спать")],a:0},
{q:L("Ki lè pou revize yon leson ?","Quand réviser une leçon ?","When to review a lesson?","Когда повторять урок?"),o:[L("Aprè 1 jou, 3 jou, 1 semèn","Après 1 jour, 3 jours, 1 semaine","After 1 day, 3 days, 1 week","Через 1 день, 3 дня, неделю"),L("Yon sèl fwa","Une seule fois","Only once","Только один раз"),L("Pa janm","Jamais","Never","Никогда"),L("Sèlman jou egzamen","Seulement le jour de l'examen","Only on exam day","Только в день экзамена")],a:0},
{q:L("Kisa ki ede sèvo a kenbe sa w aprann ?","Qu'est-ce qui aide le cerveau à retenir ?","What helps the brain retain learning?","Что помогает мозгу удерживать выученное?"),o:[L("Dòmi ase","Dormir assez","Enough sleep","Достаточный сон"),L("Kafe","Le café","Coffee","Кофе"),L("Ekran","Les écrans","Screens","Экраны"),L("Bri","Le bruit","Noise","Шум")],a:0}]});
