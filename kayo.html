  --deep:#173B57; --lume:#2D78A8; --gold:#C9A96E;
  /* \u2014 r\xF4les s\xE9mantiques (c'est ce qu'utilisent les composants) \u2014 */
  --bg:var(--ink); --bg-2:#101316; --bg-3:#15181C;
  --fg:#F7F6F2; --fg-dim:#A7A7A1; --fg-mute:rgba(247,246,242,.45);
  --line:rgba(247,246,242,.13); --line-soft:rgba(247,246,242,.07);
  --surface:rgba(247,246,242,.045); --surface-2:rgba(247,246,242,.085);
  --accent:#2D78A8; --accent-deep:#173B57; --accent-soft:rgba(45,120,168,.18);
  /* \u2014 formes \u2014 */
  --r-xs:6px; --r-s:10px; --r-m:16px; --r-l:24px; --r-xl:32px;
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 24px 60px -20px rgba(0,0,0,.75);
  --shadow-3:0 40px 90px -30px rgba(0,0,0,.85);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Instrument Serif','Iowan Old Style',Georgia,'Times New Roman',serif;
  --max:1400px;
  font-family:var(--font-ui); background:var(--bg); color:var(--fg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  min-height:100vh; overflow-x:hidden;
}
.kayo button{font-family:inherit}
.kayo input,.kayo select,.kayo textarea{font-family:inherit;color:inherit}
.kayo h1,.kayo h2,.kayo h3,.kayo h4,.kayo p,.kayo figure{margin:0}
.kayo ul{margin:0;padding:0;list-style:none}
.kayo a{color:inherit;text-decoration:none}

/* th\xE8me clair pour les sections "papier" */
.theme-paper{
  --bg:var(--paper); --bg-2:#EEECE4; --bg-3:#E7E4DA;
  --fg:#0B0D0F; --fg-dim:#6B6B64; --fg-mute:rgba(11,13,15,.45);
  --line:rgba(11,13,15,.16); --line-soft:rgba(11,13,15,.08);
  --surface:rgba(11,13,15,.035); --surface-2:rgba(11,13,15,.07);
  background:var(--bg); color:var(--fg);
}
.theme-dark{ --bg:var(--ink); --bg-2:#101316; background:var(--bg); color:var(--fg); }

/* ---------- typographie ---------- */
.k-display{font-family:var(--font-display);font-weight:400;line-height:.92;letter-spacing:-.015em}
.k-serif{font-family:var(--font-display);font-weight:400}
.k-t1{font-size:clamp(44px,8.4vw,120px)}
.k-t2{font-size:clamp(32px,4.6vw,64px)}
.k-t3{font-size:clamp(24px,2.7vw,38px)}
.k-lede{font-size:clamp(15px,1.15vw,18px);line-height:1.6;color:var(--fg-dim);max-width:62ch}
.k-label{font-size:12.5px;color:var(--fg-dim);letter-spacing:.01em}
.k-meta{font-size:13px;color:var(--fg-dim)}
.k-num{font-variant-numeric:tabular-nums}

/* ---------- structure ---------- */
.k-wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 clamp(18px,4vw,54px)}
.k-section{padding:clamp(64px,9vw,132px) 0}
.k-rule{height:1px;background:var(--line-soft);border:0}
.k-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,52px)}
.k-head .k-lede{margin-top:14px}
.k-eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-dim);margin-bottom:16px}
.k-eyebrow:before{content:'';width:26px;height:1px;background:var(--gold)}

/* ---------- boutons ---------- */
.k-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 22px;
  border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);
  font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:transform .45s var(--ease),background .3s,border-color .3s,color .3s,opacity .3s}
.k-btn:hover{transform:translateY(-2px);border-color:var(--fg-dim)}
.k-btn:active{transform:translateY(0)}
.k-btn--primary{background:var(--fg);color:var(--bg);border-color:transparent}
.k-btn--primary:hover{background:var(--gold);color:#0B0D0F;border-color:transparent}
.k-btn--accent{background:linear-gradient(112deg,var(--accent-deep),var(--accent));color:#F7F6F2;border-color:transparent}
.k-btn--accent:hover{filter:brightness(1.12)}
.k-btn--sm{height:38px;padding:0 15px;font-size:13px}
.k-btn--xs{height:32px;padding:0 12px;font-size:12.5px}
.k-btn--icon{width:48px;padding:0}
.k-btn--icon.k-btn--sm{width:38px}
.k-btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.k-btn--full{width:100%}
.k-link{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--fg);padding-bottom:3px;
  border-bottom:1px solid var(--line);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;
  transition:border-color .3s,gap .3s var(--ease)}
.k-link:hover{border-color:var(--gold);gap:12px}

.kayo :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

/* ---------- champs ---------- */
.k-field{display:flex;flex-direction:column;gap:7px}
.k-field > span{font-size:12.5px;color:var(--fg-dim)}
.k-input,.k-select,.k-area{width:100%;height:46px;padding:0 14px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;
  transition:border-color .25s,background .25s}
.k-area{height:auto;padding:12px 14px;min-height:104px;resize:vertical;line-height:1.55}
.k-input:hover,.k-select:hover{border-color:var(--fg-mute)}
.k-input:focus,.k-select:focus,.k-area:focus{border-color:var(--accent);background:var(--surface-2);outline:none}
.k-input::placeholder,.k-area::placeholder{color:var(--fg-mute)}
.k-select{appearance:none;cursor:pointer;background-image:none}
.k-selwrap{position:relative}
.k-selwrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--fg-dim)}
.k-select option{background:#15181C;color:#F7F6F2}
.theme-paper .k-select option{background:#F7F6F2;color:#0B0D0F}

/* ---------- pastilles / badges ---------- */
.k-chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:transparent;color:var(--fg-dim);font-size:13px;cursor:pointer;
  transition:all .28s var(--ease-soft)}
.k-chip:hover{color:var(--fg);border-color:var(--fg-mute)}
.k-chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.k-badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;
  font-size:11.5px;font-weight:500;letter-spacing:.01em;background:var(--surface-2);color:var(--fg);
  backdrop-filter:blur(8px)}
.k-badge--rent{background:rgba(45,120,168,.9);color:#fff}
.k-badge--sale{background:rgba(247,246,242,.92);color:#0B0D0F}
.k-badge--verified{background:rgba(201,169,110,.16);color:var(--gold);border:1px solid rgba(201,169,110,.4)}
.k-badge--soft{background:var(--surface);color:var(--fg-dim);border:1px solid var(--line-soft)}
.k-badge--alert{background:rgba(190,90,60,.18);color:#E2A18B;border:1px solid rgba(190,90,60,.35)}

/* ---------- surfaces ---------- */
.k-panel{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--r-l)}
.k-hair{height:1px;background:var(--line-soft)}

/* ---------- carte propri\xE9t\xE9 ---------- */
.k-card{position:relative;display:flex;flex-direction:column;background:var(--bg-2);
  border:1px solid var(--line-soft);border-radius:var(--r-m);overflow:hidden;cursor:pointer;
  transition:transform .6s var(--ease),border-color .4s,box-shadow .6s var(--ease)}
.k-card:hover{transform:translateY(-6px);border-color:var(--line);box-shadow:var(--shadow-2)}
.k-card__media{position:relative;aspect-ratio:4/3;overflow:hidden;background:#0d1013}
.k-card__media > *{transition:transform 1.1s var(--ease)}
.k-card:hover .k-card__media > .k-visual{transform:scale(1.07)}
.k-card__scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(11,13,15,.7),rgba(11,13,15,0) 46%);
  opacity:.85;transition:opacity .5s}
.k-card:hover .k-card__scrim{opacity:1}
.k-card__top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:2}
.k-card__bottom{position:absolute;left:16px;bottom:14px;right:16px;z-index:2;
  transition:transform .6s var(--ease)}
.k-card:hover .k-card__bottom{transform:translateY(-3px)}
.k-card__body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.k-card__specs{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--fg-dim)}
.k-card__specs span{display:inline-flex;align-items:center;gap:6px}
.k-card--active{border-color:var(--gold)}

/* bouton favori */
.k-fav{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;cursor:pointer;
  border:1px solid rgba(247,246,242,.22);background:rgba(11,13,15,.42);backdrop-filter:blur(10px);
  color:#F7F6F2;transition:transform .35s var(--ease),background .3s,border-color .3s}
.k-fav:hover{transform:scale(1.09);background:rgba(11,13,15,.7)}
.k-fav[data-on="true"]{color:#E0685F;border-color:rgba(224,104,95,.5)}
.k-fav[data-on="true"] svg{fill:currentColor;animation:kPop .5s var(--ease)}
@keyframes kPop{0%{transform:scale(.6)}55%{transform:scale(1.28)}100%{transform:scale(1)}}

/* ---------- r\xE9v\xE9lations au scroll ---------- */
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease);filter:blur(6px)}
.rv.is-in{opacity:1;transform:none;filter:blur(0)}

/* ---------- s\xE9quence d'ouverture ---------- */
.k-intro{position:fixed;inset:0;z-index:200;background:#0B0D0F;display:grid;place-items:center;
  animation:kIntroOut .9s var(--ease) 1.5s forwards}
@keyframes kIntroOut{to{opacity:0;visibility:hidden;transform:scale(1.04)}}
.k-intro__word{font-family:var(--font-display);font-size:clamp(46px,10vw,110px);letter-spacing:.06em;color:#F7F6F2;display:flex}
.k-intro__word span{display:inline-block;opacity:0;transform:translateY(38px);filter:blur(10px);
  animation:kLetter .95s var(--ease) forwards}
@keyframes kLetter{to{opacity:1;transform:none;filter:blur(0)}}
.k-intro__bar{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);width:min(220px,44vw);height:1px;background:rgba(247,246,242,.18);overflow:hidden}
.k-intro__bar i{display:block;height:100%;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;
  animation:kBar 1.5s var(--ease-soft) forwards}
@keyframes kBar{to{transform:scaleX(1)}}

.k-enter{opacity:0;animation:kEnter 1s var(--ease) forwards}
@keyframes kEnter{to{opacity:1;transform:none}}
.k-rise{opacity:0;transform:translateY(26px);animation:kEnter 1.1s var(--ease) forwards}
.k-curtain{clip-path:inset(0 0 100% 0);animation:kCurtain 1.5s var(--ease) forwards}
@keyframes kCurtain{to{clip-path:inset(0 0 0 0)}}

/* ---------- skeletons ---------- */
.k-skel{position:relative;overflow:hidden;background:var(--surface);border-radius:var(--r-s)}
.k-skel:after{content:'';position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(247,246,242,.07),transparent);animation:kShimmer 1.5s infinite}
@keyframes kShimmer{100%{transform:translateX(100%)}}

/* ---------- carte interactive ---------- */
.k-marker{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:2}
.k-marker__pin{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;
  background:rgba(16,19,22,.92);border:1px solid var(--line);color:var(--fg);font-size:12.5px;font-weight:500;
  backdrop-filter:blur(8px);white-space:nowrap;transition:all .35s var(--ease)}
.k-marker:hover{z-index:5}
.k-marker:hover .k-marker__pin,.k-marker[data-active="true"] .k-marker__pin{
  background:var(--gold);color:#0B0D0F;border-color:transparent;transform:translateY(-4px) scale(1.06)}
.k-marker[data-active="true"]{z-index:6}
.k-marker__dot{position:absolute;left:50%;bottom:-5px;width:6px;height:6px;border-radius:999px;background:var(--gold);transform:translateX(-50%)}
.k-pulse{animation:kPulse 2.4s ease-out infinite}
@keyframes kPulse{0%{box-shadow:0 0 0 0 rgba(201,169,110,.5)}70%{box-shadow:0 0 0 16px rgba(201,169,110,0)}100%{box-shadow:0 0 0 0 rgba(201,169,110,0)}}

/* ---------- modales & feuilles ---------- */
.k-overlay{position:fixed;inset:0;z-index:120;background:rgba(6,8,10,.82);backdrop-filter:blur(14px);
  animation:kFade .35s var(--ease-soft)}
@keyframes kFade{from{opacity:0}}
.k-modal{position:relative;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-l);
  animation:kModalIn .5s var(--ease)}
@keyframes kModalIn{from{opacity:0;transform:translateY(20px) scale(.98)}}
.k-sheet{position:fixed;left:0;right:0;bottom:0;z-index:130;background:var(--bg-2);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:86vh;overflow:auto;
  animation:kSheetIn .45s var(--ease)}
@keyframes kSheetIn{from{transform:translateY(100%)}}
.k-sheet__grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:10px auto 0}

/* ---------- toasts ---------- */
.k-toasts{position:fixed;z-index:180;bottom:20px;left:50%;transform:translateX(-50%);display:flex;
  flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.k-toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;font-size:13.5px;
  background:rgba(16,19,22,.96);border:1px solid var(--line);color:#F7F6F2;box-shadow:var(--shadow-2);
  animation:kToast .45s var(--ease)}
@keyframes kToast{from{opacity:0;transform:translateY(14px)}}

/* ---------- header ---------- */
.k-header{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .5s,border-color .5s,padding .5s var(--ease)}
.k-header__in{display:flex;align-items:center;gap:clamp(12px,2.5vw,34px);height:78px;transition:height .5s var(--ease)}
.k-header[data-compact="true"]{background:rgba(11,13,15,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line-soft)}
.k-header[data-compact="true"] .k-header__in{height:62px}
.k-logo{font-family:var(--font-display);font-size:26px;letter-spacing:.14em;line-height:1;cursor:pointer}
.k-nav{display:flex;align-items:center;gap:26px}
.k-nav button{background:none;border:0;color:var(--fg-dim);font-size:14px;cursor:pointer;padding:6px 0;position:relative;transition:color .3s}
.k-nav button:after{content:'';position:absolute;left:0;right:100%;bottom:0;height:1px;background:var(--gold);transition:right .4s var(--ease)}
.k-nav button:hover{color:var(--fg)}
.k-nav button:hover:after,.k-nav button[data-on="true"]:after{right:0}
.k-nav button[data-on="true"]{color:var(--fg)}
.k-count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;
  background:var(--gold);color:#0B0D0F;font-size:11px;font-weight:600;margin-left:6px}

/* ---------- barre de recherche ---------- */
.k-searchbar{display:flex;align-items:center;background:rgba(247,246,242,.06);border:1px solid rgba(247,246,242,.16);
  border-radius:999px;backdrop-filter:blur(20px);padding:7px 7px 7px 8px;gap:2px;box-shadow:var(--shadow-3)}
.k-searchbar__cell{flex:1;min-width:0;padding:6px 16px;border-radius:999px;cursor:pointer;transition:background .3s}
.k-searchbar__cell:hover{background:rgba(247,246,242,.06)}
.k-searchbar__cell + .k-searchbar__cell{box-shadow:inset 1px 0 0 rgba(247,246,242,.13)}
.k-searchbar__cell label{display:block;font-size:11.5px;color:var(--fg-mute);margin-bottom:3px}
.k-searchbar__cell input,.k-searchbar__cell select{width:100%;background:none;border:0;padding:0;font-size:14.5px;color:var(--fg);outline:none;appearance:none;cursor:pointer}
.k-searchbar__cell input{cursor:text}
.k-searchbar__cell select option{background:#15181C}

/* ---------- galerie ---------- */
.k-gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(2,minmax(120px,26vh));gap:8px}
.k-gal > button{position:relative;overflow:hidden;border:0;padding:0;cursor:pointer;background:#0d1013;border-radius:4px}
.k-gal > button:first-child{grid-row:span 2;border-radius:var(--r-m) 4px 4px var(--r-m)}
.k-gal > button:nth-child(3){border-radius:0 var(--r-m) 0 0}
.k-gal > button:last-child{border-radius:0 0 var(--r-m) 0}
.k-gal > button > .k-visual{transition:transform 1s var(--ease)}
.k-gal > button:hover > .k-visual{transform:scale(1.05)}

/* ---------- tableau comparateur ---------- */
.k-table{width:100%;border-collapse:collapse;font-size:14px}
.k-table th,.k-table td{padding:15px 16px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
.k-table th{font-weight:500;color:var(--fg-dim);font-size:13px;width:180px}
.k-table tr:hover td{background:var(--surface)}

/* ---------- divers ---------- */
.k-grid-props{display:grid;gap:clamp(14px,1.6vw,22px);grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.k-scroll-x{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.k-scroll-x > *{scroll-snap-align:start;flex:0 0 auto}
.kayo ::-webkit-scrollbar{width:9px;height:9px}
.kayo ::-webkit-scrollbar-thumb{background:rgba(247,246,242,.16);border-radius:99px}
.kayo ::-webkit-scrollbar-track{background:transparent}
.k-visual{position:absolute;inset:0;width:100%;height:100%;display:block}
.k-ratio{position:relative;overflow:hidden;background:#0d1013}
.k-dot{width:5px;height:5px;border-radius:99px;background:var(--fg-mute);display:inline-block}

@media (max-width:900px){
  .k-gal{grid-template-columns:1fr;grid-template-rows:auto}
  .k-gal > button{aspect-ratio:16/11;border-radius:var(--r-m) !important}
  .k-gal > button:first-child{grid-row:auto}
}
@media (prefers-reduced-motion:reduce){
  .kayo *,.kayo *:before,.kayo *:after{animation-duration:.001ms !important;animation-delay:0ms !important;transition-duration:.001ms !important}
  .rv{opacity:1;transform:none;filter:none}
